name: Temporary Reed-Solomon refinement check

on:
  push:
    branches:
      - codex/source-preserving-rs-refinement-check

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mathematical layout observation
        continue-on-error: true
        run: python3 -B .noeaaeue/scripts/check_math_layout.py
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Build exact target modules with fatal warnings
        run: |
          lake build GRWTSK.LinearAlgebra.LinearMap.ReedSolomonRefinement --wfail
          lake build GRWTSK.NumberTheory.Zeta.Riemann.ScrewKernelRefinement --wfail
          lake build GRWTSK.NumberTheory.Zeta.Riemann --wfail
      - name: Trust-zero source checks
        run: |
          lake env lean --trust=0 GRWTSK/LinearAlgebra/LinearMap/ReedSolomonRefinement.lean
          lake env lean --trust=0 GRWTSK/NumberTheory/Zeta/Riemann/ScrewKernelRefinement.lean
          lake env lean --trust=0 GRWTSK/NumberTheory/Zeta/Riemann.lean
      - name: Target declaration axiom audit
        run: |
          cat > /tmp/RSRefinementAxiomAudit.lean <<'EOF'
          import GRWTSK.NumberTheory.Zeta.Riemann.ScrewKernelRefinement
          #print axioms GRWTSK.LinearAlgebra.LinearMap.ReedSolomonRefinement.transport_comp
          #print axioms GRWTSK.LinearAlgebra.LinearMap.ReedSolomonRefinement.codeword_error_invisible
          #print axioms GRWTSK.LinearAlgebra.LinearMap.ReedSolomonRefinement.source_error_bound
          #print axioms GRWTSK.NumberTheory.Zeta.Riemann.ScrewKernelRefinement.encoded_source_refines
          #print axioms GRWTSK.NumberTheory.Zeta.Riemann.ScrewKernelRefinement.screwKernel_source_preserving_refinement_error
          EOF
          lake env lean --trust=0 /tmp/RSRefinementAxiomAudit.lean | tee /tmp/rs-axioms.log
          ! grep -E 'sorryAx|Lean\.ofReduceBool' /tmp/rs-axioms.log
