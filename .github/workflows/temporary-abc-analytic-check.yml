name: Temporary ABC analytic interface check

on:
  push:
    branches:
      - agent/abc-analytic-box-estimates

permissions:
  contents: write
  issues: write

jobs:
  lean-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Close remaining quantitative cast obligations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("GRWTSK/NumberTheory/Diophantine/PrimitiveAdditiveTriples/QuantitativeAnatomicFactorization.lean")
          lines = path.read_text().splitlines()

          def find_exact(value: str, start: int = 0) -> int:
              for i in range(start, len(lines)):
                  if lines[i] == value:
                      return i
              raise RuntimeError(f"missing exact line: {value!r}")

          def find_contains(value: str, start: int = 0) -> int:
              for i in range(start, len(lines)):
                  if value in lines[i]:
                      return i
              raise RuntimeError(f"missing text: {value!r}")

          # Unfold the local definition through `change`, since `rw [K]` no longer
          # recognizes this section-local noncomputable definition in Lean 4.33.
          theorem_start = find_exact("private theorem K_inv_le_eps : (K : ℝ)⁻¹ ≤ ε := by")
          rw_k = find_exact("        rw [K]", theorem_start)
          apply_ceil = find_exact("        apply Nat.le_ceil", rw_k)
          lines[rw_k:apply_ceil + 1] = [
              "        change ε⁻¹ ≤ (⌈ε⁻¹⌉₊ : ℝ)",
              "        exact Nat.le_ceil",
          ]

          # rpow monotonicity needs base >= 1, not merely nonnegative.
          theorem_start = find_exact("private theorem prod_y_large_le_X_pow :")
          first = find_exact("          · norm_cast", theorem_start)
          first_end = find_exact("          · rw [le_mul_inv_iff₀]", first)
          lines[first:first_end] = [
              "          · simp only [Nat.one_le_cast]",
              "            exact Nat.succ_le_iff.mpr (hy_pos i)",
          ]
          hdi_line = find_exact("            · exact_mod_cast hdi", first_end)
          lines[hdi_line] = "            · exact_mod_cast hdi.le"

          theorem_start = find_exact("private theorem c_le_X_pow : c ≤ (X : ℝ) ^ ε := by")
          base_line = find_exact("        · exact_mod_cast (hy_pos _).le", theorem_start)
          lines[base_line:base_line + 1] = [
              "        · simp only [Nat.one_le_cast]",
              "          exact Nat.succ_le_iff.mpr (hy_pos i)",
          ]

          # The displayed inequalities are casts of natural-product inequalities.
          # Move to Nat first, then apply the generic subset-product theorem.
          theorem_start = find_exact("private theorem X_pow_mul_prod_le_radical :")
          first_calc = find_exact(
              "    _ ≤ ∏ m ∈ Finset.range d, y (m + 1) := by", theorem_start
          )
          first_apply = find_exact(
              "      apply Finset.prod_le_prod_of_subset_of_one_le", first_calc
          )
          first_end = find_exact(
              "    _ = ∏ m ∈ Finset.Icc 1 d, y m := by", first_apply
          )
          lines[first_calc:first_end] = [
              "    _ ≤ ∏ m ∈ Finset.range d, y (m + 1) := by",
              "      norm_cast",
              "      apply Finset.prod_le_prod_of_subset_of_one_le",
              "      · exact Finset.filter_subset _ _",
              "      · intro i hi",
              "        exact Nat.zero_le _",
              "      · intro i hi hnot",
              "        exact Nat.succ_le_iff.mpr (hy_pos _)",
          ]

          second_calc = find_exact(
              "    _ ≤ ∏ m ∈ Finset.Icc 1 d ∪ Finset.Ioc d n, y m := by",
              first_end,
          )
          second_end = find_exact("    _ = (radical n : ℕ) := by", second_calc)
          lines[second_calc:second_end] = [
              "    _ ≤ ∏ m ∈ Finset.Icc 1 d ∪ Finset.Ioc d n, y m := by",
              "      norm_cast",
              "      apply Finset.prod_le_prod_of_subset_of_one_le",
              "      · exact Finset.subset_union_left",
              "      · intro i hi",
              "        exact Nat.zero_le _",
              "      · intro i hi hnot",
              "        exact Nat.succ_le_iff.mpr (hy_pos _)",
          ]

          path.write_text("\n".join(lines) + "\n")
          PY
          git diff --check
          if ! git diff --quiet -- GRWTSK/NumberTheory/Diophantine/PrimitiveAdditiveTriples/QuantitativeAnatomicFactorization.lean; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add GRWTSK/NumberTheory/Diophantine/PrimitiveAdditiveTriples/QuantitativeAnatomicFactorization.lean
            git commit -m "Close the remaining quantitative abc cast obligations (#401)"
            git push
          fi
      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@c544e89643240c6b398f14a431bcdc6309e36b3e
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Build ABC analytic modules
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          lake build \
            GRWTSK.NumberTheory.Diophantine.PrimitiveAdditiveTriples.ExceptionalSetAnalyticBounds \
            GRWTSK.NumberTheory.Diophantine.PrimitiveAdditiveTriples.ExceptionalSetCounting \
            2>&1 | tee /tmp/abc-analytic-build.log
      - name: Publish failure diagnostics to issue 414
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          {
            printf 'Temporary Lean check failed at `%s`.\n\n```text\n' "$RUN_URL"
            tail -c 55000 /tmp/abc-analytic-build.log
            printf '\n```\n'
          } > /tmp/comment.txt
          jq -Rs '{body: .}' /tmp/comment.txt > /tmp/comment.json
          gh api "repos/${REPOSITORY}/issues/414/comments" --method POST --input /tmp/comment.json
      - name: Propagate build failure
        if: steps.build.outcome == 'failure'
        run: exit 1
