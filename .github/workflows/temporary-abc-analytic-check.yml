name: Temporary ABC analytic interface check

on:
  push:
    branches:
      - agent/abc-analytic-box-estimates

permissions:
  contents: write
  issues: write

jobs:
  lean-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Apply final declaration-anchored repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("GRWTSK/NumberTheory/Diophantine/PrimitiveAdditiveTriples/QuantitativeAnatomicFactorization.lean")
          lines = path.read_text().splitlines()

          def find_exact(value: str, start: int = 0) -> int:
              for i in range(start, len(lines)):
                  if lines[i] == value:
                      return i
              raise RuntimeError(f"missing exact line: {value!r}")

          def find_contains(value: str, start: int = 0) -> int:
              for i in range(start, len(lines)):
                  if value in lines[i]:
                      return i
              raise RuntimeError(f"missing text: {value!r}")

          import_anchor = find_exact("import Mathlib.Algebra.Order.BigOperators.GroupWithZero.Finset")
          if "import Mathlib.Algebra.Order.Floor.Semifield" not in lines:
              lines.insert(import_anchor + 1, "import Mathlib.Algebra.Order.Floor.Semifield")

          start = find_exact("private theorem two_lt_K : 2 < K := by")
          end = find_exact("private theorem K_inv_le_eps : (K : ℝ)⁻¹ ≤ ε := by", start)
          lines[start:end] = [
              "private theorem two_lt_K : 2 < K := by",
              "  change 2 < ⌈ε⁻¹⌉₊",
              "  exact (Nat.lt_ceil).2 two_lt_eps_inv",
              "",
          ]

          lines = [
              line.replace("Finset.prod_le_prod₀", "Finset.prod_le_prod")
                  .replace("Finset.prod_le_prod_of_subset_of_one_le₀",
                           "Finset.prod_le_prod_of_subset_of_one_le")
              for line in lines
          ]

          theorem_start = find_exact("private theorem prod_y_large_le_X_pow :")
          apply_start = find_exact(
              "      apply Finset.prod_le_prod_of_subset_of_one_le", theorem_start
          )
          calc_end = find_exact("    _ ≤ (X : ℝ) ^ (d⁻¹ : ℝ) := by", apply_start)
          lines[apply_start:calc_end] = [
              "      apply Finset.prod_le_prod_of_subset_of_one_le",
              "      · exact Finset.subset_union_right",
              "      · intro i hi",
              "        positivity",
              "      · simp only [Finset.mem_union, Finset.mem_Icc]",
              "        intro i hi _",
              "        apply Nat.one_le_pow",
              "        exact (hy_pos _)",
          ]

          theorem_start = find_exact("theorem x_K_le_X_pow : x KIndex ≤ (X : ℝ) ^ ε := by")
          rw_index = find_exact(
              "        rw [← Real.rpow_natCast_mul, ← Real.rpow_natCast]", theorem_start
          )
          second_branch = find_exact("        · simp", rw_index + 1)
          lines[rw_index + 1:second_branch] = [
              "        · gcongr",
              "          · simp only [Nat.one_le_cast]",
              "            exact Nat.succ_le_iff.mpr (hy_pos i)",
              "          · rw [← Nat.floor_div_eq_div (K := ℝ), div_eq_mul_inv]",
              "            apply Nat.floor_le",
              "            positivity",
          ]

          disjoint = find_exact(
              "      · simp only [disjoint_singleton_left, mem_Ioc, not_and, not_le]",
              theorem_start,
          )
          after_disjoint = find_exact(
              "    _ ≤ (∏ m ∈ Finset.Icc 1 d ∪ Finset.Ioc d n, y m ^ m) ^",
              disjoint,
          )
          lines[disjoint:after_disjoint] = [
              "      · simp only [disjoint_singleton_left, mem_Ioc, not_and, not_le]",
              "        intro hdK",
              "        exact ((not_lt_of_ge hKd.le) hdK).elim",
          ]

          union_start = find_exact(
              "    _ ≤ (∏ m ∈ Finset.Icc 1 d ∪ Finset.Ioc d n, y m ^ m) ^",
              theorem_start,
          )
          n_eq = find_exact("    _ = (n : ℝ) ^ (K⁻¹ : ℝ) := by", union_start)
          lines[union_start:n_eq] = [
              "    _ ≤ (∏ m ∈ Finset.Icc 1 d ∪ Finset.Ioc d n, y m ^ m) ^",
              "        (K⁻¹ : ℝ) := by",
              "      gcongr",
              "      · intros",
              "        apply Nat.add_one_le_of_lt",
              "        simp [hy_pos]",
              "      · intro i",
              "        simp +contextual [hKd.le, Nat.add_one_le_iff.eq ▸ hK_pos]",
          ]

          x_step = find_exact("    _ ≤ (X : ℝ) ^ (K⁻¹ : ℝ) := by", n_eq)
          eps_step = find_exact("    _ ≤ (X : ℝ) ^ ε := by", x_step)
          lines[x_step:eps_step] = [
              "    _ ≤ (X : ℝ) ^ (K⁻¹ : ℝ) := by",
              "      gcongr",
              "      exact_mod_cast hnX",
          ]

          path.write_text("\n".join(lines) + "\n")
          PY
          git diff --check
          if ! git diff --quiet -- GRWTSK/NumberTheory/Diophantine/PrimitiveAdditiveTriples/QuantitativeAnatomicFactorization.lean; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add GRWTSK/NumberTheory/Diophantine/PrimitiveAdditiveTriples/QuantitativeAnatomicFactorization.lean
            git commit -m "Apply final quantitative abc repairs (#401)"
            git push
          fi
      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@c544e89643240c6b398f14a431bcdc6309e36b3e
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Build ABC analytic modules
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          lake build \
            GRWTSK.NumberTheory.Diophantine.PrimitiveAdditiveTriples.ExceptionalSetAnalyticBounds \
            GRWTSK.NumberTheory.Diophantine.PrimitiveAdditiveTriples.ExceptionalSetCounting \
            2>&1 | tee /tmp/abc-analytic-build.log
      - name: Publish failure diagnostics to issue 414
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          {
            printf 'Temporary Lean check failed at `%s`.\n\n```text\n' "$RUN_URL"
            tail -c 55000 /tmp/abc-analytic-build.log
            printf '\n```\n'
          } > /tmp/comment.txt
          jq -Rs '{body: .}' /tmp/comment.txt > /tmp/comment.json
          gh api "repos/${REPOSITORY}/issues/414/comments" --method POST --input /tmp/comment.json
      - name: Propagate build failure
        if: steps.build.outcome == 'failure'
        run: exit 1
