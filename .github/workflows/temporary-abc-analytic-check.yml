name: Temporary ABC analytic interface check

on:
  push:
    branches:
      - agent/abc-analytic-box-estimates

permissions:
  contents: write
  issues: write

jobs:
  lean-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Resolve final quantitative API mismatches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("GRWTSK/NumberTheory/Diophantine/PrimitiveAdditiveTriples/QuantitativeAnatomicFactorization.lean")
          text = path.read_text()

          if "import Mathlib.Algebra.Order.Floor.Semifield" not in text:
              text = text.replace(
                  "import Mathlib.Algebra.Order.BigOperators.GroupWithZero.Finset\n",
                  "import Mathlib.Algebra.Order.BigOperators.GroupWithZero.Finset\n"
                  "import Mathlib.Algebra.Order.Floor.Semifield\n",
                  1,
              )

          text = text.replace(
              """private theorem two_lt_K : 2 < K := by
          rw [K, Nat.lt_ceil]
          simp [two_lt_eps_inv]""",
              """private theorem two_lt_K : 2 < K := by
          change 2 < ⌈ε⁻¹⌉₊
          exact (Nat.lt_ceil).2 two_lt_eps_inv""",
              1,
          )

          text = text.replace("Finset.prod_le_prod₀", "Finset.prod_le_prod")
          text = text.replace(
              "Finset.prod_le_prod_of_subset_of_one_le₀",
              "Finset.prod_le_prod_of_subset_of_one_le",
          )

          old = """      apply Finset.prod_le_prod_of_subset_of_one_le
          · exact Finset.subset_union_right
          simp only [Finset.mem_union, Finset.mem_Icc]
          intro i hi _
          apply Nat.one_le_pow
          exact (hy_pos _)"""
          new = """      apply Finset.prod_le_prod_of_subset_of_one_le
          · exact Finset.subset_union_right
          · intro i hi
            positivity
          · simp only [Finset.mem_union, Finset.mem_Icc]
            intro i hi _
            apply Nat.one_le_pow
            exact (hy_pos _)"""
          if old not in text:
              raise RuntimeError("large-layer subset block not found")
          text = text.replace(old, new, 1)

          old = """        · gcongr
              · exact_mod_cast (hy_pos _).le
              · rw [← Nat.floor_div_eq_div (K := ℝ), div_eq_mul_inv]
                apply Nat.floor_le
                positivity"""
          new = """        · gcongr
              · simp only [Nat.one_le_cast]
                exact Nat.succ_le_iff.mpr (hy_pos i)
              · rw [← Nat.floor_div_eq_div (K := ℝ), div_eq_mul_inv]
                apply Nat.floor_le
                positivity"""
          if old not in text:
              raise RuntimeError("K-layer base block not found")
          text = text.replace(old, new, 1)

          old = """      · simp only [disjoint_singleton_left, mem_Ioc, not_and, not_le]
            intro h
            linarith"""
          new = """      · simp only [disjoint_singleton_left, mem_Ioc, not_and, not_le]
            intro hdK
            exact ((not_lt_of_ge hKd.le) hdK).elim"""
          if old not in text:
              raise RuntimeError("singleton disjointness block not found")
          text = text.replace(old, new, 1)

          old = """    _ ≤ (∏ m ∈ Finset.Icc 1 d ∪ Finset.Ioc d n, y m ^ m) ^
            (K⁻¹ : ℝ) := by
          gcongr
          · intro i hi
            positivity
          · intro i
            simp +contextual [hKd.le, hK_pos]"""
          new = """    _ ≤ (∏ m ∈ Finset.Icc 1 d ∪ Finset.Ioc d n, y m ^ m) ^
            (K⁻¹ : ℝ) := by
          gcongr
          · intros
            apply Nat.add_one_le_of_lt
            simp [hy_pos]
          · intro i
            simp +contextual [hKd.le, Nat.add_one_le_iff.eq ▸ hK_pos]"""
          if old not in text:
              raise RuntimeError("K-layer union monotonicity block not found")
          text = text.replace(old, new, 1)

          old = """    _ ≤ (X : ℝ) ^ (K⁻¹ : ℝ) := by
          gcongr"""
          new = """    _ ≤ (X : ℝ) ^ (K⁻¹ : ℝ) := by
          gcongr
          exact_mod_cast hnX"""
          if old not in text:
              raise RuntimeError("n-to-X K-layer comparison not found")
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          git diff --check
          if ! git diff --quiet -- GRWTSK/NumberTheory/Diophantine/PrimitiveAdditiveTriples/QuantitativeAnatomicFactorization.lean; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add GRWTSK/NumberTheory/Diophantine/PrimitiveAdditiveTriples/QuantitativeAnatomicFactorization.lean
            git commit -m "Resolve the final quantitative abc API mismatches (#401)"
            git push
          fi
      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@c544e89643240c6b398f14a431bcdc6309e36b3e
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Build ABC analytic modules
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          lake build \
            GRWTSK.NumberTheory.Diophantine.PrimitiveAdditiveTriples.ExceptionalSetAnalyticBounds \
            GRWTSK.NumberTheory.Diophantine.PrimitiveAdditiveTriples.ExceptionalSetCounting \
            2>&1 | tee /tmp/abc-analytic-build.log
      - name: Publish failure diagnostics to issue 414
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          {
            printf 'Temporary Lean check failed at `%s`.\n\n```text\n' "$RUN_URL"
            tail -c 55000 /tmp/abc-analytic-build.log
            printf '\n```\n'
          } > /tmp/comment.txt
          jq -Rs '{body: .}' /tmp/comment.txt > /tmp/comment.json
          gh api "repos/${REPOSITORY}/issues/414/comments" --method POST --input /tmp/comment.json
      - name: Propagate build failure
        if: steps.build.outcome == 'failure'
        run: exit 1
