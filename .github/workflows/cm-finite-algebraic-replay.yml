name: CM finite algebraic replay

on:
  push:
    branches:
      - docs/openai-typed-hodge-bridge
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: false
          auto-config: false
      - name: Build algebraic owner and its local imports
        run: lake build GRWTSK.AlgebraicGeometry.Hodge.CMFinitePureAssembly
      - name: Lean algebraic owner with warnings as errors
        run: lake env lean -DwarningAsError=true GRWTSK/AlgebraicGeometry/Hodge/CMFinitePureAssembly.lean
      - name: Lean algebraic owner with trust level zero
        run: lake env lean --trust=0 -DwarningAsError=true GRWTSK/AlgebraicGeometry/Hodge/CMFinitePureAssembly.lean
      - name: Report axioms of the finite-CM equivariance and transport declarations
        shell: bash
        run: |
          cat > /tmp/CMFiniteAxiomAudit.lean <<'LEAN'
          import GRWTSK.AlgebraicGeometry.Hodge.CMFinitePureAssembly
          #print axioms GRWTSK.AlgebraicGeometry.Hodge.CMFourFactorSwitchGeometry.CMFiniteFourPairedCoefficientConjugate_pure
          #print axioms GRWTSK.AlgebraicGeometry.Hodge.CMFourFactorSwitchGeometry.CMFiniteCanonicalPairedAssembly_scalarConjugate_linearMap
          #print axioms GRWTSK.AlgebraicGeometry.Hodge.CMFourFactorSwitchGeometry.CMFiniteCanonicalPairedAssembly_transport_four
          LEAN
          lake env lean --trust=0 -DwarningAsError=true /tmp/CMFiniteAxiomAudit.lean
