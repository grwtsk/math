[[acceptance_obligations]]
id = "G01"
requirement = "Elaborate all four new Lean modules at the exact head; source presence and lexical checks do not pass."

[[acceptance_obligations]]
id = "G02"
requirement = "Reconcile exact public types and the full transitive import/axiom/native closure, including the inherited projector and count modules."

[[acceptance_obligations]]
id = "G03"
requirement = "Retain actual Nat.Prime support, ordered pairs, inclusive finite bounds and literal natural equality p+q=N."

[[acceptance_obligations]]
id = "G04"
requirement = "Prove strict logarithmic weight positivity only from actual primality; a nonzero sieve or prime-power weight must not pass."

[[acceptance_obligations]]
id = "G05"
requirement = "Retain the explicit no-wrap condition 2*N<q before replacing modular equality by natural equality."

[[acceptance_obligations]]
id = "G06"
requirement = "The full-frequency theorem must use every character in ZMod q with the exact normalization q^-1."

[[acceptance_obligations]]
id = "G07"
requirement = "Preserve the modular-wrap hostile control; removing no-wrap must not produce an integer-equality theorem."

[[acceptance_obligations]]
id = "G08"
requirement = "Do not promote the finite projector identity to the continuous circle integral, a major/minor-arc estimate or an every-even residual bound."

[[acceptance_obligations]]
id = "G09"
requirement = "Do not infer strong Goldbach from bounded examples, positive weighted identities, or static finite diagnostics."

[[acceptance_obligations]]
id = "G10"
requirement = "Keep this integration root isolated from GRWTSK.lean until exact-source replay and trust review are accepted."

