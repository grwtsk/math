[[hostile_controls]]
id = "reject-mismatched-middle-object"
description = "Typed port and certified-path composition must reject endpoints whose exact middle objects do not agree."
[[hostile_controls]]
id = "reject-path-certificate-drop"
description = "The composite of a certified path must retain every selected composable certificate."
[[hostile_controls]]
id = "reject-path-map-drift"
description = "The fiber map of a composite port must agree with atom-by-atom certified-path evaluation."
[[hostile_controls]]
id = "reject-source-name-as-proof"
description = "Repository, revision, path, and declaration metadata cannot populate a certificate or theorem proof field."
[[hostile_controls]]
id = "reject-ring-label-without-ring-hom"
description = "A ring certificate must reconstruct the exact bundled ring homomorphism on the selected port map; ofHom requires map equality and hom_ofHom retains the supplied homomorphism."
[[hostile_controls]]
id = "reject-data-certificate-as-proposition"
description = "RingCertificate and TopologicalRingCertificate must inhabit Prop when used by ComposableProperty.Holds; bundled homomorphisms are reconstructed from the fixed map and exact ring laws."
[[hostile_controls]]
id = "reject-ring-continuity-drift"
description = "The continuity proof of a topological-ring port must concern the same exact map identified by its ring certificate."
[[hostile_controls]]
id = "reject-continuity-as-holomorphy"
description = "Continuity alone cannot construct a complex differentiability or holomorphic-extension certificate."
[[hostile_controls]]
id = "reject-holomorphy-without-domain-map"
description = "Holomorphic composition and restriction require the exact source-to-middle domain mapping proof."
[[hostile_controls]]
id = "reject-ordinary-section-as-holomorphic-section"
description = "An arbitrary function section cannot inhabit the holomorphic section subring without an ambient differentiability witness."
[[hostile_controls]]
id = "reject-holomorphic-subring-closure-gap"
description = "Zero, one, addition, negation, and multiplication must each preserve the exact holomorphic-extension predicate."
[[hostile_controls]]
id = "reject-holomorphic-ring-restriction-drift"
description = "The holomorphic-section restriction ring homomorphism, continuous map, and forgetful full-section restriction must be the same exact underlying function."
[[hostile_controls]]
id = "reject-evaluation-prime-without-holomorphic-ring"
description = "An evaluation prime must be the kernel of the exact evaluation homomorphism on the holomorphic-section ring."
[[hostile_controls]]
id = "reject-evaluation-naturality-drift"
description = "Pullback of an evaluation prime along restriction must equal evaluation at the same exact included point; continuous_restriction_naturality must retain this equality as a continuous-map square."
[[hostile_controls]]
id = "reject-evaluation-map-continuity-by-construction"
description = "Continuity must follow from section_continuous, preimage_zeroLocus, and pointToSpectrum_continuous, not from the mere existence of the point map."
[[hostile_controls]]
id = "reject-continuous-injection-as-homeomorphism"
description = "pointToSpectrum_injective and pointToSpectrum_continuous do not supply a topological embedding, surjectivity, or equality of analytic and Zariski topologies."
[[hostile_controls]]
id = "reject-general-bridge-injectivity"
description = "Replay HostileFixtures.constantBridge_whole_not_injective: a genuine continuous coordinate-ring bridge can collapse all analytic points."
[[hostile_controls]]
id = "reject-coordinate-ring-map-by-metadata"
description = "A source identity or bridge name cannot create the required ring homomorphism. The polynomial affine-line model must use its actual eval2 construction."
[[hostile_controls]]
id = "reject-polynomial-evaluation-drift"
description = "PolynomialModel.coordinateRingMap_eval must identify evaluation of the constructed holomorphic section with ordinary polynomial evaluation at the exact point."
[[hostile_controls]]
id = "reject-polynomial-restriction-drift"
description = "PolynomialModel.restriction_coordinateRingMap must commute with every exact domain restriction."
[[hostile_controls]]
id = "reject-polynomial-model-as-arithmetic-bridge"
description = "The canonical complex affine-line model does not construct the source-specific arithmetic-to-elliptic map B_n or the Weil comparison."
[[hostile_controls]]
id = "reject-analytic-affine-point-map-drift"
description = "A bridge point map must be the pullback of the exact holomorphic evaluation prime along its coordinate-ring homomorphism."
[[hostile_controls]]
id = "reject-analytic-affine-restriction-drift"
description = "Restricting a domain must preserve the induced source-spectrum point through evaluation naturality."
[[hostile_controls]]
id = "reject-analytic-affine-precomposition-variance"
description = "Precomposing the coordinate ring must act contravariantly on the induced prime-spectrum point map."
[[hostile_controls]]
id = "reject-spectrum-variance-reversal"
description = "A ring homomorphism B to A induces Spec A to Spec B; port types must retain contravariance."
[[hostile_controls]]
id = "reject-spectrum-continuity-by-label"
description = "The induced prime-spectrum map must use PrimeSpectrum.continuous_comap, not a ring-map label alone."
[[hostile_controls]]
id = "reject-spectrum-composition-order"
description = "Composite prime-spectrum maps must follow the reverse order of the exact ring homomorphisms."
[[hostile_controls]]
id = "reject-spectrum-as-scheme"
description = "A continuous spectrum map alone is not a scheme morphism; the affine-scheme profile must carry the actual Mathlib Spec.map."
[[hostile_controls]]
id = "reject-affine-scheme-map-drift"
description = "The affine-scheme point map must agree with PrimeSpectrum.comap for the same ring morphism."
[[hostile_controls]]
id = "reject-scheme-composition-order"
description = "Affine Spec composition must retain contravariant order at scheme and point-map levels."
[[hostile_controls]]
id = "reject-global-sections-map-drift"
description = "The affine global-section port map must be the appTop map of the same Spec.map."
[[hostile_controls]]
id = "reject-structure-sheaf-comap-drift"
description = "The map on open sections must equal StructureSheaf.comap for the same ring morphism and preimage open."
[[hostile_controls]]
id = "reject-global-sections-loss-of-original-ring-map"
description = "Recover the original morphism through the canonical Gamma-Spec arrow isomorphism, not point-map continuity."
[[hostile_controls]]
id = "reject-nonlocal-stalk-map"
description = "Every selected affine Spec stalk map must carry IsLocalHom at the exact point."
[[hostile_controls]]
id = "reject-local-holomorphy-as-global-gluing"
description = "Ordinary function gluing alone supplies no analytic proof. For a binary open cover, global_holomorphic_of_openCover constructs the proof from local holomorphy, exact matching, and IsOpenCover; other cover profiles require their own theorem."
[[hostile_controls]]
id = "reject-function-gluing-as-arithmetic-bridge"
description = "Ordinary function gluing cannot construct an arithmetic-to-elliptic map or source comparison."
[[hostile_controls]]
id = "reject-open-target-as-proof-or-refutation"
description = "TargetDisposition.unresolved_proof? and unresolved_refutation? return none; optional proofs use PLift without creating evidence."
[[hostile_controls]]
id = "reject-rh-from-local-family"
description = "Local theorem portfolios cannot synthesize RH without a target theorem."
[[hostile_controls]]
id = "reject-target-failure-erasing-local-proofs"
description = "Every supplied target disposition must preserve independent local theorem dispositions."
[[hostile_controls]]
id = "reject-local-branch-collapse"
description = "Proved, refuted, conditional, and unresolved local branches remain distinct."
[[hostile_controls]]
id = "reject-refuted-branch-erasing-proved-branches"
description = "Rejecting one application bridge cannot erase unrelated structural or analytic-evaluation proofs."
[[hostile_controls]]
id = "reject-historical-branch-reindexing"
description = "PortFiberEvaluationTopology and PortFiberOpenCoverDescent extend portfolios by disjoint sums; original_branch_unchanged and target_unchanged must hold at each extension."
[[hostile_controls]]
id = "reject-open-obligation-as-false-or-proved"
description = "Unresolved arithmetic, source-comparison, and convergence obligations provide neither proof nor refutation."
[[hostile_controls]]
id = "reject-local-update-changing-target"
description = "A local theorem update leaves the terminal RH disposition unchanged."
[[hostile_controls]]
id = "reject-stage-as-residual-update"
description = "A stage cannot alter residuals without an accepted adapter, source compatibility, and a valid named change."
[[hostile_controls]]
id = "reject-plan-changing-target-or-portfolio"
description = "A residual plan cannot modify local theorem or target dispositions."
[[hostile_controls]]
id = "reject-untouched-key-drift"
description = "Untouched residual keys remain exactly unchanged."
[[hostile_controls]]
id = "reject-root-import-as-slice-pass"
description = "A build of GRWTSK cannot substitute for checking the isolated root and every declared module."
[[hostile_controls]]
id = "reject-nonopen-cover-promotion"
description = "IsOpenCover explicitly requires both members to be open in the ambient complex plane. Do not apply this theorem to arbitrary or merely closed covers without a new analytic theorem."
[[hostile_controls]]
id = "reject-cover-exhaustion-gap"
description = "Replay OpenCoverFixtures.empty_domains_do_not_cover. Openness does not supply the exact coverage and inclusion fields of BinaryDomainCover."
[[hostile_controls]]
id = "reject-open-cover-overlap-mismatch"
description = "Replay OpenCoverFixtures.zero_one_do_not_match on the nonempty overlap of the two punctured-plane opens. Local holomorphy and openness cannot replace matching."
[[hostile_controls]]
id = "reject-global-holomorphy-as-input"
description = "holomorphicGlueCertificate_of_openCover must derive its global proof from local witnesses and openness; it may not assume its own conclusion or change the historical ordinary glue."
[[hostile_controls]]
id = "reject-descent-source-ring-mismatch"
description = "Both local Bridge maps must have the same exact source CommRingCat object; names, equal dimensions, or separately isomorphic rings do not supply that identity."
[[hostile_controls]]
id = "reject-spectrum-only-descent"
description = "Descent.Compatible requires equality of the restricted coordinate-ring homomorphisms, not just equal prime-spectrum point maps."
[[hostile_controls]]
id = "reject-descended-ring-law-gap"
description = "Descent.glueRingHom must prove zero, one, addition, and multiplication through local ring laws and holomorphic_ext. A pointwise gluing function alone is insufficient."
[[hostile_controls]]
id = "reject-polynomial-descent-drift"
description = "Descent.glue_polynomial_model must recover the existing global polynomial Bridge as equality of coordinate-ring maps, not as an unrelated new point-map fixture."

[acceptance]
requires_all_declared_modules = true
requires_exact_public_signatures = true
requires_explicit_failures_and_unavailable_checks = true
requires_named_downstream_blockers = true
requires_root_import_unchanged = true
requires_hostile_controls = true
requires_axiom_audit = true
requires_runtime_safety_scan = true

[nonclaims]
claims = [
  "construction of the source-specific arithmetic-to-elliptic coordinate-ring map or B_n",
  "global elliptic or Poncelet comparison theorem",
  "holomorphic gluing on arbitrary non-open covers without an appropriate analytic theorem",
  "general indexed-cover sheaf descent or nontrivial line-bundle cocycle descent",
  "coordinate-ring descent from spectrum point-map agreement alone",
  "topological embedding or surjectivity of analytic evaluation into the prime spectrum",
  "identification of analytic points with all prime ideals",
  "injectivity of every supplied analytic-affine bridge",
  "complete explicit formula",
  "convergence to the Weil form",
  "Weil positivity",
  "proof or refutation of the Riemann Hypothesis",
  "automatic continuity of arbitrary ring homomorphisms on their carrier topologies",
  "holomorphy inferred from continuity",
  "automatic residual discharge from local certification",
  "classification of an unresolved obligation as false",
  "arithmetic comparison or zeta theorems from polynomial descent or generic functoriality"
]
