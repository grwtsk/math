[[hostile_controls]]
id = "empty-character"
must_preserve = "Every subset including empty contributes to the exact Walsh sum; the empty coefficient is sample size."
[[hostile_controls]]
id = "pairwise-is-not-full-independence"
must_preserve = "The 4-sample fixture has all one- and two-point moments zero but nonzero 3-point moment."
[[hostile_controls]]
id = "boundary-source-identity"
must_preserve = "Off-exception matching requires same actual root and every selected Boolean coordinate."
[[hostile_controls]]
id = "distinct-arithmetic-shifts"
must_preserve = "No fixed or growing affine-shift Chowla theorem is constructed or imported by this generic finite module."
[[hostile_controls]]
id = "entire-boolean-cube"
must_preserve = "Orthogonality sums over ALL Boolean assignments, not a proper subset, sample-dependent selection, or sparse orbit."

[[hostile_controls]]
id = "distinct-characters"
must_preserve = "The zero result requires S != T; diagonal Gram entries count all assignments, including the empty-coordinate case."

[[hostile_controls]]
id = "moment-sign-convention"
must_preserve = "Parent signedMomentOn includes the pattern character. Factoring it must retain the unchanged source moment and correct character."

[[hostile_controls]]
id = "positive-root-cardinality"
must_preserve = "The empirical chi-square equality requires 0 < roots.card. Empty-root sourceCorrelation is zero; treating 0/0 as one is forbidden."

[[hostile_controls]]
id = "nonempty-correlation-energy"
must_preserve = "The sum over subset characters excludes exactly the empty subset, whose positive-sample coefficient is one. Full-cube orthogonality must be used."

[[hostile_controls]]
id = "squared-not-absolute-energy"
must_preserve = "The correlation energy is the sum of squares of PLAIN source moments divided by roots.card squared, not the sum of raw or pattern-signed moments."

[[hostile_controls]]
id = "chi-square-denominator"
must_preserve = "Pearson chi-square relative to U is q^{-1} sum_a(q P(a)-1)^2, q=card(ι→Bool). It is not q times this expression."

[[hostile_controls]]
id = "tv-normalization"
must_preserve = "The fair Bernoulli L1 distance is halved; scaled discrepancy q*P(a)-1 is divided by q exactly once. No missing 1/2, q, or square."

[[hostile_controls]]
id = "sqrt-real-conversion"
must_preserve = "The rational squared-TV inequality becomes a real square-root inequality only through an explicit rational-to-real cast and a proved square/sqrt comparison."

[[hostile_controls]]
id = "categorical-root-conservation"
must_preserve = "Every finite root contributes mass one to exactly one categorical label; sum of all category counts equals roots.card, with no collapsed labels."

[[hostile_controls]]
id = "exception-subset-and-full-label"
must_preserve = "Exception is a subset of the same roots in both laws, and every nonexceptional root has equal complete labels. Root count or unlabeled geometry alone does not suffice."

[[hostile_controls]]
id = "l1-coupling-factor-two"
must_preserve = "Total categorical L1 discrepancy is at most 2*exception.card, which yields TV <= exception.card / roots.card; not the stronger false half-bound."

[[hostile_controls]]
id = "single-root-sharpness"
must_preserve = "The Boolean fixture with one root and opposite labels has total variation exactly one, while the empty-exception agreement hypothesis is false."

[[hostile_controls]]
id = "single-root-population"
must_preserve = "Source, model, categorical discrepancy and uniform-reference TV must all refer to the SAME positive-cardinality finite root set; changing samples requires another theorem."

[[hostile_controls]]
id = "complete-boolean-label-marginal"
must_preserve = "The intervening categorical distance compares complete Boolean words and the exact Walsh empirical law, not a coarser or unlabeled partition."

[[hostile_controls]]
id = "one-sided-source-energy"
must_preserve = "The composite estimate uses ONLY source nonempty Walsh energy and charges the exceptional set once; no assumption that the model energy is small."

[[hostile_controls]]
id = "triangle-is-not-sofic-limit"
must_preserve = "Finite triangle and labeled boundary bounds do not construct a cyclic sample or sofic limit. The r/N specialization requires a separate index/boundary theorem."

[[hostile_controls]]
id = "modulo-zero-rejected-by-consumer"
must_preserve = "The finite cyclic return requires r<N, hence N>0; the standalone modular window definition must not be claimed a probability law at N=0."

[[hostile_controls]]
id = "exact-last-r-roots"
must_preserve = "The exceptional collar is Ico (N-r) N, not an arbitrary boundary label; its exact cardinal is r only under r<=N."

[[hostile_controls]]
id = "no-wrap-for-every-coordinate"
must_preserve = "For each good root n<N-r and every h in the finite offset set, n+h<N and modulo N is the identity. All Boolean source labels, not just averages, agree."

[[hostile_controls]]
id = "empty-offset-cycle"
must_preserve = "The empty offset finset has supremum zero and an empty collar; a zero-dimensional Boolean word does not incur a fabricated wrap error."

[[hostile_controls]]
id = "shift-identity-and-duplicates"
must_preserve = "The finite set of offsets is the coordinate type. Duplicate input shifts are collapsed by Finset; a multiset or indexed family with repeats needs another adapter."

[[hostile_controls]]
id = "cyclic-source-not-arithmetic-cancellation"
must_preserve = "The cyclic model theorem transports ONLY the finite source energy and r/N error; it supplies neither higher-order Chowla estimates nor an infinite sofic action."

[[hostile_controls]]
id = "all-nonempty-subsets"
must_preserve = "The envelope quantifies over every nonempty subset of the complete finite offset-coordinate type; neither binary-only nor any fixed arity is an accepted substitute."

[[hostile_controls]]
id = "exponential-character-cost"
must_preserve = "Exactly 2^k-1 distinct nonempty characters contribute. A bound by k*epsilon^2 is false without extra independence or coefficient sparsity hypotheses."

[[hostile_controls]]
id = "uniformity-per-scale"
must_preserve = "A single epsilon applies to every subset at the given N and selected shifts; forall fixed shifts exists constant does not provide one epsilon uniformly over a growing shift family."

[[hostile_controls]]
id = "nonnegative-envelope"
must_preserve = "epsilon >= 0 is part of the envelope; pointwise |correlation| <= epsilon alone must not be silently used for a negative error budget."

[[hostile_controls]]
id = "finite-sample-support-feasibility"
must_preserve = "Paper-only obstruction: an N-root empirical law on q=2^k patterns has TV at least max(0, 1-N/q) and chi-square energy at least q/N-1. Any claim of small error with q much larger than N needs rejection; this obstruction is NOT yet a Lean theorem."

[[hostile_controls]]
id = "no-new-arithmetic-estimate"
must_preserve = "OrdinaryAllOrderChowlaAtScale is a declared proposition, NOT inhabited by the external 2026 fixed two-point result, and no log/ordinary or all-order transfer is constructed."

[[hostile_controls]]
id = "no-probabilistic-upgrade"
must_preserve = "All eight finite module layers, including the conditional all-order envelope with exact exponential cost, are SOURCE_DRAFT only, not elaborated or kernel-audited. Shannon entropy and any actual all-order arithmetic cancellation supplier remain open."
[[hostile_controls]]
id = "no-spectral-upgrade"
must_preserve = "Neither local/sofic graph limits nor normalized finite patterns entail microscopic GUE spacing."

