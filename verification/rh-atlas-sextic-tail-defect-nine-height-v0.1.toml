[[hostile_controls]]
id = "same_sextic_source"
requirement = "Reuse the exact sextic source_identity, b6, tail, reference R6, multiplier A7, normalization and finiteModel. No new primitive, endpoint correction or source map."

[[hostile_controls]]
id = "signed_kernel_not_defect"
requirement = "The polynomial normalized(u)=30240*b6(u) is signed. Only the difference between its proved norm majorant and actual norm is nonnegative. Do not replace the signed kernel by a positive metric."

[[hostile_controls]]
id = "kernel_table_identity"
requirement = "All112 signed coefficients must satisfy the16 exact degree6 polynomial identities. Their absolute bounds must be matched to the same16 cap numerators and binomial weights. An arbitrary positive/signed table or point samples are insufficient."

[[hostile_controls]]
id = "partition_identity"
requirement = "Prove the binomially weighted degree6 partition identity. The unweighted basis is not a partition of unity."

[[hostile_controls]]
id = "closed_first_cell"
requirement = "At t=2 the fractional part resets to0, while u=t-1=1. Retain and prove the matching sextic endpoint values; do not apply floor(t)=1 at t=2."

[[hostile_controls]]
id = "weight_exponent_scope"
requirement = "The lower defect weight t^-7 uses Re(s)<=1; the relative saving also uses Re(s)>=1/2. Retain both hypotheses and positivity of the integration variable."

[[hostile_controls]]
id = "actual_absolute_defect"
requirement = "Define defect=w-30240*norm(actual sextic integrand). Prove it is integrable and nonnegative above1. No numerical error label may replace this function."

[[hostile_controls]]
id = "no_missing_subcell"
requirement = "All16 intervals node(i)..node(i+1) telescope from1 to2. They retain endpoints once under interval integration; no sampled or corner-only coverage."

[[hostile_controls]]
id = "rational_integral_not_quadrature"
requirement = "Compute each integral of t^-7 exactly as (a^-6-b^-6)/6 with a,b>0. The sum saving>=7/220 is a finite rational theorem, not numerical quadrature."

[[hostile_controls]]
id = "tail_complement_nonnegative"
requirement = "The complement(2,infinity) is separately integrable and contributes nonnegative defect. Do not drop it before proving that sign and the exact domain split."

[[hostile_controls]]
id = "first_cutoff_only"
requirement = "The factor33/40 is established for tail1 ONLY. Do not attach it to tail N at general cutoffs. The all-integer finite-model theorem deliberately retains155/132."

[[hostile_controls]]
id = "two_bounds_not_conflated"
requirement = "The analytic saving33/40 multiplies the geometric ratio155/132 to31/32. The geometric ratio alone exceeds1 and proves no zero exclusion."

[[hostile_controls]]
id = "joint_identity_complete"
requirement = "All66 natural tensor coefficients must satisfy1024*(24025D-17424N) on x=(1+u)/2,y=81v. Reuse the unchanged N,D and exact norm identities; restore both shared factors."

[[hostile_controls]]
id = "domain_squared_height"
requirement = "Prove y=Im(s)^2 in[0,81] and x in[1/2,1]. The common root remains heightAt=Im, not a second cutoff coordinate."

[[hostile_controls]]
id = "strict_margin_and_closed_edges"
requirement = "Include Re=1/2,Re=1,Im=+/-9 and H(1)=1. Derive relative31/32, reference65/112 and lower65/3584>0. Do not weaken strict margin."

[[hostile_controls]]
id = "old_failure_preserved"
requirement = "The old height-nine comparison failure remains true because it used a weaker tail bound. New gap failure at x=1/2,y=100 concerns a sufficient certificate, not a zero or false RH."

[[hostile_controls]]
id = "mirror_zero_only"
requirement = "Use critical reflection only on canonical target zero locations. No H-value/norm/multiplicity equality or complete zero-list certification follows."

[[hostile_controls]]
id = "homotopy_same_function"
requirement = "Retain the existing R6+t(H-R6) and real t in[0,1]. Reciprocal differentiability requires separate holomorphy and derived nonvanishing."

[[hostile_controls]]
id = "previous_port_and_next_gap"
requirement = "Instantiate the previous window_nine_of_shell with shellRH_eight. WindowRH10 still requires ShellRH9 and RH still requires the full higher-step family."

[[hostile_controls]]
id = "verification_status"
requirement = "Require exact elaboration of all modules and declaration types plus transitive axiom audit. Reject sorryAx and undeclared native dependencies. Python identities, integral algebra and hashes are NOT a replay or kernel receipt."
