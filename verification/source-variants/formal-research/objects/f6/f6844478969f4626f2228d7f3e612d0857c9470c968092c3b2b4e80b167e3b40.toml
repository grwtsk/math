name = "bit_matrix"
version = "0.1.0"
testDriver = "bit_matrix_tests"

defaultTargets = [
  "BitMatrix",
  "bit_matrix_demo",
  "bit_matrix_tests"
]

[leanOptions]
pp.unicode.fun = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.32.0"

[[lean_lib]]
name = "BitMatrix"
# The compiled-environment audit enumerates every repository Lean source file.
# Namespace globs make every non-executable source an actual library build root,
# so `lake exe compiled_environment_export` never relies on cached `.olean`
# files and newly added modules enter the export dependency graph automatically.
roots = [
  "Atomize",
  "BooleanMatrix",
  "BitMatrix",
  "DAF",
  "FilesystemCodec",
  "FilesystemDynamics",
  "FilesystemHomology",
  "Quantization",
  "Surface"
]
globs = [
  "Atomize.*",
  "BooleanMatrix.*",
  "BitMatrix.*",
  "DAF.*",
  "FilesystemCodec.+",
  "FilesystemDynamics.+",
  "FilesystemHomology.+",
  "Quantization.+",
  "Surface.+"
]

[[lean_exe]]
name = "bit_matrix_demo"
root = "Main"

[[lean_exe]]
name = "bit_matrix_tests"
root = "Tests"

[[lean_exe]]
name = "compiled_environment_export"
root = "Tools.CompiledEnvironmentExport"
# Main and Tests cannot share one Lean environment because both define `main`.
# Build their executable roots separately before the exporter dynamically reads
# each module's compiled metadata.
needs = [
  "BitMatrix",
  "bit_matrix_demo",
  "bit_matrix_tests"
]
