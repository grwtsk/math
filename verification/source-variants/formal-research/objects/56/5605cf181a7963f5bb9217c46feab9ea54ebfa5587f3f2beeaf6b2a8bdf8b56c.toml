name = "math_discovery"
version = "0.8.0"
defaultTargets = ["MathDiscovery"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.0"

[[lean_lib]]
name = "MathDiscovery"

[[lean_lib]]
name = "MathDiscoveryTools"
globs = ["tools.LeanSource.+", "tools.LeanEnvironmentExtractAtoms.+"]

[[lean_exe]]
name = "surface_lean_env_extract"
root = "tools.LeanEnvironmentExtract"

[[lean_exe]]
name = "surface_lean_source_trace"
root = "tools.LeanSourceTrace"
supportInterpreter = true
