name = "ursm_composite"
version = "0.1.0"
defaultTargets = ["URSMComposite"]

[[require]]
name = "ursm_contracts"
path = "../contracts"

[[require]]
name = "ursm_bridge"
path = "../bridge"

[[require]]
name = "ursm_network"
path = "../network"

[[lean_lib]]
name = "URSMComposite"
globs = ["URSMComposite", "CompositeElements.+"]

[[lean_exe]]
name = "emit_composite_manifest"
root = "Tools.EmitCompositeManifest"
supportInterpreter = true

[[lean_exe]]
name = "check_composite_manifest"
root = "Tools.CheckCompositeManifest"
supportInterpreter = true
