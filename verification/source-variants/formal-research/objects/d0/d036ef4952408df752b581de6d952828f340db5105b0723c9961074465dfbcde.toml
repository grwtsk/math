name = "mathematics"
version = "0.8.0"
defaultTargets = ["Mathematics"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.0"

[[lean_lib]]
name = "Mathematics"
globs = ["Mathematics", "Mathematics.+"]

[[lean_lib]]
name = "MathematicsTools"
globs = ["tools.LeanSource.+", "tools.LeanEnvironmentExtractElements.+"]

[[lean_exe]]
name = "surface_lean_env_extract"
root = "tools.LeanEnvironmentExtract"

[[lean_exe]]
name = "mathematics_lean_element_extract"
root = "tools.LeanEnvironmentExtractElements.Main"

[[lean_exe]]
name = "surface_lean_source_trace"
root = "tools.LeanSourceTrace"
supportInterpreter = true

[[lean_exe]]
name = "surface_lean_kernel_check"
root = "tools.LeanKernelCheck"
supportInterpreter = true
