name = "formal-research"
version = "0.1.0"
keywords = ["math", "formalization", "lean"]
defaultTargets = ["FormalResearch"]

lintDriver = "batteries/runLinter"

[leanOptions]

# Render anonymous functions using ↦.
pp.unicode.fun = true

# A misspelled variable must never silently become an implicit variable.
autoImplicit = false
relaxedAutoImplicit = false

# Follow the Mathlib synthesis configuration.
maxSynthPendingDepth = 3

# Enable the standard Mathlib linter family.
weak.linter.mathlibStandardSet = true

# Mathlib's header style linter requires an Apache-2.0 copyright header. This
# repository uses MIT, so do not require incompatible Apache-2.0 legal metadata
# as a build condition. All mathematical linters remain enabled, and warnings
# still fail the build.
weak.linter.style.header = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

# The source-bound RH work uses the import closures of Zeta23.WeilEF.Main and
# Zeta23.XiPrime.ExplicitFormula.ZeroFree.  The latter supplies the proved
# weighted actual-zero logarithmic-derivative identity used by the centered-xi
# product construction; no XiPrime headline proportion theorem is imported.
# The dependency keeps its Apache-2.0 notices and the root Mathlib revision
# above remains authoritative.  scripts/prepare_weil_source.py checks the
# original 57-module Weil closure separately and applies only recorded
# deprecated-name compatibility renames to both exact pinned closures.
[[require]]
name = "Zeta23"
git = "https://github.com/anthropics/formal-math"
rev = "3635e74826a4c1fcece7d1cd2b6fa75e43a00510"

[[lean_lib]]
name = "FormalResearch"

# Canonical exact RH target and zero symmetries, with checked legacy exports.
[[require]]
name = "grwtsk-math"
git = "https://github.com/grwtsk/math.git"
rev = "4396c48c99d39ccaf05c4e74a4d166319ebfdb71"
