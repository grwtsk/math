[[hostile_controls]]
id = "source_identity"
required = true
description = "Reuse the existing residue-normalized source with F(1)=1, not a raw totalized product."

[[hostile_controls]]
id = "canonical_orders"
required = true
description = "Transport analytic orders at actual nonpole points; count contribution at one is zero."

[[hostile_controls]]
id = "right_half_plane"
required = true
description = "Zero equivalence and source remainder retain positive real part; no silent crossing of Re(s)=0."

[[hostile_controls]]
id = "finite_inventory"
required = true
description = "Positive bases 1..N only; every Bernoulli correction and minus half endpoint retained."

[[hostile_controls]]
id = "pole_safe_definition"
required = true
description = "Define entire G before division. Nonpole raw-product identity is not asserted at one."

[[hostile_controls]]
id = "true_derivative"
required = true
description = "The second output is the derivative of G at ALL complex points, including one, for N>=1."

[[hostile_controls]]
id = "source_tail_factor"
required = true
description = "Pay the inherited integral remainder times |s-1| and the complete finite ball error."

[[hostile_controls]]
id = "pointwise_vs_derivative"
required = true
description = "A zero pointwise value residual does not imply a zero derivative residual; require uniform Cauchy input."

[[hostile_controls]]
id = "complete_disk_geometry"
required = true
description = "Positive left margin, nonnegative inner radius and strictly positive outer-to-inner gap required."

[[hostile_controls]]
id = "computed_derivative_bound"
required = true
description = "Cauchy source bound is derived, not a sampled derivative or a claimed curvature field."

[[hostile_controls]]
id = "proper_norm_direction"
required = true
description = "Use max coordinate absolute value as a lower bound; L1 magnitude is an upper bound only."

[[hostile_controls]]
id = "strict_margin"
required = true
description = "Equality e+MR=lower must reject; rejection is not a claim of a source zero."

[[hostile_controls]]
id = "actual_sample_semantics"
required = true
description = "A fictitious value two at one can pass the finite gate but has no true source enclosure."

[[hostile_controls]]
id = "rounded_arithmetic"
required = true
description = "Keep signed midpoint displacements, product-of-radii terms and all old logarithm/exponential trace checks."

[[hostile_controls]]
id = "effective_closed_collar"
required = true
description = "The actual full closed disk |s-1|<=1/5 receives norm lower bound 1/2; not just endpoint samples."

[[hostile_controls]]
id = "coverage_and_count"
required = true
description = "No full contour, winding theorem, canonical coverage or H(15)<4 is supplied by local patches."

[[hostile_controls]]
id = "inherited_trust"
required = true
description = "Entire predecessor chain and generated declarations need pinned elaboration and independent trust review."
