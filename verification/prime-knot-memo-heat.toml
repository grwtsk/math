# Source-pinned targeted verification: prime knot, factoring and mirrored signed heat.
# One local run checks new declarations and their transitive imported dependencies.
# Pre-existing atlas modules are dependencies, not silently counted as new proofs.
#
# python3 scripts/verify_frozen_prime_atlas.py \
#   --config verification/prime-knot-memo-heat.toml \
#   --all-diagnostics --report /tmp/prime-knot-memo-heat.json
#
# Source status: Lean NOT_RUN until this exact manifest passes.
# A pass does not prove a continuous heat generator, signed Weil positivity,
# general RH/GRH, globally optimal traversal or P=NP.
format_version = 1
suite = "Prime Knot: Certified Factor Memo, Involutive Heat and Signed Source Return"
issue = "https://github.com/grwtsk/math/issues/1845"

[environment]
lean_toolchain = "leanprover/lean4:v4.34.1"
mathlib_revision = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[policy]
expected_theorems = 28
allowed_axioms = ["propext", "Classical.choice", "Quot.sound"]

[[module]]
name = "GRWTSK.Combinatorics.GraphTheory.PrimeKnotFactorMemo"
path = "GRWTSK/Combinatorics/GraphTheory/PrimeKnotFactorMemo.lean"
namespace = "GRWTSK.CombinatoricsAndDiscreteMathematics.GraphTheory.PrimeKnotFactorMemo"
git_blob = "ba51828c57e38d059a771470880c2aa111ddcd5f"
theorems = [
  "primeAt_prime",
  "firstPrime",
  "firstPrime_no_previous",
  "previous_of_successor",
  "nextPrime_prime",
  "primeAt_lt_next",
  "primeAt_injective",
  "knot_previous",
  "knot_current_prime",
  "knot_next_prime",
  "atlasKnot_ordinal",
  "atlasKnot_location_id",
  "verifiedMemo_sound",
  "verifiedMemo_all_prime",
  "empty_memo_returns_none",
  "factorCursor_finished_product",
]

[[module]]
name = "GRWTSK.AlgebraicTopology.MirroredPrimeHeatAndSignedReturn"
path = "GRWTSK/AlgebraicTopology/MirroredPrimeHeatAndSignedReturn.lean"
namespace = "GRWTSK.AlgebraicTopology.MirroredPrimeHeatAndSignedReturn"
git_blob = "8b9639e051be4487abe165e6ce880a3e279fd5fd"
theorems = [
  "MirroredFlow.backward_zero",
  "MirroredFlow.backward_add",
  "MirroredFlow.intertwining",
  "MirroredFlow.forward_from_backward",
  "MirroredFlow.Automorphism.commute_backward",
  "signedKnotReflect_preserves_id",
  "signedKnotReflect_involutive",
  "SignedSourceApproximation.lower",
  "SignedSourceApproximation.upper",
  "SignedSourceApproximation.positive_of_margin",
  "SignedSourceApproximation.negative_of_margin",
  "SignedSourceApproximation.exact_of_zero_error",
]
