[[hostile_controls]]
id = "negative-not-unsigned"
description = "The complete correction is strictly negative for h>0 and x-h>1; no zero-correction or positive-correction substitution."

[[hostile_controls]]
id = "normalized-area"
description = "Integral of the normalized tent equals h, not 2h or h squared."

[[hostile_controls]]
id = "finite-prefix-direction"
description = "A finite negative prefix is an upper approximation; subtract its geometric remainder before using it as a lower bound."

[[hostile_controls]]
id = "density-tail"
description = "The pointwise density prefix retains exactly q(t)*(1/t squared)^N, including N=0."

[[hostile_controls]]
id = "compact-domain"
description = "All uniform estimates require the full interval x-h <= t <= x+h and x-h>1."

[[hostile_controls]]
id = "singular-first-square"
description = "n=1 lies outside this analytic correction domain; totalized division at t=1 is not analytic evidence."

[[hostile_controls]]
id = "equality-margin"
description = "A zero or non-strict corrected margin cannot force an actual prime witness."

[[hostile_controls]]
id = "source-identity-open"
description = "The source equality with this exact rational integral remains an independent theorem hypothesis, not a constructed Perron/contour formula."

[[hostile_controls]]
id = "count-and-signed-divisor"
description = "The actual zeta counting theorem, low-height coverage, both signs and multiplicities remain independent."

[[hostile_controls]]
id = "finite-checks-not-replay"
description = "Rational tests, hash matches, primitive algebra and import scans do not establish Lean elaboration or transitive trust."

[nonclaims]
claims = [
  "complete first-Riesz or Riemann explicit formula",
  "identification of the rational correction with contour residues in Lean",
  "actual zeta zero counting, finite low-height coverage or multiplicity certification",
  "finite zero evaluator or spectral prime certificate",
  "all-square strict margins, Legendre or RH",
  "Lean elaboration, transitive trust acceptance or execution authority"
]
