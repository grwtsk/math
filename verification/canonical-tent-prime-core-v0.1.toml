[[acceptance_obligations]]
id = "R01"
requirement = "Elaborate all four new modules at the exact head; preserve every inherited absolute-sum target obligation."

[[acceptance_obligations]]
id = "R02"
requirement = "Reconcile exact public types and the full transitive import/axiom/native closure; selected module bindings are not the full closure."

[[acceptance_obligations]]
id = "R03"
requirement = "The main prime theorem must not acquire a source identity, count, summability, or contour supplier hypothesis."

[[acceptance_obligations]]
id = "R04"
requirement = "Retain canonicalTailBudget and the actual 44/log(6/5) counting coefficient; reject coefficient-one substitution."

[[acceptance_obligations]]
id = "R05"
requirement = "Keep actual full complex locations, both signs, analytic multiplicities, closed cutoff membership and complete strict tail."

[[acceptance_obligations]]
id = "R06"
requirement = "Derive the real lower mass from the negative side of the absolute-error inequality; a wrong direction must not pass."

[[acceptance_obligations]]
id = "R07"
requirement = "The coarse application must derive -squareTrivialBudget internally and retain the correction sign."

[[acceptance_obligations]]
id = "R08"
requirement = "The refined correction uses prefix minus finite evaluation error minus complete geometric remainder, not the prefix alone."

[[acceptance_obligations]]
id = "R09"
requirement = "Charge the included-head evaluation, nontrivial tail, correction-prefix evaluation and correction tail once each; do not add a second coarse correction or unrelated contour error."

[[acceptance_obligations]]
id = "R10"
requirement = "Prime witness extraction requires complete proper-prime-power subtraction and a strictly positive margin; equality cannot pass."

[[acceptance_obligations]]
id = "R11"
requirement = "External exact inventories require membership equivalence for every actual zero, not equal cardinality or approximate heights."

[[acceptance_obligations]]
id = "R12"
requirement = "Use the original squareCount and Legendre predicates; require one fixed threshold at least one, complete finite-prefix coverage and every-input tail suppliers."

[[acceptance_obligations]]
id = "R13"
requirement = "Do not infer a successful certificate, useful margin, uniform moving-interval bound or Legendre from fixed-n convergence or synthetic diagnostics."

[[acceptance_obligations]]
id = "R14"
requirement = "Preserve n>=2 and T>=2 for the analytic theorem; the n=1 arithmetic fixture does not enlarge that domain."

[[acceptance_obligations]]
id = "R15"
requirement = "Do not treat local Fraction/text checks as execution of Lean controls, transitive trust acceptance or numerical zero certification."

