[scope]
summary = "Explicit unimodular kernel frame and exact anisotropic area normalization for the primitive linear equation used in Proposition 4.1."

mathematical_claims = [
  "The reduced coefficient pair a/g,b/g is coprime.",
  "Two explicit integer vectors lie in the kernel of a*x+b*y-c*z.",
  "Their cross product is exactly (-a,-b,c).",
  "A nested Bezout complement completes the frame with determinant -1.",
  "After scaling coordinates by X,Y,Z, the cross product is (-a/(YZ),-b/(ZX),c/(XY)).",
  "The exact squared area is ((aX)^2+(bY)^2+(cZ)^2)/(XYZ)^2.",
  "max(aX,bY,cZ)/(XYZ) is a lower bound for the positive scaled area."
]

nonclaims = [
  "No identification with Mathlib ZLattice.covolume is accepted.",
  "No reduced-basis or successive-minima theorem is proved.",
  "No Blichfeldt or Minkowski finite count is instantiated.",
  "No absolute constant for the Heath-Brown primitive point count is constructed.",
  "No divisor-fibre lifting or complementary-coordinate summation is proved.",
  "No Proposition 4.1, exceptional-set theorem, or abc conjecture is proved.",
  "Source presence is not Lean elaboration, kernel acceptance, or replay evidence."
]

