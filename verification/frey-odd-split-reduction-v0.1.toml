[[hostile_controls]]
id = "reject-nonprime-residue-ring"
description = "Use Fact p.Prime. Composite ZMod rings do not supply the field or degree-two root behavior."

[[hostile_controls]]
id = "reject-nonintegral-residue"
description = "The localization map is not a reduction of arbitrary Q. Denominators divisible by p are excluded."

[[hostile_controls]]
id = "reject-injective-for-equivalence"
description = "Reflect splitting through a constructed residue FIELD EQUIVALENCE, not an arbitrary injective extension."

[[hostile_controls]]
id = "reject-canonical-model-drift"
description = "Identify the chosen integralModel with the supplied same-curve model before reading its tangent polynomial."

[[hostile_controls]]
id = "reject-missing-multiplicative-premise"
description = "The generic split adapter requires actual multiplicative reduction. A split or zero polynomial at a good prime is insufficient."

[[hostile_controls]]
id = "reject-characteristic-two-extension"
description = "Odd-prime conclusions do not classify dyadic splitness. Opposite slopes merge in characteristic two."

[[hostile_controls]]
id = "reject-minus-sign-at-b"
description = "At p|b the parameter is -a; replacing it by a reverses the test for example(1,3,4) at3."

[[hostile_controls]]
id = "reject-wrong-node-at-c"
description = "At p|c translate to x=a. The origin is not the singular point, for example(1,4,5) at5."

[[hostile_controls]]
id = "reject-nonprimitive-source"
description = "Primitivity prevents both a and b vanishing in the residue field. No nonsingular-leading-factor claim for nonprimitive tuples."

[[hostile_controls]]
id = "reject-zero-leading-factor"
description = "Cancel the tangent polynomial scalar only after proving16*d^2 nonzero."

[[hostile_controls]]
id = "reject-double-root-as-node"
description = "Nonzero square parameter and characteristic not2 are retained for distinct tangent directions."

[[hostile_controls]]
id = "reject-quadratic-as-full-curve"
description = "The exact local expansion has the cubic remainder -u^3. The tangent cone is not the entire elliptic curve or a Bezier arc."

[[hostile_controls]]
id = "reject-source-relabel"
description = "Retain ordered a,b,c. Equal j and the same bad-prime label do not justify exchanging source branches or rational twists."

[[hostile_controls]]
id = "reject-c4-square-for-splitness"
description = "The leading c4 can be a square in both split and nonsplit cases; inspect the slope parameter instead."

[[hostile_controls]]
id = "reject-selected-model-promotion"
description = "Formal split theorems use the OLD raw model, already minimal at odd primes. Selected-model slope compatibility is checked arithmetic, not an exported transport theorem."

[[hostile_controls]]
id = "reject-conductor-or-tamagawa"
description = "No conductor exponent, Galois representation, Tate uniformization, Kodaira or Tamagawa datum is supplied."

[[hostile_controls]]
id = "reject-branches-as-atlas"
description = "Two tangent directions are not an open-cover atlas, global section frame, or rationally labelled pair in the nonsplit case."

[[hostile_controls]]
id = "reject-static-as-acceptance"
description = "No Lean execution, kernel replay, transitive trust, merge or issue closure follows from source and bounded checks."

[acceptance]
requires_all_declared_modules = true
requires_exact_public_signatures = true
requires_explicit_failures_and_unavailable_checks = true
requires_named_downstream_blockers = true
requires_root_import_unchanged = true
requires_hostile_controls = true
requires_axiom_audit = true
requires_runtime_safety_scan = true

[nonclaims]
claims = [
  "Lean parsing, elaboration, kernel or transitive trust acceptance",
  "execution or acceptance of historical targets or hostile controls",
  "dyadic splitness or a general Tate algorithm",
  "formal split transport to the selected global equation",
  "a conductor, Ogg, Kodaira or Tamagawa calculation",
  "Tate uniformization or a Galois-representation comparison",
  "completed-local or extension-field invariance",
  "rational tangent labels in a nonsplit residue fiber",
  "an elliptic curve equal to its quadratic tangent cone",
  "a geometric open-cover atlas or a complete section/jet lattice",
  "intrinsic Hodge, adelic height or uniform radical-height estimates",
  "cancellation of old model, weighted-map, index or gauge costs",
  "ABC, RH, external replay, worker/F06, merge or closure authority"
]
