[[hostile_controls]]
id = "actual-source-only"
description = "ZeroPoint must remain the subtype of the existing NontrivialZetaZero predicate, not an arbitrary complex family or a newly weakened predicate."

[[hostile_controls]]
id = "order-finiteness-before-toNat"
description = "Analyticity and order_ne_top must precede positivity of analyticOrderNatAt; the identically zero function has infinite order but natural order zero."

[[hostile_controls]]
id = "nonzero-natural-weights"
description = "Weights are actual analytic multiplicities and are positive; zero metadata cannot erase a real zero."

[[hostile_controls]]
id = "multiplicity-not-cardinality"
description = "Synthetic double root has order two at one point; distinct-point cardinality is only a lower bound for the weighted count."

[[hostile_controls]]
id = "both-signs-full-coordinates"
description = "A point and its conjugate may have equal absolute height without being equal. Never index the divisor only by height or project real parts to one-half."

[[hostile_controls]]
id = "closed-head-complete-complement"
description = "heightHead includes equality at the cutoff; every omitted canonical point must have strictly greater height."

[[hostile_controls]]
id = "noncomputable-not-enumerated"
description = "Set.Finite.toFinset is a mathematical finite head, not a finite database, numerical zero list, external enclosure certificate, or executable evaluator."

[[hostile_controls]]
id = "actual-count-still-open"
description = "The all-height scalar count bound is an independent analytic hypothesis; compact finiteness cannot supply a growth rate or a threshold."

[[hostile_controls]]
id = "exact-external-membership"
description = "External finite sets replace heightHead only through exact membership agreement over all actual points; matching sample counts or approximate coordinates is insufficient."

[[hostile_controls]]
id = "source-formula-still-open"
description = "The actual first-Riesz/tent arithmetic identity remains an unproved theorem argument even when the zero divisor is now canonical."

[[hostile_controls]]
id = "inherited-and-kernel-boundary"
description = "No finite model check, source draft, parent receipt, or public-root success accepts the new root or its transitive types and axioms."

[nonclaims]
claims = [
  "Lean compilation or kernel acceptance",
  "actual zeta height-count upper bound or its valid threshold",
  "complete first-Riesz or Perron explicit formula",
  "certified numerical zero inventory or finite evaluator",
  "conjugation/reflection multiplicity transport for external records",
  "positive margin for any interval from spectral data",
  "uniform positive margins for all square intervals",
  "Legendre conjecture or Riemann hypothesis",
  "build request, merge, execution authority or held-condition change"
]
