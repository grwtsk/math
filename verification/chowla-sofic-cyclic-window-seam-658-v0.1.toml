[[hostile_controls]]
id = "empty-horizon"
requirement = "N=0 is not a probability horizon; the final theorem must require N>0."
status = "NOT_RUN"

[[hostile_controls]]
id = "seam-cardinality-range"
requirement = "Exact seam cardinality r requires r<=N; for r>N the interval saturates and its size is not r."
status = "NOT_RUN"

[[hostile_controls]]
id = "empty-seam"
requirement = "For r=0 the seam is empty, and allowed shifts are only zero, hence no wraparound difference."
status = "NOT_RUN"

[[hostile_controls]]
id = "all-boundary"
requirement = "For r=N the entire range may be exceptional and r/N=1, not a vanishing boundary."
status = "NOT_RUN"

[[hostile_controls]]
id = "strict-off-by-one"
requirement = "Root n=N-r-1 (if it exists) is good; root n=N-r is exceptional. Ico left closed/right open must not be swapped."
status = "NOT_RUN"

[[hostile_controls]]
id = "original-sequence-identity"
requirement = "Ordinary and cyclic labels must be computed from the SAME original binary sequence a, not independent samples."
status = "NOT_RUN"

[[hostile_controls]]
id = "modulus-identity"
requirement = "Cyclic label is a((n+h)%N), ordinary label is a(n+h), and Nat.mod_eq_of_lt must be used under n+h<N."
status = "NOT_RUN"

[[hostile_controls]]
id = "all-selected-shifts"
requirement = "Every selected h must be proved <=r, and all selected coordinates must agree at each nonexceptional root."
status = "NOT_RUN"

[[hostile_controls]]
id = "no-growth-shortcut"
requirement = "Finite TV <= r/N does not tend to 0 if r grows proportionally to N; fixed-window control does not imply growing-shift uniformity."
status = "NOT_RUN"

[[hostile_controls]]
id = "liouville-offset-adapter-open"
requirement = "Actual Liouville source uses a(n)=lambda(n+1); this specialisation and its nonzero guard are not imported or proved here."
status = "NOT_RUN"

[[hostile_controls]]
id = "sofic-distinction"
requirement = "A finite N-cycle approximation for Z is not a Bernoulli measure assertion or Liouville ergodicity theorem."
status = "NOT_RUN"

[[hostile_controls]]
id = "no-spectral-promotion"
requirement = "No microscopic GUE, zeta-divisor, operator-norm convergence, or Riemann Hypothesis follows from binary finite-event TV."
status = "NOT_RUN"

[[hostile_controls]]
id = "no-trust-promotion"
requirement = "Textual source/manifest inspection without exact-head kernel elaboration and external audit remains NOT_RUN."
status = "NOT_RUN"
