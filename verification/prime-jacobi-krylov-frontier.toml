# Source-pinned, narrow verification suite for independent prime-Jacobi
# Krylov support, positive determinant and inverse prime-bond theorem.
#
# Run in an exact grwtsk/math checkout with Lean/Lake installed:
#   python3 scripts/verify_frozen_prime_atlas.py \
#     --config verification/prime-jacobi-krylov-frontier.toml \
#     --all-diagnostics \
#     --report /tmp/prime-jacobi-krylov-frontier.json
#
# A TOML manifest is NOT a completed check. The new Lean source and all
# its imported dependencies remain SOURCE_PROOF_CANDIDATES until genuine
# compilation, axiom auditing, and fresh kernel replay succeed. This
# runner is not an independently implemented Lean checker.
# No zeta zeros or external RH proof are used as input.
format_version = 1
suite = "Prime-only Jacobi Krylov frontier and inverse Hankel determinants"
issue = "https://github.com/grwtsk/math/issues/1849"

[environment]
lean_toolchain = "leanprover/lean4:v4.34.1"
mathlib_revision = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[policy]
expected_theorems = 17
allowed_axioms = ["propext", "Classical.choice", "Quot.sound"]

[[module]]
name = "GRWTSK.Combinatorics.GraphTheory.PrimeJacobiKrylovFrontier"
path = "GRWTSK/Combinatorics/GraphTheory/PrimeJacobiKrylovFrontier.lean"
namespace = "GRWTSK.CombinatoricsAndDiscreteMathematics.GraphTheory.PrimeJacobiKrylovFrontier"
git_blob = "05aafe27b87dae744c49533a8906b6ab6b08cecb"
theorems = [
  "bondPrefix_zero",
  "bondPrefix_succ",
  "bondPrefix_pos",
  "action_support",
  "iterate_root_support",
  "frontier_edge",
  "iterate_root_frontier",
  "krylovMatrix_upper_triangular",
  "krylovMatrix_diagonal",
  "krylovMatrix_det_product",
  "hankelMatrix_det_explicit",
  "hankelMatrix_det_positive",
  "prefixKrylovDet_succ",
  "primeRootHankelDet_eq_prefix",
  "primeRootHankelDet_positive",
  "primeRootHankelDet_recurrence",
  "bond_sq_from_hankel_determinants",
]
