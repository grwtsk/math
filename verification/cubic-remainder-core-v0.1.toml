[controls]
obligations = [
  "Cell integrals reuse the unchanged normalized third polynomial and logPower; no second factor of 1/3! is inserted.",
  "The half-plane comparison requires q>=1; below one the exponent order can reverse.",
  "Positive p=sigma0+2 is independent of the totalized p=0 quotient.",
  "Retain the terminal power in each finite majorant telescope before weakening its bound.",
  "Prove summability of integral norms, not just cancellation between signed cell integrals.",
  "N included cells have first omitted endpoint N+1; empty prefixes retain a nonzero error budget.",
  "The tail is the complete infinite omitted family; finite diagnostic samples do not certify it.",
  "Finite evaluation error is separate and must enclose the same exact prefix.",
  "The cell derivative contains minus log(q+u); obtain the interchange from explicit local domination.",
  "Holomorphy is on Re(s)>-2, and uniform majorants require a fixed sigma0>-2; no maximal-domain claim is made.",
  "Remainder analyticity at one does not remove the separate zeta pole or identify a zeta source.",
  "Do not divide through zero cubic prefactors or infer equality from matching analytic norm bounds.",
  "The single periodic improper-integral adapter is unformalized and unused; the source is the complete cell sum.",
  "Actual-zeta identity, unconditional Lean circle ceilings and old Jensen/prime-consumer hypotheses remain unchanged.",
  "All inherited exact types, transitive imports/axioms/native dependencies and external acceptance requirements remain.",
]
