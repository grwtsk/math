exact_hypotheses = "For the scalar kernel integral and arctangent identity σ : Real, T : Real and hσ : 0 < σ, no T>=0 restriction because integral (-T)..T is oriented. For exact half-gap, gap rate and propagated norm bounds add hT : 0 < T. For coefficient-level corollaries add q N : Nat, χ : DirichletCharacter C q, hσ : 1 < σ, hN : 3 <= N. For atTop convergence retain σ>0. No hSeven, NeZero q, character primitiveness, analytic explicit formula or global prime error is assumed."
normalization = "finitePerronEndpointKernel σ T = ((2*pi:Real):Complex)^(-1) * ∫_{-T}^T ((1:Complex)/((σ,t):Complex)) dt. The normalizing scalar reflects the real-parameter upward contour; complex curve-integral equivalence remains unproved."
exact_unscaled_integral = "∫_{-T}^T ((1:Complex)/(σ+i*t)) dt = ((2*Real.arctan(T/σ):Real):Complex), for 0<σ, arbitrary oriented real T."
exact_scalar_kernel = "finitePerronEndpointKernel σ T = (((Real.arctan(T/σ)/Real.pi):Real):Complex)."
exact_half_gap = "(1/2:Complex) - finitePerronEndpointKernel σ T = (((Real.arctan(σ/T)/Real.pi):Real):Complex), for σ,T>0."
exact_gap_norm = "norm(K(σ,T) - 1/2) = Real.arctan(σ/T)/Real.pi for σ,T>0."
effective_rate = "norm(K(σ,T)-1/2) <= (σ/T)/Real.pi for σ,T>0, algebraically σ/(Real.pi*T)."
coefficient_rate = "norm(finitePerronTermIntegral(q,N,N,χ,σ,T) - a_N/2) <= norm(a_N)*((σ/T)/Real.pi), for 1<σ,N>=3,T>0."
total_defect_bound = "norm(finitePerronHeightDefect q N χ σ T) <= ∑_{n<N} norm(finitePerronTermIntegral(q,N,n,χ,σ,T)-a_n) + norm(a_N)*((σ/T)/Real.pi)."
scalar_limit = "Filter.Tendsto (finitePerronEndpointKernel σ) Filter.atTop (nhds (1/2:Complex)), when σ>0. No limit asserted for full finitePerronHeightDefect or global prime-weighted sum."
