[nonclaims]
claims = [
  "Lean elaboration, kernel acceptance, transitive trust audit or external replay",
  "replacement or execution of historical roots, targets and hostile controls",
  "integral inversion on all reduced targets without the composite congruences",
  "a new determinant formula for a rectangular normalizer",
  "full cochain recovery from reduced sum and mismatch without gauge fields",
  "intrinsic Hodge metrics, complete H0, geometric integral lattices or conductor laws",
  "removal of metric, field, model or prime-power-depth costs",
  "a universal height or radical-excess bound, abc or RH result",
  "workflow dispatch, worker/F06 action, merge, issue closure or promotion authority"
]
