[[hostile_controls]]
id = "reject-unbound-composite"
description = "Construct the restriction to the old minimum-integral reduced source lattice and then the old weighted port. Matrix factors alone do not define this composite."

[[hostile_controls]]
id = "reject-source-column-reversal"
description = "Read target reverse(i) with the signed SOURCE weight w_i. Do not index weights by the target slot."

[[hostile_controls]]
id = "reject-forgotten-common-edge"
description = "Retain w_i dividing e_0 as well as 3w_i dividing s and 4w_i dividing both edge differences. Difference congruences alone do not give an integral inverse."

[[hostile_controls]]
id = "reject-unrelated-index-product"
description = "Derive four diagonal moduli per column before the product. The exponent 4k^2 belongs to FOUR reduced fields, not one section or six full cochains."

[[hostile_controls]]
id = "reject-clearing-as-index"
description = "The common clearing scalar is 12|ab|^k; the index is 48^r |ab|^(4k^2). They are different invariants."

[[hostile_controls]]
id = "reject-lcm-of-previous-clearing"
description = "Do not replace the composite common denominator by lcm(12,|ab|^k). Shared prime depth can accumulate; ab=6,k=2 requires 432 rather than 36."

[[hostile_controls]]
id = "reject-zero-weight-finiteness"
description = "Zero weights give integer residue factors. Finiteness and the Frey index formula retain nonzero ab; no rational inverse is supplied at zero ab."

[[hostile_controls]]
id = "reject-forgetting-grade-zero"
description = "At grade zero the old weighted port is identity but metric-minimum integrality still has index48 and clearing12."

[[hostile_controls]]
id = "reject-free-gauge-quotient-as-obstruction"
description = "The free integral gauge quotient and the quotient by transported minimum-admissible sources are different objects. Every integral reduced class still has a nonminimal integral anchored lift."

[[hostile_controls]]
id = "reject-replaced-minimum"
description = "Realized integer source cochains must equal the old minimum normal form. Use the old realEmbedding, field basis and six fields."

[[hostile_controls]]
id = "reject-new-function-port"
description = "Use the previous integerPort and realLift with the same rational inverse-ab witness. The diagonal frame identity is proved after the source-map construction."

[[hostile_controls]]
id = "reject-forward-erasure-as-integral-inverse"
description = "Multiplication may annihilate earlier residue obstructions without making the weighted inverse integral. Retain the exact map direction."

[[hostile_controls]]
id = "reject-radical-for-depth"
description = "The support is contained in primes dividing 6ab, but scalar depth and total index retain all powers and rank dependence."

[[hostile_controls]]
id = "reject-coefficient-lattice-as-geometric-H0"
description = "Neither the quotient presentation nor the normalizer identifies an intrinsic integral H0, a minimal/Neron-model lattice, a conductor, or a Hodge metric."

[[hostile_controls]]
id = "reject-quotient-as-full-recovery"
description = "The map consumes reduced sum and mismatch coordinates. Full source recovery still needs the two gauge coordinates per coefficient."

[[hostile_controls]]
id = "reject-source-checks-as-acceptance"
description = "All new scripts remain unelaborated. Independent rational/matrix checks, hashes and token scans are not Lean execution, exact-signature verification or transitive trust acceptance."

[acceptance]
requires_all_declared_modules = true
