[[hostile_controls]]
id = "direct-fixed-affine-not-dyadic"
must_preserve = "The pair (m,m+h) already has slopes (1,1), intercepts (0,h), determinant h. Its complex affine Icc sum equals the integer n+1 shifted prefix with NO dyadic boundary penalty."

[[hostile_controls]]
id = "fixed-h-only"
must_preserve = "Specialize h AFTER the shared exponent c and BEFORE a form-dependent C. This does not produce one C uniform over growing h."

[[hostile_controls]]
id = "positive-shift-required"
must_preserve = "h>0 gives determinant h != 0. For h=0, lambda(n)^2=1 on positive n and the finite prefix equals N."

[[hostile_controls]]
id = "exact-positive-root-conversion"
must_preserve = "Finset.range N with n+1 matches Finset.Icc 1 N exactly, including N=0. No dropped head or tail, no N/2 normalization."

[[hostile_controls]]
id = "integer-to-complex-cast"
must_preserve = "Integer signs are cast to Complex termwise with exact Int.cast_sum and Int.cast_mul; the complex norm of the INTEGER sum is its real absolute value, without taking abs before summation."

[[hostile_controls]]
id = "floor-real-scope"
must_preserve = "The conditional imported theorem uses every real X>=3, real floor_nat cutoff, a positive uniform exponent c and a per-form positive constant C, without changing Real.rpow or logs."

[[hostile_controls]]
id = "pinned-external-Mertens-import"
must_preserve = "The solution import chain reaches PrimeReciprocalTheorem.lean with PrimeNumberTheoremAnd.Erdos970.MertensClassical; that path was absent from the nominal pinned package. A proposed mapping to PrimeNumberTheoremAnd.IEANTN.Mertens cannot be called verified before external elaboration."

[[hostile_controls]]
id = "inert-provider-patch"
must_preserve = "The three-line candidate patch is stored as inert data only; do not claim it was applied, compiled, kernel checked, accepted by OpenAI, or imported into grwtsk/math."

[[hostile_controls]]
id = "Mertens-statement-vs-qualification"
must_preserve = "The alternate theorem has the expected finite prime reciprocal bounded-error source statement. Its exact type compatibility and the full prime library dependency/toolchain reconciliation remain open."

[[hostile_controls]]
id = "external-source-unproven"
must_preserve = "FixedNonproportionalAffineLogSaving is a Prop, NOT an axiom, never given an inhabitant in this package. External solution's transitive trust and the cross-version import are NOT audited."

[[hostile_controls]]
id = "no-higher-order-upgrade"
must_preserve = "Fixed positive binary additive Chowla at each h does not prove the all-order energy or growing-window uniformity required by math #630, nor RH."

