# RH/GRH-independent, source-prime polynomial coefficient-to-Gm
# adaptive certificate. No Alpoge final RH theorem / everyCharacter,
# Weil positivity from RH, or synthetic zeta-zero spectral substitute.
#
# Mathematical main line:
# - strict integer prime gap -> coefficient l1 contraction T_n<=1
# - original Jacobi P_n(J)e0=e_n -> H_N^-1=R^T R and ||H_N^-1||inf<=N
# - Hadamard determinant certificate -> exact prime-bond rounding
# - source Lambda(n) restored from true prime-power factors using
#   variable-precision rational logs, preserving original chi phases
# - source error bound -> Alpoge typed EAtH/CoreAtH bridge in its
#   separately pinned Lean v4.33.1 environment
#
# No Lean/Lake toolchain was available in the authorship runtime.
# Every theorem below is an uncompiled SOURCE_PROOF_CANDIDATE.
# A manifest is NOT an elaboration or kernel receipt.
#
# From a full pinned grwtsk/math checkout, with Mathlib available:
# python3 scripts/verify_frozen_prime_atlas.py \
#   --config verification/prime-jacobi-upstream-contraction-gm.toml \
#   --all-diagnostics --report /tmp/prime-jacobi-upstream-lean.json
#
# Exact separate checker runs (not Lean):
# python3 scripts/verify_prime_jacobi_moment_to_source_stability.py \
#   --max-bonds 8
# python3 scripts/verify_adaptive_prime_log_gm.py
# python3 scripts/verify_prime_jacobi_to_gm_end_to_end.py
format_version = 1
suite = "Prime-gap Jacobi polynomial, genuine Krylov inverse, adaptive signed Gm"
issue = "https://github.com/grwtsk/math/issues/1850"

[environment]
lean_toolchain = "leanprover/lean4:v4.34.1"
mathlib_revision = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[policy]
expected_theorems = 55
allowed_axioms = ["propext", "Classical.choice", "Quot.sound"]

