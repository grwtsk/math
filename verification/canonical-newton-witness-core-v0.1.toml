[[acceptance_obligations]]
id = "R01"
requirement = "Elaborate all new modules at the exact head and preserve all inherited acceptance obligations."

[[acceptance_obligations]]
id = "R02"
requirement = "Reconcile exact public/generated declaration types, Decidable instance, transitive imports, axioms and native dependencies."

[[acceptance_obligations]]
id = "R03"
requirement = "Construct the correction map on the complete CLOSED disk; derive invariance, contraction and the zero equation using A nonzero."

[[acceptance_obligations]]
id = "R04"
requirement = "Retain q<1 strictly and the complete Y+q*r<=r budget, including uncertainty and radius-dependent curvature."

[[acceptance_obligations]]
id = "R05"
requirement = "Use Cauchy n=2 with 2! and radius 1/2; prove whole local-disk inclusion in the source-bound radius-three disk."

[[acceptance_obligations]]
id = "R06"
requirement = "Preserve N>=2, both signed charts and nonnegative containment margin before taking squared-norm implications."

[[acceptance_obligations]]
id = "R07"
requirement = "Apply derivative variation on the entire convex disk, not only finitely many samples or the center."

[[acceptance_obligations]]
id = "R08"
requirement = "CenterEnclosures must concern actual riemannZeta and deriv riemannZeta at the SAME exact center. Boolean success supplies neither."

[[acceptance_obligations]]
id = "R09"
requirement = "Never infer critical-line location from a center on that line. Preserve full complex coordinates."

[[acceptance_obligations]]
id = "R10"
requirement = "Bind Newton centers and radii exactly to numerical rows. A change requires new center facts and new geometry checks."

[[acceptance_obligations]]
id = "R11"
requirement = "The unit-weight consumer retains the independent complete-count upper bound at the same closed cutoff; no count is inferred from rows."

[[acceptance_obligations]]
id = "R12"
requirement = "Keep numerical-head verification, omitted-tail coefficient, signed correction, proper powers and strict prime margin unchanged."

[[acceptance_obligations]]
id = "R13"
requirement = "No actual zero certificate, executable root finder, code generation, choice-free result or universal prime margin is represented."

[[acceptance_obligations]]
id = "R14"
requirement = "Finite diagnostics are synthetic polynomial checks, not all-disk analytic proofs, zeta samples or Lean execution."
