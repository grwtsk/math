[[hostile_controls]]
id = "q-zero-rejected"
requirement = "Character averaging uses [NeZero q]; q=0 has no normalized q-ary projection."
status = "NOT_RUN"

[[hostile_controls]]
id = "q-one-allowed-with-alias"
requirement = "q=1 remains valid, but must not be assumed to satisfy NoAlias when integer homology labels differ."
status = "NOT_RUN"

[[hostile_controls]]
id = "zero-homology-dimension"
requirement = "m=0 is a legitimate one-element integral homology tuple; do not invent nonzero coordinates."
status = "NOT_RUN"

[[hostile_controls]]
id = "zero-iteration-cutoff"
requirement = "K=0 contains no positive iterates; do not include n=0 by default."
status = "NOT_RUN"

[[hostile_controls]]
id = "finite-u-only"
requirement = "FinitePrimitiveUniverse is an externally supplied finite ID universe, NOT all real geodesics of a surface."
status = "NOT_RUN"

[[hostile_controls]]
id = "selected-subset-proved"
requirement = "The selected Finset must be a proved subset of U; incomparable candidate families are not accepted."
status = "NOT_RUN"

[[hostile_controls]]
id = "same-source-indices"
requirement = "The full packet must preserve original primitive source IDs and positive iterate IDs (gamma,n)."
status = "NOT_RUN"

[[hostile_controls]]
id = "retain-orientation-multiplicity"
requirement = "Distinct oriented/conjugacy source IDs cannot be merged by length or homology equality."
status = "NOT_RUN"

[[hostile_controls]]
id = "same-homology-length-weight-target"
requirement = "Expansion from S to U changes only finite source membership; signed homology, length, Fourier test, target and coefficient cannot change."
status = "NOT_RUN"

[[hostile_controls]]
id = "positive-all-universe-lengths"
requirement = "Every U candidate has positive length; a selected-only positivity certificate does not license estimates on omissions."
status = "NOT_RUN"

[[hostile_controls]]
id = "primitive-missing-filter"
requirement = "A primitive omission must be in U, absent from S, and have iterate 1<=n<=M; no alias filter here."
status = "NOT_RUN"

[[hostile_controls]]
id = "selected-complex-sum"
requirement = "Integer-selected primitive omissions use the actual homology equality indicator and actual complex amplitudes."
status = "NOT_RUN"

[[hostile_controls]]
id = "third-error-separate"
requirement = "Primitive missing mass is independent of modular alias mass at K and omitted iterate mass between K and M."
status = "NOT_RUN"

[[hostile_controls]]
id = "no-silent-triangle-zero"
requirement = "Neither finite omission budget is presumed zero without its own support or coverage theorem."
status = "NOT_RUN"

[[hostile_controls]]
id = "cutoff-K-le-M"
requirement = "Three-error comparison requires K<=M; no uncontrolled subtraction of nonnested iteration sets."
status = "NOT_RUN"

[[hostile_controls]]
id = "one-sided-radius-vs-length"
requirement = "Fourier support radius B and positive length floor are explicit hypotheses; no guessed B or uniform systole."
status = "NOT_RUN"

[[hostile_controls]]
id = "coverage-boundary-weak"
requirement = "Coverage requires every U candidate of length <=B selected; equality length=B remains potentially contributing."
status = "NOT_RUN"

[[hostile_controls]]
id = "missing-strictly-long"
requirement = "Under coverage, each missing U candidate has length>B, not merely length>=B."
status = "NOT_RUN"

[[hostile_controls]]
id = "positive-iterate-amplification"
requirement = "n>=1 and positive length are essential for n*length >= length; n=0 is not an admissible source."
status = "NOT_RUN"

[[hostile_controls]]
id = "no-all-geodesics-inference"
requirement = "Finite U coverage is not a proof of surface-wide primitive geodesic enumeration completeness."
status = "NOT_RUN"

[[hostile_controls]]
id = "simple-vs-primitive-counting"
requirement = "Mirzakhani simple-curve counts are not a completeness theorem for all primitive oriented Selberg trace terms."
status = "NOT_RUN"

[[hostile_controls]]
id = "asymptotic-vs-enumeration"
requirement = "Prime geodesic asymptotic counts do not furnish an exact marked geodesic source list or checker."
status = "NOT_RUN"

[[hostile_controls]]
id = "no-unique-source-fabrication"
requirement = "Two IDs of the same length or homology remain source-distinct; no invented injectivity of these invariants."
status = "NOT_RUN"

[[hostile_controls]]
id = "toy-positive-coverage"
requirement = "Toy finite universe with selected false length 1 and omitted true length 3 at B=2 passes coverage."
status = "NOT_RUN"

[[hostile_controls]]
id = "toy-negative-coverage"
requirement = "Toy finite universe with omitted true length 2 at B=2 fails coverage and retains a nonzero Fourier test input."
status = "NOT_RUN"

[[hostile_controls]]
id = "toy-not-selberg-regular"
requirement = "Discontinuous toy Fourier test is a finite logical fixture, not an admissible Selberg test function."
status = "NOT_RUN"

[[hostile_controls]]
id = "no-hair-or-trace-upgrade"
requirement = "Finite q torsion averaging cannot be identified with continuous Haar or an analytic Selberg trace without an external theorem."
status = "NOT_RUN"

[[hostile_controls]]
id = "no-gue-sine-universality"
requirement = "No GOE/GUE number variance, microscopic sine-kernel process or high-zeta-zero law follows from finite coverage."
status = "NOT_RUN"

[[hostile_controls]]
id = "no-chowla-rh"
requirement = "No actual Möbius/Liouville cancellation, growing-shift weighted supplier, zeta divisor or RH implication is produced."
status = "NOT_RUN"

[[hostile_controls]]
id = "no-unapproved-runtime"
requirement = "Passive source target does not run Lean/Lake, native VM, cache, workflow, F06 or an executor."
status = "NOT_RUN"

