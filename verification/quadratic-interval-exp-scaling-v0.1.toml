[declarations]
requires_all_public_in_listed_modules = true
requires_full_transitive_import_closure = true
requires_inherited_required_names = true

[[hostile_controls]]
id = "inherited-controls"
description = "Retain all previous mesh, domain, endpoint, scale, shared-log, input-error, Taylor and arithmetic controls."

[[hostile_controls]]
id = "exact-divided-argument"
description = "exp_nat_mul reconstruction uses the exact positive dyadic denominator and exactly s squarings. Rounded exponent/seed evaluation needs its own bound."

[[hostile_controls]]
id = "true-disk-not-approximate"
description = "Only the true exponential is proved in the unit disk from Re(w)<=0. The approximate value may leave it."

[[hostile_controls]]
id = "quadratic-radius-required"
description = "quadratic_radius_control forbids replacing 2e+e^2 by 2e."

[[hostile_controls]]
id = "horizontal-domain-required"
description = "outside_unit_disk_control guards against dropping the true-unit-disk premise. The Mellin adapter retains Re(z)<=1 and a proved nonnegative center."

[[hostile_controls]]
id = "seed-tail-not-final"
description = "scaled_exp_error must propagate the seed tail through squaringRadius, not use delta as output error."

[[hostile_controls]]
id = "precision-is-not-admissibility"
description = "The optional linear precision bound retains K*delta<=1/2 separately from the reduced Taylor ratio guard."

[[hostile_controls]]
id = "every-rounded-square"
description = "scaled_exp_trace_error requires every used local square error; early_rounding_control forbids summing unpropagated local radii."

[[hostile_controls]]
id = "empty-seed"
description = "empty_seed_control retains unit error at zero exponent for an empty Taylor polynomial, for every scale."

[[hostile_controls]]
id = "unit-exactness"
description = "zero_exponent_exact and unit_parameter_scaled_exact retain the correct exact constant case."

[[hostile_controls]]
id = "log-error-once"
description = "The adapter pays q*eta once along the true exponential path; it cannot disappear through division by K or be confused with seed truncation."

[[hostile_controls]]
id = "inner-versus-outer-arithmetic"
description = "Inner square errors propagate nonlinearly; outer weighted accumulation retains zero initialization and each weighted update."

[[hostile_controls]]
id = "exact-family-and-source"
description = "No new density, kernel, endpoints, count, zero family or remainder replaces the inherited source. The finite evaluator supplies no complete divisor tail."

[[hostile_controls]]
id = "all-types-and-trust"
description = "Reconcile every listed source module, all public elaborated signatures, inherited controls and complete transitive import/axiom closure. Root-only success is insufficient."

[acceptance]
requires_all_declared_modules = true
requires_exact_public_signatures = true
requires_explicit_failures_and_unavailable_checks = true
requires_inherited_source_replay = true
requires_named_downstream_blockers = true

[nonclaims]
claims = ["Lean elaboration or kernel acceptance", "qualified executable arithmetic or evaluator", "wall-clock or bit-complexity improvement", "certified zeta-zero data", "complete source identity or omitted-divisor tail", "uniform prime margins, Legendre or RH", "worker qualification, F06 release, execution or merge authority"]
