# Prime-only, independent Hilbert-Polya operator research.
# 0 imported theorem/axiom/zero-height from Alpoge's checked proof.
# Arithmetic sections use true Nat.nth Nat.Prime and prime-sum divergence.
# Graph-sandwich energy monotonicity is a distinct certified finite theorem.
# Spectral-convergence => RH is CONDITIONAL on an unsupplied, source-complete
# Jacobi eigenvalue approximation premise. Do not classify as proof of RH.
# Infinite l2 Carleman closure established analytically in adjacent
# mathematical paper, but a full Lean l2 domain proof remains NOT_RUN.
# In the grwtsk/math root checkout:
# python3 scripts/verify_prime_jacobi_finite.py
# python3 scripts/verify_frozen_prime_atlas.py \
#   --config verification/prime-jacobi-independent.toml \
#   --all-diagnostics --report /tmp/prime-jacobi-independent.json
format_version = 1
suite = "Independent Prime Jacobi Operator and Source Faithful Spectral Obstructions"
issue = "https://github.com/grwtsk/math/issues/1849"

[environment]
lean_toolchain = "leanprover/lean4:v4.34.1"
mathlib_revision = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[policy]
expected_theorems = 43
allowed_axioms = ["propext", "Classical.choice", "Quot.sound"]

