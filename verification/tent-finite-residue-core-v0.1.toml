[controls]
required = [
  "Nonzero signed transverse coordinates imply positive squared radii on complete edges.",
  "Real primitives are used on each edge; no global complex-log branch is assumed.",
  "The upward vertical differential includes I. The real-parameter right integral uses 2*pi.",
  "Four positive reciprocal corner pairs give exactly 2*pi; negative ratios have another sign.",
  "Strict interior yields 2*pi*I; exterior to the closed rectangle yields zero.",
  "Boundary points satisfy neither normalization domain; no half-residue convention is introduced.",
  "Reversing left and right reverses the complete boundary orientation.",
  "Finite sums require edge integrability before linearity is invoked.",
  "Actual complex points and analytic multiplicities are preserved; the pole and both zero families are disjoint.",
  "The actual coefficient sum retains the radius h and the complete signed trivial prefix.",
  "The finite contour formula has no winding, residue-equality, counting or decay hypothesis.",
  "The upward-left and top-minus-bottom edge corrections remain in the finite right-segment formula.",
  "Finite normalization supplies no infinite boundary decay, global count bound, evaluator or all-interval prime margin.",
  "Every inherited type, import, axiom and native dependency must be audited at the new exact head.",
]

