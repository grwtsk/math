[[controls]]
id = "actual_local_witness"
obligation = "Geometry alone supplies no zero, root order or count; require LocalWitnesses proofs."

[[controls]]
id = "mass_direction"
obligation = "A lower bound on the complete count cannot replace its upper bound."

[[controls]]
id = "positive_source"
obligation = "Zero source weights can hide omitted points; canonical multiplicity positivity is required."

[[controls]]
id = "distinctness"
obligation = "Duplicate selections can mimic total mass; strict closed-disk separation must imply injection."

[[controls]]
id = "tangency"
obligation = "Tangent closed disks are rejected; retain shared boundary points."

[[controls]]
id = "height"
obligation = "Both signs and the exact closed height cutoff are retained; reject straddling disks."

[[controls]]
id = "multiplicity"
obligation = "Derive exact source orders from local lower orders and exhaustion; do not trust labels."

[[controls]]
id = "clusters"
obligation = "Total disk multiplicity does not imply one point of that multiplicity."

[[controls]]
id = "shape"
obligation = "Every radius and every inherited tent-evaluator trace entry is present exactly as required."

[[controls]]
id = "source_target"
obligation = "Final norm bound targets the actual canonical heightHead and actual zeta orders."

[[controls]]
id = "normalization"
obligation = "A positive-height count cannot be substituted for the both-sign canonical count without proof."

[[controls]]
id = "empty"
obligation = "Empty geometry needs an actual zero complete count before any empty-head conclusion."

[[controls]]
id = "line_status"
obligation = "No critical-line projection or bounded critical-line statement follows from these disks."

[[controls]]
id = "inherited_errors"
obligation = "Retain all tent, node, arithmetic and coordinate errors from the unchanged evaluator."

[[controls]]
id = "trust"
obligation = "Run exact-head elaboration and full transitive type/axiom/native audit before acceptance; no static receipt."
