# Exact source-pinned verification of the corrected two-reference 16D design.
# 4096 distinct numeric prime IDs, replicated into 8192 physical positions.
# Invariant: every cell sees exactly two DIFFERENT face-adjacent prime IDs.
# The previously established 4096-single-position model has only ONE neighbor.
# This suite excludes the unrelated computationally heavy prime-count proof;
# that cutoff remains a separate Lean supplier.
#
# python3 scripts/verify_prime_two_reference_16d.py
# python3 scripts/verify_frozen_prime_atlas.py \\
#   --config verification/prime-forest-two-reference.toml \\
#   --all-diagnostics --report /tmp/prime-forest-two-reference.json
#
# A PASS_SCOPED_LEAN here checks the declared proof bodies and allowed axioms.
# It does not certify global spectral placement optimality, external GRH imports,
# independent kernel replay, or the entire infinite universe.
format_version = 1
suite = "Prime Forest: Two Distinct References and 16D to 64D Continuation"
issue = "https://github.com/grwtsk/math/issues/1844"

[environment]
lean_toolchain = "leanprover/lean4:v4.34.1"
mathlib_revision = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[policy]
expected_theorems = 106
allowed_axioms = ["propext", "Classical.choice", "Quot.sound"]

