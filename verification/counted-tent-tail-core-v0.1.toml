[[hostile_controls]]
id = "all-finite-subsets"
description = "A bound only on a displayed finite list is not the universal finite-subfamily counting theorem."

[[hostile_controls]]
id = "right-closed-count-strict-tail"
description = "Every record with absolute height <=T must be included; the complement has strict height >T."

[[hostile_controls]]
id = "retained-terminal-boundary"
description = "The finite layer-cake identity keeps totalWeight/R^2, including an atom exactly at R."

[[hostile_controls]]
id = "nonnegative-multiplicity"
description = "Analytic multiplicities and both height signs are preserved; equal heights are not deduplicated."

[[hostile_controls]]
id = "convergence-before-tsum"
description = "Summable norms and Summable complex terms are conclusions; a default tsum value is not convergence evidence."

[[hostile_controls]]
id = "whole-complement"
description = "Finite-head splitting covers the entire original index type, not a chosen further truncated list."

[[hostile_controls]]
id = "horizontal-complement-bound"
description = "The omitted-family real-part bound is explicit; included critical-line checks do not imply beta=1/2 outside."

[[hostile_controls]]
id = "source-not-surrogate"
description = "The consumer uses actual squareTentMangoldt and still requires its complete tent-specific explicit formula."

[[hostile_controls]]
id = "separate-evaluation"
description = "The finite head uses exactly the same records and multiplicities; elementary evaluation/rounding error remains supplied."

[[hostile_controls]]
id = "universal-count-not-zetatheorem"
description = "No Trudgian theorem, zeta divisor enumeration, or source multiplicity certificate is imported by these hypotheses."

[[hostile_controls]]
id = "all-input-margin"
description = "A margin at a fixed interval is not a margin for all intervals; finite tests do not establish the global quantifier."

[[hostile_controls]]
id = "all-source-closure"
description = "Every public/private helper and inherited module is required; source syntax and a root-only pass are not acceptance."

[nonclaims]
claims = ["actual zeta zero-counting theorem", "first-Riesz explicit formula", "signed trivial-zero correction bound", "certified external zero list", "positive margin for all square intervals", "Legendre conjecture", "Riemann hypothesis", "kernel acceptance", "execution authority"]
