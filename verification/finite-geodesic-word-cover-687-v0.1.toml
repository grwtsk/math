[[hostile_controls]]
id = "all-length-codes"
requirement = "BoundedWord must enumerate lengths 0 through L inclusive, never omit the longest or empty word."
status = "NOT_RUN"

[[hostile_controls]]
id = "empty-word-not-geodesic"
requirement = "The empty word is a finite code, not the identity of an oriented primitive hyperbolic geodesic."
status = "NOT_RUN"

[[hostile_controls]]
id = "search-cardinality-not-geodesic-count"
requirement = "The geometric sum counts all word codes, not conjugacy classes or primitive closed geodesics."
status = "NOT_RUN"

[[hostile_controls]]
id = "finite-alphabet-required"
requirement = "The word alphabet must have a finite Fintype; infinite free generators are not an accepted finite enumeration."
status = "NOT_RUN"

[[hostile_controls]]
id = "word-length-bound-unproved"
requirement = "A numerical L(B,X,marking) is an explicit external geometric premise, not inferred from finite code enumeration."
status = "NOT_RUN"

[[hostile_controls]]
id = "word-conjugacy-relations"
requirement = "A surface group with relators cannot be silently replaced by a free group or free monoid."
status = "NOT_RUN"

[[hostile_controls]]
id = "conjugacy-decoder-required"
requirement = "Equal hyperbolic lengths, traces or homology labels do not imply identical oriented primitive conjugacy IDs."
status = "NOT_RUN"

[[hostile_controls]]
id = "proper-power-criterion"
requirement = "Primitive in the Selberg source means not a proper power in the actual surface group, not primitive in a free-generator basis."
status = "NOT_RUN"

[[hostile_controls]]
id = "simple-vs-primitive"
requirement = "Mirzakhani simple-curve counts do not enumerate all non-simple primitive geodesics."
status = "NOT_RUN"

[[hostile_controls]]
id = "reverse-orientation"
requirement = "A word and its inverse may encode distinct oriented conjugacy/geodesic IDs; any quotient requires a theorem."
status = "NOT_RUN"

[[hostile_controls]]
id = "decoder-into-option"
requirement = "Failed word decoding returns none, not a fabricated primitive source."
status = "NOT_RUN"

[[hostile_controls]]
id = "no-injectivity-of-decoder"
requirement = "Two or more word codes may decode to the same source ID; reject Finset.filterMap without injectivity."
status = "NOT_RUN"

[[hostile_controls]]
id = "actual-image-dedup"
requirement = "Finset.image into Option followed by eraseNone yields each decoded source ID only once."
status = "NOT_RUN"

[[hostile_controls]]
id = "decode-soundness"
requirement = "Every successful output must be proven in the declared finite source universe."
status = "NOT_RUN"

[[hostile_controls]]
id = "bounded-word-short-representation"
requirement = "Each short source must have a bounded successful encoder, with length<=B checked against the exact original source length."
status = "NOT_RUN"

[[hostile_controls]]
id = "exact-encoder-roundtrip"
requirement = "A successful source encoding must decode back to the same source identity, not merely an isospectral or homological neighbor."
status = "NOT_RUN"

[[hostile_controls]]
id = "always-reject-invalid-if-short-source"
requirement = "A decoder returning none for every code fails when the declared finite universe has a known source of length<=B."
status = "NOT_RUN"

[[hostile_controls]]
id = "vacuity-explicit"
requirement = "An empty short-source subfamily makes coverage conditional/vacuous and is not evidence of geodesic existence."
status = "NOT_RUN"

[[hostile_controls]]
id = "noninjective-toy-positive"
requirement = "Toy Bool word codes at L=1 include distinct empty/one-letter codes with the same successful PUnit output."
status = "NOT_RUN"

[[hostile_controls]]
id = "toy-output-once"
requirement = "The toy decoded candidate Finset deduplicates the one source ID regardless of how many words decode to it."
status = "NOT_RUN"

[[hostile_controls]]
id = "toy-geometric-veto"
requirement = "The toy PUnit source is not a marked surface, smooth Selberg test, or primitive geodesic."
status = "NOT_RUN"

[[hostile_controls]]
id = "selected-superset-source-fidelity"
requirement = "Decoded selected and original universe inputs must preserve exactly the same signed homology, lengths, Fourier test and target."
status = "NOT_RUN"

[[hostile_controls]]
id = "finite-original-universe-not-global"
requirement = "The supplied finite U remains independent of all actual primitive geodesics on a surface, unless a separate authentic source-covering theorem exists."
status = "NOT_RUN"

[[hostile_controls]]
id = "support-radius-exact"
requirement = "The decoder short-word radius B must equal the Fourier support certificate radius used to erase finite primitive omissions."
status = "NOT_RUN"

[[hostile_controls]]
id = "iterate-cutoff-premises"
requirement = "The parent 0<=K<=M and B<=K*delta conditions must remain explicit, including positive delta."
status = "NOT_RUN"

[[hostile_controls]]
id = "alias-mass-retained"
requirement = "Finite word coverage cannot remove q-modular aliases; NoAlias is a separate proved-or-premised field."
status = "NOT_RUN"

[[hostile_controls]]
id = "no-infinite-selberg-inference"
requirement = "A finite exhaustive word code search is not an infinite Selberg trace formula or complete length spectrum."
status = "NOT_RUN"

[[hostile_controls]]
id = "no-goe-gue-universality"
requirement = "No Weil-Petersson integration, GOE/GUE number variance or microscopic sine-kernel universality follows from bounded words."
status = "NOT_RUN"

[[hostile_controls]]
id = "no-chowla-rh-upgrade"
requirement = "No source-bound Liouville/Mobius cancellation, growing-shift maximal packet, zeta divisor or Riemann hypothesis is established."
status = "NOT_RUN"

