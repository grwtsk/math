id = "homotopy_interval_guard"
requirement = "The actual affine multiplier homotopy is bounded for 0<=t<=1. Beyond that interval a norm-small multiplier can cross zero. Continuity is not a nonvanishing proof."

[[hostile_controls]]
id = "holomorphic_inverse_after_nonzero"
requirement = "Complex differentiability uses the Mellin analytic theorem on Re(s)>0; reciprocal differentiability also consumes the derived nonzero theorem. No continuity-to-holomorphy or ring-map coercion."

[[hostile_controls]]
id = "mirror_zero_only_parabolic"
requirement = "Apply the canonical critical-reflection theorem only to zero locations; no equality of H-values, inverse values, analytic multiplicities, or norms is inferred."

[[hostile_controls]]
id = "closed_band_complete"
requirement = "All inequalities on rightBand include the top/bottom and left/right edges. Verify the Euclidean factor bound over the entire band, not its sample center."

[[hostile_controls]]
id = "tapered_rational_identity"
requirement = "For 0<u<=1/4, a=1-u, T=1-2u and r=1-7u/4. Prove r^2-(u^2+T^2)=u*(8-31u)/16>=0 and a-r=3u/4>0."

[[hostile_controls]]
id = "new_band_not_full_seed"
requirement = "At height1/2 the explicit band has Re(s)>=3/4, and at height3/4 it has Re(s)>=7/8. It is not a complete strip or an increase of the uniform1/3 seed."

[[hostile_controls]]
id = "vanishing_width_and_margin"
requirement = "As T approaches1 from below, width(1-T)/2 and lower bound3(1-T)/8 tend to0. No height-one positive margin or common spectral/coercivity gap follows."

[[hostile_controls]]
id = "parabolic_remainder_exact"
requirement = "firstRemainder retains 1/3<Im<=1,1/2<Re<1,2Re-1<=Im^2. Preserve the equality frontier, top height, critical-line approach and actual source zero predicate in WindowRH1 equivalence."

[[hostile_controls]]
id = "remainder_nonvacuous"
requirement = "The ambient point5/8+i/2 lies on the remainder frontier. It is not asserted to be a zero. An actual analytic cover of that exact remainder is still an input."

[[hostile_controls]]
id = "parabolic_source_only"
requirement = "Rational diagnostics and written Lean tactics do not validate integration, universal norm inequalities, imports, elaboration or axioms. No replay, worker qualification or RH acceptance is implied."
