[[controls]]
id = "source-inputs"
requirement = "Every base and resolution comes from the fixed plan; computed seed and log error cannot be supplied by the packet."
status = "NOT_RUN"

[[controls]]
id = "two-list-lengths"
requirement = "Missing/extra base rows and missing/extra successor states reject, including zero-square fixed-point rows."
status = "NOT_RUN"

[[controls]]
id = "ordered-prefix"
requirement = "Retain all rounded parentheses in both prefixes, absolute cursor and complete state."
status = "NOT_RUN"

[[controls]]
id = "terminal-reuse"
requirement = "Reuse the same final checked base in both endpoint terms; no omitted/default or additional labeled terminal."
status = "NOT_RUN"

[[controls]]
id = "finite-exactness"
requirement = "Verify all six finite output fields and source-draft equality with the unchanged finite model."
status = "NOT_RUN"

[[controls]]
id = "source-derivative"
requirement = "Keep the point value tail and independent uniform E/S derivative tail; never differentiate a point bound."
status = "NOT_RUN"

[[controls]]
id = "strict-patch"
requirement = "Retain full image radius, minimum of two derived slopes, positive-half-plane geometry and strict lower-norm gate."
status = "NOT_RUN"

[[controls]]
id = "edge-seams"
requirement = "Use the same global image vertex and the same derived radius in both incident disks; include the final edge."
status = "NOT_RUN"

[[controls]]
id = "header-mesh"
requirement = "Reconcile all list dimensions, both closures, complete unwrapped rectangle mesh and sign-preserving orientation."
status = "NOT_RUN"

[[controls]]
id = "signed-index"
requirement = "Invoke the unchanged polygon algorithm; none is not some 0 and negative orientation is not truncated."
status = "NOT_RUN"

[[controls]]
id = "source-completeness"
requirement = "Elaborate the finite-jet, patch and local-edge existence converses; reject an always-reject interpretation."
status = "NOT_RUN"

[[controls]]
id = "fixed-candidate"
requirement = "Preserve all original target data and prove actual complete witness success before applying the conditional count consumer."
status = "NOT_RUN"

[[controls]]
id = "small-controls"
requirement = "Elaborate every small control, including pole derivative error, two-base order, radius mutation and complete tiny square."
status = "NOT_RUN"

[[controls]]
id = "large-obligations"
requirement = "The original 38 block equalities and full inherited analytic/topological/divisor chain remain mandatory acceptance duties."
status = "NOT_RUN"

[[controls]]
id = "transitive-trust"
requirement = "Inspect all exact types, generated declarations, instances, imports, axioms, native dependencies and resource evidence."
status = "NOT_RUN"

[[controls]]
id = "external-binding"
