odd_exponents = "Overcounted in the written correction; no claim that such powers occur"
fresh_margin = "B<=X; L<=W(X); E(X)<=error; P(B)+error<L"
conclusion = "exists n, B<n<=X and 1<=n and Nat.Prime(n^2+1)"
infinite_target = "Requires the supplier for all sufficiently large X and a growing strict margin; one bounded positive count is insufficient"

[hostile_controls]
fixed_finite_sieve = "For all M>=1 and B, explicit n>B gives composite n^2+1 avoiding every divisor d>1 of M"
small_survivor = "30^2+1=17*53 avoids 2,3,5,7"
constructed_survivor = "M=2,B=3 gives n=42 and n^2+1=5*353"
zero_index = "0^2+1=1^2; n>=1 is required for square exclusion"
index_vs_value = "quadraticCount(10)=5; prime count through 101 is 26"
empty_source = "W(0)=E(0)=0"
nonstrict_margin = "P(B)+error=L does not meet the consumer hypothesis"

