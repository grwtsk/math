[pair_basis_saturation]
source_set = "arbitrary finite set S"
left_delta = "delta_i(p)=1 if i=p else 0"
right_delta = "delta_j(q)=1 if j=q else 0"
reconstruction = "sum_(i,j in S) kappa(i,j) delta_i(p) delta_j(q)=kappa(p,q) for p,q in S"
absolute_mass = "pair-basis absolute mass equals original finite kernel l1 mass"
factor_count = "|S x S|=|S|^2"
prime_specialization = "S=thetaPrimeWindow(X)"
finite_separability_is_restrictive = false

[feature_norm_factorization]
left_l1 = "sum_(p in P_X) |L_r(p)|"
right_l1 = "sum_(q in P_X) |R_r(q)|"
exact_identity = "absoluteFactorMass(v)=sum_r |c_r(v)| leftL1(r) rightL1(r)"
certificate = "nonnegative left/right majorants with proved l1 inequalities"
certified_budget = "sum_r |c_r(v)| leftBudget(r) rightBudget(r)"
bound = "absoluteFactorMass(v)<=certifiedFeatureBudget(v)"

[criterion]
name = "PrimeThetaFeatureNormCriterionAt"
source_majorization = "|thetaError(v)|+1 <= |inducedResponse_X(v)|/X + residual(v)"
uniform_budget = "certifiedFeatureBudget(v)<=K"
residual = "residual(v)<=R*X^(Q(rho)+eta/2)"
to_separable_criterion = true
to_prime_kernel_criterion = true
to_quadratic_recurrence = true
to_descent_for_rho_ge_three_quarters = true

[cardinality_control]
pointwise_unit_left_feature = true
pointwise_unit_right_feature = true
left_l1 = "|P_X|"
right_l1 = "|P_X|"
factor_mass = "|c(v)|*|P_X|^2"
prime_count_asymptotic_used = false
pointwise_bound_implies_uniform_l1 = false

