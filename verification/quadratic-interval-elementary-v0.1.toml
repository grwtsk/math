[declarations]
requires_all_public_in_listed_modules = true
requires_full_transitive_import_closure = true

[[hostile_controls]]
id = "positive-log-chain"
description = "Positive ordered nodes and exact endpoint coverage are required; all log cells contribute once."

[[hostile_controls]]
id = "empty-log-not-new-endpoint"
description = "empty_chain_is_not_log_two and L>0 prevent an empty chain from representing a different logarithm."

[[hostile_controls]]
id = "exact-log-radius"
description = "The finite reciprocal enclosure and constant-step radius must be proved; no computed log approximation is assumed."

[[hostile_controls]]
id = "literal-taylor-guard"
description = "B/(M+1)<=1/2 remains explicit and applies to the actual input bound; short_truncation_guard_control rejects an inadmissible cut."

[[hostile_controls]]
id = "empty-taylor-not-exact"
description = "zero_terms_control retains T_0(0)=0, exp(0)=1 and tail=2."

[[hostile_controls]]
id = "input-error-not-tail"
description = "polynomialRadius_two retains nonzero input sensitivity; the log-input channel cannot be omitted by increasing M."

[[hostile_controls]]
id = "height-not-projected"
description = "componentBound uses both coordinates, with no critical-line projection or imaginary-height waiver."

[[hostile_controls]]
id = "restricted-rational-mesh"
description = "The purely arithmetic mesh majorant has Re(z)<=2; do not use it unguarded above two."

[[hostile_controls]]
id = "actual-density-samples"
description = "density_node_error must target the unchanged density, and kernel_elementary_error supplies the actual inherited hv premise."

[[hostile_controls]]
id = "arithmetic-initialization"
description = "sum_from_step_errors requires acc(0)=0 and every local weighted-term error; no absent arithmetic check becomes zero."

[[hostile_controls]]
id = "inherited-controls"
description = "Retain every required quadrature/endpoint/sample/multiplicity control from the pinned parent target."

[[hostile_controls]]
id = "source-and-trust"
description = "All modules, exact public types and transitive trust must be reconciled; finite Python checks and source presence are not acceptance."

[acceptance]
requires_all_declared_modules = true
requires_exact_public_signatures = true
requires_explicit_failures_and_unavailable_checks = true
requires_named_downstream_blockers = true
requires_inherited_source_replay = true

