[[controls]]
id = "POLY-01"
requirement = "Failure returns none, not some zero; exact lengths and n>0 are mandatory."
status = "NOT_RUN"

[[controls]]
id = "POLY-02"
requirement = "The full final closing edge is included, with literal external closure."
status = "NOT_RUN"

[[controls]]
id = "POLY-03"
requirement = "Both endpoints share one STRICT coordinate half-plane; origin vertices/chords reject."
status = "NOT_RUN"

[[controls]]
id = "POLY-04"
requirement = "A rejected nonzero diagonal is not falsely declared to contain a zero."
status = "NOT_RUN"

[[controls]]
id = "POLY-05"
requirement = "Negative log chart includes pi*i and exponentiates to z, not -z."
status = "NOT_RUN"

[[controls]]
id = "POLY-06"
requirement = "The exact principal-argument convention at a negative-real vertex is retained."
status = "NOT_RUN"

[[controls]]
id = "POLY-07"
requirement = "Tangent arrival/departure and ray edges receive the half-open convention."
status = "NOT_RUN"

[[controls]]
id = "POLY-08"
requirement = "Positive-ray crossings do not contribute the negative-ray count."
status = "NOT_RUN"

[[controls]]
id = "POLY-09"
requirement = "Reversal changes sign; doubled traversal retains multiplicity."
status = "NOT_RUN"

[[controls]]
id = "POLY-10"
requirement = "Continuous log cells match accumulated lifted vertices, not principal-log resets."
status = "NOT_RUN"

[[controls]]
id = "POLY-11"
requirement = "The full lift uses precisely the inherited dyadic traversal, including its pause."
status = "NOT_RUN"

[[controls]]
id = "POLY-12"
requirement = "The returned integer equals the OLD exponential-lift winding, not a redefined one."
status = "NOT_RUN"

[[controls]]
id = "POLY-13"
requirement = "A punctured loop is constructed for accepted polygons; the refinement is not vacuous."
status = "NOT_RUN"

[[controls]]
id = "POLY-14"
requirement = "Source tube check and actual source Enclosures persist in the composite evaluator."
status = "NOT_RUN"

[[controls]]
id = "POLY-15"
requirement = "Small-square source winding zero is composed through computed Option success."
status = "NOT_RUN"

[[controls]]
id = "POLY-16"
requirement = "No argument principle, region orientation theorem, large trace or regional upper count is inferred."
status = "NOT_RUN"
