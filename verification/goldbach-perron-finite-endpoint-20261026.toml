theorem_hypotheses = "For q,N naturals and chi : DirichletCharacter C q, sigma : Real with 1<sigma, natural N with 3<=N, and arbitrary real finite T (the interval -T..T is oriented, so no positivity assumption on T is used in the algebraic identity). Individual term integrability is proved from continuity. No zero-freeness or Perron limit is assumed."
normalization = "((2*pi:Real):Complex)^(-1) times the real-parameter integral of the inclusive finite Dirichlet polynomial times (N^s/s), s=sigma+i*t. It corresponds algebraically to the 1/(2*pi*i) upward contour factor after ds=i dt but NO complex curve-integral equivalence is formalized."
integral_sum_identity = "finitePerronPolynomialIntegral(q,N,chi,sigma,T) = sum_{n in Finset.range(N+1)} finitePerronTermIntegral(q,N,n,chi,sigma,T)."
half_endpoint_target = "finitePerronHalfWeightedPrefix = sum_{n in Finset.range N} dirichletVonMangoldtCoefficient(q,chi,n) + dirichletVonMangoldtCoefficient(q,chi,N)/2."
defect_definition = "finitePerronHeightDefect = sum_{n in Finset.range N}(finitePerronTermIntegral(q,N,n,chi,sigma,T) - coefficient(n)) + finitePerronTermIntegral(q,N,N,chi,sigma,T) - coefficient(N)/2."
exact_decomposition = "finitePerronPolynomialIntegral = finitePerronHalfWeightedPrefix + finitePerronHeightDefect, and the existing inclusive prefix sum_{n<=N} coefficient(n) = finitePerronPolynomialIntegral + coefficient(N)/2 - finitePerronHeightDefect."
critical_distinction = "At finite T the kernel is NOT the sharp Heaviside projection: the half-endpoint convention is an explicit target and finitePerronHeightDefect remains an unevaluated complex error. No assertion of defect->0 or rate in T, no Perron inversion for the FULL L-series, and no contour deformation or prime-distribution consequence."
