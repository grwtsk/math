# RH-INDEPENDENT, source-pinned candidate proof modules.
# No RH source/axiom or final Alpoge theorem imported.
# Paper mathematics: exact inverse prime-Krylov Gram, scalar coefficient
# envelope, Weil sqrt(n) normalization, actual finite zeta and complex
# character arithmetic returns, full weighted Gm observation errors.
#
# IMPORTANT formal gap: show the true orthogonal polynomial
# coefficient matrix equals the inverse prime-Krylov coefficient
# matrix, and bound each coefficient row by the scalar envelope.
# The conditional row-norm theorem is NOT an unconditional bound.
# EAtH and CoreAtH in Gm are abstract, separately supplied Prop
# placeholders, NOT instantiated upstream definitions. A real
# cross-edition port must reestablish their exact Frame/HostAx types.
#
# Run in the grwtsk/math repository with actual Lean/Lake:
# python3 scripts/verify_frozen_prime_atlas.py \
#   --config verification/prime-jacobi-conditioned-gm-source.toml \
#   --all-diagnostics --report /tmp/prime-jacobi-conditioned-gm-source.json
#
# Independent finite arithmetic controls:
# python3 scripts/verify_prime_jacobi_moment_to_source_stability.py
# python3 scripts/verify_prime_jacobi_gm_source.py
#
# Lean compilation/kernel/axiom audit NOT_RUN in ChatGPT environment:
# lean, lake and pinned Mathlib checkout were unavailable.
format_version = 1
suite = "RH-free actual-prime Hankel inverse and signed Alpoge intermediate Gm source"
issue = "https://github.com/grwtsk/math/issues/1850"

[environment]
lean_toolchain = "leanprover/lean4:v4.34.1"
mathlib_revision = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[policy]
expected_theorems = 25
allowed_axioms = ["propext", "Classical.choice", "Quot.sound"]

