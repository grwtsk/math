diagnostic_scope = "Exact prime reduced-character sums, prime denominator coefficients, coefficient-plus-one local factors, modulus-two parity and finite cutoff products; not Lean execution, analytic integration, progression estimates or a Goldbach estimate."

[[hostile_controls]]
id = "prime-two-parity"
description = "At p=2 the denominator coefficient is one for even targets and negative one for odd targets, so adding one retains the exact parity obstruction."

[[hostile_controls]]
id = "coefficient-not-local-factor"
description = "The prime denominator coefficient is not itself the local density factor; the universal leading one must be added."

[[hostile_controls]]
id = "finite-product-not-major-sum"
description = "The finite coefficient Euler product agrees with the finite local product but is not the actual coefficient-weighted major integral."

[[hostile_controls]]
id = "common-window-premise"
description = "A denominator block factors through one coefficient only under an explicit common singular-integral premise for every reduced numerator."

[[hostile_controls]]
id = "local-not-global"
description = "A positive finite coefficient Euler product can coexist with a zero exact Goldbach count."

[[hostile_controls]]
id = "strict-margin"
description = "Equality of the total error budget and proposed model lower bound cannot pass the terminal consumer."

[[hostile_controls]]
id = "finite-not-infinite"
description = "Finite character sums and finite Euler products supply no infinite singular-series convergence, tail or uniform lower bound."

