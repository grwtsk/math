[[acceptance_obligations]]
id = "R01"
requirement = "Elaborate all six new modules at the exact new head and preserve every inherited target obligation."

[[acceptance_obligations]]
id = "R02"
requirement = "Reconcile all public types and the full transitive import/axiom/native closure; selected bindings are not the complete closure."

[[acceptance_obligations]]
id = "R03"
requirement = "Keep the actual closed height-two head and its exact mass; do not assume emptiness or divide its points by height."

[[acceptance_obligations]]
id = "R04"
requirement = "Every Jensen supplier used in the cumulative count must have integer stage at least two; overlapping bands are overcounts, not a disjoint partition."

[[acceptance_obligations]]
id = "R05"
requirement = "Prove the real-cutoff ceiling inequalities and keep the 44/log(6/5) coefficient; do not substitute the old coefficient-one budget."

[[acceptance_obligations]]
id = "R06"
requirement = "The high count must hold for every finite subfamily and every real t above two, with actual analytic multiplicities and both height signs."

[[acceptance_obligations]]
id = "R07"
requirement = "Normalization of counting weights is a proof device only; actual multiplicities in the source family must remain unchanged."

[[acceptance_obligations]]
id = "R08"
requirement = "Retain the finite partial-summation terminal boundary before dropping its favorable combined remainder."

[[acceptance_obligations]]
id = "R09"
requirement = "Derive a uniform bound for sums of norms over all finite subsets, not only for norms of signed sums or selected prefixes."

[[acceptance_obligations]]
id = "R10"
requirement = "Use the integral-defined tent, the true unconditional strip bound and complete strict-height complement; reject critical-line projections and sampled-list completeness."

[[acceptance_obligations]]
id = "R11"
requirement = "Absolute summability must be obtained independently of the arithmetic source identity and only then supplied to the parent selected-limit consumer."

[[acceptance_obligations]]
id = "R12"
requirement = "The new canonical square source theorem must have only n and n>=2 as inputs, without hidden source, count or summability assumptions."

[[acceptance_obligations]]
id = "R13"
requirement = "Preserve the signed full trivial-zero correction and square radius; the source formula is smoothed, not the unsmoothed staircase."

[[acceptance_obligations]]
id = "R14"
requirement = "The direct divisor-tail bound is distinct from the older finite-right-contour defect; certified same-head evaluation error is added once and approximate correction error separately."

[[acceptance_obligations]]
id = "R15"
requirement = "Arbitrary-height convergence is fixed-geometry; it must not become uniform control over all square intervals or a positive prime margin."

[[acceptance_obligations]]
id = "R16"
requirement = "Execute hostile controls only under separate valid authority; manual inventories, Git readback and source integration are not Lean acceptance or a prime certificate."
