[[hostile_controls]]
id = "reject-affine-reduction-with-even-denominator"
description = "Do not reduce d/4 or -d/8 at two when d is odd."

[[hostile_controls]]
id = "reject-zero-homogeneous-residue"
description = "The cleared vector at16q reduces to zero; normalize BEFORE reduction."

[[hostile_controls]]
id = "reject-unit-eight-at-two"
description = "Eight is a rational unit, not a unit of Z_(2). Rational projective equality does not imply dyadic unit equivalence."

[[hostile_controls]]
id = "reject-unguarded-normalizer"
description = "The chosen half-mark normalizer needs16|d or odd d for a nonzero special point; d=2 is excluded."

[[hostile_controls]]
id = "reject-source-relabeling"
description = "Retain T0,Ta,Tb and signed x-r. The infinity label differs across chambers."

[[hostile_controls]]
id = "reject-new-curve-substitution"
description = "Use OLD selectedCurve and integerModel with coefficient-level baseChange agreement."

[[hostile_controls]]
id = "reject-integrality-equals-smoothness"
description = "The primitive residue at the affine origin can be singular."

[[hostile_controls]]
id = "reject-good-fiber-means-distinct-marks"
description = "Even on good reduction the two marked residue positions can coincide."

[[hostile_controls]]
id = "reject-reduction-injectivity"
description = "Three rational labels give two positions on Descends. Do not delete duplicate labels or claim recovery."

[[hostile_controls]]
id = "reject-infinity-division-at-Y-zero"
description = "The infinity chart requires nonzero Y; d=0 is not in the odd branch."

[[hostile_controls]]
id = "reject-constant-parameter-uniform-height"
description = "The coordinate t=2 retains w=8/d. Odd denominators and global height do not disappear."

[[hostile_controls]]
id = "reject-half-scale-on-raw-complement"
description = "Outside Descends use the unchanged raw marks, not a fractional half-scale equation."

[[hostile_controls]]
id = "reject-nonsingular-points-at-nodes"
description = "Do not put singular special marks in the nonsingular group carrier."

[[hostile_controls]]
id = "reject-full-atlas-from-three-points"
description = "These are point representatives and chart values, not a geometric cover or intrinsic principal-parts map."

[[hostile_controls]]
id = "reject-conductor-from-marked-specialization"
description = "No conductor, Kodaira, Tamagawa or component-group formula follows here."

[[hostile_controls]]
id = "reject-bounded-check-as-proof"
description = "Exact bounded tests do not establish universal Lean proofs or inherited trust acceptance."

[[hostile_controls]]
id = "reject-proper-model-overclaim"
description = "No regular proper or Neron model, section morphism, or extension universal property is constructed."

[[hostile_controls]]
id = "reject-old-cost-erasure"
description = "Old weighted maps, source heights, valuation depth and discarded gauge data remain charged."

[acceptance]
source_status = "SOURCE_ONLY_NOT_RUN_NOT_KERNEL_AUDITED"
requires_exact_head_elaboration = true
requires_public_signature_comparison = true
requires_all_declared_modules = true
requires_all_hostile_controls = true
requires_transitive_trust_acceptance = true

[nonclaims]
no_lean_acceptance = true
no_proper_or_neron_model = true
no_intrinsic_jet_lattice = true
no_reduction_injectivity = true
no_conductor_formula = true
no_uniform_height_or_abc_or_rh = true
