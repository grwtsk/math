# Source-bound verification for the 16D atlas research frontier (includes 40 checked baseline claims).
# Run from a grwtsk/math checkout:
#   python3 scripts/verify_frozen_prime_atlas.py
# Python 3.11+ is needed for stdlib tomllib; no third-party Python packages.
# A successful run establishes scoped Lean compilation and transitive axiom
# reports. It does not establish independent fresh replay or RH/GRH.
format_version = 1
suite = "Frozen Prime Atlas: Lean Theorem and Axiom Verification"
issue = "https://github.com/grwtsk/math/issues/1842"

[environment]
lean_toolchain = "leanprover/lean4:v4.34.1"
mathlib_revision = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[policy]
expected_theorems = 270
allowed_axioms = ["propext", "Classical.choice", "Quot.sound"]

