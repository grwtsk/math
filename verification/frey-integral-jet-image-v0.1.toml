[[hostile_controls]]
id = "same-source-quotient"
description = "Begin from all five old integerModel coefficients and SelectedJet; no replacement curve or fitted image."

[[hostile_controls]]
id = "full-origin-ideal"
description = "Kill the full ideal (X,Y)^(N+1), including all mixed monomials, before factoring."

[[hostile_controls]]
id = "integral-image-exhaustion"
description = "The integral image must equal the span of 1,Y,X,XY,X²,...; rational dimension alone is insufficient."

[[hostile_controls]]
id = "retain-mixed-relation"
description = "Odd-frame multiplication uses B X^(i+1)-X^(i+1)Y+A X^(i+2)+X^(i+3)."

[[hostile_controls]]
id = "high-monomial-vanishing"
description = "Prove terms outside the finite frame vanish using X in (Y²), not by deleting them."

[[hostile_controls]]
id = "same-old-lift"
description = "Identify every frame polynomial with the old WeierstrassMixedLift and parameter quotient."

[[hostile_controls]]
id = "index-not-vector-denominator"
description = "At (1,47,48), N4 the coefficient denominator is27 but the full-image index is81."

[[hostile_controls]]
id = "determinant-not-index-definition"
description = "Derive the matrix from actual monomials. The index consequence requires integral image generation and inclusion."

[[hostile_controls]]
id = "cardinality-not-exponent"
description = "Do not infer cyclicity or exponent from the total determinant; small Smith fixtures distinguish these."

[[hostile_controls]]
id = "not-dilation-index"
description = "The frame index exponent floor(N²/4) differs from N(N+1)/2 and N(N-1)/2 from other maps."

[[hostile_controls]]
id = "nonzero-B"
description = "No rational inverse-Jacobian branch is constructed at B=0."

[[hostile_controls]]
id = "signed-B"
description = "Retain determinant sign for negative B; absolute value only in the cardinality consequence."

[[hostile_controls]]
id = "orders-zero-one"
description = "The image index is1 at N0,1; do not impose a positive-order formula with invalid subtraction."

[[hostile_controls]]
id = "source-quotient-not-image"
description = "Do not claim integral source injectivity or flatness: at N1 B*X=0 and rational parametrization kills X."

[[hostile_controls]]
id = "specialization-not-commuting-saturation"
description = "At bad Jacobian primes distinguish source quotient dimension2N+1 from image lattice rankN+1."

[[hostile_controls]]
id = "units-versus-nonzero"
description = "A rational basis is not an integral equivalence at primes dividing B."

[[hostile_controls]]
id = "cancellation-control"
description = "A1,B2,N4 has frame index16 but denominator/exponent4, not8."

[[hostile_controls]]
id = "same-fixed-source"
description = "The source (1,47,48) and marked height48 stay fixed while auxiliary order and lattice index grow."

[[hostile_controls]]
id = "no-global-atlas-promotion"
description = "The local image frame is not a full global section observation or intrinsic Hodge metric."

[[hostile_controls]]
id = "trust-boundary"
description = "No sample test or determinant calculation is Lean parsing, elaboration, transitive audit, or ABC/RH evidence."

[acceptance]
status = "SOURCE_ONLY / NOT_RUN / NOT_KERNEL_AUDITED"
requires_pinned_elaboration = true
