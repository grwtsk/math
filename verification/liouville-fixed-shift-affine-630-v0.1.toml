[[hostile_controls]]
id = "zero-shift-is-not-cancellation"
must_preserve = "For h=0 every product lambda(n+1)^2 equals 1, so the ordinary prefix equals its length. Exclude h=0 from nonproportional applications."

[[hostile_controls]]
id = "odd-even-shift-sign"
must_preserve = "For h=2j+1 both reindexed affine terms carry negative signs. For h=2j>0 both carry positive signs; do not reuse odd sign for even shifts."

[[hostile_controls]]
id = "positive-affine-form-det"
must_preserve = "Odd h=2j+1 pairs (2m+1,m+j+1) and (m+1,2m+2j+3) have determinant h. Even h=2j>0 pairs (2m+1,2m+2j+1) and (m+1,m+j+1) have determinants 4j and j, both nonzero."

[[hostile_controls]]
id = "positive-index-Icc-1-M"
must_preserve = "The external comparator sums m in Finset.Icc 1 M. The new even-endpoint expression is 2*(M+1) and its two m=0 affine terms remain explicit; no silent shift of cutoff or fabricated endpoint cancellation."

[[hostile_controls]]
id = "real-versus-complex-result"
must_preserve = "Local exact sums are integer-valued. External comparator uses complex-valued affineSum; no cast/normalization/proof-term adapter is admitted merely because source formulas match."

[[hostile_controls]]
id = "comparator-is-not-a-proof"
must_preserve = "Pinned OpenAI ComparatorChallenges theorem liouville_log_saving has a sorry placeholder. Its theorem statement supplies the scope signature only and is NOT imported as a verified theorem."

[[hostile_controls]]
id = "solution-not-challenge-comparator"
must_preserve = "The ComparatorChallenges module has three expected sorry placeholders; it is a challenge statement. A separate FinalMain solution file and Main theorem source exist and must be evaluated on their own merits, with a complete transitive axiom audit; do not misrepresent the comparator as the only proof source."

[[hostile_controls]]
id = "cross-version-proof-import"
must_preserve = "OpenAI solution uses Lean 4.34.1 / Mathlib d13f23; grwtsk/math is Lean 4.33.0 / Mathlib db584cd. No direct import, elaboration, trust success or source-level transfer is claimed without a separately controlled port."

[[hostile_controls]]
id = "fixed-shift-not-growing-shift"
must_preserve = "Per-fixed-h constants do not imply one uniform bound over h growing with M. Affine slopes/intercepts depend on fixed h, and no uniform rate is constructed here."

[[hostile_controls]]
id = "binary-not-full-Chowla"
must_preserve = "This treats one binary additive pair at a time. No higher-order Chowla, all-nonempty Walsh envelope, or RH square-modulus supplier is derived."

