visibility = "private"
kind = "theorem"
source_signature = """private theorem finite_abel_prefix_mean
    (x q : ℕ → ℝ) (N : ℕ) :
    (∑ k ∈ Finset.range N, x k * q k) =
      (∑ t ∈ Finset.range N,
        (∑ k ∈ Finset.range (t + 1), x k) *
          (q t - q (t + 1))) +
        (∑ k ∈ Finset.range N, x k) * q N"""
