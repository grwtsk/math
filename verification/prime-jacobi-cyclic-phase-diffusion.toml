# Source-only RH-independent exact arithmetic character phase / heat transport.
# Mathematical source cyclic c in original pinned Alpoge Lean v4.33.1 is
# isolated in docs/adaptations/environments/alpoge-gm-native/CyclicPhase.lean.
# DO NOT import incompatible Mathlib into root Lean v4.34.1.
#
# Correct signed-source finite evolution: D_t^m M_c v.
# Exact phase-covariant representation: M_c (M_c^-1 D_t M_c)^m v.
# Phase/heat commutator is nonzero unless phase is constant on
# the supported graph edges, and the two exterior Dirichlet
# curvature boundary terms STILL must be carried separately.
#
# This is the finite Dirichlet-heat spectrum, NOT actual zeta zeros,
# no RH/GRH or Weil positivity imported or assumed.
# All theorems are uncompiled source-proof candidates.
# Local Python checks:
# python3 scripts/verify_cyclic_phase_diffusion_commutator.py
# python3 scripts/verify_cyclic_covariant_diffusion.py
# With pinned root Lean/Lake/Mathlib present:
# python3 scripts/verify_frozen_prime_atlas.py \
#  --config verification/prime-jacobi-cyclic-phase-diffusion.toml \
#  --all-diagnostics --report /tmp/prime-jacobi-cyclic-phase-diffusion.json
format_version = 1
suite = "RH-free original cyclic phase finite Dirichlet commutator and gauge-covariant heat"
issue = "https://github.com/grwtsk/math/issues/1850"

[environment]
lean_toolchain = "leanprover/lean4:v4.34.1"
mathlib_revision = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[policy]
expected_theorems = 11
allowed_axioms = ["propext", "Classical.choice", "Quot.sound"]
