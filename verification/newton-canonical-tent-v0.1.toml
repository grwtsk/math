[[hostile_controls]]
id = "analytic_data_not_boolean"
obligation = "Reject any interpretation that finite margin acceptance verifies actual zeta value, derivative, or disk-wide second derivative estimates."

[[hostile_controls]]
id = "strict_contraction"
obligation = "Require kappa<1, not kappa<=1; repeated-root derivative zero cannot meet the true defect bound."

[[hostile_controls]]
id = "selfmap"
obligation = "Retain eta+kappa*R<=R separately from strict contraction."

[[hostile_controls]]
id = "whole_closed_disk"
obligation = "Mean-value and derivative estimates apply throughout the exact complete closed disk, not just sampled nodes or the center."

[[hostile_controls]]
id = "boundary_root"
obligation = "Self-map equality permits a boundary zero; do not reuse as a zero-free contour certificate."

[[hostile_controls]]
id = "complex_defects"
obligation = "Both real and imaginary components enter multiplication and magnitude."

[[hostile_controls]]
id = "positive_radii"
obligation = "Reject zero/negative R and negative value, derivative and second-derivative allowances."

[[hostile_controls]]
id = "zero_preconditioner"
obligation = "A zero preconditioner is excluded by strict derivative defect, not silently inverted."

[[hostile_controls]]
id = "strip_not_line"
obligation = "Derived source domain is the open strip, not the critical line; strip-touching disks fail this sufficient supplier."

[[hostile_controls]]
id = "same_input"
obligation = "Analytic estimates must refer to the literal center/radius/preconditioner data and actual riemannZeta, not Mellin density or source labels."

[[hostile_controls]]
id = "unit_multiplicity"
obligation = "Local family mode requires weight one. Leave the old higher-order/cluster obligations unchanged."

[[hostile_controls]]
id = "finite_table"
obligation = "Typed finite data covers every index; byte/parser/table refinement remains independent."

[[hostile_controls]]
id = "count_independent"
obligation = "Preserve the same complete both-sign closed-height upper count and all prior geometry/evaluation error obligations."

[[hostile_controls]]
id = "no_acceptance_promotion"
obligation = "All Lean proof scripts and literal decide/norm_num controls remain NOT_RUN until pinned elaboration and independent trust acceptance."
