  "A vanishing multiplier may cancel a coefficient without making the regular product zero.",
  "The generic extension uses local principal-part identities, not only scaled limits.",
  "Every actual point in singularHead has its source-defined coefficient; repeated heights do not merge points.",
  "Analytic multiplicities are included once. Duplicate or omitted coefficients change the principal sum.",
  "The pole coefficient has the positive sign and gives h, not 2h.",
  "The trivial-zero coefficient uses analytic order one and remains separate from the nontrivial divisor.",
  "The analytic remainder is established on the filled closed rectangle, not merely its boundary.",
  "Cauchy-Goursat is not applied to the original meromorphic integrand on its singular interior.",
  "The reduced rational contour integral is not silently identified with 2*pi*I times its coefficient sum.",
  "No left or horizontal edge is discarded. No infinite contour decay or zero-count estimate is supplied.",
  "The canonical prime consumer retains every source/count/evaluation/margin obligation.",
]

