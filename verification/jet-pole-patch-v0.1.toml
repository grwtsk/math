[[controls]]
id = "J01-uniform_not_pointwise"
requirement = "Require the complete outer-disk residual and Cauchy bound on the actual analytic difference. A zero point error is not a derivative error."

[[controls]]
id = "J02-same_finite_model"
requirement = "Value, finite derivative, source residual and correction count refer to the identical existing normalized finite model."

[[controls]]
id = "J03-outer_disk_geometry"
requirement = "Both magnitude factors use the whole outer disk; retain 0<S<Re(c), including strict tangent rejection."

[[controls]]
id = "J04-radius_gap"
requirement = "Retain 0<=R<S and the positive Cauchy gap before any analytic denominator use."

[[controls]]
id = "J05-complete_inherited_arithmetic"
requirement = "Retain every log, Taylor, seed, square, nonlinear amplification, finite-jet and source-tail obligation."

[[controls]]
id = "J06-derivative_source_charge"
requirement = "The derivative radius is e_fin+E/S, not e_fin, E or center source error divided by S."

[[controls]]
id = "J07-pole_not_exact_derivative"
requirement = "F(1)=1 leaves a nonzero source-derivative error. Reconcile the 65/32 uniform error and 33/8 radius fixture."

[[controls]]
id = "J08-curvature_allpoints"
requirement = "Retain 2! and the full inner-disk Cauchy curvature; no sampled F second derivative or caller oracle."

[[controls]]
id = "J09-nonlinear_budget"
requirement = "Two mean values give L*R^2, not an unproved half of that value. Retain the quadratic counterexample."

[[controls]]
id = "J10-min_two_proved_bounds"
requirement = "Both bounds concern the same derivative on the same disk. Retain fallback and no-regression proofs."

[[controls]]
id = "J11-strict_lower_norm"
requirement = "Use max absolute coordinate as a lower bound; never replace it by the L1 upper bound."

[[controls]]
id = "J12-equality_rejects"
requirement = "Retain strict rejection at the pole equality case and the separate direct-collar nonzero theorem."

[[controls]]
id = "J13-generated_jet"
requirement = "No independent actual value/derivative/curvature premise in the constructed patch theorem."

[[controls]]
id = "J14-unchanged_pilot"
requirement = "Reconcile exact pilot center, original 81-base schedule, correction inventory and unchanged value ball."

[[controls]]
id = "J15-larger_pilot_disk"
requirement = "Check old failure, new success at 1/400, and new failure at 1/200; these large decisions remain mandatory."

[[controls]]
id = "J16-old_count_unchanged"
requirement = "Do not substitute the new image radius into the old tube/count Boolean semantics without a separate proved adapter."

[[controls]]
id = "J17-finite_models_not_proof"
requirement = "Independent Python polynomial and zeta comparisons do not prove uniformity or execute/refine Lean."

[[controls]]
id = "J18-transitive_acceptance"
requirement = "Elaborate exact types and all large decisions; audit complete generated/import/axiom/native closure and all predecessor controls."
