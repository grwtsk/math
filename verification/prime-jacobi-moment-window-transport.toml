# RH-independent component-scoped proof candidates.
# Theorem A: the full entrywise determinant perturbation estimate is
# proved in adjacent mathematical exposition, but NOT YET IN LEAN.
# These 8 candidates prove *downstream* positive determinant/half-unit
# margin accounting and exact late-power-window transfer.
#
# No theorem of Alpoge's final RH/GRH statement, Main, FinalTheorems,
# everyCharacter, or Weil positivity from RH is imported or assumed.
# The original Alpoge intermediate window definitions are inspected
# at tamnd/riemann-lean@af705e0d9a5904326eb0693310e36d9484df7f8f
# but require an isolated cross-toolchain equivalence proof.
#
# Exact independent rational finite controls (run separately):
# python3 scripts/verify_prime_jacobi_moment_to_source_stability.py \
#   --max-bonds 7 --report /tmp/moment-to-source-rational.json
#
# When pinned Lean/Lake + math repo available:
# python3 scripts/verify_frozen_prime_atlas.py \
#   --config verification/prime-jacobi-moment-window-transport.toml \
#   --all-diagnostics \
#   --report /tmp/moment-window-lean-checks.json
#
# Only source/manifest integrity was checked in the current session.
# Lean elaboration / axioms / fresh kernel replay: NOT_RUN.
format_version = 1
suite = "Independent prime-Jacobi moment error and Alpoge intermediate power windows"
issue = "https://github.com/grwtsk/math/issues/1849"

[environment]
lean_toolchain = "leanprover/lean4:v4.34.1"
mathlib_revision = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[policy]
expected_theorems = 8
allowed_axioms = ["propext", "Classical.choice", "Quot.sound"]

[[module]]
name = "GRWTSK.Combinatorics.GraphTheory.PrimeJacobiMomentErrorBudget"
path = "GRWTSK/Combinatorics/GraphTheory/PrimeJacobiMomentErrorBudget.lean"
namespace = "GRWTSK.CombinatoricsAndDiscreteMathematics.GraphTheory.PrimeJacobiMomentErrorBudget"
git_blob = "015f462edfe88261734cef97f72cb678bca49588"
theorems = [
  "relative_error_of_absolute_budget",
  "determinant_positive_of_relative_error",
  "determinant_positive_of_moment_budget",
  "half_unit_margin_of_relative_error",
  "reconstructed_bond_half_unit",
]

[[module]]
name = "GRWTSK.NumberTheory.ZetaAndLFunctionsAnalyticTheory.AlpogeWindowSourceTransport"
path = "GRWTSK/NumberTheory/ZetaAndLFunctionsAnalyticTheory/AlpogeWindowSourceTransport.lean"
