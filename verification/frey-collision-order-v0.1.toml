[[hostile_controls]]
id = "reject-refitted-pair"
description = "PairFrame coordinates must equal the OLD labelled projective representatives, not fitted points or relabelled sources."

[[hostile_controls]]
id = "reject-generic-integral-crt"
description = "A nonzero gap gives splitting over Q, not integral splitting. The image has gap-divisible coordinate difference."

[[hostile_controls]]
id = "reject-zero-gap-inverse"
description = "The generic inverse requires nonzero delta; no division by zero or disappearance of a label."

[[hostile_controls]]
id = "reject-odd-gap-specialization"
description = "Reduction into the square-zero algebra requires an EVEN gap. Odd delta gives a different relation."

[[hostile_controls]]
id = "reject-reduced-special-pair"
description = "The special algebra has a nonzero square-zero element and is not F2 times F2."

[[hostile_controls]]
id = "reject-value-only-jet"
description = "Both special values see only the constant coefficient. Retain the nilpotent coefficient separately."

[[hostile_controls]]
id = "reject-quadratic-jet-rank"
description = "A length-two special algebra retains only a first jet. It is not the full order-two principal-parts space."

[[hostile_controls]]
id = "reject-singular-intrinsic-identification"
description = "At a singular collision the selected vertical direction is not the entire tangent space or intrinsic first neighborhood."

[[hostile_controls]]
id = "reject-good-distinctness"
description = "Good reduction can still have an even separation and a nonreduced marked pair."

[[hostile_controls]]
id = "reject-sign-loss"
description = "The even-a chamber uses NEGATIVE Y-gap -a/8; signs and original labels remain."

[[hostile_controls]]
id = "reject-raw-complement-extension"
description = "The canonical collision selection requires OLD Descends; its complement is not classified by this pair algebra."

[[hostile_controls]]
id = "reject-point-count-rank"
description = "The basis rank is two over both rings; coincident residue values do not change coefficient rank to one or restore value-map injectivity."

[[hostile_controls]]
id = "reject-cubic-factor-loss"
description = "The literal selected line restriction is T(T-delta)(8T+8delta-1-4a2). Retain the remaining factor."

[[hostile_controls]]
id = "reject-discriminant-index-swap"
description = "Trace discriminant is delta squared; evaluation image index over Z is absolute delta, not its square or radical."

[[hostile_controls]]
id = "reject-divided-difference-derivative-swap"
description = "For a quadratic, the exact divided difference is c1+delta*c2, not c1 before specialization."

[[hostile_controls]]
id = "reject-uniform-denominator-from-fixed-fiber"
description = "The family (1,16*2^r-1,16*2^r) keeps the same special algebra while the gap depth and inverse cost grow."

[[hostile_controls]]
id = "reject-unproved-scheme-api"
description = "Algebra-valued equation and basis are exported; no intrinsic jet/sheaf, Cartier divisor, proper model or tensor-base-change equivalence is silently supplied."

[[hostile_controls]]
id = "reject-bounded-or-source-as-lean"
description = "Bounded exact checks and unelaborated scripts are not kernel acceptance. Historical map, height, index and gauge costs remain."

[acceptance]
source_status = "SOURCE_ONLY_NOT_RUN_NOT_KERNEL_AUDITED"
requires_exact_head_elaboration = true
requires_public_signature_comparison = true
requires_all_declared_modules = true
requires_all_hostile_controls = true
requires_transitive_trust_acceptance = true

[nonclaims]
no_lean_acceptance = true
no_intrinsic_jet_equivalence = true
no_geometric_cover = true
no_conductor_or_neron_model = true
no_uniform_source_height_bound = true
no_abc_or_rh = true
