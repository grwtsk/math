[[hostile_controls]]
id = "retain-terminal-compensation"
description = "Deleting the negative terminal square changes the exact finite identity and must fail."

[[hostile_controls]]
id = "reject-diagonal-as-cancellation"
description = "A finite or summable nonnegative diagonal does not bound the complete signed correlation."

[[hostile_controls]]
id = "reject-uncompensated-substitution"
description = "A bound for the uncompensated mixed sum is stronger and cannot be reported as the exact equivalence without a proved comparison."

[[hostile_controls]]
id = "reject-fixed-rate-promotion"
description = "The damping-one critical boundary is one fixed rate and cannot be promoted to the cofinal all-positive-rate premise."

[[hostile_controls]]
id = "reject-finite-prefix"
description = "A finite table of correlation values cannot discharge a uniform all-N bound."

[[hostile_controls]]
id = "reject-totalized-integral"
description = "A totalized real integral value cannot witness integrability or summability without the corresponding proof."

[[hostile_controls]]
id = "preserve-actual-source"
description = "The sample residue must remain the actual closed Möbius source, including its Mertens endpoint."

[[hostile_controls]]
id = "critical-compatibility-not-rh"
description = "Compatibility at damping one is not a proof at cofinally small dampings and is not RH."

[[hostile_controls]]
id = "source-signatures-not-types"
description = "Source text signatures cannot be reported as elaborated declaration types."

