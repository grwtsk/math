[[controls]]
id = "WIND-01"
requirement = "Actual covering lifts exist for all continuous punctured paths; no always-zero default."
status = "NOT_RUN"

[[controls]]
id = "WIND-02"
requirement = "Closedness is required to quantize the endpoint displacement into an integer."
status = "NOT_RUN"

[[controls]]
id = "WIND-03"
requirement = "Continuous logarithm, not pointwise principal logs or unproved lift data."
status = "NOT_RUN"

[[controls]]
id = "WIND-04"
requirement = "Any constant integer branch shift preserves the jump; discontinuous shifts are not admitted."
status = "NOT_RUN"

[[controls]]
id = "WIND-05"
requirement = "Free homotopy invariance allows moving basepoints and checks every closed slice."
status = "NOT_RUN"

[[controls]]
id = "WIND-06"
requirement = "The whole lifted square is continuous and exponentiates to the actual given homotopy."
status = "NOT_RUN"

[[controls]]
id = "WIND-07"
requirement = "Every intermediate value is nonzero through the punctured-plane target."
status = "NOT_RUN"

[[controls]]
id = "WIND-08"
requirement = "Positive, reversed and double exponential turns have indices 1, -1 and 2."
status = "NOT_RUN"

[[controls]]
id = "WIND-09"
requirement = "A nonzero-turn loop has no closed continuous logarithm and no contraction through admitted loops."
status = "NOT_RUN"

[[controls]]
id = "WIND-10"
requirement = "Actual time reversal negates the signed index, not its absolute value."
status = "NOT_RUN"

[[controls]]
id = "WIND-11"
requirement = "Endpoint-preserving nonuniform reparameterization preserves winding without claiming integral regularity."
status = "NOT_RUN"

[[controls]]
id = "WIND-12"
requirement = "Pointwise multiplication adds indices; pointwise addition is not silently substituted."
status = "NOT_RUN"

[[controls]]
id = "WIND-13"
requirement = "Both original contour closures and every exact source-value enclosure persist."
status = "NOT_RUN"

[[controls]]
id = "WIND-14"
requirement = "The endpoint maps are exactly the old analytic source image and literal rational image polygon."
status = "NOT_RUN"

[[controls]]
id = "WIND-15"
requirement = "The unchanged sourced small pole square has index zero without extra enclosures."
status = "NOT_RUN"

[[controls]]
id = "WIND-16"
requirement = "The previous false source data still cannot provide Enclosures."
status = "NOT_RUN"

[[controls]]
id = "WIND-17"
requirement = "No executable crossing refinement, contour-integral identity, argument principle, large-contour trace, or K(15)<=1 is supplied."
status = "NOT_RUN"
