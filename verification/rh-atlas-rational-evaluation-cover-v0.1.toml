[[hostile_controls]]
id = "finite_support"
requirement = "Recheck the complete positive-cutoff list at the exact Gaussian point before admitting an analytic disk."

[[hostile_controls]]
id = "same_source"
requirement = "Use the unchanged sextic finiteModel and actual poleNormalizedZeta; no anonymous or fitted function."

[[hostile_controls]]
id = "source_tail"
requirement = "Add the constructed Mellin value radius to the finite-evaluation radius; never discard the infinite tail."

[[hostile_controls]]
id = "positive_radius"
requirement = "Reject radius zero and negative radii. Prove the center belongs to every admitted disk."

[[hostile_controls]]
id = "sample_direction"
requirement = "Require a nonnegative lower norm bound and sampleLower squared <= Gaussian normSq; reject inverted or negative bounds."

[[hostile_controls]]
id = "whole_disk_real_domain"
requirement = "The real-part guard must include the radius. A center-only sigma bound is insufficient."

[[hostile_controls]]
id = "whole_disk_norm_domain"
requirement = "Charge the radius to the center L1 norm before applying the source derivative majorant."

[[hostile_controls]]
id = "derivative_denominators"
requirement = "Require 0 < auxiliary < sigma. Totalized field division cannot license a zero or negative analytic denominator."

[[hostile_controls]]
id = "actual_derivative"
requirement = "Use the actual Mellin-derived H derivative bound; do not differentiate the sample-error inequality."

[[hostile_controls]]
id = "strict_margin"
requirement = "Retain sample error plus derivativeBound times radius strictly below sampleLower, including equality-case rejection."

[[hostile_controls]]
id = "geometry_independent"
requirement = "Analytic packet acceptance alone never establishes rectangle coverage."

[[hostile_controls]]
id = "ordered_rectangles"
requirement = "Reject inverted bounds; accepted rectangle carriers and packet families are inhabited."

[[hostile_controls]]
id = "closed_seams"
requirement = "All exterior boundaries and both sides of each strictly interior split remain covered."

[[hostile_controls]]
id = "corners_insufficient"
requirement = "Coverage of separate corners by different disks is not a full rectangle cover."

[[hostile_controls]]
id = "all_packets"
requirement = "The fused check validates every stored packet, even a packet not selected by a leaf."

[[hostile_controls]]
id = "mirror_scope"
requirement = "Reflect only the actual canonical zero predicate, not an asserted equality of arbitrary H values or norms."

[[hostile_controls]]
id = "isolation_preserved"
requirement = "Adjoining a clear rectangle preserves every existing zero-permitting region and its count and capacity proofs."

[[hostile_controls]]
id = "continuum_not_grid"
requirement = "Soundness quantifies over every complex disk/rectangle point; finite rational grids are diagnostics only."

[[hostile_controls]]
id = "local_not_global"
requirement = "No new height window, complete shell cover, general search termination, or unconditional RH follows from this local witness."

[[hostile_controls]]
id = "replay_boundary"
requirement = "Exact Python arithmetic, file hashes, and static manifests do not imply Lean elaboration or transitive axiom acceptance."
