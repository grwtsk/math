[nonclaims]
claims = [
  "Lean elaboration, exact-public-signature or transitive trust acceptance",
  "execution or replacement of any historical verification target",
  "homogeneous height invariance under scaling the affine coordinates alone",
  "a bundled Mathlib projective-space height or general number-field adelic theorem",
  "an intrinsic Hodge, geometric integral-lattice or complete H0 identification",
  "recovery of discarded gauge fields from four reduced coordinates",
  "a marked-source/model-to-coordinate height comparison",
  "conductor, minimal-model or characteristic-two classification",
  "uniformity in arithmetic source or unbounded auxiliary grade",
  "a radical bound obtained by discarding denominator multiplicities",
  "the ABC-equivalent observation-height upper bound or ABC/RH conclusion",
  "execution, workflow, worker, merge, issue closure or target promotion authority"
]
