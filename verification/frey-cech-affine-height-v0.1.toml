[[hostile_controls]]
id = "reject-homogeneous-height-substitution"
description = "The height is H([1:x]), not H([x]). Scaling x changes the affine point; the first homogeneous coordinate must be scaled too for projective invariance."

[[hostile_controls]]
id = "reject-arbitrary-common-denominator"
description = "Use the actual LCM of reduced Rat.den coordinates. A larger common denominator does not give the primitive representative or its exact height."

[[hostile_controls]]
id = "reject-denominator-product"
description = "The least common denominator is an LCM, not a product. Shared denominators are not counted independently."

[[hostile_controls]]
id = "reject-zero-denominator"
description = "Prove the common denominator nonzero before cancellation, inequalities or logarithms. The zero clearing scalar is not a positive denominator."

[[hostile_controls]]
id = "reject-nonprimitive-height"
description = "Bind the max formula to the explicit primitive integer representative (D,N_i), proving every natural common divisor is one."

[[hostile_controls]]
id = "reject-zero-height-zero"
description = "The affine origin has height one. Zero vectors are allowed in the affine inequalities and are not undefined projective vectors."

[[hostile_controls]]
id = "reject-local-cost-as-height-theorem"
description = "Prove denominator divisibility and the archimedean comparison for the same map before exporting a height inequality. A sum of proposed local costs is insufficient."

[[hostile_controls]]
id = "reject-map-replacement"
description = "Reuse OLD combinedQ and inverseQ, old source weights, source-column reversal and raw reduced fields. The older one-section operator is not the four-parameter composite."

[[hostile_controls]]
id = "reject-forgotten-raw-mismatch"
description = "Retain all three raw mismatch coordinates plus the vertex sum; a difference-only target loses information."

[[hostile_controls]]
id = "reject-arch-frame-isometry"
description = "The difference frame is not archimedean-isometric. Consume the proved raw-row bound with factor five, not the framed diagonal factor four."

[[hostile_controls]]
id = "reject-inverse-cost-one"
description = "Archimedean inverse factor one does not give affine-height factor one. Retain the full inverse common-denominator multiplier 12|ab|^k."

[[hostile_controls]]
id = "reject-clearing-index-radical-interchange"
description = "The clearing integer, actual cokernel index and radical support are different. Neither index nor radical replaces the sharp height factor."

[[hostile_controls]]
id = "reject-lcm-of-composite-costs"
description = "The old composite uses 12|ab|^k, not lcm(12,|ab|^k). Shared primes can accumulate valuation depth."

[[hostile_controls]]
id = "reject-missing-grade-zero"
description = "At grade zero forward height factor five and inverse factor twelve still arise from the fixed four-field chart."

[[hostile_controls]]
id = "reject-norm-witness-as-height-witness"
description = "Sharpness must include actual least denominators and affine heights. The reciprocal 3w and 4w columns force the full witness denominator."

[[hostile_controls]]
id = "reject-reduced-height-as-source-model-height"
description = "The four reduced fields omit gauge; the marked Frey model and primitive triple are not identified with these coefficient coordinates or the fixed section x."

[[hostile_controls]]
id = "reject-hidden-uniformity"
description = "Bounds quantify over rational vectors at fixed source and grade; retain |ab| and k. No source-independent or grade-independent radical bound is inferred."

[[hostile_controls]]
id = "reject-unelaborated-height-as-acceptance"
description = "Exact arithmetic tests, lexical checks and source publication do not elaborate Lean, validate public signatures, audit trust or authorize execution/merge."

[acceptance]
requires_all_declared_modules = true
