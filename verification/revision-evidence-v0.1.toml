# Authored mathematical verification target, not an execution or acceptance record.
# Conceptual direction and authorship: R.A. Jacob Martone. AI-assisted development.
# This target grants no execution permission and releases no retained hold.
schema = "grwtsk-math-replay-target-v1"
id = "revision-evidence-v0.1"
owner_repository = "grwtsk/math"
tracking_issue = "https://github.com/grwtsk/math/issues/321"
mathematical_author = "R.A. Jacob Martone"
formalization_assistance = "AI-assisted mathematical formulation and source development"
lean_toolchain_file = "lean-toolchain"
lean_toolchain = "leanprover/lean4:v4.33.0"
lake_manifest_file = "lake-manifest.json"
candidate_status = "STATIC_SPECIFICATION / VALIDATION_EXTERNAL"

[scope]
kind = "isolated-mathematical-replay-target"
selection = "Revision-scoped timed evidence and constructive finite-list facts over Init"
requires_clean_checkout = true
requires_exact_declaration_types = true
requires_module_coverage_reconciliation = true
requires_axiom_audit = true
public_root_exposure_required = false
full_library_build_required = false
operational_evidence_is_external = true
application_correspondence_is_separate = true
future_native_validation_requires_separate_authorization = true
replaces_prior_finite_observation_target = false
extends_prior_finite_observation_type_expectations = false

[source_binding]
supplied_by = "external source selection and separately authorized validation"
repository_commit_tree_and_blobs_required = true
manifest_does_not_bind_its_own_content_identity = true
all_selected_sources_must_belong_to_one_bound_tree = true
required_external_identities = [
  "repository commit and tree",
  "this target manifest blob and exact byte digest",
  "selected Lean source blob and exact byte digest",
  "mathematical exposition blob and exact byte digest",
  "lean-toolchain and lake-manifest.json blobs",
  "Lean compiler and Init distribution identity",
  "any separately authored full-type expectations before their comparison",
]
expected_type_binding = "Before complete exact-type acceptance, independently author and bind complete expected type expressions, ordered universe parameters, source and kernel kinds, and owner modules for all selected declarations. Compare those terms against the separately observed declarations. This manifest supplies exact head selection but does not claim that such a full-type comparison has occurred."
head_selection_is_a_full_type_expectation = false
elaboration_alone_is_complete_acceptance = false

[build]
mode = "separately authorized direct elaboration of the selected source"
required_compiler_options = ["-DwarningAsError=true"]
expected_direct_imports = ["Init", "GRWTSK.FoundationsLogicAndTypeTheory.MathematicalLogic.FiniteSequences.ConstructiveList"]
require_exact_direct_imports = true
require_compiler_toolchain_match = true
require_zero_errors_and_warnings = true
external_dependency_closure = "Init"
mathlib_required_for_selected_module = false
mathlib_fetch_required_for_this_target = false
repository_dependency_manifest_is_bound_as_context = true
generated_build_outputs_and_logs_are_external = true

[mathematical_contract]
revision_representation = "Nat ordinals; issued is the count of issued ordinals"
current_selection = "List.max? of confirmed ordinals, independent of confirmation order"
record_fields = ["revision:Nat", "kind:Kind", "tick:Nat", "payload:Payload"]
query_selection = "List.filter requiring both exact revision and exact kind equality"
earliest_time = "List.min? of matching observed timestamps"
target_comparison = "inclusive: observed tick <= target"
elapsed_comparison = "strict: target < current clock"
empty_query_means = "no matching record in this finite ledger"
empty_query_refutes_external_occurrence = false
confirmed_revision_guard = "revision < issued"
recording_guard = "revision belongs to the exact confirmation list"
fresh_correction = "issue one fresh ordinal, then confirm that exact ordinal"
history_relation = "the established exact ordered List prefix relation"
string_identifier_and_predecessor_order_correspondence_is_proved = false
hidden_context_noninterference_is_in_scope = false
parser_storage_and_external_program_refinement_are_proved = false

[declaration_inventory]
required_count = 76
theorem_count = 56
core_count = 67
fixture_count = 9
module_count = 2
nonempty = true
duplicate_free = true
exact_names_selected = true
exact_owner_modules_selected = true
exact_universe_polymorphic_types_required = true
reconcile_all_explicit_heads_in_selected_module = true
generated_constructors_recursors_projections_and_derived_instances_are_not_separate_entries = true
generated_dependencies_remain_in_transitive_trust_inspection = true

[trust]
# Required acceptance policy, not a report of observed transitive dependencies.
allowed_axioms = []
standard_lean_axioms_are_automatically_allowed = false
policy_change_requires_separate_review = true
empty_axiom_closure_is_established_by_this_source_package = false
open_obligation = "Source-bound external inspection must establish an explicit empty transitive axiom list for every selected head. The constructive source and changed bounded-position interface supply no execution evidence or independent full-type acceptance; this empty allowance is not relaxed."
reject_sorry_ax = true
reject_native_decide = true
reject_native_proof_dependencies = true
reject_unreported_native_dependencies = true
reject_unavailable_audit = true
reject_missing_audit_as_empty_axiom_set = true
require_transitive_dependency_inspection = true
require_kernel_checked_proof_terms = true
proof_search_success_alone_is_insufficient = true

[axiom_audit]
selection = "All 56 explicit theorem heads, including all eight fixture theorems; external selected-head observation must also inspect every selected definition and inductive head"
required_count = 56
same_exact_source_binding_as_elaboration = true
imported_List_lemma_dependencies_are_included = true

