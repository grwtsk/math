[[controls]]
id = "P02"
kind = "positive"
theorem = "GRWTSK.Logic.Observation.RevisionEvidence.Fixtures.fresh_revision_control"
description = "Fresh ordinal one becomes current without matching evidence; the tick-ten ordinal-zero record remains exactly available."

[[controls]]
id = "P03"
kind = "positive"
theorem = "GRWTSK.Logic.Observation.RevisionEvidence.Fixtures.unconfirmed_revision_keeps_current"
description = "Issuing a new ordinal alone keeps current ordinal zero and its exact record."

[[controls]]
id = "H01"
kind = "hostile"
theorem = "GRWTSK.Logic.Observation.RevisionEvidence.Fixtures.old_confirmation_control"
description = "A first delayed confirmation of ordinal zero after ordinal one yields confirmation order [1,0] but cannot roll current selection back."

[[controls]]
id = "H02"
kind = "hostile"
theorem = "GRWTSK.Logic.Observation.RevisionEvidence.Fixtures.distinct_kind_control"
description = "A matching record for kind true does not supply a record for kind false at the same revision."

[[controls]]
id = "H03"
kind = "hostile"
theorem = "GRWTSK.Logic.Observation.RevisionEvidence.Fixtures.elapsed_without_evidence_control"
description = "Moving past target twenty changes the elapsed flag while current evidence stays unavailable."

[[controls]]
id = "P04"
kind = "positive"
theorem = "GRWTSK.Logic.Observation.RevisionEvidence.Fixtures.inclusive_timing_control"
description = "Tick ten meets target ten, misses target nine, and remains timely for target ten after the clock advances."

[[controls]]
id = "H04"
kind = "hostile"
theorem = "GRWTSK.Logic.Observation.RevisionEvidence.Fixtures.malformed_state_counterexample"
description = "A fabricated unconfirmed future record violates WellFormed and survives correction, refuting unconditional fresh-query absence without that structural premise."

[acceptance]
requirements = [
  "Bind this target, the source, exposition, compiler context, and any complete authored type expectations to their exact selected identities.",
  "Obtain scoped authorization for the intended validation path; this target supplies none.",
  "Elaborate both selected modules in dependency order with the pinned compiler and required options, preserving actual failure and warning output.",
  "Resolve all 76 explicitly selected heads at their two listed owner modules and reconcile source forms and generated dependencies.",
  "Before claiming complete exact-type acceptance, independently bind and compare all complete expected types and ordered universe parameters; do not substitute name presence or observed types for authored expectations.",
  "Audit transitive trust for all 76 selected heads, including all 56 theorems and dependencies of imported Init list facts; unavailable output is not an empty axiom set.",
  "Validate all eight controls as their actual theorem propositions; a named passing record is insufficient.",
  "Review that the fresh-query result is derived from issuance/confirmation invariants and concrete updates, not inserted into the guards.",
  "Review that old-history position preservation and no-rollback selection cover arbitrary modeled finite traces and out-of-order confirmations as stated.",
  "Keep external event truth, ordinal correspondence, fixed-target policy, input validation, durable storage, information flow, and implementation refinement separate.",
]
nonclaims = [
  "This manifest reports no observed elaboration, complete exact-type comparison, transitive axiom audit, or external replay result.",
  "No earlier finite-observation source, target, or authored type expectation is revised by this increment.",
  "A matching record does not by itself establish fidelity or adequacy of an external observation.",
  "An empty record query does not refute external event occurrence.",
  "The ordinal order is not a proved interpretation of arbitrary string identifiers, predecessor graphs, or source contents.",
  "Unguarded update functions on an arbitrary state are not valid Step proofs; recovered states need a valid origin or invariant argument.",
  "A fixed target parameter in a theorem does not prove that another program forbids target reset.",
  "List-prefix preservation proves no storage durability, crash recovery, or actual successful interaction.",
  "Hidden-context noninterference and visible-output authorization are outside this compact target.",
  "The source implements no process runner, external evidence record, action authorization, or application workflow.",
]

