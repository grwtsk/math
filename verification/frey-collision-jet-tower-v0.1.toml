[[hostile_controls]]
id = "retain-mixed-term"
description = "The selected equation has XY. Use B-Y with its exact finite resolvent, not a constant B inverse inside the inherited cubic solver."

[[hostile_controls]]
id = "retain-unit-not-nonzero"
description = "Over the local ring and composite residue rings B must be a unit, not merely nonzero."

[[hostile_controls]]
id = "retain-nilpotence-bound"
description = "The finite geometric sum is an exact inverse only under the stated nilpotence bound; it is not an analytic convergence claim."

[[hostile_controls]]
id = "retain-full-origin-ideal"
description = "Use (F)+(X,Y)^(N+1), including mixed monomials, not just separate coordinate powers or a line restriction."

[[hostile_controls]]
id = "retain-same-model"
description = "Derive selectedEquation from all five OLD integerModel coefficients before applying the generic quotient theorem."

[[hostile_controls]]
id = "retain-exhaustion"
description = "Uniqueness uses the whole universal nilpotent origin ideal, not only a fitted parametric candidate."

[[hostile_controls]]
id = "retain-normalization"
description = "Uniqueness fixes Y=T, not merely its first coefficient. The old free second Y coefficient is not silently removed without this normalization."

[[hostile_controls]]
id = "retain-two-inverses"
description = "Construct both quotient maps and prove both composition identities before claiming algebra equivalence."

[[hostile_controls]]
id = "retain-truncation-direction"
description = "Thickening maps go from higher order to lower order. Use independently defined quotient truncations and prove compatibility."

[[hostile_controls]]
id = "retain-rank-scope"
description = "Rank N+1 belongs to the actual local finite origin-jet algebra under the unit hypothesis, not to complete global section spaces."

[[hostile_controls]]
id = "retain-singular-obstruction"
description = "The OLD vertical jet at B=0 is still obstructed at order two, even at a split node."

[[hostile_controls]]
id = "retain-characteristic-two"
description = "Do not divide Taylor coefficients by factorials, especially by two. Parameter coefficients work over arbitrary commutative rings."

[[hostile_controls]]
id = "retain-fractional-local-boundary"
description = "Do not reduce rational coefficients with even denominators into F2. The actual localization unit test is required."

[[hostile_controls]]
id = "retain-cubic-denominator"
description = "The third X coefficient is 1/B^2. Replacing its clearing scalar by B or radical(B) is invalid."

[[hostile_controls]]
id = "retain-separate-map-costs"
description = "The pair gap, inverse Jacobian B, cubic B^2 cost, trace discriminant and elliptic discriminant remain separate objects."

[[hostile_controls]]
id = "retain-cancellation"
description = "General stage denominators divide powers of B; equality is not universal. The sharp family has its own congruence proof."

[[hostile_controls]]
id = "retain-local-vs-global"
description = "Odd B gives dyadic integral lifts at every order while global coefficient denominators can still grow."

[[hostile_controls]]
id = "retain-domain-and-labels"
description = "Preserve OLD Descends, the ordered source, and the signed even-a branch. No new pair is assigned outside the old domain."

[[hostile_controls]]
id = "retain-finite-vs-completed"
description = "Every finite order and its compatibility are addressed. No analytic arc, completed scheme, full line-bundle atlas or tensor-base-change equivalence is promoted."

[[hostile_controls]]
id = "retain-acceptance-boundary"
description = "New and inherited Lean scripts remain unelaborated; exact bounded arithmetic and source checks are not kernel acceptance."

[acceptance]
