schema = "grwtsk.lean-subject-sort/1"
managed_root = "GRWTSK"
umbrella = "GRWTSK.lean"
taxonomy_root = "docs/taxonomy/subjects"
immutable_prefixes = ["GRWTSK/SourceCorpus"]
ignored_prefixes = []

# A model score is only a placement proposal. Ambiguous files remain in REVIEW.
confidence_threshold = 0.42
margin_threshold = 0.06
secondary_threshold = 0.30
current_location_prior = 0.035
import_prefix_bonus = 0.20
namespace_prefix_bonus = 0.15
require_non_path_evidence = true

[validation]
require_native_parse_for_move = true
native_parse_command = ["lake", "env", "lean", "--src-deps", "{path}"]
native_parse_timeout_seconds = 300
check_each_moved_file = true
per_file_command = ["lake", "env", "lean", "{path}"]
command = ["lake", "build", "GRWTSK"]
timeout_seconds = 7200

