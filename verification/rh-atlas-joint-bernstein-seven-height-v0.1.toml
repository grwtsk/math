[[hostile_controls]]
id = "unchanged_arithmetic_source"
requirement = "Use the SAME quartic source_identity, reference R4, multiplier A5, centeredTail and corrected finiteModel. This increment changes no primitive, mean, endpoint, normalization or dependency pin."

[[hostile_controls]]
id = "exact_tensor_identity"
requirement = "The complete 9x5 NATURAL table must satisfy tensor_identity by ordinary ring normalization. Positivity of an arbitrary table, sampled signs, or an external symbolic assertion is insufficient. Reject deletion, zero replacement or corruption of any coefficient unless the exact identity is reproved."

[[hostile_controls]]
id = "basis_not_partition_assumption"
requirement = "Use u^i(1-u)^(8-i)v^j(1-v)^(4-j) with binomial weights absorbed into coefficients. The proof uses only nonnegative factors on [0,1]^2, not an unproved partition-of-unity or convex-weight normalization."

[[hostile_controls]]
id = "squared_height_domain"
requirement = "Set x=Re(s), y=Im(s)^2, u=2x-1 and v=y/49. Prove 0<=u,v<=1 from 1/2<=Re(s)<=1 and |Im(s)|<=7. No replacement of squared height by height, finite lattice, absolute value, or root-index metadata."

[[hostile_controls]]
id = "joint_norm_identity"
requirement = "Retain all factors in numerator and denominator. The real scalar (Re(s)+3)^2 is distinct from |s+3|^2. Prove both exact norm-square identities before taking nonnegative square roots."

[[hostile_controls]]
id = "tail_actual_real_part"
requirement = "Apply the EXISTING Mellin tail theorem with sigma=Re(s)>0. Re(s)+3 must remain until its legitimate positive cancellation. A uniform sigma=1/2 estimate cannot silently be replaced by a stronger variable-sigma bound."

[[hostile_controls]]
id = "restore_shared_factor"
requirement = "The squared ratio cancels |s+2| only as an algebraic planning step. Restore it before comparing the complete A5 to referenceFactors. No missing factor or endpoint can be hidden in the tensor table."

[[hostile_controls]]
id = "relative_margin"
requirement = "Reconcile 961/1024=(31/32)^2, error<=31|R4|/32, inherited |R4|>=11/16, and |H|>=11/512>0. Ordinary algebra scripts still require Lean elaboration and transitive audit."

[[hostile_controls]]
id = "closed_seven_boundaries"
requirement = "Include Re=1/2, Re=1, Im=+/-7 and H(1)=1. Target-zero height is STRICTLY greater than7. No first-zero numerical location is asserted."

[[hostile_controls]]
id = "not_height_eight"
requirement = "The exact gap at x=1/2,y=64 equals -2206009628455/256. This falsifies extension of this particular 31/32 comparison, NOT nonvanishing or RH at height8. The ambient point is not asserted to be a zeta zero."

[[hostile_controls]]
id = "mirror_only_zeros"
requirement = "The functional mirror transports canonical zero locations. Do not reflect the quantitative H norm as an equality or infer analytic multiplicity or complete zero enumeration."

[[hostile_controls]]
id = "same_homotopy"
requirement = "Use the EXISTING deformation R4+t(H-R4) with real t in[0,1]. Reciprocal differentiability additionally consumes inherited complex differentiability and the new nonzero bound. R4(9)=0 still rules out a global-unit claim."

[[hostile_controls]]
id = "finite_cutoff_same_model"
requirement = "Only the inherited integer-cutoff quartic finiteModel is used. The new relative error carries N^(-Re(s)-3) and |R4(s)|. This is not an order-limit, all-height error, completed divisor tail, or Weil positivity theorem."

[[hostile_controls]]
id = "prior_next_port"
requirement = "Instantiate the PREVIOUS window_seven_of_shell with the new shellRH_six. New window_eight_of_shell retains ShellRH7; rh_of_above_seven retains the full higher-step family. Do not promote a bounded no-zero seed into unconditional RH."

[[hostile_controls]]
id = "no_metric_or_weil_coercion"
requirement = "The degree-(8,4) squared-norm comparison is not a globally positive Hodge metric, signed-null-form identification, arithmetic B_n construction, spectral theorem or positive Weil Gram."

[[hostile_controls]]
id = "source_script_not_replay"
requirement = "Python exact arithmetic, ring expansions and lexical scans are diagnostics only. No Lean/Lake/native evaluator, worker, replay, receipt, merge or execution authority is supplied by this mathematical target. Reject sorryAx and unreported native dependencies."
