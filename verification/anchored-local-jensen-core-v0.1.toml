[controls]
obligations = [
  "The leading Dirichlet term one and the n=2 term must both be retained.",
  "Actual complex-series summability precedes index shifts and all partial-sum limits.",
  "Every finite reciprocal-square bound retains its terminal reciprocal before weakening.",
  "The uniform disk and floor require Re(s)>=2; analytic continuation is not bounded by this series outside that domain.",
  "The imaginary coordinate is unrestricted and is never projected onto a selected height or critical line.",
  "A norm-radius bound of one would admit zero; the strict gap in radius 3/4 is essential.",
  "Both original Jensen centers receive the derived floor; no conjugacy or substituted center is assumed.",
  "Center floors hold at low stages but analytic Jensen on the outer disks still requires N>=2.",
  "Actual all-point outer-circle ceilings remain inputs; a center bound or finite sampling does not supply them.",
  "Polynomial circle growth is conditional and does not become a derived source estimate.",
  "Finite local principal sums do not control the full logarithmic-derivative regular or distant terms.",
  "All inherited canonical source, contour, counting, evaluation and arithmetic-margin obligations remain unchanged.",
]
