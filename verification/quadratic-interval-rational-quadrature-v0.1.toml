[[modules]]
name = "GRWTSK.Interfaces.QuadraticIntervalRationalQuadratureCore"
path = "GRWTSK/Interfaces/QuadraticIntervalRationalQuadratureCore.lean"
source_git_blob = "ee0770335e9d7c219e38f65717dd2fd5316eb304"
required_declarations = []

[[controls]]
id = "kernel_not_samples"
requirement = "The target must be the existing integral kernel, not a reference sample sum."

[[controls]]
id = "literal_endpoints"
requirement = "Changing the external right endpoint changes weights and invalidates a stale trace when the resulting checks fail."

[[controls]]
id = "positive_cell_count"
requirement = "Reject zero cells even with empty data; positive N is the endpoint-coverage guard."

[[controls]]
id = "ordered_domain"
requirement = "Require 1<a<=b and Re(z)<=1; do not extrapolate to other domains."

[[controls]]
id = "sample_count"
requirement = "Require exactly N complete sample records; neither a prefix nor extra records are accepted."

[[controls]]
id = "literal_node_input"
requirement = "Every node checker is called at the derived rational x_i and the same complex parameter."

[[controls]]
id = "accumulator_count"
requirement = "Require N+1 accumulator values and N radii; no default-valued missing evidence."

[[controls]]
id = "zero_initialization"
requirement = "Reject exact updates from a nonzero seed."

[[controls]]
id = "weighted_products"
requirement = "Check against the exact rational d*v_i; product and addition errors both belong in the local defect."

[[controls]]
id = "imaginary_and_sign"
requirement = "Retain imaginary defects and reject negative radii before squaring."

[[controls]]
id = "full_tolerance"
requirement = "A successful node tolerance is not automatically an integral tolerance: add the mesh charge."

[[controls]]
id = "nonvacuity"
requirement = "Replay reference_checked and exactTrace_checked plus literal unit and nonconstant examples."

[[controls]]
id = "rounded_sum"
requirement = "Retain the first nonzero arithmetic error in the rounded two-cell example."

[[controls]]
id = "degenerate_interval"
requirement = "Equal endpoints are allowed with positive N and zero weights, without permitting zero-cell data."

[[controls]]
id = "failure_is_unknown"
requirement = "Failure is not a proof of inaccuracy, a zero, failed coverage, or a prime-count assertion."

[[controls]]
id = "no_promotion"
requirement = "No parser/runtime qualification, divisor identity, complete zero coverage, omitted tail or conjecture conclusion follows."
