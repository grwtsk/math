[[declarations]]
source_name = "finite_abel_sum"
visibility = "public"
kind = "theorem"
source_signature = """theorem finite_abel_sum (b w : ℕ → ℝ) (N : ℕ) :
    (∑ n ∈ Finset.range (N + 1), b n * w n) =
      (∑ n ∈ Finset.range (N + 1), b n) * w N +
        ∑ n ∈ Finset.range N,
          (∑ k ∈ Finset.range (n + 1), b k) *
            (w n - w (n + 1))"""
source_signature_sha256 = "f263feb811ca2e6abed42c75c7eac4d92217161883ae50572cbb0d986cbad508"

[[declarations]]
source_name = "weightedMertens_partial_sum_abel"
visibility = "public"
kind = "theorem"
source_signature = """theorem weightedMertens_partial_sum_abel (ε : ℝ) (N : ℕ) :
    (∑ n ∈ Finset.range (N + 1),
      weightedMertensBaseTerm n *
        ((n + 1 : ℕ) : ℝ) ^ (-ε)) =
      weightedMertensCumulative (N + 1) *
