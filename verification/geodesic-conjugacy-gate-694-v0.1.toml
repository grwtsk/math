[[hostile_controls]]
id = "actual-mathlib-conjugacy"
requirement = "Use Mathlib IsConj and ConjClasses.mk; never substitute raw word equality, homology equality, or trace equality for conjugacy."
status = "NOT_RUN"

[[hostile_controls]]
id = "proper-power-actual-group"
requirement = "A proper power witness has n>=2 and r^n=g in the chosen group G, not just a substring or a free-basis pattern."
status = "NOT_RUN"

[[hostile_controls]]
id = "identity-not-primitive"
requirement = "The group identity is never admitted as an oriented primitive geodesic source."
status = "NOT_RUN"

[[hostile_controls]]
id = "squares-not-primitive"
requirement = "For every group element r, r^2 has a proper-power witness; repeated word w++w fails primitive."
status = "NOT_RUN"

[[hostile_controls]]
id = "conjugacy-preserves-power"
requirement = "Proper-power transport must use an actual conjugacy witness and Mathlib's conjugate-power identity."
status = "NOT_RUN"

[[hostile_controls]]
id = "conjugacy-preserves-primitive"
requirement = "Nonidentity AND absence of proper roots are preserved by conjugacy; neither is omitted."
status = "NOT_RUN"

[[hostile_controls]]
id = "monoid-word-order"
requirement = "Ordered List.prod evaluation does not commute letters in a noncommutative group."
status = "NOT_RUN"

[[hostile_controls]]
id = "split-only-one-direction"
requirement = "u++v and v++u are conjugate; arbitrary conjugacies are not asserted to arise only from cyclic splits."
status = "NOT_RUN"

[[hostile_controls]]
id = "conjugating-element-correct"
requirement = "The cyclic-split conjugator is evalWord(u)^(-1), not evalWord(u) in the stated orientation."
status = "NOT_RUN"

[[hostile_controls]]
id = "mathlib-conj-quotient"
requirement = "The source canonical class is the actual ConjClasses G quotient, not an invented representation."
status = "NOT_RUN"

[[hostile_controls]]
id = "inverse-orientation-needs-proof"
requirement = "Conjugacy of g and g^(-1) is NOT automatic; Multiplicative ℤ gives distinct +1/-1 oriented classes."
status = "NOT_RUN"

[[hostile_controls]]
id = "typed-class-source-map-not-algorithm"
requirement = "sourceOfClass : ConjClasses G -> Option γ is a supplied source map, not a computable conjugacy decision procedure."
status = "NOT_RUN"

[[hostile_controls]]
id = "group-is-not-assumed-surface-group"
requirement = "The group G need not be a torsion-free cocompact Fuchsian group; identifying it with π1(X) needs separate geometric proof."
status = "NOT_RUN"

[[hostile_controls]]
id = "alphabet-word-evaluation"
requirement = "Letters map into actual chosen G; no implicit free-group or surface-group relations are assumed."
status = "NOT_RUN"

[[hostile_controls]]
id = "decoded-source-factorization"
requirement = "The finite decoder must factor exactly through conjugacyClassOfWord, not use merely equal lengths/word cyclic forms."
status = "NOT_RUN"

[[hostile_controls]]
id = "primitive-source-acceptance"
requirement = "Every successful decoded source must have an IsPrimitiveConjugacy evaluation proof in G; a bare Prop or booleans cannot become verified roots."
status = "NOT_RUN"

[[hostile_controls]]
id = "empty-word-rejected"
requirement = "The all-identity evaluation of the empty word forces a primitive-group decoder to return none."
status = "NOT_RUN"

[[hostile_controls]]
id = "repeated-word-rejected"
requirement = "A code with letters = u++u is rejected, independent of free reductions or subgroup generators."
status = "NOT_RUN"

[[hostile_controls]]
id = "cyclic-split-outputs-equal"
requirement = "Two in-bound codes with concatenation patterns u++v and v++u decode to the SAME Option γ value."
status = "NOT_RUN"

[[hostile_controls]]
id = "full-conjugacy-decider-still-open"
requirement = "Cyclic split invariance is not a full group conjugacy classification, normal form, or complete decidable class quotient."
status = "NOT_RUN"

[[hostile_controls]]
id = "decidable-proper-power-still-open"
requirement = "IsProperPower is Prop; no finite maximal exponent or decision procedure is inferred for arbitrary group G."
status = "NOT_RUN"

[[hostile_controls]]
id = "old-toy-geometric-veto"
requirement = "The previous #687 PUnit toy maps the empty word to a source and cannot satisfy the strengthened primitive-group gate."
status = "NOT_RUN"

[[hostile_controls]]
id = "old-finite-count-preserved"
requirement = "The prior full bounded code enumeration, many-to-one decoding, and short-source roundtrip remain independent explicit fields."
status = "NOT_RUN"

[[hostile_controls]]
id = "no-group-basis-primitive-confusion"
requirement = "Primitive group element is not synonymous with a generator-basis primitive element or simple closed curve."
status = "NOT_RUN"

[[hostile_controls]]
id = "surface-length-word-bound-open"
requirement = "No numerical conjugacy-representative cutoff L(B,X,marking) or source-complete real geodesic list is proved."
status = "NOT_RUN"

[[hostile_controls]]
id = "no-source-identifier-collapse"
requirement = "Reverse orientation, conjugacy and iterate IDs must retain exact source identity according to supplied geometric mapping."
status = "NOT_RUN"

[[hostile_controls]]
id = "no-automatic-error-discharge"
