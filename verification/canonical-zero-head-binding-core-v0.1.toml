[[acceptance_obligations]]
id = "R01"
requirement = "Elaborate all five new modules at the exact head and retain every inherited acceptance obligation."

[[acceptance_obligations]]
id = "R02"
requirement = "Audit all public types, the new Decidable instance, and complete transitive imports/axioms/native dependencies; selected bindings are not closure."

[[acceptance_obligations]]
id = "R03"
requirement = "Positive-mass exhaustion requires an actual injection, pointwise LOWER weights, and positivity of EVERY target atom."

[[acceptance_obligations]]
id = "R04"
requirement = "Use the complete source multiplicity sum in the upper bound, never a count computed only from the observed records."

[[acceptance_obligations]]
id = "R05"
requirement = "The disk predicate uses nonnegative radii, rational full-complex squared distances, STRICT separation and NON-STRICT height containment."

[[acceptance_obligations]]
id = "R06"
requirement = "Tangent or duplicate closed disks must fail; equal heights at distinct complex locations must not be identified."

[[acceptance_obligations]]
id = "R07"
requirement = "Local witnesses must be genuine canonical ZeroPoint values with proved coordinates and lower actual analytic multiplicities, not residuals or metadata."

[[acceptance_obligations]]
id = "R08"
requirement = "Construct head membership and injectivity from geometry, then prove surjectivity and exact weights without assuming the desired binding."

[[acceptance_obligations]]
id = "R09"
requirement = "Retain Classical.choice in the semantic witness selection and report it; this is not an executable enumerator or a choice-free proof."

[[acceptance_obligations]]
id = "R10"
requirement = "Uniqueness must quantify over every actual zero in the whole closed disk, using containment and global exhaustion."

[[acceptance_obligations]]
id = "R11"
requirement = "Unit weights require only local existence but still require the COMPLETE multiplicity-count upper bound; simplicity is a conclusion."

[[acceptance_obligations]]
id = "R12"
requirement = "Empty geometry is vacuous; an empty canonical binding still requires the actual total count to be zero."

[[acceptance_obligations]]
id = "R13"
requirement = "The verified head and prime wrappers must reuse the old numerical verifier, canonical family, actual multiplicities, returned error and scaled tail."

[[acceptance_obligations]]
id = "R14"
requirement = "No source-bound count, analytic existence packet, byte decoder, execution authority or universal strict prime margin is supplied by numeric geometry."

[[acceptance_obligations]]
id = "R15"
requirement = "Execute hostile Lean controls only under separate valid authority; Python finite models and hash checks are not kernel acceptance."
