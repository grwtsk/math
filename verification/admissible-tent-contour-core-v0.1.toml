[mathematical_scope]
contour_geometry = "Left=-2N-1, right=2, bottom=-H_N, top=H_N, N+1<H_N<N+2."
source_inventory = "Pole one plus the actual canonical nontrivial height head plus exactly N negative-even zeros. Multiplicity is not a height key."
derived = "Qualitative boundary avoidance; exact inventory; boundary/off-inventory analyticity; finite edge integrability; orientation; right-segment convergence to the arithmetic source."
not_supplied = "Quantitative divisor separation, actual zero-count estimate, finite meromorphic residue identity, left/horizontal boundary decay, full explicit formula, numerical evaluator or all-interval margin."
regularity_policy = "The inventory lists potential singularities; the tent multiplier may make an entry removable. Entire-function Cauchy is not applied to the interior-singular zeta integrand."
remaining_consumer_hypotheses = "CanonicalZetaTent hsource/hcount/evaluation/margin remain unchanged."

[hostile_controls]
requires_external_replay = true
cases = [
  "Replace the complete forbidden-height head by observed records only: reject.",
  "Round the chosen real height without a proved separation radius: reject.",
  "Treat height deduplication for exclusion as zero-point or multiplicity deduplication: reject.",
  "Use a cutoff containing a boundary zero as an admissible height: reject.",
  "Replace the negative odd left edge by a negative even edge: reject.",
  "Use N+1 trivial points instead of exactly N: reject.",
  "Ignore the pole in the interior because all boundaries are nonvanishing: reject.",
  "Forget corner membership or one height sign: reject.",
  "Claim exhaustion of the whole plane instead of Re(s)<2: reject.",
  "Reverse top-minus-bottom or the upward-left correction in the normalization: reject.",
  "Infer each edge vanishes because an entire function has zero closed contour integral: reject.",
  "Infer a boundary-growth rate from noncomputable qualitative avoidance: reject.",
  "Apply the improper-limit bridge without actual absolute integrability: reject.",
  "Treat the source count or full residue formula as proved by this contour construction: reject."
]
