[[controls]]
id = "SHARP_DENOMINATOR"
description = "Keep the factor 1/(2*n+1) and derive it from primitive comparison, not an assumed tail."

[[controls]]
id = "LOWER_NOT_MIDPOINT"
description = "The lower series endpoint requires the full one-sided tail; halving it there is refuted."

[[controls]]
id = "SAME_SCALE_AND_INPUT"
description = "Recover the literal t from 2^k times its mantissa. No log input substitution."

[[controls]]
id = "COMPLETE_81_BASES"
description = "The source quantifies over Icc 1 81, excluding zero and including 81; reconcile every finite decision."

[[controls]]
id = "OLD_CHECKER_UNCHANGED"
description = "The atanh formulas are distinct from reciprocal grids. No old declaration is modified."

[[controls]]
id = "SHARED_LOG_TWO_ERROR"
description = "Charge k copies of the same log-two radius; do not infer independent stochastic errors."

[[controls]]
id = "SIGNED_FLOOR"
description = "Negative coordinate rounding is floor toward minus infinity, not truncation to zero."

[[controls]]
id = "RADIUS_ROUND_UP"
description = "Charge midpoint displacement, including imaginary displacement, then ceil the full radius."

[[controls]]
id = "PRODUCT_CROSS_TERM"
description = "Retain both linear errors and e_a*e_b; do not cancel error radii with centers."

[[controls]]
id = "NONLINEAR_DOMINATION"
description = "Prove exact propagation <= upward propagation. Do not assert equality or omit early amplification."

[[controls]]
id = "SAME_EXPONENT_TRACE"
description = "Original exact trace length, seed and every square remain checked at the derived exponent."

[[controls]]
id = "ORIGINAL_POWER_TARGET"
description = "The composed theorem targets t^(-s); preserve Re(s)>=0 and log-center nonnegativity."

[[controls]]
id = "ZERO_AND_NEGATIVE_INPUTS"
description = "Zero terms are a coarse allowance, not exact; negative radii/tolerances and invalid scales cannot supply evidence."

[[controls]]
id = "CENTER_ESTIMATES_RETAINED"
description = "The old literal zeta candidate still requires its actual CenterEstimates proof."

[[controls]]
id = "NOT_EXECUTABLE_QUALIFICATION"
description = "Finite formula correspondence is not Python/compiled/parser or resource qualification."

[[controls]]
id = "SOURCE_AND_GLOBAL_GAPS"
description = "No EM source, complete zeta jet, root inventory, count, divisor tail or prime margin is supplied."
