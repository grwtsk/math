[[controls]]
id = "exact_types"
requirement = "Inspect all new/inherited exact types and generated structure members; a Bool or data record is not actual source semantics."

[[controls]]
id = "leaf_source_identity"
requirement = "Use the literal external base and complex parameter to derive the exponent; do not accept a relabeled output."

[[controls]]
id = "scale_guards"
requirement = "Check exact dyadic inequalities even when Nat.log2 constructs the candidate scale. Reject base zero."

[[controls]]
id = "full_log_error"
requirement = "Retain scale-weighted log(2) uncertainty, full atanh remainder and directed coordinate displacement."

[[controls]]
id = "actual_generated_trace"
requirement = "Derive every inherited trace check from the reference constructor; no missing seed, square or endpoint."

[[controls]]
id = "nonlinear_rounding"
requirement = "Retain E^2 and every local residual before later squarings; upward error rounding is not exact error."

[[controls]]
id = "validity_not_precision"
requirement = "M=0 can be valid but coarse; require full radius comparison for requested precision and unchanged strict patch margin."

[[controls]]
id = "positive_base_inventory"
requirement = "Generate every base 1..N; N>=1 and complete endpoint corrections are mandatory."

[[controls]]
id = "correction_count"
requirement = "extraCorrections=p means p+1 actual Bernoulli corrections; do not shift the source residual order."

[[controls]]
id = "actual_source_tail"
requirement = "Add the inherited actual-source remainder to the complete finite value radius; finite derivative is not actual source derivative."

[[controls]]
id = "removed_pole"
requirement = "Retain F(1)=1 and the pole-free finite construction. Do not evaluate raw totalized 0*zeta(1)."

[[controls]]
id = "no_value_field"
requirement = "Plans contain geometry and parameters only. Construct the same value ball internally rather than accepting source truth metadata."

[[controls]]
id = "plan_lengths"
requirement = "Require positive n, exactly n plans and every source guard, including zero-width cells; defaults waive no record."

[[controls]]
id = "upstream_count_preserved"
requirement = "Reuse unchanged mesh, tube, polygon index, oriented alignment, canonical divisor and all original strict checks."

[[controls]]
id = "only_finite_success"
requirement = "Inspect count_eq_of_evaluate to ensure Enclosures is derived, not retained under a disguised free premise."

[[controls]]
id = "small_constructed_example"
requirement = "The old small pole square must compute generated records and some0; failed target reuse remains none."

[[controls]]
id = "literal_target_pilot"
requirement = "The single left-side pilot requires actual reduction of all 81 leaves and full source/patch formulas. It is not whole-contour coverage."

[[controls]]
id = "strict_radius"
requirement = "Equality at the Cauchy radius threshold rejects. Rejection is not a zero witness; reducing value error alone does not remove variation."

[[controls]]
id = "negative_index"
requirement = "Retain signed output and derive nonnegativity only from the complete soundness chain; no truncation or absolute value."

[[controls]]
id = "full_acceptance"
requirement = "No Python diagnostic, static scan, hash match or source commitment substitutes for pinned elaboration, large decision acceptance and independent transitive trust review."
