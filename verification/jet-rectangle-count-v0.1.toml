[[controls]]
id = "JC01-same_radius"
requirement = "Use the derived jet image radius for the strict margin, actual whole-cell source bound and BOTH surrogate endpoint checks. Reject a stale larger endpoint radius."

[[controls]]
id = "JC02-same_source"
requirement = "Values and derivatives come from the same literal plan, full pole-free model and source residual; no editable value or accuracy field."

[[controls]]
id = "JC03-complete_lengths"
requirement = "Require positive n, n+1 domain/image vertices, n plans, every consecutive cell and both exact closures. Missing or extra records reject."

[[controls]]
id = "JC04-zero_width"
requirement = "Repeated marks are permitted only with all per-position witnesses and endpoint tests; retain the old small-square regression."

[[controls]]
id = "JC05-domain_disk"
requirement = "Both domain endpoints must lie in one common convex disk; do not replace this by unrelated endpoint patches."

[[controls]]
id = "JC06-all_point_deformation"
requirement = "Construct the same full two-parameter nonzero homotopy from image containment, not only sample signs."

[[controls]]
id = "JC07-old_invariant"
requirement = "Use the old exponential-lift signed index and old rational polygon refinement; no redefinition of the count or integer."

[[controls]]
id = "JC08-moving_basepoint"
requirement = "Keep free closed-loop semantics, not an unjustified fixed-basepoint homotopy."

[[controls]]
id = "JC09-boundary_alignment"
requirement = "Reuse full geometric range and real-perimeter boundary homotopy; do not interpolate complex points through interior zeros."

[[controls]]
id = "JC10-canonical_divisor"
requirement = "Retain actual source analytic orders, complete regional head, removed F(1)=1, exact positive rectangle and mirror-completeness hypotheses."

[[controls]]
id = "JC11-signed_result"
requirement = "Reject invalid data distinctly from zero; do not truncate negative winding or use its absolute value. Reverse and doubled synthetic traversals retain signs."

[[controls]]
id = "JC12-literal_mesh"
requirement = "Reconstruct exactly the sixteen candidate blocks, all 2380 marks and 2379 cells with side totals 14,206,47,2112."

[[controls]]
id = "JC13-literal_plans"
requirement = "Use midpoint centers, R=3*axis length/4, S=Re(center)/2, and the exact 16-base/eight-correction/80-bit schedule."

[[controls]]
id = "JC14-literal_image"
requirement = "Shared images are opposite-length weighted adjacent generated midpoints, checked independently in BOTH incident disks; not exact source vertex values."

[[controls]]
id = "JC15-new_vs_old"
requirement = "Old Cauchy-only guards and targets remain unchanged. Independent model success of the new evaluator does not imply success of the old one."

[[controls]]
id = "JC16-large_success_obligation"
requirement = "Construct GRWTSK.RiemannHypothesis.Checks.HeightFifteenJetCandidate.Success in Lean at this exact source. It is currently a definition and explicit premise, NOT a theorem or axiom."

[[controls]]
id = "JC17-finite_controls"
requirement = "Elaborate all new controls and all inherited large decisions; Python reports do not execute or refine Lean."

[[controls]]
id = "JC18-runtime_limits"
requirement = "No implicit parser/compiler/caching/refinement or complexity claim. A qualified computation strategy must not import native truth as an axiom."

[[controls]]
id = "JC19-numeric_vs_analytic"
requirement = "Ordinary zeta comparisons and finitely sampled homotopies do not prove uniform analytic bounds or source identities."

[[controls]]
id = "JC20-full_acceptance"
requirement = "Audit every generated declaration, exact public type and transitive import/axiom/native dependency, preserving the entire predecessor target chain."
