[[hostile_controls]]
id = "same-arithmetic-source"
description = "The two original corrections agree by actual source decompositions and exact square casts, not by approximate values or equal dimensions."

[[hostile_controls]]
id = "retained-producer-blobs"
description = "All five selected producer blobs must remain byte-identical to the pinned producer. No unrelated kernel, documentation or workflow files are incorporated."

[[hostile_controls]]
id = "upper-square-and-exponent-coverage"
description = "Retain the right-square prime power and all occupied exponents. At stage two both eight and nine contribute."

[[hostile_controls]]
id = "literal-prime-count"
description = "Positive theta difference must feed the exact inherited Nat.Prime square count with strict endpoints."

[[hostile_controls]]
id = "strict-margin"
description = "A zero corrected margin cannot yield a positive count; equality in the total squared-error threshold permits one failure."

[[hostile_controls]]
id = "finite-versus-universal"
description = "Finite-set exclusion applies only to that set. The Legendre endpoint must retain complete prefix and every-input error and strict-margin premises."

[[hostile_controls]]
id = "shifted-endpoint-identity"
description = "Half-integer endpoint use must go through squareIncrement_eq_shifted without changing the original source inventory."

[[hostile_controls]]
id = "no-trust-promotion"
description = "Every inherited draft remains unreplayed. An integration import or successful static check does not create Lean acceptance."

[[hostile_controls]]
id = "complete-root-and-leaf-coverage"
description = "Audit all listed modules, inherited positive/hostile controls, exact elaborated types and transitive dependencies; root-only or missing results are not passes."

[acceptance]
requires_all_declared_modules = true
requires_exact_public_signatures = true
requires_explicit_failures_and_unavailable_checks = true
requires_named_downstream_blockers = true

[nonclaims]
claims = [
  "new prime-distribution estimate",
  "constructed explicit-formula approximation",
  "complete zero source or omitted-zero tail",
  "all-interval strict positive margin",
  "Legendre conjecture or another Landau conjecture",
  "Riemann hypothesis",
  "Lean execution, transitive audit or accepted replay",
  "merge or execution authority"
]
