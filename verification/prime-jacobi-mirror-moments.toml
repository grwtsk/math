# Arithmetic-only prime Jacobi graph: mirror, square, even moments and Gram.
# This suite imports ZERO zeta-zero data into the operator, and ZERO
# external RH theorem. Original source is Nat.nth Nat.Prime.
# Lean v4.34.1, pinned Mathlib d13f23...
# Run:
# python3 scripts/verify_prime_jacobi_moments.py
# python3 scripts/verify_frozen_prime_atlas.py \
#   --config verification/prime-jacobi-mirror-moments.toml \
#   --all-diagnostics --report /tmp/prime-jacobi-mirror-moments.json
#
# The new Lean proof bodies are SOURCE_PROOF_CANDIDATES until actually checked.
# The *general* inverse root-moment reconstruction is proved in the adjacent
# mathematical exposition, not yet fully formalized in Lean.
# No actual spectral xi determinant or independent RH proof is claimed.
format_version = 1
suite = "Arithmetic-only Jacobi mirror, square heat, spectral moments and Hankel Gram"
issue = "https://github.com/grwtsk/math/issues/1849"

[environment]
lean_toolchain = "leanprover/lean4:v4.34.1"
mathlib_revision = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[policy]
expected_theorems = 36
allowed_axioms = ["propext", "Classical.choice", "Quot.sound"]

[[module]]
name = "GRWTSK.Combinatorics.GraphTheory.PrimeJacobiParitySquare"
path = "GRWTSK/Combinatorics/GraphTheory/PrimeJacobiParitySquare.lean"
namespace = "GRWTSK.CombinatoricsAndDiscreteMathematics.GraphTheory.PrimeJacobiParitySquare"
git_blob = "3c94a4c6ea844125d20318bf1008db34079d2121"
theorems = [
  "alternatingSign_ne_zero",
  "alternatingSign_square_one",
  "knotWeight_support_successor",
  "alternatingSign_flip",
  "twist_involution",
  "twist_nonzero_at",
  "jacobi_twist_anticommutes",
  "jacobi_mirrored_eigenpair",
  "squareEnergy_eq_sum_sq",
  "squareEnergy_nonnegative",
  "squareEnergy_zero_iff_kernel",
  "jacobiSquare_twist_commutes",
]

[[module]]
