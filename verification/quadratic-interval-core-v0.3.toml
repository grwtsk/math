[[hostile_controls]]
id = "preserve-v02-hostile-controls"
description = "All v0.2 endpoint, exponent, cutoff, prime-filter, correction and source controls remain required; no prior file is changed."

[[hostile_controls]]
id = "reject-zero-quotient"
description = "kernel_zero and kernel_zero_ne_zero retain the nonzero removable value when a<b. kernel_eq_quotient requires z!=0."

[[hostile_controls]]
id = "positive-domain-and-integrability"
description = "The density and log-weighted density must be proved integrable on the positive compact domain. Totalized divergent integrals are not a substitute."

[[hostile_controls]]
id = "actual-parametric-derivative"
description = "hasDerivAt_kernel constructs local domination, measurability, and integrability for the true density. A supplied derivative certificate must not replace these proofs."

[[hostile_controls]]
id = "horizontal-growth-not-projection"
description = "Both exact parameters and centers obey explicit horizontal bounds. No projection to Re=1/2 is performed."

[[hostile_controls]]
id = "interval-and-height-bounds-distinct"
description = "The pole-free bound must coexist with the separate nonzero-parameter inverse-norm bound. Neither is an infinite-divisor tail."

[[hostile_controls]]
id = "retain-multiplicity-and-finite-scope"
description = "finite_enclosure_error is a finite-family estimate with exact natural weights; it does not certify zero identity, multiplicity, cutoff, or completeness."

[[hostile_controls]]
id = "separate-omitted-tail"
description = "finite_enclosure_error_with_tail requires a separate bound for the same full target and exact finite family. Missing tail data cannot become tail=0."

[[hostile_controls]]
id = "degenerate-and-unit-parameter"
description = "kernel_same, kernel_one and squareKernel_one fix zero-width and exact main-term behavior."

[[hostile_controls]]
id = "same-square-endpoint-source"
description = "The square application must reuse QuadraticIntervals.squareEndpoint and its exact width, without a new prime or prime-power source."

[[hostile_controls]]
id = "all-modules-types-and-trust"
description = "Reconcile every listed module, all public elaborated types and full transitive axioms. A root-only run or missing audit record is not acceptance."

[[hostile_controls]]
id = "no-numerical-or-target-promotion"
description = "Floating sanity checks are not interval certificates or Lean replay. No zero-divisor tail, cancellation estimate, Legendre or RH follows from this source increment."

[acceptance]
requires_all_declared_modules = true
requires_exact_public_signatures = true
requires_explicit_failures_and_unavailable_checks = true
requires_named_downstream_blockers = true

[nonclaims]
claims = [
  "independent Lean elaboration or kernel acceptance",
  "certified numerical evaluation or rounding",
  "zero-source identity, multiplicity or complete divisor",
  "omitted-zero tail or explicit formula",
  "moving-interval cancellation estimate",
  "Legendre conjecture or Riemann hypothesis"
]
