[[hostile_controls]]
id = "zero-exclusion"
require = "Liouville(0)=0, so the square-sign and proportional-product identities explicitly assume n>0."
[[hostile_controls]]
id = "nonproportional-necessity"
require = "The proportional pair n,2n has correlation exactly -1, not cancellation; never generalize a fixed nonproportional affine estimate to proportional forms."
[[hostile_controls]]
id = "integer-ordinary-averaging"
require = "All finite sums use ordinary uniform weights and exact 0-based/1-based conversion; no logarithmic average is imported."
[[hostile_controls]]
id = "even-cutoff-reindex"
require = "The adjacent correlation to cutoff 2*M decomposes into exactly two affine sums to cutoff M; no endpoint, orientation or factor-of-two is discarded."
[[hostile_controls]]
id = "sign-preserving-affine-decomposition"
require = "The two dyadic affine sums are added and then negated; no absolute values inside their signed sums."
[[hostile_controls]]
id = "determinant-nonzero"
require = "Affines (m+1,2m+1) and (m+1,2m+3) have coefficient determinants -1 and +1. Pair (m+1,2m+2) has determinant zero."
[[hostile_controls]]
id = "analytic-bounds-not-provided"
require = "The source gives a conditional absolute-value comparison only; its left/right affine cancellation bounds must be independently supplied before any arithmetic conclusion."
[[hostile_controls]]
id = "binary-not-full-order"
require = "Even independently verified two-point affine estimates do not control all higher-order nonempty Walsh correlations needed in #630."
[[hostile_controls]]
id = "scope-limited-literature"
require = "OpenAI result 007 is a 2026 external fixed-form scope record, not a locally imported theorem, growing-shift uniformity theorem, or RH-E02 supplier."

