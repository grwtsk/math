[[controls]]
id = "complete_cells"
obligation = "value_cases and hits_cell must retain every consecutive edge, its local endpoints and the final t=1 endpoint."

[[controls]]
id = "exact_ranges"
obligation = "polygon_range must identify the full old carrier, not a sampled set or only one inclusion."

[[controls]]
id = "schedule"
obligation = "Retain the initial pause and shared dyadic time schedule; do not substitute uniform quadrature weights."

[[controls]]
id = "source_endpoint"
obligation = "joined_source must identify the actual F composed with the separate domain polygon."

[[controls]]
id = "image_endpoint"
obligation = "joined_polygon must identify the literal external image polygon in the same order."

[[controls]]
id = "joint_continuity"
obligation = "Construct the global homotopy through the pinned concatenation; separate cell continuity is not a substitute."

[[controls]]
id = "both_closures"
obligation = "Closedness of every intermediate loop requires both checked domain and image closure equations."

[[controls]]
id = "initial_nonzero"
obligation = "n>0 is retained when transferring first-cell nonvanishing to the initial pause; generic empty concatenation is not contour evidence."

[[controls]]
id = "punctured_target"
obligation = "The full global homotopy and both endpoints must lift to the actual nonzero subtype."

[[controls]]
id = "moving_basepoint"
obligation = "Keep the exact basepoint formula. Free homotopy is not a fixed-endpoint Path.Homotopy."

[[controls]]
id = "opposite_constants"
obligation = "Nonzero endpoint loops at one and minus one do not certify their straight interpolation through zero."

[[controls]]
id = "source_enclosures"
obligation = "False values may pass a Boolean guard; the existing actual Enclosures premise remains required."

[[controls]]
id = "small_square"
obligation = "Compose the literal maintained square checks and F(1)=1 into square_contracts_without_zero; execute every inherited reduction before acceptance."

[[controls]]
id = "no_interior_exclusion"
obligation = "The identity-square boundary self-deformation does not remove its interior zero."

[[controls]]
id = "no_count_promotion"
obligation = "No winding, quotient-circle conversion, argument principle, K(15)<=1, complete inventory or RH is established here."
