[[acceptance_obligations]]
id = "R01"
requirement = "Elaborate the exact head and retain every inherited acceptance obligation."

[[acceptance_obligations]]
id = "R02"
requirement = "Reconcile exact public and generated types, all imports, axioms, native dependencies and proof-bearing packet fields."

[[acceptance_obligations]]
id = "R03"
requirement = "Preserve N included terms at 1 through N and terminal L=N+1, including the empty prefix."

[[acceptance_obligations]]
id = "R04"
requirement = "Derive the finite formula from actual riemannZeta and the independently specified omitted cell remainder with its minus sign."

[[acceptance_obligations]]
id = "R05"
requirement = "Retain every term of the finite complex derivative, including minus logarithms and the derivative of L/(s-1)."

[[acceptance_obligations]]
id = "R06"
requirement = "Derive the complete 1/(96 L^2) remainder on Re>=0, not a next-term or sampled tail estimate."

[[acceptance_obligations]]
id = "R07"
requirement = "Prove all-point disk containment and tail bounds before invoking Cauchy; never differentiate a pointwise magnitude inequality."

[[acceptance_obligations]]
id = "R08"
requirement = "Keep the Cauchy radius positive and <= Re(c); raw zeta evaluation requires c!=1 even though the analytic tail extends across one."

[[acceptance_obligations]]
id = "R09"
requirement = "Use the same exact integer bases and exponent -c for all included and terminal powers."

[[acceptance_obligations]]
id = "R10"
requirement = "Charge logarithm-product uncertainty in each finite derivative contribution, not only the power error."

[[acceptance_obligations]]
id = "R11"
requirement = "Charge finite value and slope accumulation rounding separately and add their distinct analytic tails once."

[[acceptance_obligations]]
id = "R12"
requirement = "Keep Cauchy radius, Newton radius, cutoff N, chart index and all numerical precision indices distinct."

[[acceptance_obligations]]
id = "R13"
requirement = "The Newton adapter constructs CenterEnclosures but does not construct a concrete passing packet or independent complete count."

[[acceptance_obligations]]
id = "R14"
requirement = "No raw joint rational checker, compiled executable, zero packet, useful complexity bound or universal precision guarantee is represented."

[[acceptance_obligations]]
id = "R15"
requirement = "Preserve canonical source identity, complete head, multiplicities, scaled omitted-zero tail, signed correction, proper powers and strict prime margins."

[[acceptance_obligations]]
id = "R16"
requirement = "Distinguish exact finite checks and symbolic identities from ordinary non-certified mpmath diagnostics and from all universal analytic proofs."
