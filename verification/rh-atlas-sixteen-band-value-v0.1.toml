[[hostile_controls]]
id = "live_dependency_identity"
requirement = "Use the pinned live cutoff-sixteen FifteenWitness, not the incompatible uncommitted cutoff-eight derivative draft. Prepared base9f5563d879b9b36ade9a32cf7569f461bcac6d4b. Reconcile every transitive module and exact theorem type."

[[hostile_controls]]
id = "actual_arithmetic_source"
requirement = "Keep poleNormalizedZeta, H(1)=1, the canonical target-zero predicate and the maintained root height. The finiteModel is the unchanged sextic model at N=8."

[[hostile_controls]]
id = "no_cutoff_saving_transfer"
requirement = "Use only the general sextic tail at sigma=1/2 and N=8. Never move cutoff-one or cutoff-two defect factors to eight."

[[hostile_controls]]
id = "fresh_center"
requirement = "The new center is3/4+31i/2, not3/4+27i/2. Reuse only the exact positive-base log records; recompute every center sample and error guard."

[[hostile_controls]]
id = "all_eight_terms"
requirement = "Retain every base1..8 in the finite sum, including the exact unit term and a separately charged extra use of the base8 power in the endpoint weight."

[[hostile_controls]]
id = "branch_and_log"
requirement = "Retain the principal complex power on each positive real base. Reuse each source-bound log enclosure of radius2^-24, not arbitrary log samples."

[[hostile_controls]]
id = "center_arithmetic"
requirement = "Check all eight finite128-term center exponential calculations, norm16 and exponent34 bounds, and sample radius2^-18. The finite Taylor expression is not the true exponential without its remainder."

[[hostile_controls]]
id = "spatial_remainder"
requirement = "Prove the CLOSED rectangle[1/2,1]x[15,16] lies in the centered radius5/8 disk. Retain the displacement real-part guard, order8, log perturbation and sample error."

[[hostile_controls]]
id = "coefficient_rounding"
requirement = "Check weight(center+w) and all14 convolution coefficients. Charge L1 rounding at2^-24 per complex coefficient and the full polynomial rounding radius2^-20, including rounded zero coefficients."

[[hostile_controls]]
id = "whole_region_products"
requirement = "Reprove |s+j|<=17 for j=-1..4 and |s+5|<=18 on the NEW region. All seven parameter factors and endpoint weight bound22 remain."

[[hostile_controls]]
id = "error_budget"
requirement = "The source radius contains17*sum(powerError)+22*powerError7+17^6*18/(30240*(11/2)*65536)+2^-20<=1/8. A value error is not a derivative error."

[[hostile_controls]]
id = "full_tensor_identity"
requirement = "All144 nonnegative integer coefficients must satisfy2^45*(-Re Q((1+u)/2+i(15+v))-7) in the degree11x11 unnormalized Bernstein basis. No coefficient-only or sampled positivity claim."

[[hostile_controls]]
id = "projection_sign"
requirement = "Use Re(H-Q)<=|H-Q| to obtain -Re H>=55/8. Reversing this sign or projecting a different model is invalid."

[[hostile_controls]]
id = "signed_band_scope"
requirement = "NoTargetZero_signedBand concerns15<=|root.heightAt|<=16 only. It is NOT noTargetZero for |height|<=16, and no height_gt_sixteen declaration is justified."

[[hostile_controls]]
id = "mirror_only_zeros"
requirement = "Transport actual zero locations by canonical critical reflection and conjugation. Do not infer equality of reflected H values, norms, derivatives, multiplicities or lists."

[[hostile_controls]]
id = "live_successor"
requirement = "Instantiate ZeroIsolation.FifteenWitness.window_sixteen_of_shell with the new ShellRH15 proof. Keep the earlier window zero-permitting."

[[hostile_controls]]
id = "mixed_cover"
requirement = "The explicit ZeroPermittingCover on[0,1]x[14,16] has count1, region fifteenBox with its actual capacity proof, and zeroFree upperBand. Every point and the height15 seam must be covered."

[[hostile_controls]]
id = "no_existence_or_count"
requirement = "A capacity bound and WindowRH16 do not construct a zero, a complete zero list, analytic multiplicity or an exact count."

[[hostile_controls]]
id = "homotopy_scope"
requirement = "The NEW path (1-t)*(-1)+t*H is nonzero only on the new band for0<=t<=1. Do not identify it with the preceding injective derivative homotopy."

[[hostile_controls]]
id = "analytic_not_topological"
requirement = "Joint continuity, complex differentiability and reciprocal differentiability are separate proofs. The reciprocal additionally consumes the established norm margin."

[[hostile_controls]]
id = "hostile_off_domain"
requirement = "The new polynomial projection bound fails at the ambient point1/2+14i. This is a model-certificate failure outside the domain, not a zeta-zero assertion."

[[hostile_controls]]
id = "next_unfilled_shell"
requirement = "WindowRH17 retains ShellRH16 as a premise. The all-height RH endpoint retains every higher shell. No uniform all-height margin or Weil/spectral comparison follows."

[[hostile_controls]]
id = "ordinary_kernel_trust"
requirement = "Require exact elaboration and transitive axiom audit; reject sorryAx and unreported native dependencies. Python rational checks, hashes and model identities are NOT a kernel replay."

[[hostile_controls]]
id = "no_execution_effects"
requirement = "This static target creates no worker, build process, operational receipt, execution authority, merge, issue closure or F06 release."
