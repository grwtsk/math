[[hostile_controls]]
id = "nonempty-roots"
requirement = "The normalized event and finite total-variation theorem require roots.card > 0; do not treat an empty sample as a probability."
status = "NOT_RUN"

[[hostile_controls]]
id = "full-event-supremum"
requirement = "Finite total variation is a supremum over every Boolean event of the finite alphabet, not a single selected pattern."
status = "NOT_RUN"

[[hostile_controls]]
id = "exact-exception-subset"
requirement = "An exceptional root set must be a named subset of the exact sample root identities."
status = "NOT_RUN"

[[hostile_controls]]
id = "all-coordinate-labels"
requirement = "Off-exception matching must preserve every selected Boolean coordinate of each named root."
status = "NOT_RUN"

[[hostile_controls]]
id = "empty-coordinate-alphabet"
requirement = "The selected coordinate set may be empty; the induced singleton Boolean pattern alphabet remains finite."
status = "NOT_RUN"

[[hostile_controls]]
id = "empty-exception"
requirement = "If exceptional roots are empty, the two complete empirical distributions are identical, not just one pattern."
status = "NOT_RUN"

[[hostile_controls]]
id = "boundary-fraction-not-zero"
requirement = "A finite bound |E|/|R| is not a limiting vanishing statement unless the ratio is independently controlled."
status = "NOT_RUN"

[[hostile_controls]]
id = "cyclic-seam-open"
requirement = "No cyclic modulo-N seam bound, exceptional-root construction, or growing-shift control has been supplied."
status = "NOT_RUN"

[[hostile_controls]]
id = "source-metadata-scope"
requirement = "The proof controls only selected Boolean labels; omitted jet, sector, geometric and multiplicity labels are not certified."
status = "NOT_RUN"

[[hostile_controls]]
id = "no-analytic-or-spectral-promotion"
requirement = "Finite TV says nothing by itself about Chowla, Liouville ergodicity, Bernoulli limits, GUE, zeta divisors, or RH."
status = "NOT_RUN"

[[hostile_controls]]
