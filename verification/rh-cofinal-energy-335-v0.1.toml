[[declarations]]
name = "GRWTSK.RiemannHypothesis.CCC.CofinalDamping.reciprocalDamping_drop"
kind = "theorem"
source_signature = '''
theorem reciprocalDamping_drop (n : ℕ) :
    reciprocalDamping n - reciprocalDamping (n + 1) =
      2 / (((n : ℝ) + 1) * ((n : ℝ) + 2))
'''

[[declarations]]
name = "GRWTSK.RiemannHypothesis.CCC.CofinalDamping.successor_density_identity"
kind = "theorem"
source_signature = '''
theorem successor_density_identity (n : ℕ) (u : ℝ) :
    Real.exp (-(reciprocalDamping (n + 1)) * u) * wholePickup u ^ 2 =
      Real.exp ((reciprocalDamping n - reciprocalDamping (n + 1)) * u) *
        (Real.exp (-(reciprocalDamping n) * u) * wholePickup u ^ 2)
'''

[[declarations]]
name = "GRWTSK.RiemannHypothesis.CCC.CofinalDamping.successor_membership_iff_extra_moment"
kind = "theorem"
source_signature = '''
theorem successor_membership_iff_extra_moment (n : ℕ) :
    reciprocalDamping (n + 1) ∈ pickupEnergyConvergenceSet ↔
      IntegrableOn (fun u : ℝ ↦
        Real.exp ((reciprocalDamping n - reciprocalDamping (n + 1)) * u) *
          (Real.exp (-(reciprocalDamping n) * u) * wholePickup u ^ 2)) (Ici 0)
'''

