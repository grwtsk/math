[[hostile_controls]]
id = "reject-real-stage-as-complex-module"
description = "Use the old W_k over C for complex sections and the actual old coefficient-ring map from R. Do not impose an unsupported C scalar action on the old real W_k."

[[hostile_controls]]
id = "reject-real-part-only-detection"
description = "Both real and imaginary components are required to detect a section and all six Cech inputs. An imaginary-only closure or mismatch cannot be erased."

[[hostile_controls]]
id = "reject-embedding-as-complete-complexification"
description = "The raw real-to-complex embedding is not declared surjective. The two-part assemble/realification equivalence supplies arbitrary complex coefficients."

[[hostile_controls]]
id = "reject-unbound-complex-port"
description = "Use the previous complex stageEquiv with the inverse-ab witness mapped from the same real source. Prove whole-vector and both-component agreement."

[[hostile_controls]]
id = "reject-rounded-cubic-root"
description = "Construct omega=(-1+i sqrt(3))/2 and prove its cube, nontriviality and unit norm exactly; rounded SVG or floating data are not hypotheses."

[[hostile_controls]]
id = "reject-phase-source-relabeling"
description = "Encode/decode with sourcePhase(j)=omega^j at the SAME label j. Reflection or displayed cyclic order cannot silently change the source index."

[[hostile_controls]]
id = "reject-phase-c3-as-geometric-translation"
description = "Cubic scalar badges are not a C3 action by the geometric two-torsion translation, which remains period two."

[[hostile_controls]]
id = "reject-raw-vertices-as-normalized-data"
description = "Raw.sections must be phase-decoded before delta0, tree subtraction, mismatch or GlueFiber checks. Raw.transitions remain normalized edge data."

[[hostile_controls]]
id = "reject-unrotated-edges"
description = "Global oscillator rotation acts on all three normalized vertices AND all three transitions. Rotating vertices alone generally breaks exact matching."

[[hostile_controls]]
id = "reject-angle-as-heat-time"
description = "wave(angle,tau,data) has independent angle and heat arguments. Angle may be Omega*t_wave; it is not tau or a geometric return parameter."

[[hostile_controls]]
id = "reject-cycle-with-heat-drift"
description = "The angle-plus-2pi equality holds at fixed tau. Advancing heat during a displayed cycle need not return the normalized state."

[[hostile_controls]]
id = "reject-normSq-as-real-square"
description = "Use sum of Complex.normSq of the old complex basis coefficients, equal to the sum of BOTH real coefficient energies."

[[hostile_controls]]
id = "reject-mismatch-energy-as-corrected-defect"
description = "The corrected-frame D is the sum of the two previous real defects. The separately named mismatchEnergy is the norm of delta0(z)-a, not D."

[[hostile_controls]]
id = "reject-unit-phase-as-arithmetic-preservation"
description = "A unit complex norm does not imply rational or integer-lattice preservation. Omega has positive imaginary part; previous index and denominator costs remain."

[[hostile_controls]]
id = "reject-finite-time-complex-exactification"
description = "Rotation and finite-time exponential attenuation are nonzero. Matching and GlueFiber inhabitedness cannot first appear at a finite heat time or phase-cycle endpoint."

[[hostile_controls]]
id = "reject-complexification-as-metric-cost-removal"
description = "Retain E(f)<=E(L_k f)<=(ab)^(2k)E(f) only under the old ab>=1 hypothesis. Complex realization and unit phase badges do not erase weighted transport costs."

[[hostile_controls]]
id = "reject-complex-coefficient-heat-as-hodge"
description = "Both components use the declared real tree-fixed coefficient flow. No intrinsic Hodge/Dolbeault generator, geometric overlap or complete H0 space follows."

[[hostile_controls]]
id = "reject-unelaborated-wave-as-acceptance"
description = "Exact finite algebraic tests do not elaborate Lean, check public types, audit the transitive trust closure or verify continuous raw-wave/ODE statements not supplied here."

[acceptance]
requires_all_declared_modules = true
requires_exact_public_signatures = true
requires_explicit_failures_and_unavailable_checks = true
requires_named_downstream_blockers = true
requires_root_import_unchanged = true
requires_hostile_controls = true
requires_axiom_audit = true
requires_runtime_safety_scan = true

[nonclaims]
claims = [
  "Lean elaboration, kernel acceptance, transitive trust acceptance or external replay",
  "replacement or execution of historical targets and hostile controls",
  "a complex scalar action on the old real-only stage",
  "a C3 geometric torsion translation or a billiard/elliptic return theorem",
  "an intrinsic Hodge, arithmetic Markov or infinite-dimensional heat operator",
  "geometric Cech covers, complete H0 or globally glued integral model lattices",
  "rational or integral-lattice preservation under arbitrary complex phase rotation",
  "a norm isometry for the unnormalized Frey weighted lift",
  "equality of mismatch energy and corrected common-frame defect energy",
  "exact gluing created at finite heat time or after one full phase cycle",
  "joint continuous/ODE packaging of Raw waveforms beyond the supplied scalar rotation continuity and previous real heat statements",
  "completion coefficient-base-change, conductor or characteristic-two classification",
  "uniform arithmetic height, radical-excess, abc or RH results",
  "execution, workflow, worker, merge, issue closure or target promotion authority"
]
