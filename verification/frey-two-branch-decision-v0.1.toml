[[hostile_controls]]
id = "reject-nonprimitive-extension"
description = "The prior scale budget uses primitivity. Nonprimitive (4,60,64) can remove24 and is not in this source type."

[[hostile_controls]]
id = "reject-depth-guard-loss"
description = "The c6 congruence is combined with16|abc. Source(1,7,8) satisfies the congruence but admits no scale step by the strict discriminant window."

[[hostile_controls]]
id = "reject-invariant-sign-loss"
description = "Retain raw c6=-32(b-a)(2a+b)(a+2b). The sign distinguishes the two high-depth branches."

[[hostile_controls]]
id = "reject-cancellation-in-quotient"
description = "Cancel32 in the injective characteristic-zero realization BEFORE applying the mod8 ring hom. 32 is zero modulo8 and cannot be cancelled there."

[[hostile_controls]]
id = "reject-mod8-field"
description = "ZMod8 is a ring with zero divisors. Only local units have square/sixth power one."

[[hostile_controls]]
id = "reject-residue-of-nonintegral-rational"
description = "Construct the residue map by localization at odd denominators. There is no unital reduction Q->ZMod8 and no image of1/2."

[[hostile_controls]]
id = "reject-rational-unit-for-local-unit"
description = "Scale exponent1 is normalized as2 times a local unit using equality of actual normalized valuations. Nonzero alone is insufficient."

[[hostile_controls]]
id = "reject-restricted-shifts"
description = "Necessity covers every locally integral admissible change and unrestricted translations/shears, including odd denominators."

[[hostile_controls]]
id = "reject-missing-coefficients"
description = "All five target coefficients must be locally integral. Invariant congruences alone are not integrality certificates."

[[hostile_controls]]
id = "reject-finite-source-promotion"
description = "The256-case residue theorem is explicitly transferred through the quotient homs to arbitrary sources. Bounded source tests do not prove universal minimality."

[[hostile_controls]]
id = "reject-failed-search-additive"
description = "Raw minimality on the complement is proved through the invariant obstruction and equality with an actual minimum, not failure of a candidate search."

[[hostile_controls]]
id = "reject-label-permutation"
description = "The ordered source is retained. Swapping a,b preserves j but can change prime-two reduction type for these rational Frey models."

[[hostile_controls]]
id = "reject-natural-subtraction"
description = "The b-a guard uses signed integer subtraction. The valid even-a family includes negative k."

[[hostile_controls]]
id = "reject-raw-target-confusion"
description = "Semistable predicates are on the explicit selected changed curve. Raw minimal/additive predicates apply exactly on the complement."

[[hostile_controls]]
id = "reject-conductor-promotion"
description = "Good/multiplicative/additive type is not a conductor exponent, Kodaira symbol, Tamagawa number, splitness or completed-local theorem."

[[hostile_controls]]
id = "reject-port-isometry"
description = "Selecting integral minimal equation coefficients does not make old marked affine points, section/jet lattices or weighted ports integral isometries."

[[hostile_controls]]
id = "reject-height-promotion"
description = "The same j is retained, with previous height, denominator, index and gauge costs. No uniform radical-height, ABC or RH estimate is supplied."

[[hostile_controls]]
id = "reject-static-acceptance"
description = "Source scripts, finite tables and standalone checks are not Lean elaboration, exact-signature acceptance or transitive trust audit. This target grants no execution authority."

[acceptance]
requires_all_declared_modules = true
requires_exact_public_signatures = true
requires_explicit_failures_and_unavailable_checks = true
requires_named_downstream_blockers = true
requires_root_import_unchanged = true
requires_hostile_controls = true
requires_axiom_audit = true
requires_runtime_safety_scan = true

[nonclaims]
claims = [
  "Lean parsing, elaboration, kernel or transitive trust acceptance",
  "execution or acceptance of historical replay targets or hostile fixtures",
  "a bounded search proving the all-changes obstruction or minimality",
  "an arbitrary Q-to-ZMod8 reduction or a field structure on ZMod8",
  "a general Tate algorithm, Kodaira, conductor, Ogg, Tamagawa or splitness calculation",
  "a global minimal equation or completed-local realization",
  "integral marked-point, section or jet-lattice transport",
  "choice elimination from inherited existence proofs or a compiled Lean decision program",
  "complete H0, intrinsic Hodge, adelic or Faltings height comparison",
  "cancellation of previous weighted-map, denominator, index or gauge costs",
  "uniform radical-height estimates, ABC or RH",
  "workflow dispatch, worker/F06 action, external replay, merge or closure authority"
]
