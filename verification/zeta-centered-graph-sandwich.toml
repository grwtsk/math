# Zeta-centered graph-layer structural theorem proof candidates.
# Source identities below are exact Git blobs. Source publication != Lean proof.
# User command:
# python3 scripts/verify_frozen_prime_atlas.py --config verification/zeta-centered-graph-sandwich.toml --all-diagnostics --report /tmp/zeta-centered-graph-sandwich.json
# Standalone finite countermodel (no analytic zero oracle):
# python3 scripts/verify_zeta_graph_sandwich_finite.py
#
# No source-zero existence is postulated: ZetaZeroCenter carries an
# actual riemannZetaZeros membership witness when constructed.
# SignedSource return requires independent original source premises.
# No unconditional RH/GRH, spectral determinant, or Weil positivity.
format_version = 1
suite = "Actual Zeta-Zero Source Centers and Certified Layered Graph Sandwiches"
issue = "https://github.com/grwtsk/math/issues/1847"

[environment]
lean_toolchain = "leanprover/lean4:v4.34.1"
mathlib_revision = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[policy]
expected_theorems = 21
allowed_axioms = ["propext", "Classical.choice", "Quot.sound"]

[[module]]
name = "GRWTSK.Combinatorics.GraphTheory.ZetaCenteredLayerSandwich"
