[[controls]]
id = "R01"
requirement = "Critical reflection is exactly 1-conj(z), not 1-z or conjugation alone."

[[controls]]
id = "R02"
requirement = "Fixed-point real part is exactly one-half; set invariance alone is not pointwise invariance."

[[controls]]
id = "R03"
requirement = "Same closed disk is preserved only with exact center-on-line proof; retain non-strict boundary inclusion."

[[controls]]
id = "R04"
requirement = "Local uniqueness quantifies over every actual canonical point in that disk, not a numerical record list."

[[controls]]
id = "R05"
requirement = "Off-line reflected pair in one disk must remain two distinct points; no projection or deduplication."

[[controls]]
id = "R06"
requirement = "Simple multiplicity comes from actual analytic order and nonzero derivative, not distinct-point uniqueness."

[[controls]]
id = "R07"
requirement = "Conjugation transports both point and center; negative point has derived order one via input/output conjugate derivative."

[[controls]]
id = "R08"
requirement = "Distinctness of conjugates requires the nonreal hypothesis; absolute height is not a point-identity key."

[[controls]]
id = "R09"
requirement = "Literal old center, radii, finite evaluator and source-remainder tolerances remain exactly unchanged."

[[controls]]
id = "R10"
requirement = "The geometric ordinate interval is not a new evaluated accuracy improvement or ordinal-zero assertion."

[[controls]]
id = "R11"
requirement = "Count conclusion is 2 <= heightCount(15) in the existing BOTH-SIGN closed normalization, not the reverse inequality."

[[controls]]
id = "R12"
requirement = "A symmetric synthetic ambient set can have a unique local line point and additional off-line points outside the disk."

[[controls]]
id = "R13"
requirement = "No all-height, bounded-head exclusion, complete inventory, zero-divisor tail or prime-margin conclusion is exported."

[[controls]]
id = "R14"
requirement = "Inherited large exact finite decisions and all analytic scripts must elaborate with the pinned transitive trust closure; source existence is not a receipt."
