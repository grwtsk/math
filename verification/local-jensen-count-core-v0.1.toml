[controls]
obligations = [
  "Finite support must be proved before replacing a full integer divisor finsum with a finite sum.",
  "Actual analytic order is identified with canonical positive finite multiplicity before mapping to integers.",
  "Distinct complex points with the same absolute height remain separate records.",
  "Both signed bands are covered; open-lower and closed-upper local cutoffs are retained.",
  "The center must be nonzero and its modulus cannot be omitted from Jensen.",
  "Inner radius is positive and strictly smaller than the outer radius.",
  "At N=0 and N=1 the radius-three disk contains the zeta pole; analytic application starts at N>=2.",
  "Jensen permits outer-circle zeros; no contour zero-avoidance premise is inserted.",
  "Inner-boundary zeros are included with full analytic multiplicities.",
  "Source circle ceilings and quantitative anchor floors are explicit inputs, not derived from sampled values.",
  "Bounds for finite local principal sums do not bound a freely varying analytic regular term.",
  "No polynomial circle-growth, full logarithmic-derivative rate, contour decay or arithmetic prime margin is supplied.",
]
