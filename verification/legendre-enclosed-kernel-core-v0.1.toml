[[hostile_controls]]
id = "signed-remainder-retained"
description = "One-sided remainderLower <= remainder.re is sufficient for existence and retains favorable sign."

[[hostile_controls]]
id = "no-implicit-two-sided-tail"
description = "A real-part lower bound does not bound the complex norm or imaginary part of the remainder."

[[hostile_controls]]
id = "complete-source-identity-required"
description = "hsource must be proved for the literal squareIncrement and selected finite sum. A definition by subtraction does not supply a useful bound."

[[hostile_controls]]
id = "included-is-not-complete"
description = "Empty finite families or zero coordinate radii imply no theorem about the omitted divisor."

[[hostile_controls]]
id = "exact-multiplicity-and-index"
description = "Use the identical index set and multiplicities for actual and center sums. Wrong, duplicate or missing records are not priced by coordinate radii."

[[hostile_controls]]
id = "evaluation-is-separate"
description = "The finite center-sum evaluation bound is distinct from parameter enclosure and correction evaluation."

[[hostile_controls]]
id = "imaginary-defect"
description = "The two-sided full budget must bound the computed imaginary defect; real projection alone is not complex equality."

[[hostile_controls]]
id = "strict-corrected-margin"
description = "Retain the inherited proper-prime-power budget and strict positivity before extracting a prime."

[[hostile_controls]]
id = "global-quantifiers"
description = "A complete finite prefix and every-input lower bounds and margins remain separate premises."

[[hostile_controls]]
id = "all-source-closure"
description = "Require all inherited/producer/new declarations and transitive trust closure; no root-only PASS or parent receipt substitution."

[acceptance]
requires_all_declared_modules = true
requires_exact_public_signatures = true
requires_explicit_failures_and_unavailable_checks = true
requires_named_downstream_blockers = true

[nonclaims]
