visibility = "private"
kind = "theorem"
source_signature = """private theorem square_finset_sum_eq_diagonal_add_orderedPair
    (s : Finset ℕ) (f : ℕ → ℝ) :
    (∑ n ∈ s, f n) ^ 2 =
      (∑ n ∈ s, f n ^ 2) +
        ∑ a ∈ s, ∑ b ∈ s,
          if a = b then 0 else f a * f b"""
