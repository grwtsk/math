[[hostile_controls]]
id = "reject-missing-a-congruence"
description = "The chamber requires a=4k+1. At (3,13,16), the same half-change has nonintegral a2; do not swap labels or twist the source silently."

[[hostile_controls]]
id = "reject-missing-c-divisibility"
description = "The chamber requires c=16n. At (1,7,8), a4=1/2 after the same change is not integral at two."

[[hostile_controls]]
id = "reject-model-identity-confusion"
description = "Reduction predicates apply to changedCurve, whose equality to the new integral model is proved. They do not assert raw-model minimality."

[[hostile_controls]]
id = "reject-field-unit-as-local-unit"
description = "Scale two is a unit of Q, not of Z_(2). This is an admissible rational change, not an integral automorphism of local coefficient lattices."

[[hostile_controls]]
id = "reject-omitted-shear"
description = "Retain scale, root translation, and y shear: x=4X+a,y=8Y+4X. Changing only scale or root invalidates all-five-coefficient agreement."

[[hostile_controls]]
id = "reject-fitted-curve"
description = "Construct changedCurve as the explicit old freyCurve variable change and prove integral/local base-change agreement before minimality."

[[hostile_controls]]
id = "reject-two-support-as-bad-locus"
description = "At (1,15,16) the changed discriminant is225, a unit at two even though two divides abc. The odd-prime equivalence cannot extend without exceptions."

[[hostile_controls]]
id = "reject-all-chamber-good"
description = "At (1,31,32) the minimal discriminant exponent at two is2, so the chamber includes multiplicative as well as good cases."

[[hostile_controls]]
id = "reject-discriminant-as-conductor"
description = "The exact minimal equation depth is2v2(n)=2v2(c)-8. No conductor, Ogg formula, splitness, or Tamagawa invariant is constructed."

[[hostile_controls]]
id = "reject-depth-compression"
description = "The unit-source subfamily n=2^m retains depth2m. A model change subtracts a fixed12 from raw depth, not arbitrary prime powers."

[[hostile_controls]]
id = "reject-integrality-of-all-marked-affine-ports"
description = "The inverse sends old (0,0) to(-a/4,a/8), nonintegral affine coordinates at two for odd a. Do not infer integral section/jet transport."

[[hostile_controls]]
id = "reject-completion-identification"
description = "Reuse the actual localization Z_(2) inside Q. Do not identify it with completed Z_2 or Q_2."

[[hostile_controls]]
id = "reject-singular-parameter-classification"
description = "Generic integer half-scale identities allow n=0; primitive source reduction requires n>0 and the old elliptic curve. Tests flag singular generic cases separately."

[[hostile_controls]]
id = "reject-finite-search-as-universal-proof"
description = "Bounded competitor tests are not the all-admissible-changes minimality theorem. The latter is consumed from the prior unit-c4 criterion."

[[hostile_controls]]
id = "reject-full-two-adic-classification"
description = "No classification is supplied for sources outside a%4=1 and16|c. The complement must remain unavailable rather than being called additive."

[[hostile_controls]]
id = "reject-acceptance-and-height-promotion"
description = "Source scripts, exact arithmetic checks, j invariance, and minimality do not establish Lean acceptance, intrinsic Hodge estimates, or uniform radical-height bounds."

