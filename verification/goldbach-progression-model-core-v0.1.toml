diagnostic_scope = "Exact rational residue fibres, totient cardinalities, normalized finite phase coefficients, group-ring model-plus-discrepancy reconstruction, quadratic difference-of-squares residuals, L1 error transfer, and exact rational three-lift clipping measure budgets; not Lean execution, analytic integration, a prime-progression estimate, or a Goldbach estimate."

[[hostile_controls]]
id = "noncoprime-main-zero"
description = "The canonical main term vanishes on a non-reduced residue, while the exact prime-log residue sum need not vanish."

[[hostile_controls]]
id = "prime-dividing-modulus-discrepancy"
description = "At N=2, q=2, r=0, beta=0, the exact discrepancy is log 2; a zero residue-error budget must fail."

[[hostile_controls]]
id = "finite-model-not-estimate"
description = "The model-plus-discrepancy identity defines the discrepancy but supplies no bound for it."

[[hostile_controls]]
id = "no-residual-cancellation"
description = "Residue and arc residuals are aggregated only by triangle inequalities."

[[hostile_controls]]
id = "coarse-measure-budget"
description = "The six-radius clipped-arc measure budget can exceed one and is not claimed sharp."

[[hostile_controls]]
id = "bookkeeping-not-witness"
description = "Exact progression-model bookkeeping can coexist with a zero exact Goldbach count."

[[hostile_controls]]
id = "strict-combined-margin"
description = "Equality between the complete error budget and model lower bound cannot pass."

