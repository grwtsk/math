[[hostile_controls]]
id = "reject-length-two-as-second-jet"
description = "The old dual algebra kills epsilon squared; the actual parameter quotient by T cubed retains its nonzero square."

[[hostile_controls]]
id = "reject-fixed-ansatz-only"
description = "Use the quotient normal form and truncate_fiber to include every lift of the given first jet, not only one attempted correction."

[[hostile_controls]]
id = "reject-refitted-model"
description = "Reconcile all five OLD integerModel coefficients before testing the actual curve Equation."

[[hostile_controls]]
id = "reject-refitted-first-jet"
description = "Use OLD binaryReduction and special_coordinates. The retained collision is X=0,Y=epsilon."

[[hostile_controls]]
id = "reject-singular-vertical-recursion"
description = "At B=0 the exact residual is epsilon squared for every quadratic correction. Splitness does not remove it."

[[hostile_controls]]
id = "reject-all-singular-directions-fail"
description = "A split binary node has liftable nonzero directions (1,0) and (1,1); only the specified vertical direction is universally obstructed."

[[hostile_controls]]
id = "reject-nonsplit-rational-directions"
description = "A nonsplit binary node has no nonzero second-liftable direction over F2; extension fields are not silently identified with F2."

[[hostile_controls]]
id = "reject-nonzero-as-unit"
description = "Over general coefficient rings B must be a unit, not merely nonzero; test B=2 in ZMod4."

[[hostile_controls]]
id = "reject-drop-quadratic-correction"
description = "For normalized Y=T the smooth lift requires X=T squared divided by B; X=0 is generally not a second-order solution."

[[hostile_controls]]
id = "reject-full-jet-uniqueness"
description = "The second X-coefficient is fixed; the second Y-coefficient is free. Do not assert a unique full lift without parameter normalization."

[[hostile_controls]]
id = "reject-cubic-equation-as-quadratic"
description = "The exact full residual has a displayed T cubed tail. Vanishing modulo T cubed does not mean an exact polynomial arc."

[[hostile_controls]]
id = "reject-nonunit-reparametrization"
description = "Replacing T by 2T changes the prescribed first jet modulo2 and cannot discharge its lifting obligation."

[[hostile_controls]]
id = "reject-even-denominator-reduction"
description = "An even rational denominator cannot be reduced into F2. Use genuine LocalRing2 units."

[[hostile_controls]]
id = "reject-gap-jacobian-cost-swap"
description = "The prior evaluation denominator is absolute delta; the new normalized quadratic coefficient denominator is absolute selected a4. They are different maps."

[[hostile_controls]]
id = "reject-radical-denominator-clearing"
description = "Retain selected a4 divisibility with full multiplicity. Radical support does not clear 1/4 using2."

[[hostile_controls]]
id = "reject-odd-factor-erasure"
description = "2B=delta(1+4A-8delta). The second factor is a dyadic unit but its odd global prime factors remain."

[[hostile_controls]]
id = "reject-sign-and-domain-loss"
description = "Keep negative even-a gaps, OLD Descends, all original labels and the excluded raw-complement domain."

[[hostile_controls]]
id = "reject-special-rank-as-global-height"
description = "Increasing the parameter-algebra length is not a uniform observation-height estimate or full section-rank theorem."

[[hostile_controls]]
id = "reject-intrinsic-jet-identification"
description = "The parameter algebra and curve-valued lifts are actual; no full intrinsic principal-parts sheaf, geometric atlas or all-order smoothness theorem is claimed."

[[hostile_controls]]
id = "reject-source-as-kernel-acceptance"
description = "All scripts remain unelaborated; bounded arithmetic and static source checks do not establish Lean acceptance."

[acceptance]
source_status = "SOURCE_ONLY_NOT_RUN_NOT_KERNEL_AUDITED"
requires_exact_head_elaboration = true
requires_public_signature_comparison = true
requires_all_declared_modules = true
requires_all_hostile_controls = true
requires_transitive_trust_acceptance = true

[nonclaims]
no_lean_acceptance = true
no_intrinsic_principal_parts_equivalence = true
no_all_order_arc_lifting = true
no_geometric_cover = true
no_conductor_or_neron_model = true
no_uniform_source_height_bound = true
no_abc_or_rh = true
