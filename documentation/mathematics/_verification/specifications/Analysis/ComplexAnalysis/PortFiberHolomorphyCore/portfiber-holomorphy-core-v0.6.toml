[nonclaims]
claims = [
  "construction of the arithmetic-to-elliptic map B_n",
  "global elliptic or Poncelet comparison theorem",
  "global holomorphic gluing from local extendability without an additional theorem",
  "complete explicit formula",
  "convergence to the Weil form",
  "Weil positivity",
  "proof or refutation of the Riemann Hypothesis",
  "automatic continuity of arbitrary ring homomorphisms",
  "holomorphy inferred from continuity",
  "automatic residual discharge from local port certification",
  "classification of an unresolved local obligation as mathematically false"
]
