[declarations]
requires_all_public_in_listed_modules = true
requires_full_transitive_import_closure = true

[[hostile_controls]]
id = "dyadic-source-identity"
description = "Check t=2^k*r and log t=k*log 2+log r from the actual inputs, not a named approximate relation."

[[hostile_controls]]
id = "reduced-domain-guard"
description = "wrong_scale_control and unreduced_radius_control retain the upper guard for the quarter-radius estimate."

[[hostile_controls]]
id = "positive-log-grids"
description = "L2 and Lr must be positive for the enclosures, with positive ordered grids inherited from the parent."

[[hostile_controls]]
id = "shared-log-two"
description = "power_radius and shared_log_two_error_control charge k times the shared error; unit mantissa does not make this channel vanish."

[[hostile_controls]]
id = "dyadic-boundary"
description = "scale_boundary_consistent must retain exact center/radius equality for adjacent valid scales at powers of two with equal grids."

[[hostile_controls]]
id = "real-ray-domain"
description = "norm_exp_ray_sub_le requires Re(a)<=0 and both real inputs nonnegative; positive_real_part_control excludes an unguarded extension."

[[hostile_controls]]
id = "nonnegative-computed-center"
description = "grid_logCenter_nonneg and reducedLogCenter_nonneg derive the center sign instead of assuming a generic signed log enclosure."

[[hostile_controls]]
id = "literal-exponential-tail"
description = "reducedNodeBound bounds the approximate exponent and the literal B/(M+1)<=1/2 guard remains required. Empty truncation is not zero error."

[[hostile_controls]]
id = "no-coordinate-projection"
description = "Both components enter q. Centers with Re(z)>1 cannot use density_reduced_node_error merely because the intended zeros are elsewhere."

[[hostile_controls]]
id = "node-and-mesh-distinct"
description = "The new node theorem supplies existing kernel_sample_error. Mesh error remains and the Re(z)<=2 arithmetic mesh bound is only used under Re(z)<=1."

[[hostile_controls]]
id = "weighted-local-arithmetic"
description = "Zero initialization and each local weighted-term error remain required; missing arithmetic evidence is not zero error."

[[hostile_controls]]
id = "inherited-controls"
description = "All parent exact-endpoint, multiplicity, empty-grid, empty-Taylor, incorrect-sample and transitive-trust controls remain required."

[[hostile_controls]]
id = "no-source-tail-promotion"
description = "Finite evaluation does not identify any parameter as a zero or supply a complete explicit formula, divisor tail, or strict prime margin."

[acceptance]
requires_all_declared_modules = true
requires_exact_public_signatures = true
requires_explicit_failures_and_unavailable_checks = true
requires_named_downstream_blockers = true
requires_inherited_source_replay = true

[nonclaims]
claims = [
  "Lean elaboration, independent review approval or transitive kernel acceptance",
  "qualified rational/floating executable evaluator or serializer",
  "exponential range reduction or uniform all-height precision/cost estimate",
  "parameter identity, multiplicity, complete arithmetic source or omitted-divisor tail",
  "useful all-input prime margins, Legendre or Riemann hypothesis",
  "worker qualification, F06 release, execution, deployment or merge authority"
]
