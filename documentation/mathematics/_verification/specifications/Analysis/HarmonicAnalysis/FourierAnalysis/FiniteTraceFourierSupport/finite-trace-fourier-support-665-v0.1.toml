[[hostile_controls]]
id = "zero-modulus-rejected"
requirement = "No q=0 character average; NeZero q is consumed from the inherited finite alias theorem."
status = "NOT_RUN"

[[hostile_controls]]
id = "radius-nonnegative"
requirement = "The Fourier support radius B is supplied and nonnegative; no unbounded or sign-changed interval is silently accepted."
status = "NOT_RUN"

[[hostile_controls]]
id = "positive-length-floor"
requirement = "The uniform delta satisfies delta>0; delta=0 must not support a strict n>K inequality."
status = "NOT_RUN"

[[hostile_controls]]
id = "length-floor-source-bound"
requirement = "For every actual primitive candidate in the supplied finite family, delta <= length(gamma) is an explicit premise."
status = "NOT_RUN"

[[hostile_controls]]
id = "cutoff-inequality-direction"
requirement = "Require B <= K*delta, not K*delta <= B or only K>0."
status = "NOT_RUN"

[[hostile_controls]]
id = "cutoff-equality-strict-next"
requirement = "Even when B = K*delta, the next iterate n>K must be strictly beyond the support radius."
status = "NOT_RUN"

[[hostile_controls]]
id = "no-unsupplied-fourier-support"
requirement = "Out-of-support vanishing is a named premise, not inferred from test-function naming or smoothness."
status = "NOT_RUN"

[[hostile_controls]]
id = "only-positive-iterate-frequencies"
requirement = "One-sided upper support suffices because n*length>0 on selected candidate/positive-iterate terms; no bilateral Fourier support claim."
status = "NOT_RUN"

[[hostile_controls]]
id = "iterate-source-identity"
requirement = "Omitted terms retain ordered pair (primitive candidate ID, positive iterate index) and may not be quotiented by length or homology."
status = "NOT_RUN"

[[hostile_controls]]
id = "omitted-source-interval"
requirement = "Any a in omittedSources(K,M) must satisfy K<a.2<=M and a.1 in the selected candidate family."
status = "NOT_RUN"

[[hostile_controls]]
id = "finite-not-infinite-tail"
requirement = "Zero omittedMass(K,M) says nothing about unknown primitive candidates or the infinite Selberg trace tail."
status = "NOT_RUN"

[[hostile_controls]]
id = "alias-not-cutoff"
requirement = "Zeroing omittedMass does not zero modular aliasMass or identify finite q-torsion with continuous Haar."
status = "NOT_RUN"

[[hostile_controls]]
id = "uniform-genus-systole-not-inferred"
requirement = "A lengthFloor for one candidate family is not automatically a uniform systole over growing genus or all moduli space."
status = "NOT_RUN"

[[hostile_controls]]
id = "zero-cutoff-conditional"
requirement = "K=0 is accepted only under B<=0*delta; with B>=0 this forces B=0 and out-of-support vanishing for positive arguments."
status = "NOT_RUN"

[[hostile_controls]]
id = "empty-source-degenerate"
requirement = "Empty primitiveCandidates does not manufacture a geometric surface, spectral trace or RH statement."
status = "NOT_RUN"

[[hostile_controls]]
id = "toy-nonvacuous-success"
requirement = "The explicit toy certificate with length 1 and radius 2 must accept cutoff K=2."
status = "NOT_RUN"

[[hostile_controls]]
id = "toy-insufficient-cutoff"
requirement = "The same toy must reject K=1 and show the excluded second iterate has nonzero Fourier test value."
status = "NOT_RUN"

[[hostile_controls]]
id = "toy-not-smooth-geometric"
requirement = "The discontinuous toy Fourier test is a finite algebra fixture, not a smooth admissible Selberg test."
status = "NOT_RUN"

[[hostile_controls]]
id = "no-geometric-source"
requirement = "No actual marked compact hyperbolic surface, primitive geodesic enumeration, orientation or homology certificate is supplied."
status = "NOT_RUN"

[[hostile_controls]]
