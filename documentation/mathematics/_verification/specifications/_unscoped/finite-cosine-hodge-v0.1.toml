[[hostile_controls]]
id = "time-sign-and-generator"
must_preserve = "Forward Hodge time s corresponds to de Bruijn time -s. Damping is exp(-s*u^2), and the time derivative has multiplier -u^2."

[[hostile_controls]]
id = "zero-time-and-zero-frequency"
must_preserve = "Zero time has multiplier one. Frequency zero is allowed and has eigenvalue zero; no theorem may insert a strict positive eigenvalue hypothesis."

[[hostile_controls]]
id = "nonnegative-time-contractivity"
must_preserve = "The scalar contraction and coefficient perturbation theorems require 0 <= s. Multiplier positivity alone holds for every real s and does not imply contraction at negative s."

[[hostile_controls]]
id = "exact-original-source-coefficients"
must_preserve = "Retain both supplied coefficients a,b, frequencies u,v, and their same readout z. The finite source_identity is derived from definitions; source_separation consumes the supplied identity as written."

[[hostile_controls]]
id = "derivative-coordinates"
must_preserve = "Time differentiation varies only s; spatial differentiation varies only z. The exact finite heat equation compares the actual two-mode time derivative and actual derivative of its first spatial derivative."

[[hostile_controls]]
id = "complete-error-budget"
must_preserve = "Source, quadrature, omitted tail and rounding remain distinct named components. The full bound consumes all four absolute-error hypotheses; nonnegative components are required only where stated."

[[hostile_controls]]
id = "pointwise-versus-integrated-tail"
must_preserve = "finiteCosineTailBound is a pointwise bound. ExponentialTailIntegralCertificate and ThetaTailSupplier retain actual integral_le_budget and tail_le_exponential as supplied proof fields; no integrability or integral estimate is manufactured."

[[hostile_controls]]
id = "positive-decay-denominator"
must_preserve = "exponentialTailBudget is C*exp(-c*U)/c. Nonnegativity and antitone budget conclusions retain 0 <= C and 0 < c exactly as stated; denominator zero is not silently accepted."

[[hostile_controls]]
id = "theta-source-normalization"
must_preserve = "The literal theta term retains both polynomial terms 2*pi^2*n^4*exp(9u) and -3*pi*n^2*exp(5u), multiplied by exp(-pi*n^2*exp(4u)). No source normalization or zeta identity is inferred."

[[hostile_controls]]
id = "finite-mode-range"
must_preserve = "thetaKernelPartialSum and its majorant range over Finset.Icc 1 N. Zeroth term is zero. Finite bounds do not imply summability or convergence of an infinite theta series."

[[hostile_controls]]
id = "signed-theta-pieces"
must_preserve = "Both polynomial-weighted positive/negative parts are nonnegative; their difference need not be. The absolute bound charges the sum of both parts and retains all pi coefficients."

[[hostile_controls]]
id = "uniform-majorant-is-supplied"
must_preserve = "ThetaUniformMajorant.finite_bound and ScaledGaussianEnvelope.bound are explicit conditional fields, not proof that such an analytic supplier exists."

[[hostile_controls]]
id = "scaled-gaussian-factorization"
must_preserve = "The variable q is n^2*exp(4u). Both signed terms retain the same exp(u) factor and exp(-pi*q), preserving exact source identities."

[[hostile_controls]]
id = "polynomial-exponential-envelope"
must_preserve = "The final elementary envelope applies only for x >= 0 and keeps the declared constant 20 and exp(-x/2) rate."

[[hostile_controls]]
id = "no-complex-zero-or-RH-upgrade"
must_preserve = "These real finite scalar identities do not establish xi/zeta kernel identification, contact-complex Laplacians, an infinite Connes spectral triple, complex entire zero control, or RH."

