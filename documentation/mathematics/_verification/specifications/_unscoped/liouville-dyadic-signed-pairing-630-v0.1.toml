[[hostile_controls]]
id = "signed-interaction-is-not-nonnegative"
must_preserve = "X(M,H) is a SIGNED mixed pairing. It may be negative; it is not a separately nonnegative correlation energy or variance."

[[hostile_controls]]
id = "exact-character-sign-and-coefficient"
must_preserve = "Every nonempty subset S contributes (-1)^|S| C_S R_S, and exact identity is 4 E_lifted = E_source + E_residual + 2 X. Dropping (-1)^|S|, 2, or the factor 4 makes the statement false."

[[hostile_controls]]
id = "complete-nonempty-powerset"
must_preserve = "The mixed pairing and all three energies sum over all nonempty subsets of precisely the SAME original finite coordinate subtype H; empty S is excluded."

[[hostile_controls]]
id = "source-index-and-residual-index"
must_preserve = "C_S uses arithmetic factors lambda(m+h+1) and R_S uses lambda(2*t+2*h+3), with independent root indices. The canonical lifted set is exactly {2*h+1|h∈H}."

[[hostile_controls]]
id = "positive-sample"
must_preserve = "All normalized mean and signed energy equalities assume M>0. The zero sample rational convention must never become a probability conclusion."

[[hostile_controls]]
id = "mixed-budget-not-a-proved-supplier"
must_preserve = "DyadicSignedMixedBudget is a Prop parameter including epsilon>=0 and E_source+E_residual+2X <=4 epsilon. No theorem in the source inhabits it for a decaying epsilon."

[[hostile_controls]]
id = "negative-cross-can-cancel-large-energies"
must_preserve = "At M=2,H={1}, C=-1,R=-1, X=-1, E_source=E_residual=1, E_canonical_lifted=0; rejecting this fixture would expose an incorrectly unsigned pairing."

[[hostile_controls]]
id = "positive-cross-sharp-obstruction"
must_preserve = "At M=1,H={0}, C=1,R=-1, X=1, E_source=E_residual=E_canonical_lifted=1. No unqualified contraction from the sign decomposition."

[[hostile_controls]]
id = "unformalized-antipodal-collision"
must_preserve = "A separate PAPER-ONLY identity expresses X=2^k*A/M^2-1 using complement-pattern matching pairs of source and odd residual labels. No Lean collision-count theorem is declared in this increment."

[[hostile_controls]]
id = "canonical-cyclic-collar"
must_preserve = "The cyclic-TV consumer retains max({2*h+1|h∈H})<2*M and epsilon>=0. The r/(2M) collar is NOT removed by mixed cancellation."

[[hostile_controls]]
id = "no-analytic-Chowla-progression"
must_preserve = "The exact signed energy algebra does not estimate ordinary higher-order odd-affine Liouville correlations, furnish growing-shift uniformity, or prove Bernoulli genericity, GUE or RH."

[[hostile_controls]]
id = "source-not-kernel"
must_preserve = "Explicit theorem heads, no authored sorry, and finite BigInt checks do not establish Lean/Lake elaboration, kernel acceptance, transitive axiom audit or Noeaaeue replay."

