[[hostile_controls]]
id = "not-Liouville"
must_preserve = "F(N,h)=1_{N=h*h} is a purely abstract rational-valued family, NOT the actual Liouville/Moebius two-point correlation. It refutes a logical quantifier exchange only, not a numerical arithmetic conjecture."

[[hostile_controls]]
id = "fixed-form-eventually-zero"
must_preserve = "For each fixed h the only exceptional cutoff is N=h*h. The source proves F(N,h)=0 for every N>h*h; this is stronger than asymptotic cancellation."

[[hostile_controls]]
id = "common-exponent-form-dependent-constant"
must_preserve = "For all N,h, |F(N,h)| <= (h*h+1)/(N+1), one common polynomial exponent 1 and an allowed constant C_h=h*h+1. A dependence on h must not be silently dropped."

[[hostile_controls]]
id = "genuine-sublinear-window"
must_preserve = "On N=k*k the growing offset h=k has h/N=1/k tending to zero; the obstruction survives r_N/N→0 and is not limited to h comparable to N."

[[hostile_controls]]
id = "strict-cyclic-collar-eventual"
must_preserve = "For the separate cyclic theorem r<N, the square-scale window r=k,N=k*k is admissible only once k>=2. The k=1 initial scale does not satisfy strict inequality, but this does not rescue eventual uniformity."

[[hostile_controls]]
id = "positive-shift-range"
must_preserve = "The counterexample to uniformity uses k≥1 and the actual finite shift set Finset.Icc 1 k. h=k is a member; h=0 is not required."

[[hostile_controls]]
id = "not-a-proof-of-false-arithmetic"
must_preserve = "This abstract spike cannot be used to assert actual Liouville shift-uniformity fails. The required all-order arithmetic theorem remains independently open."

[[hostile_controls]]
id = "no-infinite-limit-promotion"
must_preserve = "The source proves finite exact identities and a nonimplication, with written sublinear asymptotics only; a new Lean Tendsto theorem is not claimed."

[[hostile_controls]]
id = "source-vs-kernel"
must_preserve = "Source declarations and independent bounded integers do NOT prove Lean elaboration, transitive axiom acceptance or replay."

