[[hostile_controls]]
id = "generic_source_match"
requirement = "CellPrimitive.source_eq and target_eq identify the ACTUAL two bounded kernels on every open integer cell. Polynomial names or equal dimensions are insufficient."

[[hostile_controls]]
id = "generic_integrability"
requirement = "Weighted integrands are proved integrable by measurable domination, with Re(z)>1 and T>=1. Do not use the default value of a divergent integral."

[[hostile_controls]]
id = "generic_integer_seams"
requirement = "Local HasDerivAt, continuous local slope, and both zero primitive endpoints precede integration by parts. Almost-everywhere endpoint removal is not equality of pointwise jets."

[[hostile_controls]]
id = "generic_two_tails"
requirement = "Prove the finite telescope and decay of BOTH independent tails before identifying full values. The integer-cutoff identity follows from actual full and finite identities."

[[hostile_controls]]
id = "concrete_step_records"
requirement = "Instantiate quarticToFifth and fifthToSixth completely. No source identity, nonvanishing, sample, cover, RH or generic-step oracle remains an extra parameter of the concrete endpoints."

[[hostile_controls]]
id = "exact_mean"
requirement = "Compute sixthRaw mean=-1/30240 and retain the centered +1/30240. Its norm bound is1/30240, not zero; the centered kernel has both signs."

[[hostile_controls]]
id = "integer_correction_sign"
requirement = "Retain J4_N=-(s+4)N^(-s-5)/30240+(s+4)(s+5)J6_N. The finite model must ADD A6*N^(-s-5)/30240, not subtract or omit it."

[[hostile_controls]]
id = "noninteger_endpoint"
requirement = "The fifth primitive at1/4 and raw sixth at1/2 are nonzero. No boundary-free identity at arbitrary real cutoffs is implied by the integer theorem."

[[hostile_controls]]
id = "sextic_reference"
requirement = "Prove R6=R4+A6/30240 and its factorization (s+2)(s+4)(s+6)(s+7)(s^2-10s+45)/30240. Keep H(1)=1; R6 is not a global unit."

[[hostile_controls]]
id = "quadratic_factor_geometry"
requirement = "Use norm-square=(Im(s)^2+(Re(s)-5)^2-20)^2+80(Re(s)-5)^2 to prove norm>=32 for Re(s)<=1. Do not assume positivity of the quadratic factor real part."

[[hostile_controls]]
id = "exact_tensor_identity"
requirement = "Verify the FULL 11x6 natural table against1024*(961D-1024N) at x=(1+u)/2,y=64v by ring normalization. Positive coefficients alone or sampled signs are not a certificate."

[[hostile_controls]]
id = "joint_domain"
requirement = "The box coordinates are u=2Re(s)-1 and v=Im(s)^2/64. The real scalar Re(s)+5 and complex norm |s+5| are different. Restore both |s+2| and |s+4| factors before the source comparison."

[[hostile_controls]]
id = "eight_height_margin"
requirement = "Reconcile squared ratio961/1024, actual tail denominator30240(Re(s)+5), reference lower65/112, and |H|>=65/3584. Retain closed edges Re=1/2,Re=1,Im=+/-8."

[[hostile_controls]]
id = "mirror_only_zeros"
requirement = "Critical reflection transports the canonical zero predicate; no equality of reflected H norms, multiplicities or complete divisor is inferred."

[[hostile_controls]]
id = "cutoff_not_order"
requirement = "The N^(-Re(s)-5) estimate is for the corrected finite model at integer N. Fixed-s cutoff decay is not increasing-order convergence, all-height positivity, completed divisor control or Weil convergence."

[[hostile_controls]]
id = "sextic_homotopy"
requirement = "Use R6+t(H-R6), real0<=t<=1, not the preceding quartic homotopy. Reciprocal differentiability additionally consumes source holomorphy and proved nonvanishing."

[[hostile_controls]]
id = "previous_port"
requirement = "The new ShellRH7 must inhabit the existing QuarticPrimitive.window_eight_of_shell. WindowRH9 and the full higher-step family remain conditional."

[[hostile_controls]]
id = "height_nine_control"
requirement = "The new gap is negative at x=1/2,y=81. This refutes extrapolation of THIS sufficient bound, not nonvanishing or RH at height9; the point is not asserted to be a zero."

[[hostile_controls]]
id = "local_not_metric_equivalence"
requirement = "The positive tensor representation proves one bounded squared-error comparison. It is not a globally positive Hodge metric, signed-null identification, source-faithful Weil B_n or spectral theorem."

[[hostile_controls]]
id = "no_execution_promotion"
requirement = "Written Lean proofs and independent rational diagnostics are not elaboration, transitive axiom audit or replay. No worker, native evaluation, replay request, merge, authority change or receipt is supplied."
