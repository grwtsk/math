requirement = "Prepare against fe6a8c52fd41d3bd5bc40fa45b254b761e20bbce and retain all old sources, pins and zero-permitting declarations. Full import closure is a separate audit."

[[hostile_controls]]
id = "same_actual_source"
requirement = "Use the SAME poleNormalizedZeta H, removable H(1)=1, canonical zero predicate, root height and sextic finiteModel8. Retain the exact residual H-F8=-A7*J6_8."

[[hostile_controls]]
id = "all_arithmetic_terms"
requirement = "All bases1..8, the endpoint, B2/B4/B6 corrections and separately charged extra base8 power remain."

[[hostile_controls]]
id = "fresh_center"
requirement = "The new center is3/4+33i/2, not3/4+31i/2. Recompute all eight samples, exact convolution and every coefficient round."

[[hostile_controls]]
id = "log_source"
requirement = "Reuse the proved positive-base log enclosures with radius2^-24; neither arbitrary logarithms nor another complex-power branch is admitted."

[[hostile_controls]]
id = "sample_remainder"
requirement = "Check each128-term exponential expression, norm17 and exponent36 guards, log perturbation, rounding and sample radius2^-18."

[[hostile_controls]]
id = "spatial_domain"
requirement = "Prove the whole CLOSED rectangle[1/2,1]x[16,17] lies in radius5/8 of the center. Keep the real-part displacement guard, order8 and all errors."

[[hostile_controls]]
id = "polynomial_rounding"
requirement = "Every one of14 complex coefficient slots is checked, including rounded zero slots. Charge2^-24 per coefficient and polynomial radius2^-20."

[[hostile_controls]]
id = "whole_region_products"
requirement = "Reprove |s+j|<=18 for j=-1..4, |s+5|<=19 and endpoint weight<=22 on the NEW band. Do not recycle the old smaller bounds."

[[hostile_controls]]
id = "general_tail_only"
requirement = "Apply only the general sextic tail at N8 and sigma1/2; no cutoff-one or cutoff-two special saving is transported."

[[hostile_controls]]
id = "complete_radius"
requirement = "Retain18*sum(e)+22*e8+18^6*19/(30240*(11/2)*65536)+2^-20<=1/8. Value error does not imply derivative error."

[[hostile_controls]]
id = "full_tensor"
requirement = "All144 natural coefficients satisfy the exact degree11x11 identity2^46*(-Re Q((1+u)/2+i(16+v))-9). Check equality, not just coefficient signs or samples."

[[hostile_controls]]
id = "source_projection"
requirement = "The sign is Re(H-Q)<=|H-Q|, yielding -Re H>=71/8 on the band only."

[[hostile_controls]]
id = "mirror_scope"
requirement = "Transport actual target zero locations by conjugation and critical reflection, not arbitrary values, norms, derivatives, or multiplicities."

[[hostile_controls]]
id = "bounded_band"
requirement = "Signed zero exclusion is16<=|height|<=17. It does not exclude zeros on the earlier14-to15 permitted region or imply height_gt_seventeen."

[[hostile_controls]]
id = "live_successor"
requirement = "Instantiate the exact pre-existing SixteenBandJet.window_seventeen_of_shell with ShellRH16. WindowRH17 retains canonical RH classification."

[[hostile_controls]]
id = "cover_extension"
requirement = "extendZeroFree must consume NoTargetZero V, retain the SAME count/regions/mirror/capacity and prove coverage of U union V. No disjointness assumption drops seams."

[[hostile_controls]]
id = "union_coherence"
requirement = "Associativity and order-independence are identities of zero-free CARRIERS. They are not full chart-transition cocycles, ring maps or field equivalences."

[[hostile_controls]]
id = "one_region_capacity"
requirement = "Count1 implies at most one target only using the full cover and source proofs. An empty-cover control refutes any inference of zero existence or exact count."

[[hostile_controls]]
id = "three_band_cover"
requirement = "Restrict the extended actual cover to[0,1]x[14,17] by explicit inclusion. Keep fifteenBox and both closed seams15 and16; clear only the added bands."

[[hostile_controls]]
id = "same_cutoff_overlap"
requirement = "At nonempty seam[1/2,1]x{16}, keep Q17-F8+F8-Q16. The infinite tail cancels because F8 is EXACTLY the same source, not because its norms are small."

[[hostile_controls]]
id = "overlap_budget"
requirement = "Charge both finite power-jet and both rounding errors, prove their sum<=1/16. Do not call this bounded model mismatch zero or identify the models."

[[hostile_controls]]
id = "path_identity"
requirement = "Reuse the SAME negative-reference deformation as the prior clear band. Prove norm>=1 only for15<=Im<=17 and0<=time<=1; do not identify the earlier zero-permitting path."

[[hostile_controls]]
id = "analytic_transport"
requirement = "Inherited continuity/holomorphy is distinct from the new nonzero bound; reciprocal differentiation consumes both."

[[hostile_controls]]
id = "hostile_off_domain"
requirement = "The new polynomial guard fails at1/2+14i, outside its admitted band. This is not a zeta-zero witness or a rejection of RH."

[[hostile_controls]]
id = "higher_shells"
requirement = "WindowRH18 still needs ShellRH17. The RH endpoint keeps every higher-shell supplier. Global divisor/Weil/spectral comparisons remain absent."

[[hostile_controls]]
id = "kernel_boundary"
requirement = "Exact arithmetic diagnostics, source hashes and ring scripts are not Lean elaboration or transitive axiom auditing. Reject sorryAx, new axioms and unreported native dependencies."

[[hostile_controls]]
id = "no_execution_authority"
requirement = "This static target authorizes no build, worker, replay request, execution receipt, merge, issue closure or F06 release."
