[[hostile_controls]]
id = "quartic_raw_mean"
requirement = "Derive r(u)=u^2(u-1)^2/24, rprime=q, and actual cell integral 1/720. Do not infer weighted cancellation from a periodicity or zero-mean label."

[[hostile_controls]]
id = "centered_kernel_sign"
requirement = "The raw kernel is nonnegative with bound1/384. The centered kernel r-1/720 is SIGNED, bounded in absolute value by1/720, and equals -1/720 at integer endpoints. These are distinct objects."

[[hostile_controls]]
id = "jet_order"
requirement = "Values, first and second local polynomial jets agree at integer seams; third jets jump. Use actual cellwise derivatives, a.e. interval equality, and telescoping rather than inventing global C3 smoothness."

[[hostile_controls]]
id = "convergent_raw_and_centered"
requirement = "Prove raw, cubic, constant-correction and centered integrands integrable at Re(s)>0 before subtraction. All tail norms retain cutoff>=1 and a positive real-part margin."

[[hostile_controls]]
id = "integer_boundary_correction"
requirement = "Prove Q_N=N^(-s-3)/720+(s+3)J_N at integer N>=1. The raw primitive vanishes there but the centered primitive does NOT. Retain the positive correction in Q_N and the negative correction in the finite source model."

[[hostile_controls]]
id = "noninteger_boundary"
requirement = "The raw value r(3/2)=1/384 is nonzero. Do not extend the integer boundary-free integration-by-parts identity to arbitrary real cutoffs without its endpoint term."

[[hostile_controls]]
id = "quartic_reference_factorization"
requirement = "Prove R4=(s+2)(s+4)(s+5)(9-s)/720=R3-A4/720. In particular R4(1)=1 and R4(9)=0. It is not globally nonzero or a positive Hodge metric."

[[hostile_controls]]
id = "finite_model_negative_correction"
requirement = "Only the old cubic finite model MINUS A4*N^(-s-3)/720 gets the new residual -A4*(s+3)*J_N and N^(-sigma-3) bound. Do not attach the bound to an unchanged or plus-corrected model."

[[hostile_controls]]
id = "growth_and_limit"
requirement = "Retain all five factors of A5(s). Fixed-s or bounded-domain cutoff convergence is not increasing-order convergence, uniform all-height positivity, a completed zero-divisor tail, or a Weil comparison."

[[hostile_controls]]
id = "six_height_joint_geometry"
requirement = "On all closed right-rectangle points prove |s||s-1|<=37, |s+1|<=(7/9)|s+5|, |s+3|<=(13/14)|s+4|, and |9-s|>=8. Shared factors must not be dropped."

[[hostile_controls]]
id = "six_height_rational_margin"
requirement = "Reconcile J1<=1/2520, factor481/144, relative error481/504<1, reference norm>=11/16, and final |H|>=253/8064. No sample, cover or nonvanishing premise is introduced."

[[hostile_controls]]
id = "closed_six_boundaries"
requirement = "Include Re=1/2, Re=1, Im=+/-6 and removable H(1)=1. Target height is strictly greater than6. No numerical first-zero location is asserted."

[[hostile_controls]]
id = "mirror_zero_only"
requirement = "Critical reflection transports only the canonical zero predicate for left-half exclusion. The right-side norm bound is not reflected as an equality of H-values or norms; multiplicities are not inferred."

[[hostile_controls]]
id = "quartic_homotopy"
requirement = "Use the exact corrected quartic reference plus t*(H-reference), real t in[0,1]. It is not a relabeling of the affine/quadratic deformation. Reciprocal differentiability additionally requires proved nonvanishing."

[[hostile_controls]]
id = "next_shell_not_automatic"
requirement = "Source endpoints WindowRH6 and ShellRH5 have no extra source/cover hypothesis. WindowRH7 still consumes ShellRH6, and the all-height step family remains open. No unconditional RH claim."

[[hostile_controls]]
id = "no_native_or_execution_promotion"
requirement = "Do not run or conceal native_decide, external evaluators, workers or replay in the mathematical source. All declarations require exact elaboration and transitive axiom audit; finite rational diagnostics are not those proofs."
