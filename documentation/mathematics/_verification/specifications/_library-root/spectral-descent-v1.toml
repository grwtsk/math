[[hostile_controls]]
id = "reject-cross-revision-cache"
description = "A cached build or receipt from another repository revision cannot satisfy this target."

[[hostile_controls]]
id = "reject-root-only-coverage"
description = "Building the root alone cannot hide an omitted or failed declared module."

[[hostile_controls]]
id = "check-exact-types"
description = "An unchanged declaration name cannot substitute for checking its exact type."

[[hostile_controls]]
id = "separate-elaboration-from-axioms"
description = "Successful elaboration cannot be reported as an axiom audit."

[[hostile_controls]]
id = "no-scope-promotion"
description = "A pass for one target cannot promote an unrelated target."

[acceptance]
requires_all_declared_modules = true
requires_exact_public_signatures = true
requires_explicit_failures_and_unavailable_checks = true
requires_named_downstream_blockers = true

[nonclaims]
claims = [
  "Riemann hypothesis",
  "complete zeta-zero divisor",
  "validity of external zero data",
  "analytic premises not proved by the inspected declarations",
  "quantum algorithm or speedup"
]
