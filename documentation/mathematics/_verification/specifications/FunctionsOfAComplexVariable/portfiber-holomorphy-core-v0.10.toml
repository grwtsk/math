[[hostile_controls]]
id = "reject-mismatched-middle-object"
description = "Typed port and certified-path composition must reject endpoints whose exact middle objects do not agree."
[[hostile_controls]]
id = "reject-path-certificate-drop"
description = "The composite of a certified path must retain every selected composable certificate."
[[hostile_controls]]
id = "reject-path-map-drift"
description = "The fiber map of a composite port must agree with atom-by-atom certified-path evaluation."
[[hostile_controls]]
id = "reject-source-name-as-proof"
description = "Repository, revision, path, and declaration metadata cannot populate a certificate or theorem proof field."
[[hostile_controls]]
id = "reject-ring-label-without-ring-hom"
description = "A ring-certified port must carry an exact bundled ring homomorphism equal to the selected fiber map."
[[hostile_controls]]
id = "reject-ring-continuity-drift"
description = "The continuity proof of a topological-ring port must concern the same exact map identified by its ring certificate."
[[hostile_controls]]
id = "reject-continuity-as-holomorphy"
description = "Continuity alone cannot construct a complex differentiability or holomorphic-extension certificate."
[[hostile_controls]]
id = "reject-holomorphy-without-domain-map"
description = "Holomorphic composition and restriction require the exact source-to-middle domain mapping proof."
[[hostile_controls]]
id = "reject-ordinary-section-as-holomorphic-section"
description = "An arbitrary function section cannot inhabit the holomorphic section subring without an ambient differentiability witness."
[[hostile_controls]]
id = "reject-holomorphic-subring-closure-gap"
description = "Zero, one, addition, negation, and multiplication must each preserve the exact holomorphic-extension predicate."
[[hostile_controls]]
id = "reject-holomorphic-ring-restriction-drift"
description = "The holomorphic-section restriction ring homomorphism, continuous map, and forgetful full-section restriction must be the same exact underlying function."
[[hostile_controls]]
id = "reject-evaluation-prime-without-holomorphic-ring"
description = "An evaluation prime must be the kernel of the exact evaluation ring homomorphism on the holomorphic-section ring, not on an unrelated function space."
[[hostile_controls]]
id = "reject-evaluation-naturality-drift"
description = "Pullback of an evaluation prime along restriction must equal evaluation at the same exact included point."
[[hostile_controls]]
id = "reject-evaluation-map-continuity-by-construction"
description = "The point-to-prime-spectrum evaluation map carries no continuity theorem unless a separate proof is supplied."
[[hostile_controls]]
id = "reject-coordinate-ring-map-by-metadata"
description = "A source identity or bridge name cannot create the required exact ring homomorphism into a holomorphic-section ring."
[[hostile_controls]]
id = "reject-analytic-affine-point-map-drift"
description = "An analytic-affine bridge point map must be the pullback of the exact holomorphic evaluation prime along the supplied coordinate-ring homomorphism."
[[hostile_controls]]
id = "reject-analytic-affine-restriction-drift"
description = "Restricting a domain must preserve the induced source-spectrum point through the exact evaluation-naturality theorem."
[[hostile_controls]]
id = "reject-analytic-affine-precomposition-variance"
description = "Precomposing the coordinate ring must act contravariantly on the induced prime-spectrum point map."
[[hostile_controls]]
id = "reject-spectrum-variance-reversal"
description = "A ring homomorphism B → A induces the continuous prime-spectrum map Spec A → Spec B; the port type must retain this contravariance."
[[hostile_controls]]
id = "reject-spectrum-continuity-by-label"
description = "The induced prime-spectrum map must use the actual PrimeSpectrum.continuous_comap theorem, not a ring-homomorphism label alone."
[[hostile_controls]]
id = "reject-spectrum-composition-order"
description = "Composite prime-spectrum maps must follow the reverse order of the exact composite ring homomorphisms."
[[hostile_controls]]
id = "reject-spectrum-as-scheme"
description = "A continuous map of prime spectra alone is not a scheme morphism; the affine-scheme profile must carry the actual Mathlib Spec.map."
[[hostile_controls]]
id = "reject-affine-scheme-map-drift"
description = "The affine-scheme port point map must agree exactly with PrimeSpectrum.comap for the same reverse-direction ring morphism."
[[hostile_controls]]
id = "reject-scheme-composition-order"
description = "Affine Spec composition must retain the contravariant order of ring morphisms at both the scheme and point-map levels."
[[hostile_controls]]
id = "reject-global-sections-map-drift"
description = "The affine global-section port map must be exactly the appTop map of the same Spec.map morphism."
[[hostile_controls]]
id = "reject-structure-sheaf-comap-drift"
description = "The map on sections over an open set must equal Mathlib's StructureSheaf.comap for the same ring morphism and preimage open."
[[hostile_controls]]
id = "reject-global-sections-loss-of-original-ring-map"
description = "Recovery of the original ring morphism requires the canonical Gamma-Spec arrow isomorphism; point-map continuity alone is insufficient."
[[hostile_controls]]
id = "reject-nonlocal-stalk-map"
description = "Every selected affine Spec stalk map must carry the actual IsLocalHom instance at the exact point."
[[hostile_controls]]
id = "reject-local-holomorphy-as-global-gluing"
description = "Local holomorphic extendability plus ordinary function matching cannot produce a global holomorphic section without a separate gluing theorem."
[[hostile_controls]]
id = "reject-function-gluing-as-arithmetic-bridge"
description = "The ordinary function sheaf theorem cannot construct an arithmetic-to-elliptic map or source comparison."
[[hostile_controls]]
id = "reject-open-target-as-proof-or-refutation"
description = "An unresolved target disposition yields neither the target nor its negation."
[[hostile_controls]]
id = "reject-rh-from-local-family"
description = "The simultaneous proof architecture exposes local theorems but cannot synthesize RH from them."
[[hostile_controls]]
id = "reject-target-failure-erasing-local-proofs"
description = "Every supplied target disposition, including a hypothetical refutation, must preserve every independent local theorem disposition."
[[hostile_controls]]
id = "reject-local-branch-collapse"
description = "Proved, refuted, conditional, and unresolved local branches must remain distinct dispositions in the theorem portfolio."
[[hostile_controls]]
id = "reject-refuted-branch-erasing-proved-branches"
description = "Rejecting one local application bridge cannot erase independently proved topology, ring, holomorphy, evaluation-spectrum, analytic-affine, gluing, prime-spectrum, affine-scheme, global-section, or stalk branches."
[[hostile_controls]]
id = "reject-open-obligation-as-false-or-proved"
description = "An unresolved arithmetic, source-comparison, or convergence obligation is neither a proof nor a refutation."
[[hostile_controls]]
id = "reject-local-update-changing-target"
description = "Updating one local theorem disposition must leave the terminal RH disposition unchanged."
[[hostile_controls]]
id = "reject-stage-as-residual-update"
description = "A certified stage cannot alter the residual ledger without an accepted adapter, source-compatibility proof, and valid named change."
[[hostile_controls]]
id = "reject-plan-changing-target-or-portfolio"
description = "An accepted residual plan cannot modify local theorem dispositions or the terminal target disposition."
[[hostile_controls]]
id = "reject-untouched-key-drift"
description = "Residual keys not touched by an accepted plan must remain exactly unchanged."
[[hostile_controls]]
id = "reject-root-import-as-slice-pass"
description = "A build of GRWTSK cannot substitute for checking the isolated port-fiber root and every declared module."

