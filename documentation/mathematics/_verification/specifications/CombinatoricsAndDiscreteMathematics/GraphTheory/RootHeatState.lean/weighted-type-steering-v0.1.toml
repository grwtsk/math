meaning = "One nonnegative weighted transition is bounded above by destination type heat"

[[declarations]]
name = "GRWTSK.CombinatoricsAndDiscreteMathematics.GraphTheory.RootHeatState.HasWeightedSteeringBound"
kind = "definition"
meaning = "For each type a source/target pair supplies a common epsilon lower bound on weighted incoming heat"

