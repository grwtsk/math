meaning = "Positive epsilon steering proves next-step type completeness"

[[declarations]]
name = "GRWTSK.CombinatoricsAndDiscreteMathematics.GraphTheory.RootHeatState.eventually_type_complete_of_steering"
kind = "theorem"
meaning = "Time-uniform positive steering for all times >= start proves complete type support at every subsequent time"

[[declarations]]
name = "GRWTSK.CombinatoricsAndDiscreteMathematics.GraphTheory.RootHeatState.not_type_complete_of_missing_label"
