[nonclaims]
claims = [
  "Lean parsing, elaboration, kernel or transitive trust acceptance",
  "execution or acceptance of historical targets or hostile controls",
  "a globally regular proper scheme or Neron model",
  "a conductor, Ogg, Kodaira, Tamagawa or splitness calculation",
  "completed-field comparison or field-extension invariance",
  "integral marked affine point, section or jet-lattice transport",
  "canonical coordinates independent of source ordering",
  "complete H0, intrinsic Hodge, adelic or Faltings height comparison",
  "cancellation of old weighted-map, denominator, index or gauge costs",
  "a bound on remaining discriminant depth or uniform radical height",
  "ABC, RH, external replay, workflow, worker/F06, merge or closure authority"
]
