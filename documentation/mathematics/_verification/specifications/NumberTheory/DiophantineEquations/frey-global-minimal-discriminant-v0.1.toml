[[hostile_controls]]
id = "reject-unit-scale-without-integrality"
description = "Unit scale alone is insufficient. Require all five transformed coefficients locally integral before transporting minimality."

[[hostile_controls]]
id = "reject-same-invariants-as-same-model"
description = "Compare every coefficient with the old selectedCurve action before identifying discriminant or local minima."

[[hostile_controls]]
id = "reject-local-model-switching"
description = "Use one integer tuple for all primes; do not silently choose unrelated local or twisted equations."

[[hostile_controls]]
id = "reject-raw-minimality-at-two"
description = "The old raw equation is not minimal on Descends. Its discriminant differs by4096 there."

[[hostile_controls]]
id = "reject-always-divide4096"
description = "Divide only on the proved Descends branch. At(1,1,2) unconditional division gives a noninteger."

[[hostile_controls]]
id = "reject-all-high-depth-descent"
description = "High valuation alone does not imply descent: retain the old signed congruence guards."

[[hostile_controls]]
id = "reject-negative-k-loss"
description = "The even-summand witness uses signed b-a and integer k, including(16,1,17)."

[[hostile_controls]]
id = "reject-two-always-in-bad-support"
description = "Prime two disappears precisely on Descends with v2(abc)=4; example(1,15,16)."

[[hostile_controls]]
id = "reject-two-always-absent"
description = "Prime two remains for additive and multiplicative cases, including(1,1,2) and(1,31,32)."

[[hostile_controls]]
id = "reject-support-for-depth"
description = "Odd exponent is2vp(abc), not the indicator of divisibility; minimal discriminants are not squarefree."

[[hostile_controls]]
id = "reject-j-denominator-as-discriminant"
description = "The actual rational j denominator is not this discriminant ideal; j=1728 can be integral at bad prime two."

[[hostile_controls]]
id = "reject-j-numerator-as-bad-support"
description = "Extra numerator primes of j need not be bad; retain the actual discriminant polynomial."

[[hostile_controls]]
id = "reject-nonprimitive-extension"
description = "Primitivity is required. Source(4,60,64) can remove24 rather than at most12."

[[hostile_controls]]
id = "reject-bounded-prime-grid"
description = "Finite support statements quantify over the entire factorization support and tests must leave residual cofactor one."

[[hostile_controls]]
id = "reject-local-versus-global-integrality"
description = "Local competitors may have prime-to-p denominators; do not require global integer outputs."

[[hostile_controls]]
id = "reject-discriminant-for-conductor"
description = "No Artin conductor, Ogg formula, Kodaira symbol, Tamagawa or splitness conclusion follows here."

[[hostile_controls]]
id = "reject-equation-for-regular-scheme"
description = "Everywhere-minimal Weierstrass equation and principal discriminant ideal are not a regular proper or Neron model construction."

[[hostile_controls]]
id = "reject-model-for-port-isometry"
description = "Same equation identity and local minimality do not remove marked affine denominators or earlier section/jet/index/gauge costs."

[[hostile_controls]]
id = "reject-budget-for-radical-height"
description = "Bounded removed correction is not bounded remaining discriminant depth or the uniform source radical-height estimate."

[[hostile_controls]]
id = "reject-static-as-acceptance"
description = "Source scripts and bounded arithmetic are not Lean parsing, elaboration, exact-signature or transitive trust acceptance."

[acceptance]
requires_all_declared_modules = true
