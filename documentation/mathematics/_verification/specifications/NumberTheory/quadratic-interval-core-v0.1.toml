[[hostile_controls]]
id = "shift-at-one-changes-inventory"
description = "shift_one_control witnesses that delta=1 is outside the floor-preserving cell; a failed prime-power endpoint convention cannot be hidden by rounding."

[[hostile_controls]]
id = "complete-correction-required"
description = "correction_omission_control witnesses zero output despite a positive main term; a prime-power or source residual cannot be omitted."

[[hostile_controls]]
id = "zero-margin-is-inconclusive"
description = "zero_margin_control witnesses that zero squared margin and zero error budget do not force the exceptional set to be empty. Strict positivity is required before division."

[[hostile_controls]]
id = "actual-source-reuse"
description = "QuadraticIntervals must retain CorrelationPairing.chebyshevPrimePower and its exact closed-right inventory, not a separately defined surrogate."

[[hostile_controls]]
id = "generic-budget-is-not-arithmetic-witness"
description = "FiniteSquareBudget hypotheses do not instantiate source, zero-tail, theta/psi correction or arithmetic-growth suppliers."

[[hostile_controls]]
id = "all-new-declarations-and-import-closure"
description = "All declarations in both owning modules and their imported trust closure must be reported; a root-only pass, an absent report or a different source revision does not satisfy this target."

[acceptance]
requires_all_declared_modules = true
requires_exact_public_signatures = true
requires_explicit_failures_and_unavailable_checks = true
requires_named_downstream_blockers = true

[nonclaims]
claims = [
  "formalization of the written polylogarithmic prime-power bound",
  "formalization of the entire coupled interval kernel",
  "complete prime-power/zero explicit formula",
  "omitted-zero tail or zero multiplicity certificate",
  "mean-square arithmetic cancellation estimate",
  "Legendre conjecture",
  "Riemann hypothesis",
  "external replay acceptance or execution authority"
]
