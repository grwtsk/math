[[controls]]
id = "repeated-order"
obligation = "All finite analytic multiplicities transport; no simplicity assumption."

[[controls]]
id = "conjugate-input-output"
obligation = "Do not use output conjugation alone as a holomorphic derivative."

[[controls]]
id = "real-axis-exclusion"
obligation = "Doubling requires the actual sourced absence of height-zero atoms."

[[controls]]
id = "positive-closed-cutoff"
obligation = "Positive count retains 0<Im<=T, both-sign head retains |Im|<=T."

[[controls]]
id = "endpoint-atom"
obligation = "Open/closed counts differ by the FULL positive analytic boundary mass."

[[controls]]
id = "half-boundary"
obligation = "Two times the averaged count still needs one boundary mass."

[[controls]]
id = "unequal-weights"
obligation = "Conjugate locations with unproved unequal labels do not imply parity."

[[controls]]
id = "cardinality-vs-mass"
obligation = "Repeated-root mass is not the number of distinct points."

[[controls]]
id = "window-not-evidence"
obligation = "A passing rational guard supplies neither actual count enclosure inequality."

[[controls]]
id = "adjacent-even"
obligation = "Reject zero or four inside a window targeting two."

[[controls]]
id = "zero-target"
obligation = "Use signed rational thresholds around zero, not truncated subtraction."

[[controls]]
id = "strict-upper"
obligation = "H<4 is essential; H<=4 permits an additional simple conjugate pair."

[[controls]]
id = "found-pair"
obligation = "Two sourced points give a lower bound, not complete inventory or upper count."

[[controls]]
id = "bounded-conclusion"
obligation = "Conditional head equality and line result retain height fifteen."

[[controls]]
id = "no-execution"
obligation = "Every old/new script, generated declaration and full trust chain remains unaccepted."
