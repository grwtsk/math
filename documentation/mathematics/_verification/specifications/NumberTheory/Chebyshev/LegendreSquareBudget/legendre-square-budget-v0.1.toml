[[hostile_controls]]
id = "same-source-correction-equality"
description = "proper_mass_eq_higher_mass must use the same source and theta differences after only exact cast normalization; similar names or sampled equality do not identify corrections."

[[hostile_controls]]
id = "complete-cutoff"
description = "proper_mass_eq_covering_sum retains exponentCutoff n <= K. A shorter arbitrary prefix is not complete."

[[hostile_controls]]
id = "upper-square-and-prime-base-weights"
description = "upper_square_charge_preserved and inherited PrimePowerMarginControls retain the right-square contribution and log of the prime base."

[[hostile_controls]]
id = "actual-prime-count"
description = "Reuse the actual squareCount and the nonprime-square endpoint theorem, not a sieve candidate or Mangoldt support predicate."

[[hostile_controls]]
id = "strict-pointwise-margin"
description = "Inherit non_strict_margin_control and positive_source_without_prime. Approximation and strictly positive corrected margin remain required."

[[hostile_controls]]
id = "same-intermediate-two-errors"
description = "squareCount_pos_of_two_error_budget keeps the exact same intermediate in both bounds and charges both errors; neither is synthesized."

[[hostile_controls]]
id = "one-exception-threshold"
description = "threshold_equality_allows_zero_output prevents weakening the strict finite-budget threshold to non-strict equality."

[[hostile_controls]]
id = "complete-finite-set"
description = "prime_free_card_mul_sq_le uses the actual zero-count subset of the complete selected finite S; all_squareCounts_pos_of_small_budget concludes only on that S."

[[hostile_controls]]
id = "universal-tail-and-positive-stages"
description = "legendre_of_prefix_and_budget_margins retains complete LegendreThrough N and approximation/margin for every n>N. Positive-stage hypotheses cannot be dropped."

[[hostile_controls]]
id = "unchanged-source-snapshots"
description = "All five selected #256 owner blobs must match exactly; the inherited #264/#265 sources and controls remain unaccepted until exact replay."

[[hostile_controls]]
id = "no-kernel-or-tail-promotion"
description = "The unselected coupled complex kernel is not accepted by this target. No explicit formula, zero identity, divisor tail, numerical rounding theorem or arithmetic cancellation is inferred."

[[hostile_controls]]
id = "all-types-and-transitive-trust"
description = "Reconcile every listed module and all public elaborated types plus the full transitive closure. Root-only success, a missing axiom report or an old-head receipt is not acceptance."

[acceptance]
requires_all_declared_modules = true
requires_exact_public_signatures = true
requires_explicit_failures_and_unavailable_checks = true
requires_named_downstream_blockers = true
