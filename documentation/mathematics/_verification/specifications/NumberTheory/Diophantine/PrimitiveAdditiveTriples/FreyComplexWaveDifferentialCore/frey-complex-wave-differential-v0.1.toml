[[hostile_controls]]
id = "reject-differential-of-substitute-wave"
description = "Derive the coherent/transient splitting and every coordinate from the OLD wave, encode/decode, tree and basis maps; a fitted scalar formula alone is not a same-map theorem."

[[hostile_controls]]
id = "reject-three-of-six-channel-coverage"
description = "Observe all three raw vertices AND all three normalized transitions, retaining source labels and BOTH complex components. Joint separation must be proved."

[[hostile_controls]]
id = "reject-decoded-mismatch-as-raw-coordinate"
description = "The homogeneous ODE applies to the decoded mismatch. Raw coefficients have a coherent part and do not all decay at rate three."

[[hostile_controls]]
id = "reject-omitted-clock-derivative"
description = "For differentiable clocks use i*theta_prime on the full coefficient and -3*tau_prime on the damped part. Do not conflate phase, heat or geometric return time."

[[hostile_controls]]
id = "reject-varying-input-as-fixed-source"
description = "The coefficient profile A,B, source a,b and grade k are fixed. Varying initial data or the source introduces derivatives not supplied here."

[[hostile_controls]]
id = "reject-discrete-topology-substitution"
description = "Raw topology is induced from ordinary finite-product complex coefficients. It is not the earlier discrete-jet topology or an infinite-series norm."

[[hostile_controls]]
id = "reject-joint-source-uniformity"
description = "Joint continuity is in angle and heat time for each fixed source and datum. No uniformity in source, grade, lattice, metric or evolving input is claimed."

[[hostile_controls]]
id = "reject-frozen-closure-edge-derivative"
description = "The transient transition part is face(delta1(a)). Edge 20 must carry the evolving actual closure; fixing all edges changes the derivative."

[[hostile_controls]]
id = "reject-phase-badge-on-edges"
description = "Only raw vertices carry the sourcePhase badge. The global rotation acts on both vertices and edges; decoding is mandatory before mismatch."

[[hostile_controls]]
id = "reject-squared-energy-rate-three"
description = "The Hermitian mismatch-energy derivative is -6*tau_prime*energy, not -3*tau_prime*energy. Phase cancels in this scalar law."

[[hostile_controls]]
id = "reject-cycle-return-with-positive-heat"
description = "Positive initial mismatch energy and positive elapsed heat forbid exact raw-state return, even when the angle advances by 2pi."

[[hostile_controls]]
id = "reject-backward-time-contraction"
description = "Derivative laws allow all real clock speeds. Contractivity is not inferred for a decreasing heat clock."

[[hostile_controls]]
id = "reject-coordinate-ode-as-intrinsic-hodge"
description = "Finite coefficient first jets do not identify a geometric Hodge generator, domains, complete H0, geometric covers or an arithmetic semigroup."

[[hostile_controls]]
id = "reject-calculus-as-arithmetic-supplier"
description = "Continuity and differentiation do not erase the previous source-dependent metric, cokernel index, denominator depth or missing uniform-height bound."

[[hostile_controls]]
id = "reject-new-target-as-historical-acceptance"
description = "The new target imports the previous wave core and retains its named dependencies; it neither replaces nor executes historical targets and controls."

[[hostile_controls]]
id = "reject-symbolic-test-as-lean-audit"
description = "Finite dual-number differentiation and symbolic calculus are not Lean elaboration, exact signature checks, topology verification or transitive trust replay."

[acceptance]
requires_all_declared_modules = true
requires_exact_public_signatures = true
requires_explicit_failures_and_unavailable_checks = true
requires_named_downstream_blockers = true
requires_root_import_unchanged = true
requires_hostile_controls = true
requires_axiom_audit = true
requires_runtime_safety_scan = true

[nonclaims]
claims = [
  "Lean elaboration, kernel acceptance, transitive trust acceptance or external replay",
  "replacement or execution of historical targets and hostile controls",
  "joint varying-source or varying-initial-data derivative and uniform estimates",
  "a global normed Raw carrier or bundled Frechet derivative beyond the all-coordinate real derivatives",
  "a nonconstant continuous path in the previous discrete-jet topology",
  "intrinsic Hodge, arithmetic Markov or infinite-dimensional heat operators",
  "geometric covers, polar divisors, complete H0 or geometric integral model lattices",
  "uniform source/grade metric bounds or arithmetic-lattice preservation",
  "exactification at finite heat time or return after a phase cycle with heat drift",
  "canonical inter-anchor coefficient-base-change, conductor or characteristic-two classification",
  "uniform arithmetic height, radical-excess, abc or RH results",
  "execution, workflow, worker, merge, issue closure or target promotion authority"
]
