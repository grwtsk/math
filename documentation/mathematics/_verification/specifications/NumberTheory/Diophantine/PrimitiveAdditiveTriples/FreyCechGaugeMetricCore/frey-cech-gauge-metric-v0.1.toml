[[hostile_controls]]
id = "reject-informal-quotient"
description = "Use the actual module quotient by the kernel of the OLD reduction map, and characterize equality by mean-zero simultaneous coboundaries."

[[hostile_controls]]
id = "reject-mismatch-only-reduction"
description = "Retain the ORIGINAL vertex mean as well as all three ordered mismatch coordinates. Mismatch alone erases coherent information."

[[hostile_controls]]
id = "reject-unrestricted-gauge"
description = "An arbitrary gauge can change the vertex mean. The named quotient uses only mean-zero gauge vectors."

[[hostile_controls]]
id = "reject-full-state-recovery-from-quotient"
description = "The nonzero cell ((1,-1,0),(-2,1,1)) has raw energy eight and zero class. Quotient estimates cannot recover discarded source directions."

[[hostile_controls]]
id = "reject-raw-energy-on-arbitrary-representative"
description = "Raw six-energy is not gauge invariant. Define quotient energy using the explicit minimizer and prove its variational characterization."

[[hostile_controls]]
id = "reject-wrong-minimizer-sign"
description = "The minimizing vertex correction is +delta0Transpose(e)/4 and the edge is -(e+sum(e))/4 for e=delta0(z)-a."

[[hostile_controls]]
id = "reject-dropping-closure-in-metric"
description = "The reduced energy is 3m^2+(sum(e_j^2)+(sum e_j)^2)/4. Omitting the closure-dependent term changes the metric."

[[hostile_controls]]
id = "reject-mismatch-energy-as-quotient-energy"
description = "The mismatch weights range sharply from 1/4 to 1. Do not identify the reduced mismatch metric with the old mismatch norm or corrected-frame D."

[[hostile_controls]]
id = "reject-unstated-edge-metric"
description = "The least-energy formula assumes the old unit Euclidean vertex AND edge weights. Other weights require a new minimizer and quantitative comparison."

[[hostile_controls]]
id = "reject-minimum-without-uniqueness"
description = "Retain the exact Pythagorean remainder 4*sum(w_j^2); minimumRep_unique must detect the actual scalar representative, not only its class."

[[hostile_controls]]
id = "reject-only-abstract-coefficient-realization"
description = "Define normalization on the OLD real W_k-valued cell, then prove coefficient_normalForm through its established basis map."

[[hostile_controls]]
id = "reject-tree-as-standard-full-flow"
description = "Both flows descend to the same quotient, but the tree-fixed full flow can still expand raw six-energy to 17/12."

[[hostile_controls]]
id = "reject-tree-as-minimizer-preserving"
description = "Standard heat preserves minimum representatives. Tree heat generally requires renormalization before that comparison."

[[hostile_controls]]
id = "reject-unbound-port-or-isometry"
description = "Use the same OLD weighted stageEquiv on all six fields and retain the (ab)^(2k) coefficient-energy factor under ab>=1."

[[hostile_controls]]
id = "reject-integral-minimum-projection"
description = "The unit-vertex input has a 1/12 minimum coefficient. A real orthogonal representative is not an integral gauge transformation."

[[hostile_controls]]
id = "reject-fixed-chart-denominator-as-arithmetic-solution"
description = "The explicit factor twelve clears this fixed coordinate formula only. It neither replaces the old (ab)^k clearing factor nor removes conductor and intrinsic lattice costs."

[[hostile_controls]]
id = "reject-new-prime-support-from-samples"
description = "A normalization denominator may introduce the fixed prime 3 even for source (1,4,5). Preserve fixed-exception accounting rather than claiming all gauge support lies in abc."

[[hostile_controls]]
id = "reject-negative-time-contraction"
description = "Contraction uses attenuation in [0,1], or positive heat time. Negative-time amplification remains possible."

[[hostile_controls]]
id = "reject-selected-metric-as-intrinsic-hodge"
description = "No geometric cover, scheme quotient, Dolbeault domain, complete H0, intrinsic Hermitian metric or adelic comparison is supplied."

[[hostile_controls]]
id = "reject-unelaborated-source-as-acceptance"
description = "Static source, finite rational tests and manifest parsing are not Lean elaboration, exact-signature checking, transitive trust audit or external replay."

[acceptance]
requires_all_declared_modules = true
requires_exact_public_signatures = true
