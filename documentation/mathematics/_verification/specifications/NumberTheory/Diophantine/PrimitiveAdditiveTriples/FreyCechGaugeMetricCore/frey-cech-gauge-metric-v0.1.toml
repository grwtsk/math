[nonclaims]
claims = [
  "Lean elaboration, kernel acceptance, transitive trust acceptance or external replay",
  "replacement or execution of historical roots, targets or hostile controls",
  "full-source recovery through a noninjective gauge quotient",
  "equality of full tree and standard cochain flows",
  "raw six-energy invariance under arbitrary gauge shifts",
  "a registered quotient NormedSpace or Hilbert-space topology",
  "geometric gauge or sheaf quotients, complete H0, or intrinsic Hodge metrics",
  "integral normal-form projection or elimination of weighted-port denominators",
  "new general Lean Smith-form or least-common-integer-denominator theorem for the normalizer",
  "number-field-extension lattice, conductor or characteristic-two classification",
  "uniform arithmetic height, radical-excess, abc or RH results",
  "execution, workflow, worker, merge, issue closure or target-promotion authority"
]
