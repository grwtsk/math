[[hostile_controls]]
id = "same-source"
description = "Use the actual OLD integerModel a2/a4 and selectedEquation before assigning coefficient costs."

[[hostile_controls]]
id = "same-lift"
description = "Reconcile the integer-rescaled representative with the OLD nilpotent lift by exhaustion, not only matching a recurrence."

[[hostile_controls]]
id = "nonunit-rescaling"
description = "Y=B*T and X=B*Z are rational rescalings; do not declare them integral-unit coordinate changes at primes dividing B."

[[hostile_controls]]
id = "nonzero-versus-unit"
description = "Nonzero B suffices over Q, but arbitrary coefficient rings require an actual inverse witness."

[[hostile_controls]]
id = "mixed-term"
description = "Retain XY in the original equation and T*Z in the integral fixed-point equation."

[[hostile_controls]]
id = "cubic-rescaling-factor"
description = "The rescaled cubic term is B*Z^3, not Z^3."

[[hostile_controls]]
id = "finite-quotient"
description = "The iterate is an exact solution only modulo the declared nilpotence power, not an exact polynomial arc or analytic convergence claim."

[[hostile_controls]]
id = "order-convention"
description = "N means the old quotient by T^(N+1); the coefficient k costs at most absolute B^(k-1)."

[[hostile_controls]]
id = "signed-jacobian"
description = "Negative selected a4 remains negative in the coefficients; use absolute value only for positive denominator bounds."

[[hostile_controls]]
id = "zero-first-orders"
description = "Orders zero and one have zero X coefficients and common denominator one; do not invent a reciprocal term there."

[[hostile_controls]]
id = "bound-versus-equality"
description = "General coefficients may cancel: A=1,B=2 gives the fourth coefficient zero. Equality requires its separately proved congruence."

[[hostile_controls]]
id = "universal-versus-samples"
description = "Prove stabilization and all-order congruences universally; finite checks do not establish them."

[[hostile_controls]]
id = "composite-modulus"
description = "The congruence calculation takes place over Z/nZ for arbitrary positive n, including composite n, without assuming a field."

[[hostile_controls]]
id = "actual-rational-denominator"
description = "Use reduced Rat.den and the inherited finite-vector LCM, not a supplied cost parameter."

[[hostile_controls]]
id = "clearing-versus-index"
description = "The vector common denominator is not the cokernel index of an entire observation matrix, a trace discriminant, or a conductor."

[[hostile_controls]]
id = "fixed-source"
description = "The fixed (1,47,48) triple remains unchanged when N grows. Do not confuse auxiliary-order growth with source-height growth."

[[hostile_controls]]
id = "dyadic-versus-global"
description = "B=3 is a unit at two at every finite order but its odd denominator powers remain globally."

[[hostile_controls]]
id = "singular-first-jet"
description = "A rational rescaling does not remove the old obstruction of X=0,Y=epsilon at a singular special point."

[[hostile_controls]]
id = "normalization"
description = "Fix the FULL parameter Y=T. A nonunit reparametrization changes the prescribed first jet and its metric/lattice record."

[[hostile_controls]]
id = "source-not-acceptance"
description = "All scripts and inherited proofs remain unelaborated. No Lean acceptance, conductor/Hodge theorem or uniform radical-height estimate follows."

[acceptance]
source_status = "SOURCE_ONLY_NOT_RUN_NOT_KERNEL_AUDITED"
requires_exact_head_elaboration = true
requires_public_signature_comparison = true
requires_all_declared_modules = true
requires_all_hostile_controls = true
requires_transitive_trust_acceptance = true

[nonclaims]
no_lean_acceptance = true
no_integral_nonunit_reparametrization = true
no_analytic_convergence = true
no_intrinsic_metric_or_lattice_identification = true
no_geometric_cover_or_complete_sections = true
no_conductor_or_neron_model = true
no_uniform_source_height_bound = true
no_abc_or_rh = true
