[[hostile_controls]]
id = "reject-two-port-as-saturated-three-port"
description = "The two-port square difference carries a+b and cannot replace integral three-port recovery."
[[hostile_controls]]
id = "reject-rectangular-as-surjective"
description = "The split obstruction quotient prevents surjectivity onto all three-value data."
[[hostile_controls]]
id = "reject-left-inverse-without-bezout"
description = "Integral recovery, exactness and unit minors require the exact Bezout identity."
[[hostile_controls]]
id = "reject-maximal-minor-unit-without-primitivity"
description = "A nonprimitive pair cannot receive the unit-minor certificate."
[[hostile_controls]]
id = "reject-exactness-without-compatible-kernel"
description = "The image is the compatibility kernel, not the entire target."
[[hostile_controls]]
id = "reject-triple-drift"
description = "The x observations must decode to the same typed primitive additive triple."
[[hostile_controls]]
id = "reject-formal-points-as-elliptic-proof"
description = "Actual points require equation and nonsingularity on the same model."
[[hostile_controls]]
id = "reject-zero-discriminant-as-elliptic"
description = "Field ellipticity requires a proved nonzero discriminant."
[[hostile_controls]]
id = "reject-integral-model-as-integral-elliptic-curve"
description = "Nonzero discriminant in Z is not unit discriminant."
[[hostile_controls]]
id = "reject-base-change-model-drift"
description = "Compare the full coefficient tuple along every declared base change."
[[hostile_controls]]
id = "reject-raw-as-minimal-discriminant"
description = "Use the v0.7 variable-change proof before interpreting raw discriminant as minimal locally."
[[hostile_controls]]
id = "reject-point-on-curve-as-two-torsion"
description = "Check P+P=0 independently of point membership."
[[hostile_controls]]
id = "reject-affine-coordinate-space-as-global-sections"
description = "The affine-linear space is not yet identified with complete H0(E,O(2O))."
[[hostile_controls]]
id = "reject-geometry-map-drift"
description = "Actual evaluation must equal scalar extension of the same integral map."
[[hostile_controls]]
id = "reject-integral-left-inverse-as-uniform-isometry"
description = "On-image recovery is not an ambient isometry or an upper frame bound."
[[hostile_controls]]
id = "reject-zero-interpolation-cost-as-zero-arithmetic-cost"
description = "Recovery does not erase model, conductor or observation-height costs."
[[hostile_controls]]
id = "reject-c4-odd-prime-theorem-at-two"
description = "The odd-prime c4 and DVR results do not apply at p=2."
[[hostile_controls]]
id = "reject-c4-unit-without-primitivity"
description = "Retain the primitive source premise; a=3,b=6,p=3 is a counter-control."
[[hostile_controls]]
id = "reject-prime-support-as-multiplicity"
description = "Retain the structural square in Delta_raw=16*(abc)^2."
[[hostile_controls]]
id = "reject-raw-discriminant-excess-as-small-error"
description = "The full raw discriminant excess is not an epsilon-small residual."
[[hostile_controls]]
id = "reject-observation-max-as-c"
description = "Observation height is log max(a,b), not log c; decoding costs at most log 2."
[[hostile_controls]]
id = "reject-common-support-as-common-divisor"
description = "Content equality requires all prime powers, not just common prime support."
[[hostile_controls]]
id = "reject-base-bound-as-higher-stage-bound"
description = "Base coordinate recovery is not an intrinsic or higher-jet estimate."
[[hostile_controls]]
id = "reject-numerical-sampling-as-Lean-replay"
description = "Independent arithmetic checks are not elaboration or transitive audits."
[[hostile_controls]]
id = "reject-source-frame-as-abc"
description = "A source recovery theorem cannot construct the observation upper-bound supplier."
[[hostile_controls]]
id = "reject-root-import-as-slice-pass"
description = "A trivial root marker or whole-library build is not isolated module coverage."
[[hostile_controls]]
id = "reject-multiplicative-additive-valuation-confusion"
description = "Units have multiplicative valuation one, not zero."
[[hostile_controls]]
id = "reject-minimality-as-unproved-field"
description = "Unit-invariant constructors must derive minimality over integral variable changes."
[[hostile_controls]]
id = "reject-conductor-from-reduction-label"
description = "Multiplicative reduction does not by itself instantiate a conductor-exponent theorem."
[[hostile_controls]]
id = "reject-dropping-local-carrier-hypotheses"
description = "Keep R, K, fraction-field data, characteristic zero and residue characteristic."
[[hostile_controls]]
id = "reject-height-surrogate"
description = "Use Mathlib Height.logHeight, not an unrelated norm named height."
[[hostile_controls]]
id = "reject-unbound-rational-representative"
description = "The witness-level theorem requires primitive v, nonzero k and w=k*v; v0.8 derives these for nonzero w."
[[hostile_controls]]
id = "reject-height-direction-reversal"
description = "h(v)<=h(Jv) does not supply an upper bound for h(Jx) by radicals."
[[hostile_controls]]
id = "reject-zero-vector-as-projective-point"
description = "The zero fallback has scale zero; handle only the total-height convention, never a nonzero projective witness."
[[hostile_controls]]
id = "reject-missing-vertical-chart"
description = "The branch w0=0,w1!=0 must reconstruct exactly, including negative w1."
[[hostile_controls]]
id = "reject-negative-scale-representative-drift"
description = "The canonical primitive representative must be unchanged by every nonzero rational scale, including negative scales."
[[hostile_controls]]
id = "reject-nonprimitive-clear-denominators"
description = "Clearing denominators without dividing common content is insufficient; require normalized gcd one."
[[hostile_controls]]
id = "reject-abc-observation-quantifier-drift"
description = "Retain the same epsilon, canonical radical and forall-epsilon/exists-constant/forall-triple order."
[[hostile_controls]]
id = "reject-equivalence-as-target-proof"
description = "ABC iff an observation supplier is not an inhabitant of either side; no axiom or hidden supplier is allowed."
[[hostile_controls]]
id = "reject-decoding-constant-erasure"
description = "The reverse logarithmic supplier implication changes C to C+log(2); do not erase this bound."

[acceptance]
requires_all_declared_modules = true
