requires_hostile_controls = true
requires_axiom_audit = true
requires_runtime_safety_scan = true

[nonclaims]
claims = [
  "accepted Lean elaboration or kernel verification",
  "identification with the complete intrinsic H0(E,O(2O)) section space",
  "minimality or reduction classification at residue characteristic two",
  "conductor exponent, Kodaira symbol or split multiplicative classification",
  "global minimal-model or normalized minimal-discriminant formula",
  "explicit local-Q or Qp specialization package",
  "completed arbitrary-number-field adelic height API",
  "uniform intrinsic or higher-stage frame bound",
  "uniform upper frame bound",
  "an inhabitant of FreyObservationLogBound for every positive epsilon",
  "uniform observation-height-versus-radical estimate",
  "Szpiro conjecture",
  "abc conjecture",
  "Riemann Hypothesis",
  "execution authorization or replay receipt"
]
