[[hostile_controls]]
id = "reject-two-port-as-saturated-three-port"
description = "The square two-port map cannot replace saturated three-port recovery."
[[hostile_controls]]
id = "reject-rectangular-as-surjective"
description = "The explicit compatibility obstruction prevents arbitrary target interpolation."
[[hostile_controls]]
id = "reject-left-inverse-without-bezout"
description = "Integral recovery retains the same source Bezout identity."
[[hostile_controls]]
id = "reject-maximal-minor-unit-without-primitivity"
description = "No unit-minor certificate for nonprimitive source data."
[[hostile_controls]]
id = "reject-exactness-without-compatible-kernel"
description = "The image is the compatibility kernel, not the full target."
[[hostile_controls]]
id = "reject-triple-drift"
description = "Decoded observations must recover the same primitive additive triple."
[[hostile_controls]]
id = "reject-formal-points-as-elliptic-proof"
description = "Actual marked points retain equation and nonsingularity proofs."
[[hostile_controls]]
id = "reject-zero-discriminant-as-elliptic"
description = "Ellipticity over a field requires nonzero discriminant."
[[hostile_controls]]
id = "reject-integral-model-as-integral-elliptic-curve"
description = "Nonzero discriminant over Z is not unit discriminant."
[[hostile_controls]]
id = "reject-base-change-model-drift"
description = "Transport the same complete integral coefficient tuple."
[[hostile_controls]]
id = "reject-raw-as-minimal-discriminant"
description = "Use the proved local variable-change scope before interpreting raw data as minimal."
[[hostile_controls]]
id = "reject-point-on-curve-as-two-torsion"
description = "Point membership alone does not establish doubling to zero."
[[hostile_controls]]
id = "reject-affine-coordinate-space-as-global-sections"
description = "The selected coordinate space is not complete H0 without a section theorem."
[[hostile_controls]]
id = "reject-geometry-map-drift"
description = "Actual evaluation remains the scalar extension of the same integral map."
[[hostile_controls]]
id = "reject-integral-left-inverse-as-uniform-isometry"
description = "An on-image recovery bound is not an ambient isometry or upper bound."
[[hostile_controls]]
id = "reject-zero-interpolation-cost-as-zero-arithmetic-cost"
description = "Recovery does not erase model, conductor or observation-height costs."
[[hostile_controls]]
id = "reject-c4-odd-prime-theorem-at-two"
description = "The earlier odd-prime reduction theorem cannot be used at two."
[[hostile_controls]]
id = "reject-c4-unit-without-primitivity"
description = "Retain primitivity in the local c4 nondivisibility argument."
[[hostile_controls]]
id = "reject-prime-support-as-multiplicity"
description = "Retain the structural square in the raw discriminant."
[[hostile_controls]]
id = "reject-raw-discriminant-excess-as-small-error"
description = "The entire raw discriminant excess is not an epsilon-small residual."
[[hostile_controls]]
id = "reject-observation-max-as-c"
description = "The observation max is max(a,b), not c; the log(2) gap remains."
[[hostile_controls]]
id = "reject-common-support-as-common-divisor"
description = "Common-content equality must retain prime powers."
[[hostile_controls]]
id = "reject-base-bound-as-higher-stage-bound"
description = "Base coordinate bounds are not arbitrary intrinsic jet-metric bounds."
[[hostile_controls]]
id = "reject-numerical-sampling-as-Lean-replay"
description = "Independent arithmetic tests do not verify Lean proof terms."
[[hostile_controls]]
id = "reject-source-frame-as-abc"
description = "Source recovery does not supply the observation-height upper bound."
[[hostile_controls]]
id = "reject-root-import-as-slice-pass"
description = "The trivial legacy root marker is not complete module coverage."
[[hostile_controls]]
id = "reject-multiplicative-additive-valuation-confusion"
description = "Multiplicative valuation assigns units value one."
[[hostile_controls]]
id = "reject-minimality-as-unproved-field"
description = "Minimality must be derived over integral variable changes."
[[hostile_controls]]
id = "reject-conductor-from-reduction-label"
description = "A reduction predicate alone is not a conductor-exponent theorem."
[[hostile_controls]]
id = "reject-dropping-local-carrier-hypotheses"
description = "Retain local rings, fields and residue-characteristic assumptions."
[[hostile_controls]]
id = "reject-height-surrogate"
description = "Use the normalized Mathlib height, not a relabeled coefficient norm."
[[hostile_controls]]
id = "reject-unbound-rational-representative"
description = "The representative theorem retains exact scaling and content one."
[[hostile_controls]]
id = "reject-height-direction-reversal"
description = "A recovery lower bound cannot prove the observation upper bound."
[[hostile_controls]]
id = "reject-zero-vector-as-projective-point"
description = "The zero fallback is not a nonzero projective representative."
[[hostile_controls]]
id = "reject-missing-vertical-chart"
description = "Retain the rational normalization branch with first coordinate zero."
[[hostile_controls]]
id = "reject-negative-scale-representative-drift"
description = "Nonzero negative scalars must preserve the selected representative."
[[hostile_controls]]
id = "reject-nonprimitive-clear-denominators"
description = "Clearing denominators alone does not remove common content."
[[hostile_controls]]
id = "reject-abc-observation-quantifier-drift"
description = "Keep the same epsilon, radical and forall-exists-forall order."
[[hostile_controls]]
id = "reject-equivalence-as-target-proof"
description = "An ABC-equivalent supplier proposition is not its inhabitant."
[[hostile_controls]]
id = "reject-decoding-constant-erasure"
description = "Keep C+log(2) in the reverse supplier implication."
[[hostile_controls]]
id = "reject-x-as-first-order-parameter-at-torsion"
description = "The x displacement has zero linear y-jet at the marked root."
[[hostile_controls]]
id = "reject-values-as-detecting-y"
description = "The added y direction needs a first-jet observation."
[[hostile_controls]]
id = "reject-fourth-slot-as-fourth-point"
description = "The fourth observation is neither a fourth point nor the Cech closure."
[[hostile_controls]]
id = "reject-nilpotent-jet-as-global-curve-parametrization"
description = "Exactness needs the declared nilpotence bound."
[[hostile_controls]]
id = "reject-hasse-coefficient-as-second-derivative"
description = "A quadratic coefficient is not the ordinary second derivative."
[[hostile_controls]]
id = "reject-all-port-jacobians-as-units"
description = "One unit anchor at each prime is not three simultaneous units."
[[hostile_controls]]
id = "reject-smooth-anchor-as-good-reduction"
description = "A smooth branch at two does not make the full special fiber smooth."
[[hostile_controls]]
id = "reject-selected-plane-space-as-intrinsic-sections"
description = "The selected (1,x,y) space is not complete H0(E,O(3O))."
[[hostile_controls]]
id = "reject-one-rank-step-as-arbitrary-refinement"
description = "Parameter precision is not global-section rank growth."
[[hostile_controls]]
id = "reject-jet-substitution-as-local-ring-isomorphism"
description = "Finite representing quotients now require the actual two-sided ring maps; completion still requires a separate compatible-limit theorem."
[[hostile_controls]]
id = "reject-recursion-without-inverse-jacobian"
description = "Every exact lifting result retains d*j=1, not mere nonzeroness."
[[hostile_controls]]
id = "reject-insufficient-nilpotent-precision"
description = "The iteration residual bound must imply actual vanishing."
[[hostile_controls]]
id = "reject-uniqueness-without-root-congruence"
description = "Retain the SAME selected root and the whole nilpotent section ideal; other cubic roots are excluded."
[[hostile_controls]]
id = "reject-truncation-direction-or-source-drift"
description = "Retain the same root and coefficients under decreasing-order truncation."
[[hostile_controls]]
id = "reject-denominator-support-as-depth-bound"
description = "The denominator exponent remains conservative, not sharp or uniform in order."
[[hostile_controls]]
id = "reject-new-factorial-inverses"
description = "No new inverse of factorials, two or stage numbers is allowed."
[[hostile_controls]]
id = "reject-even-fiber-parity-as-spatial-reflection"
description = "Fiber parameter parity is not geometric or Galois metric transport."
[[hostile_controls]]
id = "reject-nilpotent-ring-cancellation"
description = "No cancellation by the parameter in rings with zero divisors."
[[hostile_controls]]
id = "reject-principal-only-as-general-nilpotent"
description = "Test the ideal-level theorem on nonprincipal ideals; do not assume I=(e)."
[[hostile_controls]]
id = "reject-ideal-bound-without-ideal-nilpotence"
description = "Element nilpotence alone does not establish nilpotence of the entire ideal."
[[hostile_controls]]
id = "reject-unmapped-ideal-naturality"
description = "Base change retains mapped ideals, mapped coefficients and nilpotence bounds."
[[hostile_controls]]
id = "reject-deformation-equivalence-as-algebra-equivalence"
description = "The earlier nonlinear deformation sets remain sets; the new algebra equivalence is between separately constructed representing quotients."
[[hostile_controls]]
id = "reject-base-cover-as-curve-cover"
description = "The Jacobian unit-ideal identity covers Spec Z, not the entire elliptic curve."
[[hostile_controls]]
id = "reject-different-anchor-as-same-formal-branch"
description = "Different torsion roots remain distinct on coefficient-chart overlaps."
[[hostile_controls]]
id = "reject-localization-map-at-nonunit"
description = "A map out of Z[1/d_i] requires the actual image of d_i to be a unit; never construct Q to F_p."
[[hostile_controls]]
id = "reject-integer-chart-to-rational-drift"
description = "Rationalization of each localized polynomial must equal the existing source-bound approximant."
[[hostile_controls]]
id = "reject-set-equivalence-as-quotient-lift"
description = "Construct actual polynomial/quotient ring homomorphisms and kill every declared ideal relation."
[[hostile_controls]]
id = "reject-omitted-mixed-section-ideal-powers"
description = "Use the full (X-r,Y)^(N+1), not only one parameter relation or independent pure powers."
[[hostile_controls]]
id = "reject-wrong-thickening-index"
description = "Order N means the (N+1)st ideal power, including N=0; do not drop the highest surviving parameter slot."
[[hostile_controls]]
id = "reject-finite-quotient-map-without-kernel"
description = "The substitution kernel must equal the declared relation ideal, not merely contain a sampled list."
[[hostile_controls]]
id = "reject-one-sided-quotient-inverse"
description = "Check both compositions on the whole quotient rings using generators and universal uniqueness."
[[hostile_controls]]
id = "reject-scalar-drift-in-jet-algebra"
description = "The ring equivalence must preserve the exact coefficient algebra S_i, not an unrelated rational replacement."
[[hostile_controls]]
id = "reject-truncation-conjugation-as-independent-map"
description = "Define truncation from inclusion of relation ideals, then prove the square commutes; do not define it by the desired equivalence."
[[hostile_controls]]
id = "reject-finite-tower-as-completed-equivalence"
description = "A compatible finite tower does not by itself supply a formal completion or global intrinsic jet-bundle theorem."

