[nonclaims]
claims = [
  "accepted Lean elaboration or kernel verification",
  "completed-local-ring or formal-completion isomorphism",
  "a geometric cover of the entire Frey curve",
  "gluing different torsion branches by coefficient-chart overlap",
  "complete global line-bundle section spaces or global intrinsic jet bundles",
  "linearity or metric isometry of the nonlinear deformation-set equivalence",
  "conductor exponents or characteristic-two reduction classification",
  "uniform intrinsic or arbitrary-stage metric bounds",
  "sharp or stage-independent denominator bounds",
  "uniform observation-height-versus-radical estimate",
  "an inhabitant of FreyObservationLogBound for every positive epsilon",
  "Szpiro conjecture",
  "abc conjecture",
  "Riemann Hypothesis",
  "execution authorization, external replay receipt or merge authority"
]
