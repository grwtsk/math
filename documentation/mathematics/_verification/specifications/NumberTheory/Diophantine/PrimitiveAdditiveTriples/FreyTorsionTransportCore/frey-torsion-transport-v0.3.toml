[[hostile_controls]]
id = "reject-unbound-point-translation"
description = "The map is P+the EXISTING freyT0 on the EXISTING rational Frey curve; a coordinate analogy is insufficient."

[[hostile_controls]]
id = "reject-affine-formula-at-pole"
description = "Keep x nonzero for the rational formula; the total group map sends T0 to infinity and infinity to T0."

[[hostile_controls]]
id = "reject-translation-as-additive-homomorphism"
description = "Translation by a nonzero point does not preserve the origin; use Equiv, not AddEquiv."

[[hostile_controls]]
id = "reject-two-torsion-as-c3-return"
description = "The translation has period two and no fixed rational point. The three nonzero ports are not invariant since T0 goes to infinity."

[[hostile_controls]]
id = "reject-wrong-ordinate-sign"
description = "For y^2=x(x-a)(x+b), translation by T0 is (-ab/x, +ab*y/x^2), reconciled with Mathlib addX/addY."

[[hostile_controls]]
id = "reject-parameter-label-as-chart-map"
description = "The Tb-to-Ta function pullback sends T_b to (b/a)T_a, not T_a, except in a separately justified equal-scale case."

[[hostile_controls]]
id = "reject-pullback-direction-reversal"
description = "Functions at the target Tb pull back to Ta; the inverse scale is a/b. Keep source/target labels despite the shared quotient-ring type."

[[hostile_controls]]
id = "reject-field-inverse-in-nilpotent-ring"
description = "Use the displayed inverse of source X and prove X*inverseX=1 inside Q[T]/T^3. Do not give the quotient a field instance."

[[hostile_controls]]
id = "reject-linear-as-quadratic-coefficient-scale"
description = "The coefficient vector transforms by diag(1,b/a,(b/a)^2). A Hasse coefficient is not an ordinary second derivative."

[[hostile_controls]]
id = "reject-order-two-map-as-all-order-linear"
description = "The exact full chart y-change has nonzero cubic correction -2b/(a^3*c) at Ta over Q. Do not extend its linear reduction modulo T^3 to the whole completion."

[[hostile_controls]]
id = "reject-reciprocal-as-isometry-or-integral"
description = "The scales 3/2 and 2/3 are reciprocal but not Euclidean unit scales or simultaneously integral at every prime. Record frame and lattice costs separately."

[[hostile_controls]]
id = "reject-point-map-as-global-line-bundle-atlas"
description = "The point map, localized ring involution and localized finite jets do not supply a scheme-morphism certificate, completion comparison, line-bundle gauge, global cover or section-space theorem."

[[hostile_controls]]
id = "reject-leaf-replay-as-full-pr-acceptance"
description = "This nineteen-local-module target does not cover the retained completion/topology stack. FreyThreePortFrame imports Mathlib; a small local count is not a small upstream trust closure."

[[hostile_controls]]
id = "reject-finite-tests-as-lean-proof"
description = "Independent rational and finite-coefficient tests are not elaboration, exact-type or transitive trust checks."

[[hostile_controls]]
id = "reject-nonunit-ab-open-involution"
description = "The full open pullback retains an explicit coefficient witness a*b*l=1. Mere nonzeroness over a general ring does not suffice."

[[hostile_controls]]
id = "reject-open-coordinate-as-global-curve"
description = "Localization at X excludes T0 and infinity. The ring construction is not a whole-projective-model or scheme-level gluing theorem."

[[hostile_controls]]
id = "reject-localized-jets-as-earlier-presentation"
description = "Compare D/Ia^n and D/Ib^n with C/J_r^n using a proved unit in EACH quotient, both inverse maps, the same image ideal, and compatible transitions. No bare type identification is allowed."

[[hostile_controls]]
id = "reject-full-ideal-power-as-support"
description = "Map the full source/target ideal and every power, retaining mixed monomials and the exponent. This is not an arithmetic radical-support bound."

[[hostile_controls]]
id = "reject-one-sided-open-quotient-inverse"
description = "Both quotient directions and their truncation laws must be proved; a quotient lift alone is not an equivalence."

[[hostile_controls]]
id = "reject-singular-specialization-as-free-translation"
description = "The generic ring involution may have fixed points after specialization, for example a=b=1 over F2. It does not prove smoothness, good reduction or a free fiber action."

[[hostile_controls]]
id = "reject-whole-open-map-as-linear-parameter"
description = "The actual open pullback keeps X^-1 and Y*X^-2; its order-two reduction must not replace the nonlinear higher jet map."

[[hostile_controls]]
id = "reject-nonunit-anchor-localization-comparison"
description = "An anchor must be a unit, not merely nonzero. Localizing a nonzero nilpotent X can collapse a nonzero finite quotient."

[[hostile_controls]]
id = "reject-geometric-inverse-without-residual"
description = "The finite inverse obeys the exact residual formula before nilpotence is applied. Do not divide by X or discard an uncontrolled tail."

[[hostile_controls]]
id = "reject-unit-anchor-as-smoothness"
description = "The comparison does not require a unit curve derivative. Singular finite quotients remain singular and may have more than n coefficient dimensions."

[[hostile_controls]]
id = "reject-localization-power-index-drift"
description = "Use the whole mapped ideal power and both canonical exponent zero and jet order N with exponent N+1."

[[hostile_controls]]
id = "reject-localization-roundtrip-on-samples-only"
description = "Prove both ring-map inverses through quotient and localization universal properties, not only sampled coordinate vectors."

[[hostile_controls]]
id = "reject-new-unlocalized-map-as-linear-fit"
description = "The unlocalized pullback must agree with the pre-existing localized nonlinear torsion pullback and both original truncation directions."

