[[hostile_controls]]
id = "reject-unbound-point-translation"
description = "The map is P+the EXISTING freyT0 on the EXISTING rational Frey curve; a coordinate analogy is insufficient."

[[hostile_controls]]
id = "reject-affine-formula-at-pole"
description = "Keep x nonzero for the rational formula; the total group map sends T0 to infinity and infinity to T0."

[[hostile_controls]]
id = "reject-translation-as-additive-homomorphism"
description = "Translation by a nonzero point does not preserve the origin; use Equiv, not AddEquiv."

[[hostile_controls]]
id = "reject-two-torsion-as-c3-return"
description = "The translation has period two and no fixed rational point. The three nonzero ports are not invariant since T0 goes to infinity."

[[hostile_controls]]
id = "reject-wrong-ordinate-sign"
description = "For y^2=x(x-a)(x+b), translation by T0 is (-ab/x, +ab*y/x^2), reconciled with Mathlib addX/addY."

[[hostile_controls]]
id = "reject-parameter-label-as-chart-map"
description = "The Tb-to-Ta function pullback sends T_b to (b/a)T_a, not T_a, except in a separately justified equal-scale case."

[[hostile_controls]]
id = "reject-pullback-direction-reversal"
description = "Functions at the target Tb pull back to Ta; the inverse scale is a/b. Keep source/target labels despite the shared quotient-ring type."

[[hostile_controls]]
id = "reject-field-inverse-in-nilpotent-ring"
description = "Use the displayed inverse of source X and prove X*inverseX=1 inside Q[T]/T^3. Do not give the quotient a field instance."

[[hostile_controls]]
id = "reject-linear-as-quadratic-coefficient-scale"
description = "The coefficient vector transforms by diag(1,b/a,(b/a)^2). A Hasse coefficient is not an ordinary second derivative."

[[hostile_controls]]
id = "reject-order-two-map-as-all-order-linear"
description = "The exact full chart y-change has nonzero cubic correction -2b/(a^3*c) at Ta over Q. Do not extend its linear reduction modulo T^3 to the whole completion."

[[hostile_controls]]
id = "reject-reciprocal-as-isometry-or-integral"
description = "The scales 3/2 and 2/3 are reciprocal but not Euclidean unit scales or simultaneously integral at every prime. Record frame and lattice costs separately."

[[hostile_controls]]
id = "reject-point-map-as-global-line-bundle-atlas"
description = "The canonical completion comparison now comes from compatible nonlinear finite maps; it still supplies no scheme morphism, line-bundle gauge, global cover or section-space theorem."

[[hostile_controls]]
id = "reject-leaf-replay-as-full-pr-acceptance"
description = "This thirty-nine-local-module target includes its declared canonical/series dependencies, not the entire retained topology, height or PR 251 stack. The inherited Mathlib import remains part of the trust closure."

[[hostile_controls]]
id = "reject-finite-tests-as-lean-proof"
description = "Independent rational and finite-coefficient tests are not elaboration, exact-type or transitive trust checks."

[[hostile_controls]]
id = "reject-nonunit-ab-open-involution"
description = "The full open pullback retains an explicit coefficient witness a*b*l=1. Mere nonzeroness over a general ring does not suffice."

[[hostile_controls]]
id = "reject-open-coordinate-as-global-curve"
description = "Localization at X excludes T0 and infinity. The ring construction is not a whole-projective-model or scheme-level gluing theorem."

[[hostile_controls]]
id = "reject-localized-jets-as-earlier-presentation"
description = "Compare D/Ia^n and D/Ib^n with C/J_r^n using a proved unit in EACH quotient, both inverse maps, the same image ideal, and compatible transitions. No bare type identification is allowed."

[[hostile_controls]]
id = "reject-full-ideal-power-as-support"
description = "Map the full source/target ideal and every power, retaining mixed monomials and the exponent. This is not an arithmetic radical-support bound."

[[hostile_controls]]
id = "reject-one-sided-open-quotient-inverse"
description = "Both quotient directions and their truncation laws must be proved; a quotient lift alone is not an equivalence."

[[hostile_controls]]
id = "reject-singular-specialization-as-free-translation"
description = "The generic ring involution may have fixed points after specialization, for example a=b=1 over F2. It does not prove smoothness, good reduction or a free fiber action."

[[hostile_controls]]
id = "reject-whole-open-map-as-linear-parameter"
description = "The actual open pullback keeps X^-1 and Y*X^-2; its order-two reduction must not replace the nonlinear higher jet map."

[[hostile_controls]]
id = "reject-nonunit-anchor-localization-comparison"
description = "An anchor must be a unit, not merely nonzero. Localizing a nonzero nilpotent X can collapse a nonzero finite quotient."

[[hostile_controls]]
id = "reject-geometric-inverse-without-residual"
description = "The finite inverse obeys the exact residual formula before nilpotence is applied. Do not divide by X or discard an uncontrolled tail."

[[hostile_controls]]
id = "reject-unit-anchor-as-smoothness"
description = "The comparison does not require a unit curve derivative. Singular finite quotients remain singular and may have more than n coefficient dimensions."

[[hostile_controls]]
id = "reject-localization-power-index-drift"
description = "Use the whole mapped ideal power and both canonical exponent zero and jet order N with exponent N+1."

[[hostile_controls]]
id = "reject-localization-roundtrip-on-samples-only"
description = "Prove both ring-map inverses through quotient and localization universal properties, not only sampled coordinate vectors."

[[hostile_controls]]
id = "reject-new-unlocalized-map-as-linear-fit"
description = "The unlocalized pullback must agree with the pre-existing localized nonlinear torsion pullback and both original truncation directions."

[[hostile_controls]]
id = "reject-incompatible-finite-equivalences"
description = "Invertibility at each level is insufficient. Demand the same transition square at EVERY pair of exponents before constructing the lift."

[[hostile_controls]]
id = "reject-completed-map-from-finite-sample"
description = "Use the actual AdicCompletion universal lift at all exponents, including zero. A finite prefix or a chosen Taylor fit does not define the map."

[[hostile_controls]]
id = "reject-completed-inverse-one-direction"
description = "The two universal lifts must compose to identity as canonical ring maps, checked at all projections, not only on X and Y samples."

[[hostile_controls]]
id = "reject-completion-smoothness-leak"
description = "The ab-unit witness suffices for the inter-anchor canonical equivalence. Formal-series frames separately require both inverse-Jacobian witnesses; singular fibers cannot use them without proof."

[[hostile_controls]]
id = "reject-formal-pullback-as-coefficient-map"
description = "The inter-anchor series algebra equivalence changes the parameter nonlinearly. It is not PowerSeries.map on coefficients and not the old quadratic diagonal rescaling."

[[hostile_controls]]
id = "reject-filtration-identity-as-arithmetic-bound"
description = "Exact congruence reflection for this equivalence is not coefficient-norm or arithmetic-valuation control; residues can still erase source coefficients."

[[hostile_controls]]
id = "reject-completed-coordinate-formula-drift"
description = "Retain P(X_b)*X_a=-ab and P(Y_b)*X_a^2=ab*Y_a through the original localized squares at every exponent; no division by a nilpotent is permitted."

[[hostile_controls]]
id = "reject-weighted-lift-as-ring-hom"
description = "L_k(1)=X^k; the same-grade map is linear, not generally unital or multiplicative. Only the sum-of-grades product law is supplied."

[[hostile_controls]]
id = "reject-weighted-square-as-identity"
description = "Retain L_k^2=(-ab)^k id and inverse (-l)^k L_k with ab*l=1. Do not discard the scalar multiplier."

[[hostile_controls]]
id = "reject-implicit-rational-square-root"
description = "Normalization by q has square q^2*(-ab)^k. For positive native a,b the grade-one multiplier cannot be made one by a rational scalar."

[[hostile_controls]]
id = "reject-monomial-span-as-complete-sections"
description = "A basis of the selected bounded span over a field does not identify it with H0(E,O(2kO)). Preserve the missing polar-divisor and global section-space theorems."

[[hostile_controls]]
id = "reject-y-block-degree-overrun"
description = "The Y block requires j+2<=k and maps to exponent k-j-2. Natural subtraction cannot justify an out-of-range monomial."

[[hostile_controls]]
id = "reject-degree-inclusion-as-intertwining"
description = "L_(k+1)(f)=X*L_k(f). Plain inclusion of the same function does not identify the operators at different grades."

[[hostile_controls]]
id = "reject-saturated-evaluation-cost-transfer"
description = "The weighted (1,X) coefficient matrix has determinant ab, not the unit Fitting ideal of the earlier rectangular value map. The two maps have separate lattice costs."

[[hostile_controls]]
id = "reject-weighted-map-certificate-drift"
description = "The lift must use the actual pre-existing nonlinear open-ring pullback and its fixed scalar map. No alternative fitted reflection or parameter rescaling is substituted."

[[hostile_controls]]
id = "reject-rank-from-generator-count"
description = "Prove polynomial-pair uniqueness and linear independence before constructing the basis or computing the finite dimension."

[[hostile_controls]]
id = "reject-zero-stage-dimension-drift"
description = "W_0 has dimension one. Dimension 2k and increments of two apply only from k>=1; W_0 to W_1 adds one."

[[hostile_controls]]
id = "reject-single-projection-as-pair-separation"
description = "Use both coordinates of the auxiliary quadratic algebra. A scalar evaluation or one chosen branch does not detect both p and q."

[[hostile_controls]]
id = "reject-auxiliary-algebra-as-geometric-field"
description = "The auxiliary quadratic algebra over K(X) is a separating carrier, not a supplied function-field or smoothness theorem."

[[hostile_controls]]
id = "reject-field-basis-as-integral-basis"
description = "The new basis theorem assumes a field. An integral lattice, denominator ideals and local norm laws require independent realization."

[[hostile_controls]]
id = "reject-stage-rank-as-observation-injectivity"
description = "A basis and strict growth of W_k do not show a fixed finite observation map is injective on every stage."

[[hostile_controls]]
id = "reject-coefficient-energy-as-intrinsic-hodge"
description = "The selected real basis energy is not the intrinsic Hodge metric, a heat estimate, or a full geometric section norm."

[[hostile_controls]]
id = "reject-permutation-weight-direction"
description = "Source column i is sent to reverse(i) with weight(i), not weight(reverse(i)); bind the entire map using the old basis."

[[hostile_controls]]
id = "reject-squared-energy-exponent-drift"
description = "The upper ENERGY factor is (ab)^(2k); the corresponding norm factor is (ab)^k. The Y block includes one additional ab multiplier."

[[hostile_controls]]
id = "reject-energy-without-positive-source"
description = "The lower bound and positive balanced metric require ab>=1. An algebraic weighted-form identity can also hold when the form is indefinite."

[[hostile_controls]]
id = "reject-adaptive-metric-cost-erasure"
description = "The balanced diagonal weights are (ab)^exponent and their comparison cost is (ab)^k. Reweighting cannot remove source/grade dependence for free."

[[hostile_controls]]
id = "reject-normalization-without-scalar-equation"
description = "The normalized balanced-form claim requires q^2*(ab)^k=1 over the declared field. Do not infer a rational normalization or unit scalar."

[[hostile_controls]]
id = "reject-upper-bound-as-sharpness"
description = "Show equality witnesses on the actual W_k: the constant and X^k basis vectors, including the exceptional grade zero."

[[hostile_controls]]
id = "reject-real-metric-as-adelic-supplier"
description = "The source-bound rational-to-real map now reconciles the selected stages and integer spans. This does not supply finite-place norm APIs, intrinsic Hodge/model comparison or an ABC upper bound."

[[hostile_controls]]
id = "reject-unrealized-integer-lattice"
description = "Embed integer coefficients into the SAME rational W_k using the old basis and prove injectivity and whole-vector intertwining before reporting integral transport."

[[hostile_controls]]
id = "reject-forward-integral-as-lattice-automorphism"
description = "An integral forward weighted map need not have an integral inverse. Use the exact coordinate divisibility criterion, not merely nonzero rational determinant."

[[hostile_controls]]
id = "reject-clearing-ideal-as-determinant"
description = "The universal scalar inverse-clearing generator is |ab|^k; do not confuse it with a product-of-weights determinant or lattice-index exponent k^2."

[[hostile_controls]]
id = "reject-radical-as-inverse-denominator"
description = "At grade two, radical 6 does not clear the constant-target inverse for a=2,b=3; the full factor 36 is required."

[[hostile_controls]]
id = "reject-single-vector-denominator-as-uniform"
description = "A fixed vector can have cancellations. The universal clearing statement quantifies over EVERY lattice element and requires a sharp necessity witness."

[[hostile_controls]]
id = "reject-selected-lattice-as-geometric-integral-model"
description = "The lattice is the Z-span of the named rational basis, not yet integral H0, a Neron/minimal model, or a globally glued line-bundle lattice."

[[hostile_controls]]
id = "reject-zero-weight-cancellation"
description = "The generic image theorem permits zero weights and requires the corresponding target coordinate to vanish. Injectivity and rational inversion retain nonzero/unit hypotheses."

[[hostile_controls]]
id = "reject-grade-zero-denominator-drift"
description = "The constant stage has one coordinate and clearing generator one even at grade zero. Do not apply a missing Y block or a positive-grade index convention."

[[hostile_controls]]
id = "reject-zero-modulus-as-finite-cyclic"
description = "ZMod 0 is the integer ring. Keep nonzero-weight hypotheses on finiteness and product cardinality; do not count a free factor as a zero-size finite group."

[[hostile_controls]]
id = "reject-residue-slot-source-drift"
description = "Residue slot i reads target reverse(i) modulo the full source weight(i). Preserve both block labels and the sign-normalized full power."

[[hostile_controls]]
id = "reject-cokernel-from-order-alone"
description = "Construct a surjective residue map, identify its kernel with the actual image, and supply a Z-linear quotient equivalence. An order or determinant alone does not determine the group."

[[hostile_controls]]
id = "reject-unrealized-cokernel-transfer"
description = "Restrict the old rational lift independently to its old range lattice and prove whole-vector conjugacy before transferring its cokernel."

[[hostile_controls]]
id = "reject-annihilator-as-group-order"
description = "For the realized Frey lattice the index is |ab|^(k*k), while the sharp scalar annihilator is |ab|^k. At a=2,b=3,k=2 these are 1296 and 36."

[[hostile_controls]]
id = "reject-cyclic-modulus-radicalization"
description = "Normalize a negative weight by its absolute value without replacing its prime-power exponents by radical support. Interior exponents occur twice."

[[hostile_controls]]
id = "reject-cokernel-as-signed-determinant"
description = "An explicit group decomposition and index do not supply signed determinant conventions or canonical Smith change-of-basis matrices."

[[hostile_controls]]
id = "reject-index-as-abc-progress-by-size"
description = "A precise grade-dependent index records an arithmetic cost, not an upper bound for observation heights in terms of prime support or an intrinsic integral model."

[[hostile_controls]]
id = "reject-coefficient-map-from-fitted-basis"
description = "Construct the map on the original localized equation with the same X, Y and inverse X before restricting to the old spans and deriving coordinate laws."

[[hostile_controls]]
id = "reject-stage-scalar-field-confusion"
description = "For a coefficient map f:R->S use f-semilinearity. Do not call the raw source R-module map S-linear without a separately constructed scalar extension."

[[hostile_controls]]
id = "reject-base-change-as-new-inverse-witness"
description = "Transport the actual source ab*l=1 witness to f(a)*f(b)*f(l)=1; do not select unrelated target coefficients, model or torsion action."

[[hostile_controls]]
id = "reject-realization-as-surjective-field-extension"
description = "The raw field map has image exactly the vectors whose basis coordinates lie in the coefficient-map image. New irrational coefficients do not acquire rational preimages."

[[hostile_controls]]
id = "reject-coefficient-transport-as-anchor-switch"
description = "The new map changes coefficients and preserves named X/Y generators. It is not a torsion translation or a fiber-parameter reversal; prove the commuting square with the distinct nonlinear pullback."

[[hostile_controls]]
id = "reject-real-span-as-integral-lattice"
description = "The real image of the selected integer lattice is a Z-span, not its full real-linear span. Preserve the exact coefficient-integrality and inverse-divisibility tests."

[[hostile_controls]]
id = "reject-realization-erases-denominator"
description = "Injective rational-to-real realization cannot turn X^2/36 into an integer-coefficient vector or reduce the universal clearing factor to radical 6."

[[hostile_controls]]
id = "reject-open-naturality-as-completion-naturality"
description = "The new naturality theorems concern the open-ring map and bounded weighted stages. Canonical inter-anchor completion and topology require their own comparison squares."

[acceptance]
requires_all_declared_modules = true
requires_exact_public_signatures = true
requires_explicit_failures_and_unavailable_checks = true
requires_named_downstream_blockers = true
requires_root_import_unchanged = true
requires_hostile_controls = true
requires_axiom_audit = true
requires_runtime_safety_scan = true

[nonclaims]
claims = [
  "accepted Lean elaboration or kernel verification",
  "coverage or replay acceptance of all PR 251 source modules",
  "an origin-preserving group homomorphism or C3 action",
  "a scheme-morphism or scheme-stalk certificate",
  "line-bundle frame gauges, global section spaces or a complete geometric atlas",
  "integral transport at excluded primes or coefficient metric isometry",
  "conductor exponents or characteristic-two reduction classification",
  "an arithmetic height upper bound or uniform radical-excess estimate",
  "abc conjecture or Riemann Hypothesis",
  "execution authorization, external replay receipt, issue closure or merge authority",
  "analytic convergence, a positive radius or a completed tensor/base-change comparison",
  "a topology, line-bundle or metric certificate for the new inter-anchor map without a separate bridge",
  "the polar divisor of X or identification of the selected spans with complete Riemann--Roch spaces",
  "a stage-dimension or all-grade determinant theorem from counting generators",
  "involutivity or metric isometry of an unnormalized weighted lift",
  "uniform standard-coefficient bounds after erasing source and grade factors",
  "identification of a source-dependent diagonal form with an intrinsic Hodge or adelic metric",
  "an intrinsic integral-section lattice or a Neron/minimal-model lattice from the selected coefficient embedding",
  "an all-grade determinant, Smith-normal-form or cokernel-index theorem from the scalar clearing criterion",
  "uniform inverse-denominator bounds after erasing the refinement grade or prime-power multiplicities",
  "a geometric integral model, signed determinant or canonical Smith transformation matrices from the selected coefficient cokernel",
  "surjectivity of the raw rational-to-real stage map or a tensor-product scalar-extension equivalence",
  "canonical-completion or topology naturality inferred solely from open-ring naturality"
]
