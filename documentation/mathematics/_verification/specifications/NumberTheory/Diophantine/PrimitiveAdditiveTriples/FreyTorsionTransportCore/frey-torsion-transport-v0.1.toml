[[hostile_controls]]
id = "reject-unbound-point-translation"
description = "The map is P+the EXISTING freyT0 on the EXISTING rational Frey curve; a coordinate analogy is insufficient."
[[hostile_controls]]
id = "reject-affine-formula-at-pole"
description = "Keep x nonzero for the rational formula; the total group map sends T0 to infinity and infinity to T0."
[[hostile_controls]]
id = "reject-translation-as-additive-homomorphism"
description = "Translation by a nonzero point does not preserve the origin; use Equiv, not AddEquiv."
[[hostile_controls]]
id = "reject-two-torsion-as-c3-return"
description = "The translation has period two and no fixed rational point. The three nonzero ports are not invariant since T0 goes to infinity."
[[hostile_controls]]
id = "reject-wrong-ordinate-sign"
description = "For y^2=x(x-a)(x+b), translation by T0 is (-ab/x, +ab*y/x^2), reconciled with Mathlib addX/addY."
[[hostile_controls]]
id = "reject-parameter-label-as-chart-map"
description = "The Tb-to-Ta function pullback sends T_b to (b/a)T_a, not T_a, except in a separately justified equal-scale case."
[[hostile_controls]]
id = "reject-pullback-direction-reversal"
description = "Functions at the target Tb pull back to Ta; the inverse scale is a/b. Keep source/target labels despite the shared quotient-ring type."
[[hostile_controls]]
id = "reject-field-inverse-in-nilpotent-ring"
description = "Use the displayed inverse of source X and prove X*inverseX=1 inside Q[T]/T^3. Do not give the quotient a field instance."
[[hostile_controls]]
id = "reject-linear-as-quadratic-coefficient-scale"
description = "The coefficient vector transforms by diag(1,b/a,(b/a)^2). A Hasse coefficient is not an ordinary second derivative."
[[hostile_controls]]
id = "reject-order-two-map-as-all-order-linear"
description = "The exact full chart y-change has nonzero cubic correction -2b/(a^3*c) at Ta over Q. Do not extend its linear reduction modulo T^3 to the whole completion."
[[hostile_controls]]
id = "reject-reciprocal-as-isometry-or-integral"
description = "The scales 3/2 and 2/3 are reciprocal but not Euclidean unit scales or simultaneously integral at every prime. Record frame and lattice costs separately."
[[hostile_controls]]
id = "reject-point-map-as-global-line-bundle-atlas"
description = "A rational-point permutation and order-two coordinate pullback do not supply scheme-morphism, completion-pullback, line-bundle gauge, global cover or section-space theorems."
[[hostile_controls]]
id = "reject-leaf-replay-as-full-pr-acceptance"
description = "This eleven-local-module target does not cover the retained completion/topology stack. FreyThreePortFrame imports Mathlib; a small local count is not a small upstream trust closure."
[[hostile_controls]]
id = "reject-finite-tests-as-lean-proof"
description = "Independent rational and finite-coefficient tests are not elaboration, exact-type or transitive trust checks."

[acceptance]
