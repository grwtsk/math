[[hostile_controls]]
id = "reject-discrete-jet-as-real-time-topology"
description = "The new finite real coefficient topology is named independently. Do not identify it with the previous discrete-observation completion topology."

[[hostile_controls]]
id = "reject-coefficient-heat-as-elliptic-hodge"
description = "Rate 3 is the selected phase-triangle residual generator plus a closure channel, not the geometric Dolbeault Laplacian or its spectrum."

[[hostile_controls]]
id = "reject-rank-growth-as-gap-proof"
description = "Replicating a fixed finite phase generator over W_k does not prove a uniform gap for growing geometric or arithmetic generators."

[[hostile_controls]]
id = "reject-damped-coherent-section"
description = "Retain the entire phase mean in W_k. High-degree coherent sections are stationary, not damped away."

[[hostile_controls]]
id = "reject-energy-rate-as-state-rate"
description = "The state factor is exp(-3t). Squared defect energy has factor exp(-6t), not exp(-3t)."

[[hostile_controls]]
id = "reject-finite-time-exactification"
description = "For finite real time the exponential is nonzero. Exact zero defect after heat is equivalent to an already exact initial zero defect; tolerance is not equality."

[[hostile_controls]]
id = "reject-unweighted-closure-kernel"
description = "Closure weight must be positive to detect closure. Nonnegative weight suffices only for contraction/nonnegativity."

[[hostile_controls]]
id = "reject-negative-time-contraction"
description = "The formulas and semigroup are defined for real time, but contraction requires t>=0. Backward time can amplify."

[[hostile_controls]]
id = "reject-three-phases-as-torsion-c3"
description = "The three source-indexed section copies are not a C3 action of the geometric two-torsion translation, which remains period two."

[[hostile_controls]]
id = "reject-closure-as-fourth-boundary-port"
description = "The closure copy is independent coefficient data, not a fourth geometric point or the derivative observation added in the earlier rank increment."

[[hostile_controls]]
id = "reject-commutator-map-drift"
description = "Heat commutation must use the old weighted stageEquiv on EVERY phase and closure, not an independently fitted matrix or unequal phase maps."

[[hostile_controls]]
id = "reject-commutation-as-isometry"
description = "Exact heat/port commutation retains the old (ab)^(2k) energy bound. It does not remove source or grade dependence."

[[hostile_controls]]
id = "reject-real-heat-as-integral-flow"
description = "Real scalar attenuation and averaging need not preserve the integer coefficient lattice. Example: half attenuation of (1,-1,0) produces half-integer coefficients."

[[hostile_controls]]
id = "reject-scalar-test-as-function-realization"
description = "Derive all phase-coordinate formulas from the direct mean/relaxation on the old W_k, and bind the energy to the previous basis metric."

[[hostile_controls]]
id = "reject-selected-flow-as-global-section-proof"
description = "This finite flow does not identify W_k with complete H0, construct intrinsic metrics, or prove geometric/adelic interpolation."

[[hostile_controls]]
id = "reject-unelaborated-source-as-acceptance"
description = "Finite exact arithmetic and symbolic exponential checks are not Lean elaboration, exact public-type checks, transitive trust audit or replay evidence."

[[hostile_controls]]
id = "reject-raw-phase-as-normalized-section"
description = "Invert the declared unit phase factors at the retained source labels before applying normalized Cech formulas. Do not infer a complex-module realization from the real specialization."

[[hostile_controls]]
id = "reject-heat-before-tree-subtraction"
description = "The old heat consumes y=z-tree(a), not normalized z or raw q. Matched data can have unequal normalized vertex values."

[[hostile_controls]]
id = "reject-frozen-closure-edge"
description = "Keep edges 01 and 12 fixed and reconstruct 20 from the damped closure. Freezing all edges does not give decay of delta0(z)-a."

[[hostile_controls]]
id = "reject-common-frame-only-gluing"
description = "Equality of all corrected sections without zero edge closure does not inhabit GlueFiber."

[[hostile_controls]]
id = "reject-normalization-with-nonunit-phase"
description = "Phase encoding and decoding use actual units. Division by a zero phase is not a valid chart map."

[[hostile_controls]]
id = "reject-tree-gauge-as-standard-edge-heat"
description = "The selected tree-fixed residual evolution is not exp(-3t) on every Cech 1-cochain; no standard all-degree Hodge-semigroup identification is supplied."

[[hostile_controls]]
id = "reject-reconstruction-only-on-one-edge"
description = "Check both old tree edges, the full closure, and all three mismatch coordinates in source order."

[[hostile_controls]]
id = "reject-finite-algebra-as-geometric-cover"
description = "The filled triangle is a declared finite additive complex. No actual open cover, geometric triple overlap, sheaf cohomology or global H0 is constructed."

[[hostile_controls]]
id = "reject-unequal-transition-port"
description = "The same old linear stageEquiv must act on both sections and transitions; differing edge maps break the reconstructed port/heat square."

[[hostile_controls]]
id = "reject-new-root-as-whole-pr-acceptance"
description = "This target retains 42 previous heat-slice modules plus three new modules. It is not acceptance of every historical topology or height target."

[acceptance]
requires_all_declared_modules = true
requires_exact_public_signatures = true
requires_explicit_failures_and_unavailable_checks = true
requires_named_downstream_blockers = true
requires_root_import_unchanged = true
requires_hostile_controls = true
requires_axiom_audit = true
requires_runtime_safety_scan = true

[nonclaims]
claims = [
  "Lean elaboration, kernel acceptance or external replay",
  "geometric covers, sheaf cohomology or complete global sections",
  "intrinsic Hodge heat or a comparison with a geometric Laplacian",
  "complex Frey-stage realification, primitive omega construction or oscillatory waveform transport",
  "ordinary all-edge Hodge heat from the selected tree-fixed residual flow",
  "exactification of nonzero matching defects at finite time",
  "integral-lattice preservation under real averaging or attenuation",
  "metric isometry, uniform-height or radical-excess estimates",
  "canonical inter-anchor coefficient-base-change naturality",
  "conductor analysis, abc conjecture or Riemann Hypothesis",
  "execution, workflow, worker, merge or issue-closure authority"
]
