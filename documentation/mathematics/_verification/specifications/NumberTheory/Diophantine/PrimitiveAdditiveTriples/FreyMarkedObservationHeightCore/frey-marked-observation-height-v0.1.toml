  "an unmarked elliptic-isomorphism-class or minimal-model height theorem",
  "constant-height coefficients for the normalized section x/c",
  "full arbitrary cochain recovery from a reduced gauge quotient",
  "conductor, minimal discriminant, integral-model or field-extension comparison",
  "a bounded Rad(abc) cost from bounded normalized real coordinates",
  "uniform observation-height, radical-excess, ABC or RH conclusions",
  "execution, workflow, worker, replay, merge, closure or promotion authority"
]
