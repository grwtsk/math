[[hostile_controls]]
id = "reject-replacement-evaluation"
description = "Bind observation and observedRatio to the OLD freyAffinePortEval which reads the actual marked points. A fitted triple of values is not the source adapter."

[[hostile_controls]]
id = "reject-zero-slope-normalization"
description = "The marked-gap denominator is c times v_1. Constant sections have zero gap and cannot instantiate the guarded normalize API."

[[hostile_controls]]
id = "reject-forgotten-common-value"
description = "Subtract y_0 before division. Dividing raw values without removing the affine offset changes the observer."

[[hostile_controls]]
id = "reject-unlabeled-port-swap"
description = "Retain the ordered T0,Ta,Tb source labels and the negative southern sign. Relabeling changes the recovered ordered triple."

[[hostile_controls]]
id = "reject-lost-primitivity"
description = "The exact denominator c uses the source Bezout identity. Nonprimitive common scaling is erased by normalization and cannot be recovered."

[[hostile_controls]]
id = "reject-real-box-as-height-bound"
description = "Normalized entries lie in a bounded real box while their exact denominator and affine height equal c. Finite compactness is not an arithmetic height bound."

[[hostile_controls]]
id = "reject-raw-max-equals-c"
description = "The raw x observation is (0,a,-b), with ordinary max and affine height max(a,b), NOT c=a+b. Only postprocessed or normalized source data have the asserted height c."

[[hostile_controls]]
id = "reject-affine-homogeneous-confusion"
description = "Use the old affine H([1:coordinates]). Homogeneous H([0:a/c:-b/c]) instead removes the scale and has another value."

[[hostile_controls]]
id = "reject-fixed-section-as-model-height"
description = "The coefficient height of x is one. The actual marked-source observation varies with the primitive triple."

[[hostile_controls]]
id = "reject-normalized-section-as-free"
description = "The section x/c itself has coefficient affine height c. Normalization does not make its denominators or arithmetic cost disappear."

[[hostile_controls]]
id = "reject-nonlinear-observer-as-linear-port"
description = "Marked-gap division is rational nonlinear preprocessing and erases section translation/nonzero scale. Source-triple injectivity is not section injectivity. Do not identify it with the earlier four-field combinedQ."

[[hostile_controls]]
id = "reject-source-denominator-as-conductor"
description = "The source denominator here is c, not the composite clearing integer, the conductor or Rad(abc). Keep full valuation depth."

[[hostile_controls]]
id = "reject-family-as-abc-counterexample"
description = "The family (1,N-1,N) proves unbounded height in a bounded real box. Even for N=2^n, prime support of the entire abc product need not be fixed."

[[hostile_controls]]
id = "reject-recovery-as-radical-upper-bound"
description = "Exact primitive recovery and height equality do not supply a uniform upper bound by Rad(abc) or an ABC-equivalent estimate."

[[hostile_controls]]
id = "reject-rounded-recovery"
description = "Recover from exact rational numerator and denominator. Nearby or rounded SVG values can have different exact denominators."

[[hostile_controls]]
id = "reject-source-only-as-acceptance"
description = "No Lean parsing, elaboration, exact-public-signature or transitive trust acceptance follows from these proof scripts or bounded independent tests."

[acceptance]
requires_all_declared_modules = true
