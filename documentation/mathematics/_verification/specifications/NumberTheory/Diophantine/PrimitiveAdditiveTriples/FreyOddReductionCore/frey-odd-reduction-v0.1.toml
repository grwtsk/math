[[hostile_controls]]
id = "reject-residue-only-as-minimal"
description = "Produce the actual IsMinimal predicate by quantifying over every VariableChange with integral output; residue c4 alone is only the input."

[[hostile_controls]]
id = "reject-multiplicative-order-reversal"
description = "Minimal additive discriminant means MAXIMAL multiplicative valuation. The output valuation is bounded above by the old one."

[[hostile_controls]]
id = "reject-nonintegral-variable-change"
description = "An arbitrary nonzero rational scale is admissible as a field change but is not eligible for minimality unless all five output coefficients are integral."

[[hostile_controls]]
id = "reject-finite-change-search-as-proof"
description = "The source proof must quantify over all changes. Independent bounded exact checks are not a minimality certificate."

[[hostile_controls]]
id = "reject-unguarded-c4"
description = "The generic c4 criterion retains valuation(c4)=one. Integral models with nonunit c4 may have a smaller discriminant after a valid change."

[[hostile_controls]]
id = "reject-fitted-prime-ring"
description = "Construct the actual ideal (p), its canonical valuation subring of Q, its localization and DVR instances. Do not assume an unrelated local ring."

[[hostile_controls]]
id = "reject-localization-as-completion"
description = "Z_(p) inside Q is not completed Z_p or Q_p. Completed field and representation results require a separate comparison."

[[hostile_controls]]
id = "reject-model-drift"
description = "Localize the OLD integral coefficient tuple and prove its base change is the OLD freyCurve before attaching reduction predicates."

[[hostile_controls]]
id = "reject-omitted-prime-hypothesis"
description = "Primality belongs in the input type before DVR, local-unit or residue-field reasoning. Composite moduli do not satisfy this contract."

[[hostile_controls]]
id = "reject-primitivity-loss"
description = "The old primitive source and its c4 nondivisibility remain necessary. Nonprimitive common scaling can produce nonminimal equations."

[[hostile_controls]]
id = "reject-two-as-odd"
description = "Both raw c4 and discriminant are nonunits at two. Do not extend the unit-c4 argument there, infer minimality, or classify minimal reduction from the raw residue alone."

[[hostile_controls]]
id = "reject-discriminant-as-conductor"
description = "The displayed minimal-model exponent at odd p is 2vp(abc). Do not call it conductor exponent one or a Tamagawa number."

[[hostile_controls]]
id = "reject-splitness-from-multiplicative"
description = "HasMultiplicativeReduction does not establish split multiplicative reduction or a Tate uniformization."

[[hostile_controls]]
id = "reject-supplied-support-as-observed"
description = "Bind actual reduction to the existing markedSupport/chartSupport theorems. Preserve source and chart identities and the odd-prime guard."

[[hostile_controls]]
id = "reject-depth-compression"
description = "Minimality does not make vp(abc) squarefree. Preserve the exact same-model discriminant multiplicity and earlier denominator/index costs."

[[hostile_controls]]
id = "reject-acceptance-promotion"
description = "Unelaborated proof scripts and exact rational tests do not establish kernel acceptance, an intrinsic Hodge bound, conductor, ABC or RH."

[acceptance]
requires_all_declared_modules = true
requires_exact_public_signatures = true
requires_explicit_failures_and_unavailable_checks = true
requires_named_downstream_blockers = true
requires_root_import_unchanged = true
requires_hostile_controls = true
requires_axiom_audit = true
requires_runtime_safety_scan = true

[nonclaims]
claims = [
  "Lean parsing, elaboration, kernel acceptance or transitive trust acceptance",
  "execution or acceptance of historical replay targets",
  "identifying finite rational checks with universal minimality proofs",
  "minimality or reduction classification at prime two",
  "conductor exponents, Ogg formula, Tamagawa numbers or split multiplicative reduction",
  "completed Z_p or Q_p realizations, Galois representations or Tate uniformization",
  "an intrinsically global minimal Weierstrass model",
  "complete H0, intrinsic Hodge metric or integral section-lattice comparison",
  "cancellation of earlier weighted-map, index, denominator or gauge costs",
  "a uniform observation-height bound by radical support, ABC or RH",
  "workflow dispatch, worker/F06 action, external replay, merge or closure authority"
]
