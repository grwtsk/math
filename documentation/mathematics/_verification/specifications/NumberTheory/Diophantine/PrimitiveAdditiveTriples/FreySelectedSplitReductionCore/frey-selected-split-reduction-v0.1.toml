[[hostile_controls]]
id = "nonzero-affine-scale"
description = "A constant substitution can turn a nonsplit quadratic into a constant. Require nonzero scale."

[[hostile_controls]]
id = "nonzero-clearing-scalar"
description = "Do not cancel a zero scalar; the zero polynomial splits regardless of source splitting."

[[hostile_controls]]
id = "exact-weight-six"
description = "The tangent-polynomial cleared factor is64 at scale2, not16 or4096."

[[hostile_controls]]
id = "retain-shear"
description = "Old slope is u*z+s, not u*z; the selected shear is1 on descent."

[[hostile_controls]]
id = "inverse-direction"
description = "The inverse is(z-s)/u; it is not the forward slope law."

[[hostile_controls]]
id = "dyadic-noncancellation"
description = "64 vanishes modulo2. Reduce the selected integral equation directly instead."

[[hostile_controls]]
id = "dyadic-not-square-test"
description = "Use T^2+T+k at two, not an odd-characteristic square test."

[[hostile_controls]]
id = "dyadic-distinct-roots"
description = "The split roots are0 and1, not distinct r and -r in characteristic2."

[[hostile_controls]]
id = "retain-a3-zero"
description = "The selected shape has a3=0. A general a3=1 can change the binary constant term."

[[hostile_controls]]
id = "good-prime-exclusion"
description = "A split auxiliary polynomial on a good fiber is not split multiplicative reduction."

[[hostile_controls]]
id = "additive-prime-exclusion"
description = "The raw additive binary tangent polynomial can be zero; multiplicative premises remain necessary."

[[hostile_controls]]
id = "nonsplit-locus"
description = "Negation of splitness alone is not nonsplit multiplicative reduction; retain actual multiplicative status."

[[hostile_controls]]
id = "source-labels"
description = "Equal j does not authorize swapping a and b or replacing the rational curve by a twist."

[[hostile_controls]]
id = "minus-a-at-b"
description = "At odd p dividing b the old source parameter remains -a, not a."

[[hostile_controls]]
id = "residue-domain"
description = "Do not assign a residue to rational numbers whose denominator is divisible by p."

[[hostile_controls]]
id = "prime-field"
description = "ZMod4 is not a field and cannot replace the actual residue-field equivalence."

[[hostile_controls]]
id = "retain-depth"
description = "Splitness changes no minimal-discriminant multiplicity, denominator/index cost or height."

[[hostile_controls]]
id = "integral-marked-frame"
description = "Integral model coefficients do not imply integral inverse affine point or jet frames at two."

[[hostile_controls]]
id = "no-bounded-promotion"
description = "Bounded arithmetic checks do not verify universal Lean scripts, dependency closure or trust."

[[hostile_controls]]
id = "no-conductor-promotion"
description = "No conductor, Tate uniformization, Kodaira, Tamagawa, intrinsic Hodge or radical-height claim follows."

[acceptance]
status = "SOURCE_ONLY / NOT_RUN / NOT_KERNEL_AUDITED"
requires_pinned_elaboration = true
