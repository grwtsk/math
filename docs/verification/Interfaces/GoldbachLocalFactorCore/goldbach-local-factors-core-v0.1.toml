[[hostile_controls]]
id = "modulus-two-parity"
description = "The factor at two is two for even targets and zero for odd targets."

[[hostile_controls]]
id = "odd-local-not-global"
description = "A positive odd-prime local factor can coexist with a zero exact Goldbach count."

[[hostile_controls]]
id = "omitted-two-false-positive"
description = "A finite odd-prime product can be positive on an odd target; omitting the factor at two cannot establish admissibility."

[[hostile_controls]]
id = "finite-not-infinite"
description = "A finite product is not an infinite singular series and supplies no convergence or tail bound."

[[hostile_controls]]
id = "density-not-prime-witness"
description = "Local residue survival does not assert that either coordinate is an actual prime integer."

[[hostile_controls]]
id = "normalization"
description = "The exact normalized factor is p times the local residue count divided by (p-1)^2; missing p or a denominator power must fail."

[[hostile_controls]]
id = "divisor-correction"
description = "At odd primes dividing the target, the universal factor must be multiplied by (p-1)/(p-2)."

