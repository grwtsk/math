[[hostile_controls]]
id = "reject-unguarded-chart-division"
description = "UnitPair retains nonzero left/right and sum one. Zero or one boundary values cannot enter through totalized rational division."

[[hostile_controls]]
id = "reject-cycle-as-elliptic-translation"
description = "The order-three arithmetic ratio map is not the old period-two torsion translation, ellipse boundary orbit, or waveform phase."

[[hostile_controls]]
id = "reject-replacement-marked-observer"
description = "Extract the old leftUnit/rightUnit from the actual marked observation and prove source_values before transporting height and support."

[[hostile_controls]]
id = "reject-slot-sign-relabeling"
description = "values retains slots (0,u,-v). Reflection swaps the underlying ratio pair explicitly; it does not silently permute original source identities."

[[hostile_controls]]
id = "reject-positive-chamber-invariance"
description = "Transformed rational charts may have negative entries or entries greater than one. Do not impose positivity on the whole chart orbit."

[[hostile_controls]]
id = "reject-six-labels-as-six-distinct-values"
description = "The half-pair has a reflection stabilizer. Six labelled charts need not have six distinct values; the rational cycle itself has primitive period three."

[[hostile_controls]]
id = "reject-denominator-as-height"
description = "Denominators cycle c,b,a. The full old affine-pair height H([1:0:u:-v]) stays c, including a chart with denominator one."

[[hostile_controls]]
id = "reject-scalar-height-substitution"
description = "The affine height of u alone need not equal the height of (0,u,-v) outside the original positive chamber."

[[hostile_controls]]
id = "reject-denominator-support-as-boundary-support"
description = "Use actual reduced numerator AND denominator supports of both ratios. Changing the pole chart does not remove source primes."

[[hostile_controls]]
id = "reject-summed-common-pole-depth"
description = "Boundary depth is max of the two absolute signed valuations. Their sum double-counts a common pole."

[[hostile_controls]]
id = "reject-independent-pair-depth-invariance"
description = "The unit equation supplies equal valuations or a zero valuation. Without it, the same rational formula need not preserve the maximum depth."

[[hostile_controls]]
id = "reject-nonprime-valuation-comparison"
description = "Valuation/support and depth identities retain a declared rational prime. Zero-factorization conventions cannot certify a prime profile."

[[hostile_controls]]
id = "reject-source-dependent-chart-discount"
description = "Even a source-dependent selector among these six charts retains exactly the same height and truncated counting. No favorable omitted chart cost is allowed."

[[hostile_controls]]
id = "reject-periodicity-as-uniform-height"
description = "An exact three-step return gives no height bound. The source family (1,N-1,N) has height N in every chart."

[[hostile_controls]]
id = "reject-quantifier-or-constant-change"
description = "The chart-bound equivalence retains the same epsilon, constant and all-source quantifier. Neither side of the uniform statement is proved."

[[hostile_controls]]
id = "reject-finite-charts-as-geometric-atlas"
description = "This finite arithmetic chart family does not construct geometric open covers, elliptic jets, Galois descent, integral section spaces or intrinsic Hodge comparison."

[[hostile_controls]]
id = "reject-lost-gauge-or-old-cost-cancellation"
description = "The chart maps are not combinedQ. Old weighted clearing/index/metric costs and the two discarded cochain gauge fields remain separate."

[[hostile_controls]]
id = "reject-unelaborated-script-as-acceptance"
description = "Exact rational tests and static source checks do not parse or elaborate Lean, verify universal terms, or audit the transitive trust closure."

[acceptance]
requires_all_declared_modules = true
requires_exact_public_signatures = true
requires_explicit_failures_and_unavailable_checks = true
requires_named_downstream_blockers = true
requires_root_import_unchanged = true
requires_hostile_controls = true
requires_axiom_audit = true
requires_runtime_safety_scan = true

[nonclaims]
claims = [
  "Lean elaboration, kernel acceptance or transitive trust acceptance",
  "execution or acceptance of historical targets and controls",
  "six distinct chart values for every source",
  "invariance of individual rational denominators or scalar-only affine height",
  "a C3 elliptic-curve translation or physical waveform evolution",
  "a geometric open-cover atlas, complete H0 or intrinsic integral lattice",
  "an intrinsic Hodge estimate, conductor theorem or number-field ideal comparison",
  "cancellation of previous weighted-map costs or recovery of discarded gauges",
  "a favorable height/counting reduction by choosing one of these charts",
  "either side of the equivalent uniform excess statements",
  "uniform radical-height, ABC or RH conclusions",
  "workflow, worker, replay, merge, issue closure or promotion authority"
]
