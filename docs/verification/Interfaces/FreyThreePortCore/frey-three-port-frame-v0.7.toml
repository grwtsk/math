[[hostile_controls]]
id = "reject-two-port-as-saturated-three-port"
description = "The square two-port difference carries a+b and cannot replace the integral three-port recovery theorem."
[[hostile_controls]]
id = "reject-rectangular-as-surjective"
description = "The split obstruction quotient prevents surjectivity of evaluation onto all of Z^3."
[[hostile_controls]]
id = "reject-left-inverse-without-bezout"
description = "Integral recovery, exactness and unit maximal minors require the exact Bezout identity."
[[hostile_controls]]
id = "reject-maximal-minor-unit-without-primitivity"
description = "A nonprimitive pair cannot receive the unit-minor certificate."
[[hostile_controls]]
id = "reject-exactness-without-compatible-kernel"
description = "The image is the explicit compatibility kernel, not the entire target."
[[hostile_controls]]
id = "reject-triple-drift"
description = "The x observations must decode to the same typed primitive additive triple."
[[hostile_controls]]
id = "reject-formal-points-as-elliptic-proof"
description = "Actual points require equation and nonsingularity proofs on the same model."
[[hostile_controls]]
id = "reject-zero-discriminant-as-elliptic"
description = "Field ellipticity requires a proved nonzero discriminant."
[[hostile_controls]]
id = "reject-integral-model-as-integral-elliptic-curve"
description = "Nonzero discriminant in Z does not imply unit discriminant."
[[hostile_controls]]
id = "reject-base-change-model-drift"
description = "Compare the full coefficient tuple along Z to R to K and along the prime-field residue embedding."
[[hostile_controls]]
id = "reject-raw-as-minimal-discriminant"
description = "Raw invariants alone do not prove minimality. The v0.7 variable-change theorem must establish it before using a minimal-discriminant interpretation."
[[hostile_controls]]
id = "reject-point-on-curve-as-two-torsion"
description = "Check P+P=0 independently of membership and nonzeroness."
[[hostile_controls]]
id = "reject-affine-coordinate-space-as-global-sections"
description = "The affine-linear coordinate space is not yet identified with all of H0(E,O(2O))."
[[hostile_controls]]
id = "reject-geometry-map-drift"
description = "Actual affine evaluation must equal scalar extension of the same integral map."
[[hostile_controls]]
id = "reject-integral-left-inverse-as-uniform-isometry"
description = "An on-image lower bound is neither an ambient integral inverse bound nor an isometry."
[[hostile_controls]]
id = "reject-zero-interpolation-cost-as-zero-arithmetic-cost"
description = "Recovery does not erase model, conductor, source-observation height or higher-stage costs."
[[hostile_controls]]
id = "reject-c4-odd-prime-theorem-at-two"
description = "The odd-prime c4 and reduction conclusions must not apply at p=2."
[[hostile_controls]]
id = "reject-c4-unit-without-primitivity"
description = "At a=3,b=6,p=3, both parameters and c4 vanish; retain the primitive source premise."
[[hostile_controls]]
id = "reject-prime-support-as-multiplicity"
description = "Retain the structural square in Delta_raw=16*(abc)^2."
[[hostile_controls]]
id = "reject-raw-discriminant-excess-as-small-error"
description = "The whole raw discriminant excess is not an arbitrarily small epsilon times logRad error."
[[hostile_controls]]
id = "reject-observation-max-as-c"
description = "The observation height is log max(a,b); the triple height is log c, with gap at most log 2."
[[hostile_controls]]
id = "reject-common-support-as-common-divisor"
description = "Normalized content equality requires the full all-divisor statement, including prime powers."
[[hostile_controls]]
id = "reject-base-bound-as-higher-stage-bound"
description = "Coordinate-height recovery does not supply arbitrary intrinsic or refined-jet metric bounds."
[[hostile_controls]]
id = "reject-numerical-sampling-as-Lean-replay"
description = "Exact integer and rational arithmetic checks are not elaboration or transitive trust audits."
[[hostile_controls]]
id = "reject-source-frame-as-abc"
description = "A lower bound for observation height does not upper-bound observation height by radical support."
[[hostile_controls]]
id = "reject-root-import-as-slice-pass"
description = "The legacy trivial root marker or a GRWTSK build is not isolated module coverage."
[[hostile_controls]]
id = "reject-multiplicative-additive-valuation-confusion"
description = "Mathlib uses multiplicative valuation: units have value 1; bad integral elements have value below 1."
[[hostile_controls]]
id = "reject-minimality-as-unproved-field"
description = "Unit-c4 and unit-Delta constructors must derive IsMinimal using all integral variable changes, not accept it as an unexplained proof field."
[[hostile_controls]]
id = "reject-conductor-from-reduction-label"
description = "HasMultiplicativeReduction is not a conductor-exponent, Kodaira-symbol or splitness theorem."
[[hostile_controls]]
id = "reject-dropping-local-carrier-hypotheses"
description = "Retain the DVR R, its fraction field K, characteristic zero, prime p, and residue characteristic p."
[[hostile_controls]]
id = "reject-height-surrogate"
description = "The new statements use Mathlib Height.logHeight and its normalized product-formula API, not an unrelated coefficient norm relabeled as height."
[[hostile_controls]]
id = "reject-unbound-rational-representative"
description = "The scaled rational theorem requires content-one integral v, nonzero k, and the exact equality w=k*v. Zero scaling is rejected."
[[hostile_controls]]
id = "reject-height-direction-reversal"
description = "h(v)<=h(Jv) cannot discharge h(Jx)<=(1+epsilon)logRad(abc)+C."

