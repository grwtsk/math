[[controls]]
id = "B01_exact_parent"
requirement = "Preserve the published 2379-cell candidate, not the older local-only 1429-cell alternative."

[[controls]]
id = "B02_full_partition"
requirement = "Positive widths, positive cap, exact total and nonempty list; no missing suffix, zeros, overlap or arbitrary offsets."

[[controls]]
id = "B03_local_equality"
requirement = "Recompute each chunk predicate and signed total. No acceptance flag or cancellation-only comparison."

[[controls]]
id = "B04_global_seams"
requirement = "Both global image endpoints at every cell, including every artificial block boundary and cyclic closure."

[[controls]]
id = "B05_no_artificial_closure"
requirement = "Do not close individual chunks or identify their signed contributions with loop winding."

[[controls]]
id = "B06_header"
requirement = "Retain positive n, every list length and both domain/image global closures."

[[controls]]
id = "B07_exact_old_result"
requirement = "Verify old_evaluate_iff, evaluate_refines and existence completeness for any admitted partition."

[[controls]]
id = "B08_direct_indexed_refinement"
requirement = "Check original planAt, pointAt and vertex identities within bounds, especially the final closing image."

[[controls]]
id = "B09_same_literal_Success"
requirement = "success_iff_exists_blocks must target the ORIGINAL result=some 1; no replacement success definition."

[[controls]]
id = "B10_no_large_equality_claim"
requirement = "BlockObligations and verifyExpected are definitions, not proofs of any of the 38 large equalities."

[[controls]]
id = "B11_expected_vector"
requirement = "Recompute the length38 signed vector and every actual local contribution, not only its sum one."

[[controls]]
id = "B12_last11"
requirement = "Final interval is [2368,2379); all eleven cells and their successors are mandatory."

[[controls]]
id = "B13_full_jet_errors"
requirement = "Retain actual-source remainder, derivative error, curvature, nonlinear squaring, rounding and identical image-radius semantics."

[[controls]]
id = "B14_signs"
requirement = "Negative block integers remain legal. Final canonical count is not obtained by truncation or absolute value."

[[controls]]
id = "B15_no_resource_claim"
requirement = "Cap64 bounds local cell predicates, not source evaluations, kernel cost, memory or time."

[[controls]]
id = "B16_trust"
requirement = "Elaborate all exact public types, generated members, imports, axioms, native dependencies and predecessor controls."

[[controls]]
id = "B17_diagnostics_not_proof"
requirement = "Independent Python reconstruction and assertion counts are not Lean computation, generic proofs or accepted zero counts."

[[controls]]
id = "B18_scope"
requirement = "No source weakening, root import, merge, issue disposition, worker action or hold release; higher-height and prime-margin suppliers stay separate."
