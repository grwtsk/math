[[controls]]
id = "POSITIVE_GAP"
description = "R<S must hold. Rational totalized division at S=R cannot certify a zero error."

[[controls]]
id = "OUTER_SOURCE_DOMAIN"
description = "The entire outer disk must retain sigma>0 and delta>0; boundary contact fails."

[[controls]]
id = "INNER_RADIUS"
description = "Require R>0 independently of R<S."

[[controls]]
id = "UNIFORM_CURVATURE"
description = "Curvature is bounded at every inner point through translated gap disks, not center samples."

[[controls]]
id = "FACTORIAL_TWO"
description = "The order-two factorial cannot be dropped; the quadratic control retains derivative two."

[[controls]]
id = "CENTER_VS_DISK"
description = "Zero center residual does not control derivative error without an analytic disk bound."

[[controls]]
id = "POLE_CANCELLATION"
description = "Cancel only in the exact identity away from one; do not replace normalized pole value by quotient zero."

[[controls]]
id = "FINITE_ENDPOINT"
description = "Keep every positive-base summand and the exact endpoint power; require N>=1."

[[controls]]
id = "ACTUAL_SOURCE"
description = "Jet bounds concern actual riemannZeta, not the Mellin density or its evaluator."

[[controls]]
id = "NO_CURVATURE_FIELD"
description = "Construct secondBound from geometry; do not accept an unproved curvature input."

[[controls]]
id = "CENTER_ESTIMATES_REQUIRED"
description = "Fictitious zero center data can pass arithmetic but has no true CenterEstimates."

[[controls]]
id = "OLD_NEWTON_GUARDS"
description = "Keep strict contraction, complete disk invariance and both independent center error charges."

[[controls]]
id = "SEPARATE_COUNT"
description = "Family estimates do not supply the complete canonical height count or positive prime margins."

[[controls]]
id = "PRECISION_COST"
description = "The N^(-sigma) source allowance and 1/S derivative factor do not shrink by floating precision alone."
