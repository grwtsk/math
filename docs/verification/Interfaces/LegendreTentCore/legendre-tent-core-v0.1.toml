[[hostile_controls]]
id = "radius-not-diameter"
description = "Normalized tent has main term h, not 2h or h squared."

[[hostile_controls]]
id = "strict-support"
description = "Both square endpoints vanish; positivity is exactly the open interval."

[[hostile_controls]]
id = "proper-powers-retained"
description = "Zero upper-square weight does not remove interior proper powers such as 8 in (4,9)."

[[hostile_controls]]
id = "different-observable"
description = "squareTentMangoldt is not squareIncrement; no substitution without an identity."

[[hostile_controls]]
id = "common-riesz-prefix"
description = "Use the same complete finite prefix in all three Riesz terms."

[[hostile_controls]]
id = "removable-parameters"
description = "The quotient is restricted away from zero and minus one; the integral definition is retained."

[[hostile_controls]]
id = "horizontal-coordinate"
description = "beta is a proved horizontal bound, never an implicit critical-line projection."

[[hostile_controls]]
id = "finite-tail-not-completeness"
description = "Finite inverse-height decay does not supply an infinite zero-count theorem or source coverage."

[[hostile_controls]]
id = "written-versus-lean"
description = "The written contour/zero-count/tail derivation is not in the Lean acceptance scope."

[[hostile_controls]]
id = "inherited-trust"
description = "A merged producer or a parent manifest does not establish this target's elaboration or trust audit."

