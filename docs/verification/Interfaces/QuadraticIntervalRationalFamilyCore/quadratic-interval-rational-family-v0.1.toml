[[controls]]
id = "external_family"
requirement = "Exact external list controls every center, key and positive natural multiplicity. A key is not analytic provenance."

[[controls]]
id = "unique_keys"
requirement = "Reject duplicate external keys; do not deduplicate equal centers or equal heights with distinct keys."

[[controls]]
id = "record_order"
requirement = "Require one matching key and complete interval proof per position; reject missing, extra or reordered records."

[[controls]]
id = "multiplicity"
requirement = "Scale values AND complete member errors by the same multiplicity. Reject zero-weight skip attempts."

[[controls]]
id = "shared_endpoints"
requirement = "All local intervals use exactly the external a,b; changed endpoints require new checks."

[[controls]]
id = "all_inner_checks"
requirement = "Retain each member mesh, every log and exponential check, and its internal accumulation. No prefix-only success."

[[controls]]
id = "outer_arithmetic"
requirement = "Require zero initialization, exact length and every weighted update. Include imaginary and multiplication error."

[[controls]]
id = "error_sign"
requirement = "Reject negative radii and tolerance; recompute total error rather than trust a supplied final claim."

[[controls]]
id = "tolerance_scope"
requirement = "Member tolerance is not family tolerance. Failure means not certified, not actual error lower bound."

[[controls]]
id = "constructed_acceptance"
requirement = "Reference construction must pass for all stated per-node guards; do not assume a passing family witness."

[[controls]]
id = "empty_family"
requirement = "Accept only the empty finite sum with one zero accumulator; no complete-divisor conclusion."

[[controls]]
id = "coordinate_transport"
requirement = "Retain separately proved coordinate/horizontal enclosures on identical indices and multiplicities; no tail or source mismatch as radius."

[[controls]]
id = "trust"
requirement = "Exact types and complete inherited/transitive trust acceptance required; root-only success or Python cases cannot accept Lean."
