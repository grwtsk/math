[[hostile_controls]]
id = "reject-unbound-cost-data"
description = "Use Nat.card of the OLD CombinedCokernel and bind clearing to the OLD combinedMap universal-image criterion. Do not introduce independent supplied index or valuation values."

[[hostile_controls]]
id = "reject-zero-as-finite-prime-budget"
description = "Every arithmetic product/index budget requires nonzero input. Nat.factorization zero is a library convention, not a finite multiplicity profile of a zero ideal or an infinite group."

[[hostile_controls]]
id = "reject-composite-as-prime-coordinate"
description = "Only declared primes identify factorization coordinates with p-adic valuation. Coordinates at nonprimes are zero, not composite-base orders."

[[hostile_controls]]
id = "reject-grade-zero-support-upgrade"
description = "At grade zero the chart costs have support {2,3}; primes of ab must not be inserted unless the grade is positive."

[[hostile_controls]]
id = "reject-four-field-index-loss"
description = "Retain r_k*v_p(48)+4*k*k*v_p(ab). The factor four comes from the four reduced fields of the existing composite."

[[hostile_controls]]
id = "reject-radical-as-multiplicity"
description = "Equal radical or occupied support does not identify clearing depth, total index length, or excess."

[[hostile_controls]]
id = "reject-omitted-product-overlap"
description = "Product excess is the sum of the two excesses PLUS one shared-support occurrence per common prime. Logarithmic overlap is retained."

[[hostile_controls]]
id = "reject-double-counted-support"
description = "The support of a product is the union, not a multiset sum. The exact support-log identity has the intersection correction."

[[hostile_controls]]
id = "reject-clearing-as-index"
description = "The clearing number 12*|ab|^k and cokernel order 48^r_k*|ab|^(4k*k) have different valuation and log formulas."

[[hostile_controls]]
id = "reject-hidden-chart-exceptions"
description = "Keep the fixed chart primes 2 and 3. A prime such as 3 can be absent from the primitive source abc and must not be silently identified with its support."

[[hostile_controls]]
id = "reject-unsigned-map-substitution"
description = "The positive generator is reconciled by absolute-value divisibility with the OLD signed clearing criterion; the function map and signed columns are unchanged."

[[hostile_controls]]
id = "reject-incomplete-log-support"
description = "Log decompositions use the complete actual finitely supported factorization. A finite sample of primes is not a complete budget."

[[hostile_controls]]
id = "reject-log-budget-as-local-norm"
description = "These are integer factorization and logarithmic identities, not new p-adic operator-norm, adelic normalization or height-comparison theorems."

[[hostile_controls]]
id = "reject-auxiliary-counterfamily-as-abc-refutation"
description = "The fixed (2,3,5) example varies the auxiliary grade. Its unbounded cost does not refute abc or rule out another source-bound construction."

[[hostile_controls]]
id = "reject-integer-profile-as-ideal-geometry"
description = "Do not promote natural-number support to general number-field ideal norms, ramification, conductor, minimal-model or intrinsic integral-section claims."

[[hostile_controls]]
id = "reject-unelaborated-budget-as-acceptance"
description = "Exact finite arithmetic and lexical checks do not elaborate Lean, verify exact signatures, or audit the transitive trust closure. Historical controls remain unexecuted."

[acceptance]
requires_all_declared_modules = true
requires_exact_public_signatures = true
requires_explicit_failures_and_unavailable_checks = true
requires_named_downstream_blockers = true
requires_root_import_unchanged = true
requires_hostile_controls = true
requires_axiom_audit = true
requires_runtime_safety_scan = true

[nonclaims]
claims = [
  "Lean elaboration, kernel acceptance, exact-public-signature or transitive trust acceptance",
  "replacement or execution of any historical target or hostile control",
  "a p-adic operator norm or a global adelic height comparison",
  "general number-field ideal factorization, norms, ramification or descent",
  "geometric covers, polar divisors, complete H0 or intrinsic integral lattices",
  "conductor, minimal discriminant, good reduction or characteristic-two classification",
  "identification of auxiliary chart support with the source abc support",
  "uniform-in-grade excess for the selected composite",
  "a counterexample to abc from increasing auxiliary grade at fixed source",
  "an intrinsic Hodge estimate or removal of metric and gauge costs",
  "uniform observation-height, radical-excess, abc or RH conclusions",
  "execution, workflow, worker, merge, issue closure or target promotion authority"
]
