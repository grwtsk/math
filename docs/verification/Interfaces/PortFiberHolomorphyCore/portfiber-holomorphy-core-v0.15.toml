[[hostile_controls]]
id = "reject-mismatched-middle-object"
description = "Typed port and certified-path composition must retain exact endpoints and middle objects."

[[hostile_controls]]
id = "reject-path-certificate-drop"
description = "A composite certified path retains every selected composable certificate."

[[hostile_controls]]
id = "reject-path-map-drift"
description = "Composite fiber maps agree with atom-by-atom certified-path evaluation."

[[hostile_controls]]
id = "reject-source-name-as-proof"
description = "Repository, revision, path, and declaration metadata cannot populate theorem or certificate proof fields."

[[hostile_controls]]
id = "reject-ring-label-without-ring-hom"
description = "RingCertificate reconstructs the exact port homomorphism; ofHom requires map equality and hom_ofHom recovers it."

[[hostile_controls]]
id = "reject-data-certificate-as-proposition"
description = "RingCertificate and TopologicalRingCertificate inhabit Prop; their homomorphisms are reconstructed from the fixed map and ring laws."

[[hostile_controls]]
id = "reject-ring-continuity-drift"
description = "Ring laws and continuity certify the same exact port function."

[[hostile_controls]]
id = "reject-continuity-as-holomorphy"
