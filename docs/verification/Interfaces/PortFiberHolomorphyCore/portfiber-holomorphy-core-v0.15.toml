requires_named_downstream_blockers = true
requires_root_import_unchanged = true
requires_hostile_controls = true
requires_axiom_audit = true
requires_runtime_safety_scan = true

[nonclaims]
claims = [
  "source-specific arithmetic-to-elliptic coordinate-ring map or B_n",
  "global elliptic or Poncelet comparison theorem",
  "holomorphic gluing on arbitrary non-open covers",
  "classification or topological nontriviality of the constructed line bundle",
  "chosen global frame or trivialization for every cocycle",
  "Picard, Chern-class, K-theory, or KK identification",
  "algebraic-to-analytic structure-sheaf comparison or general dependent-fiber sheaf descent",
  "coordinate-ring equality from spectrum point-map agreement alone",
  "topological embedding or surjectivity of analytic evaluation into the spectrum",
  "identification of analytic points with all prime ideals",
  "injectivity of every analytic-affine bridge",
  "automatic basewise continuity or holomorphic-section preservation of every local fiber operator",
  "uniform operator norms, metric or adjoint preservation, Laplacian or heat intertwining",
  "unbounded-operator domain, regularity, or analytic Kasparov-product theorem",
  "complete explicit formula, convergence to the Weil form, or Weil positivity",
  "proof or refutation of RH or ABC",
  "automatic carrier-topology continuity of arbitrary ring homomorphisms",
  "holomorphy from continuity or automatic residual discharge from local certification",
  "classification of an unresolved application obligation as false"
]
