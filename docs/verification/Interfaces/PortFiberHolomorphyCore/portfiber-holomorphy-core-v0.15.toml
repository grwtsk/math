description = "The constructed bundle provides no global frame, metric preservation, self-adjointness, Laplacian/heat intertwining, Picard identification, or K/KK classification theorem."

[[hostile_controls]]
id = "reject-nonunit-gauge"
description = "Gauge.frame contains units in the actual holomorphic-section rings. Replay Fixtures.unitValue_ne_zero; zero or unproved invertibility cannot provide a gauge."

[[hostile_controls]]
id = "reject-gauge-orientation-drift"
description = "Gauge.compatible retains h_j*g_ij = gprime_ij*h_i at the exact overlap and Gauge.comp retains the middle cocycle and H-after-G order."

[[hostile_controls]]
id = "reject-nonholomorphic-inverse-gauge"
description = "Gauge.symm uses inverse holomorphic units; pointwise invertibility of an unrelated function cannot supply the inverse analytic section."

[[hostile_controls]]
id = "reject-frame-change-cocycle-gap"
description = "Construction.changeFrames proves the diagonal and triple laws for h_j*g_ij*h_i_inverse; changeFramesGauge binds that actual cocycle to its gauge."

[[hostile_controls]]
id = "reject-gauge-homeomorphism-by-fiber-defeq"
description = "Gauge.totalHomeomorph requires proved forward and inverse continuity in the actual constructed bundle topologies; totalMap_coordinate and totalMap_proj bind it over the same base."

[[hostile_controls]]
id = "reject-gauge-as-isometry"
description = "Replay Fixtures.doubling_not_modelNormPreserving. A genuine holomorphic gauge may fail to preserve the standard model-fiber norm; no metric, adjoint, or heat law is supplied."

[[hostile_controls]]
id = "reject-gauge-operator-map-drift"
description = "descend_conjugacy and mapSection_naturality use the same gauge as bundleSectionEquiv and totalHomeomorph. Holomorphy is transported from PreservesHolomorphy, not inferred from linearity."

[[hostile_controls]]
id = "reject-gauge-target-or-ledger-promotion"
description = "PortFiberGaugeTransport is a disjoint portfolio extension preserving prior branch dispositions and the terminal target; no residual, Picard, K/KK, arithmetic, or target certificate is created."

[acceptance]
requires_all_declared_modules = true
