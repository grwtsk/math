[[hostile_controls]]
id = "actual-source-not-surrogate"
description = "source_eq_mathlib_psi must identify the unchanged SourcePairing.chebyshevPrimePower and Mathlib.psi at all real cutoffs."

[[hostile_controls]]
id = "prime-power-is-not-prime"
description = "positive_source_without_prime retains the positive log-three source increment in (8,9] with zero prime count."

[[hostile_controls]]
id = "full-correction-support"
description = "properPrimePowerMass_eq_supported_sum must preserve each integer once with its original von Mangoldt weight, not log of the power or an arbitrary discrepancy field."

[[hostile_controls]]
id = "upper-square-endpoint"
description = "first_square_upper_correction and upper_endpoint_omission_changes_correction retain the log-two contribution at four."

[[hostile_controls]]
id = "strict-positive-margin"
description = "non_strict_margin_control blocks upgrading a zero corrected margin to a prime witness."

[[hostile_controls]]
id = "open-endpoint-guard"
description = "prime_upper_endpoint_control blocks dropping the nonprime upper-endpoint hypothesis."

[[hostile_controls]]
id = "no-average-to-universal"
description = "legendre_of_prefix_and_source_margins must retain complete prefix coverage and the every-input approximation, correction and strict margin hypotheses."

[[hostile_controls]]
id = "coarse-is-not-sharp"
description = "properPrimePowerMass_le_coarse_bound is a global-scale inherited estimate, not the written polylogarithmic square-interval estimate or a vanishing relative error."

[[hostile_controls]]
id = "inherited-replay-and-source-drift"
description = "A root-only pass, omitted dependency, changed theorem type, stale base or absent axiom report cannot satisfy this target; #264 remains unaccepted until its exact replay passes."

[acceptance]
requires_all_declared_modules = true
requires_exact_public_signatures = true
requires_explicit_failures_and_unavailable_checks = true
requires_named_downstream_blockers = true
requires_inherited_source_replay = true

[nonclaims]
claims = [
  "new prime-distribution estimate",
  "formalized polylogarithmic square-interval proper-power bound",
  "explicit-formula approximation or omitted-zero tail",
  "uniform strict margins for all square intervals",
  "any Landau conjecture or RH",
  "external replay acceptance, execution or merge authority"
]
