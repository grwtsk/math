[[controls]]
id = "positive-square"
required_behavior = "Literal four-edge source cover and deformation use actual F(1)=1, not an enclosure premise."

[[controls]]
id = "all-edges"
required_behavior = "Missing, extra and last-edge defects reject; no final-edge omission."

[[controls]]
id = "external-geometry"
required_behavior = "Changed external vertices must be checked again; record values are not the domain identity."

[[controls]]
id = "domain-closure"
required_behavior = "Last domain point equals the first exactly; no tolerance closure."

[[controls]]
id = "image-closure"
required_behavior = "Image vertex chain closes independently and shares one endpoint at every seam."

[[controls]]
id = "one-common-disk"
required_behavior = "Two endpoints in different disks do not establish one full edge in either disk."

[[controls]]
id = "radius-signs"
required_behavior = "Negative radii and zero/negative Cauchy gaps reject before denominators can be evidence."

[[controls]]
id = "strict-margin"
required_behavior = "Equality is rejected; finite guard failure is not evidence of a zero."

[[controls]]
id = "imaginary-components"
required_behavior = "Squared-ball tests retain imaginary endpoint and image deviations."

[[controls]]
id = "source-semantics"
required_behavior = "False value two at one can pass arithmetic; Enclosures is independently false."

[[controls]]
id = "degeneracy"
required_behavior = "Accepted repeated vertices and reversed chains confer neither Jordan simplicity nor orientation."

[[controls]]
id = "parameter-domain"
required_behavior = "All-point deformation and segment conclusions retain 0<=t,lambda<=1."

[[controls]]
id = "point-samples"
required_behavior = "Synthetic s-1 has nonzero endpoints but zero at the midpoint."

[[controls]]
id = "interior-count"
required_behavior = "Synthetic identity is nonzero on an entire boundary but zero inside it."

[[controls]]
id = "positive-half-plane"
required_behavior = "Outer source disks remain inside Re>0; no implicit analytic continuation of error bounds."

[[controls]]
id = "buffered-top"
required_behavior = "The closed target height T is strictly inside the open regional top T+1/4."

[[controls]]
id = "mirror-not-injective"
required_behavior = "Actual reflection represents a left-side zero; the representative map is not asserted injective."

[[controls]]
id = "line-recovery"
required_behavior = "Recovery from a regional representative uses the sourced fixed-line point, not arbitrary uniqueness."

[[controls]]
id = "upper-count-input"
required_behavior = "count(15)<=1 remains unconstructed and cannot be replaced by a lower count or a finite guard."

[[controls]]
id = "free-not-based"
required_behavior = "Edge deformations may move base values; global loop/winding/argument-principle coercions are not supplied."

[[controls]]
id = "pole-on-bottom"
required_behavior = "The proposed counting rectangle contains one on its bottom edge; F(1)=1 is used, not raw totalization."
