[[controls]]
id = "source_identity"
requirement = "Conclude the original integral-defined tentKernel, using its existing split-integral theorem; never substitute interval kernel or new polynomial target."

[[controls]]
id = "shifted_domain"
requirement = "Do not call the rational node checker at z+1 for a general Re(z)<=1 input; keep every numerical call at original z."

[[controls]]
id = "positive_geometry"
requirement = "Require h>0, x-h>1 and N>0. The analytic Re<=2 bound does not widen the rational Re<=1 domain."

[[controls]]
id = "exact_midpoints"
requirement = "Construct both half grids and their midpoints from the same external x,h,N; split exactly at the tent kink."

[[controls]]
id = "integrated_masses"
requirement = "Derive the integrated affine masses, positivity and total h. Diameter 2h or bare interval widths are not substitutes."

[[controls]]
id = "every_node"
requirement = "Require exactly N samples in each half and every inherited log/seed/square check at its exact midpoint."

[[controls]]
id = "outer_arithmetic"
requirement = "Require 2N+1 values, 2N nonnegative radii, zero initialization, both complex components and every exact weighted update."

[[controls]]
id = "precision"
requirement = "Retain mesh plus full weighted node allowances plus outer arithmetic. Node-only tolerance is not integral tolerance."

[[controls]]
id = "nonvacuity"
requirement = "Construct acceptance at every admitted per-node resolution; include exact constant-density zero-error check."

[[controls]]
id = "removable_parameters"
requirement = "At z=0 and z=-1 retain the integral definition; do not evaluate the singular quotient."

[[controls]]
id = "full_dependency_review"
requirement = "Audit the retained TentWeight/TentMellinKernel mathematical source including compatibility repairs and full inherited target chain, including generated types and any unreported native dependencies."

[[controls]]
id = "scope"
requirement = "No canonical tent-family membership, zero multiplicity, full source identity, omitted-tail theorem, parser or runtime qualification follows from this single transform check."
