[[hostile_controls]]
id = "reject-finite-hodge-as-geometric-dolbeault"
description = "The adjoints and Laplacians use the old finite ordered triangle with standard real unit weights, not an elliptic Dolbeault operator or a geometric cover."

[[hostile_controls]]
id = "reject-transpose-with-wrong-metric"
description = "Bind transpose identities to the declared scalar Euclidean pairing. Different edge, vertex or bundle metrics require new adjoints and constants."

[[hostile_controls]]
id = "reject-tree-flow-as-all-edge-heat"
description = "Standard finite degree-one heat damps all three edges. The old tree-fixed flow preserves edges 01 and 12; never identify the two full-data maps."

[[hostile_controls]]
id = "reject-gauge-sign-or-direction"
description = "Use treeRelax(d,v)=gaugeShift((1-d)*centered(tree(edges)),hodgeRelax(d,v)). The gauge shifts vertices AND edges through delta0 with the declared sign."

[[hostile_controls]]
id = "reject-corrected-mean-as-reduced-invariant"
description = "The reduced invariant is the ORIGINAL vertex mean together with delta0(z)-a. The tree-corrected mean is a different gauge-dependent quantity."

[[hostile_controls]]
id = "reject-unrestricted-gauge-injectivity"
description = "Mismatch alone is invariant under all coboundaries; preserving the mean requires zero-mean gauge. Reduced equality characterizes gauge equivalence, not equality of full cells."

[[hostile_controls]]
id = "reject-unconstructed-quotient-carrier"
description = "The source supplies a surjective invariant map and an exact fiber characterization. It does not construct an additional quotient Hilbert space or scheme quotient."

[[hostile_controls]]
id = "reject-gauge-as-fixed-linear-conjugacy"
description = "The comparison gauge depends on initial edges and attenuation. The scalar standard and tree generators have different kernels; no fixed invertible similarity is supplied."

[[hostile_controls]]
id = "reject-corrected-defect-as-six-field-norm"
description = "The prior corrected-frame defect is not the standard norm of all six cochain coordinates. Tree-fixed half attenuation can increase the latter from 1 to 17/12."

[[hostile_controls]]
id = "reject-gauge-as-isometry-or-integral"
description = "Mean subtraction introduces thirds and arbitrary real attenuation introduces further scalars. Exact additive gauge equivalence gives neither metric isometry nor integer-lattice preservation."

[[hostile_controls]]
id = "reject-attenuation-as-finite-heat-time"
description = "The algebraic formulas allow arbitrary attenuation d, including zero and negative controls. Actual finite heat uses exp(-3t)>0; d=0 is a limit."

[[hostile_controls]]
id = "reject-backward-time-contraction"
description = "Contraction of the standard six-coordinate energy is asserted only for t>=0 or scalar 0<=d<=1. Negative heat time may amplify."

[[hostile_controls]]
id = "reject-standard-projection-as-full-matching-kernel"
description = "The standard zero-attenuation fixed space has diagonal vertices and ZERO edges; tree-fixed relaxation fixes matched cells with nonzero exact edges."

[[hostile_controls]]
id = "reject-finite-time-matching-creation"
description = "Finite heat has nonzero attenuation, so exact matching is preserved and reflected. A displayed cycle or tolerance cannot create it."

[[hostile_controls]]
id = "reject-unbound-frey-comparison"
description = "Specialize to the OLD real W_k and OLD FreyCechHeat.evolve. Derive basis-coordinate ODEs and sixEnergy from those same functions; no independently fitted coefficient model."

[[hostile_controls]]
id = "reject-phasewise-port-drift"
description = "The same OLD weighted stageEquiv acts on all six fields and on the comparison gauge. Unequal phase maps or a different matrix cannot inherit this naturality."

[[hostile_controls]]
id = "reject-finite-gap-as-uniform-intrinsic-gap"
description = "Repeating the finite triangle over larger W_k retains a selected finite gap only. No geometric spectral, global-section, height, denominator or conductor bound follows."

[[hostile_controls]]
id = "reject-static-checks-as-lean-acceptance"
description = "Independent finite exact arithmetic, lexical checks and a static manifest do not elaborate Lean, audit transitive axioms, run hostile Lean fixtures or authorize execution."

