[[hostile_controls]]
id = "reject-unbound-real-map"
description = "Use the OLD rational combinedQ and inverseQ; derive both block formulas before attaching archimedean norms."

[[hostile_controls]]
id = "reject-diagonal-four-as-raw-five"
description = "The raw edge rows have absolute coefficient sum five. A diagonal-frame maximum of four is not this map norm."

[[hostile_controls]]
id = "reject-archimedean-frame-isometry"
description = "The integral difference frame is p-adically isometric but changes the ordinary max norm of (0,1,-1,0) from one to two."

[[hostile_controls]]
id = "reject-copied-one-section-bound"
description = "The previous one-section L_k bound lacks the four-field chart row constant and cannot be copied to combinedQ."

[[hostile_controls]]
id = "reject-zero-weight-inversion"
description = "Nonzero ab is retained before inverse estimates or the claim that every integer weight has absolute size at least one."

[[hostile_controls]]
id = "reject-target-indexed-weight"
description = "The old SOURCE weight w_i is read at target reverse(i), including both X/Y basis blocks."

[[hostile_controls]]
id = "reject-lost-common-edge"
description = "The inverse reads e0/w as well as both differences; only tracking differences loses the sharp inverse witness."

[[hostile_controls]]
id = "reject-squared-energy-convention"
description = "These are unsquared ordinary maximum norms, not the old sum-of-squares energy or intrinsic Hodge metric."

[[hostile_controls]]
id = "reject-forward-inverse-cost-swap"
description = "Sharp forward factor is 5|ab|^k, inverse factor one at infinity. Finite-place inverse factors are separate and nontrivial."

[[hostile_controls]]
id = "reject-index-as-operator-cost"
description = "Keep index 48^r|ab|^(4k^2) separate from clearing 12|ab|^k and the sum of local inverse norms."

[[hostile_controls]]
id = "reject-five-as-bad-prime"
description = "The archimedean row constant five does not assert a new finite-place denominator prime five."

[[hostile_controls]]
id = "reject-coefficient-height-as-model-height"
description = "The supplementary affine coefficient argument concerns [1:parameters] in a fixed frame, not the marked curve or primitive triple."

[[hostile_controls]]
id = "reject-quotient-height-recovery"
description = "Four reduced fields still discard two gauge fields. Inverting combinedQ does not recover arbitrary full cochains."

[[hostile_controls]]
id = "reject-fitted-uniformity"
description = "All formulas retain source |ab| and auxiliary grade k, including grade zero. No uniform-in-source or grade estimate follows."

[[hostile_controls]]
id = "reject-note-as-formal-height-declaration"
description = "The mathematical-note affine-height derivation and bounded tests are not exported Lean height declarations or kernel acceptance."

[[hostile_controls]]
id = "reject-import-repair-as-replay"
description = "Two import-only repairs replace the absent Mathlib.Tactic.Omega by the declared Lean toolchain module. This is not complete dependency or elaboration acceptance."

