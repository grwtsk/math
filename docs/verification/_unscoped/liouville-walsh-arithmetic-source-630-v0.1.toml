[[hostile_controls]]
id = "actual-Liouville-source"
must_preserve = "ArithmeticFunction.liouville is the pinned Mathlib integer function, not a generic invented +/-1 sequence or a declared Chowla premise."

[[hostile_controls]]
id = "lambda-zero-exception"
must_preserve = "Mathlib lambda(0)=0, so use lambda(n+h+1) for nonnegative finite roots and shifts. Never assert a unit sign at zero or drop the +1."

[[hostile_controls]]
id = "bool-sign-orientation"
must_preserve = "boolSign true=+1 and false=-1. Exact pointwise boolSign of liouvillePositiveBool equals integer lambda(n+1) cast to rationals, no sign reversal."

[[hostile_controls]]
id = "all-order-exact-normalization"
must_preserve = "The subset coefficient is the ordinary uniform mean 1/N of products over every selected shift. For N=0 the rational coefficient convention is zero; only N>0 normalizes the empty character to one."

[[hostile_controls]]
id = "full-distinct-subset-family"
must_preserve = "Finset shifts are distinct and the correlation energy sums ALL nonempty subsets of the finite shift subtype with no omitted higher-order term or repeated subset."

[[hostile_controls]]
id = "real-cyclic-collar"
must_preserve = "The consumer requires max(H)<N. The finite modulo-N cyclic sign source is lambda(((n+h) mod N)+1), using actual first N arithmetic labels and an exact r/N collar."

[[hostile_controls]]
id = "conditional-analytic-allorder-premise"
must_preserve = "LiouvilleAllOrderOrdinaryEnvelope is a Prop requiring a single epsilon for ALL nonempty subsets at exact N,H. Its exact equivalence with the generic envelope does NOT furnish an inhabitant."

[[hostile_controls]]
id = "fixed-binary-not-higher-order"
must_preserve = "The external 2026 fixed nonproportional binary result, even if verified, does not produce all-order ordinary Liouville cancellation or shift-uniform growing-window control."

[[hostile_controls]]
id = "no-GUE-RH"
must_preserve = "Finite Boolean pattern, Walsh energy and cyclic TV identities do not imply microscopic spectral statistics, Montgomery pair correlation or the Riemann Hypothesis."

[[hostile_controls]]
id = "trust-not-execution"
must_preserve = "The source inventory, finite tests, and passive manifest do not imply Lean/Lake elaboration, kernel trust, source import resolution, CI success or a replay receipt."

