# Authored mathematical verification specification; not an execution receipt.
# Source identities, inspected types, and audit evidence are supplied externally.
schema = "grwtsk-math-replay-target-v1"
id = "ethics-mechanistic-reasoning-v0.1"
owner_repository = "grwtsk/math"
mathematical_author = "grwtsk contributors"
formalization_assistance = "OpenAI Codex"
lean_toolchain_file = "lean-toolchain"
lean_toolchain = "leanprover/lean4:v4.33.0"
lake_manifest_file = "lake-manifest.json"

[scope]
kind = "isolated-mathematical-replay-target"
selection = "the three explicitly enumerated Init-only modules"
requires_clean_checkout = true
requires_exact_declaration_types = true
requires_module_coverage_reconciliation = true
requires_axiom_audit = true
operational_receipt_is_external = true
public_root_exposure_required = false
full_library_build_required = false
extra_declarations_do_not_expand_claims = true
application_correspondence_is_separate = true

[source_binding]
supplied_by = "external execution or review binding"
repository_commit_tree_and_blobs_required = true
manifest_does_not_bind_its_own_content_identity = true
all_selected_sources_must_belong_to_one_bound_tree = true
required_external_identities = [
  "repository commit",
  "repository tree",
  "this target manifest blob",
  "each selected module source blob",
  "lean-toolchain blob",
  "lake-manifest.json blob",
  "Lean compiler and Init distribution identity",
]
expected_type_binding = "The external binding must select exact elaborated types, universe parameters, declaration kinds, and owner modules from the bound sources before acceptance; replay inspection must compare against that binding."
type_representation = "External inspection must identify its canonical type representation and any printer configuration; names or source spellings alone do not establish type identity."

[build]
mode = "direct Lean elaboration of every listed source file"
required_compiler_options = ["-DwarningAsError=true"]
expected_direct_imports = ["Init"]
require_exact_direct_imports = true
require_compiler_toolchain_match = true
require_zero_errors_and_warnings = true
require_all_selected_modules = true
mathlib_required_for_selected_modules = false
mathlib_fetch_required_for_this_target = false
repository_dependency_manifest_is_bound_as_context = true
generated_build_outputs_and_logs_are_external = true

[declaration_inventory]
required_count = 71
theorem_count = 47
core_count = 45
fixture_count = 26
module_count = 3
explicit_head_kinds = ["definition", "theorem", "inductive", "structure"]
nonempty = true
duplicate_free = true
exact_names_selected = true
exact_owner_modules_selected = true
exact_universe_polymorphic_types_required = true
reconcile_all_explicit_heads_in_selected_modules = true
generated_constructors_recursors_and_projections_are_not_separate_inventory_entries = true
generated_dependencies_remain_in_transitive_trust_inspection = true

[trust]
# This is the required acceptance policy, not a report of an observed axiom set.
allowed_axioms = []
reject_sorry_ax = true
reject_native_decide = true
reject_native_proof_dependencies = true
reject_unreported_native_dependencies = true
reject_unavailable_audit = true
reject_missing_audit_as_empty_axiom_set = true
require_transitive_dependency_inspection = true
require_kernel_checked_proof_terms = true
proof_search_success_alone_is_insufficient = true

[axiom_audit]
selection = "every explicitly declared theorem, including every fixture theorem"
