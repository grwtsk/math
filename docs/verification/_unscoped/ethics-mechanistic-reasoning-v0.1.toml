[application_obligations]
open_requirements = [
  "Interpret roots, scoped delegation, identity, time, and revocation independently of the finite derivation calculus.",
  "Establish that the real execution lies in the admissible trace model and that its observation is represented correctly.",
  "Establish the completeness and correctness of concrete transitions, effect labels, and the effect classifier for any proposed application.",
  "Supply independently justified initial and step simulation premises and the policy bridge; labels alone do not establish semantic correspondence.",
  "Assess initial-state and effect-predicate vacuity before using a safety result as evidence for a useful application.",
  "Assess ethical, medical, legal, accessibility, privacy, and institutional duties through their own qualified processes.",
]

