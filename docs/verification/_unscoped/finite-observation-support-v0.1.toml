# Authored mathematical verification specification; not an execution receipt.
# Source-bound validation and acceptance evidence is retained externally.
# This specification grants no execution permission and releases no retained hold.
schema = "grwtsk-math-replay-target-v1"
id = "finite-observation-support-v0.1"
owner_repository = "grwtsk/math"
mathematical_author = "R.A. Jacob Martone"
formalization_assistance = "AI-assisted source development"
lean_toolchain_file = "lean-toolchain"
lean_toolchain = "leanprover/lean4:v4.33.0"
lake_manifest_file = "lake-manifest.json"
candidate_status = "STATIC_SPECIFICATION / VALIDATION_EXTERNAL"

[scope]
kind = "isolated-mathematical-replay-target"
selection = "SupportedClaims and its finite classification specialization"
requires_clean_checkout = true
requires_exact_declaration_types = true
requires_module_coverage_reconciliation = true
requires_axiom_audit = true
operational_receipt_is_external = true
public_root_exposure_required = false
full_library_build_required = false
extra_declarations_do_not_expand_claims = true
application_correspondence_is_separate = true
future_native_validation_requires_separate_authorization = true

[source_binding]
supplied_by = "external source binding and separately authorized validation"
repository_commit_tree_and_blobs_required = true
manifest_does_not_bind_its_own_content_identity = true
all_selected_sources_must_belong_to_one_bound_tree = true
required_external_identities = [
  "repository commit",
  "repository tree",
  "this target manifest blob",
  "authored exact-type expectation blob and exact byte digest",
  "each selected module source blob",
  "lean-toolchain blob",
  "lake-manifest.json blob",
  "Lean compiler and Init distribution identity",
  "shared vector artifact blob and exact byte digest",
]
expected_type_binding = "Before actual-type comparison, bind the authored expectation file and its exact bytes. Separately elaborate its complete type terms, then compare the selected declarations' full types, ordered universe parameters, kernel kinds and owner modules against those expectations. Do not derive expectations from observed declaration types."
type_representation = "lean4.33-expr-alpha-json/1: ignore bound-variable spelling and metadata nodes; map declared universe parameters to ordered indices; retain all other Expr, Level and Name constructors. No reduction, definitional-equality substitution, or reported-string-only comparison."

[exact_type_expectations]
path = "docs/verification/_unscoped/finite-observation-type-expectations-v0.1.toml"
schema = "grwtsk-exact-declaration-expectations-v1"
id = "finite-observation-type-expectations-v0.1"
canonical_expression_grammar = "lean4.33-expr-alpha-json/1"
required_count = 78

[build]
mode = "separately authorized direct Lean elaboration of every listed source file"
required_compiler_options = ["-DwarningAsError=true"]
require_exact_direct_imports_per_module = true
require_compiler_toolchain_match = true
require_zero_errors_and_warnings = true
require_all_selected_modules = true
external_dependency_closure = "Init"
mathlib_required_for_selected_modules = false
mathlib_fetch_required_for_this_target = false
repository_dependency_manifest_is_bound_as_context = true
generated_build_outputs_and_logs_are_external = true

[finite_table_contract]
row_type = "GRWTSK.Logic.Observation.FiniteClassification.Row"
classifier = "GRWTSK.Logic.Observation.FiniteClassification.classifyRows"
row_fields = ["trace_id:String", "admissible:Bool", "view:String", "claim:Bool"]
query = "seen:String"
outcomes = ["supported", "refuted", "ambiguous", "model_mismatch"]
classification_scope = "the supplied list of admissible rows matching the query view"
ambient_support_refutation_and_emptiness_require = "CoversFiber for the independently specified ambient model"
ambiguity_requires_coverage = false
model_mismatch_means = "no compatible trace in the supplied inventory"
missing_input_is_model_mismatch = false
schema_or_binding_failure_is_model_mismatch = false
source_identifiers_authenticate_themselves = false
row_identifier_uniqueness_is_an_external_profile_condition = true
shared_vector_agreement_is_a_general_refinement_proof = false
parser_and_external_implementation_correspondence_are_separate = true

[shared_vectors]
path = "verification/fixtures/finite-observation-support-v0.1.json"
schema = "grwtsk.finite-observation-vectors/1"
profile = "noe.finite-observation-support/1"
case_count = 14
expectations = "authored synthetic expected results; not a Lean execution receipt"
external_consumer_requires_exact_byte_copy = true
external_binding_requires_vector_blob_and_byte_digest = true
lean_parses_or_executes_json = false
shared_vector_agreement_is_a_general_refinement_proof = false
native_validation_or_hold_release_implied = false

[declaration_inventory]
required_count = 78
theorem_count = 58
module_count = 2
core_count = 53
fixture_count = 25
nonempty = true
duplicate_free = true
exact_names_selected = true
exact_owner_modules_selected = true
exact_universe_polymorphic_types_required = true
reconcile_all_explicit_heads_in_selected_modules = true
generated_constructors_recursors_and_projections_are_not_separate_inventory_entries = true
generated_dependencies_remain_in_transitive_trust_inspection = true

[trust]
# Required acceptance policy, not an observed audit result.
allowed_axioms = []
reject_sorry_ax = true
reject_native_decide = true
reject_native_proof_dependencies = true
reject_unreported_native_dependencies = true
reject_unavailable_audit = true
reject_missing_audit_as_empty_axiom_set = true
require_transitive_dependency_inspection = true
require_kernel_checked_proof_terms = true
proof_search_success_alone_is_insufficient = true

