[source_statement]
title = "The rational Hodge conjecture for CM abelian varieties"
main_file = "preprints/The-rational-Hodge-conjecture-for-CM-abelian-varieties-October-6-2026/build/main.tex"
statement = "For every complex CM abelian variety A and every codimension p, the rational Betti cycle-class map CH^p(A)_Q -> H^(2p)(A,Q) intersect H^(p,p)(A) is surjective."
coefficient_field = "Q"
requires_exact_variety_scope = true
requires_exact_codimension_scope = true
requires_exact_cycle_class_conventions = true
requires_exact_hodge_realization_conventions = true

