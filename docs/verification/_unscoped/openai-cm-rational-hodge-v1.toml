[[hostile_controls]]
id = "reject-manuscript-status-as-local-proof"
description = "A published manuscript or source revision cannot populate the local Lean surjectivity proof field."

[[hostile_controls]]
id = "reject-rational-to-integral-promotion"
description = "Rational cycle-class surjectivity cannot be reported as integral cycle-class surjectivity or equality of integral K-classes."

[[hostile_controls]]
id = "reject-hodge-name-coercion"
description = "The algebraic Hodge theorem does not create a cellular differential, positive metric, adjoint, harmonic representative, or heat operator."

[[hostile_controls]]
id = "reject-finite-fixture-as-cm-variety"
description = "The Moser rational cellular fixture is not a CM abelian variety or a proof of the global theorem."

[[hostile_controls]]
id = "reject-consequence-circularity"
description = "Tate, generalized Hodge, or standard-conjecture consequences cannot be used as undeclared inputs to the main theorem."

[acceptance]
requires_exact_statement_review = true
requires_source_dependency_map = true
requires_reference_review = true
requires_local_statement_alignment = true
requires_explicit_missing_formal_proof = true
requires_external_review_receipt = true

[nonclaims]
claims = [
  "local Lean proof of the global CM rational-Hodge theorem",
  "a CM-variety-to-cellular quasi-isomorphism",
  "integral Hodge conjecture",
  "equality of integral K-classes from rational Chern data",
  "Riemann hypothesis or any analytic-number-theory consequence"
]
