[[hostile_controls]]
id = "odd-offset-injective"
must_preserve = "oddLiftOffsets H is Finset.image (h↦2*h+1). Global injectivity and exact |image H|=|H| must be retained; no collision or duplicate coordinate."

[[hostile_controls]]
id = "subtype-bijection-not-cardinality-only"
must_preserve = "An actual Equiv between {h // h∈H} and {j // j∈oddLiftOffsets H} must preserve each coordinate value j=2*h+1, not merely finite cardinality."

[[hostile_controls]]
id = "full-powerset-transport"
must_preserve = "Equiv.finsetCongr must map ALL shift-subsets bijectively, preserve empty vs nonempty and subset cardinality, and no nonempty Walsh character may be lost."

[[hostile_controls]]
id = "raw-product-source-index"
must_preserve = "At source root n, the product lambda(n+2*h+2) equals lambda(n+(2*h+1)+1) on each corresponding coordinate. No modulo operation is involved in the ordinary mean."

[[hostile_controls]]
id = "exact-M-and-N-normalization"
must_preserve = "oddLiftedMean(M,H,S) and liouvilleSubsetMean(2*M,oddLiftOffsets H,lift S) share EXACT root set range (2*M) and rational denominator 2*M. At M=0 this is a rational zero convention, not a probability."

[[hostile_controls]]
id = "canonical-energy-output"
must_preserve = "Prove equality of COMPLETE nonempty Walsh energies, not just equality of one coefficient, incomplete pairwise sums, equality of cardinalities, or an inequality."

[[hostile_controls]]
id = "empty-shift-vacuity"
must_preserve = "For H empty both image and subset map are empty, and energy has no nonempty characters. No fabricated positive odd-collar loss, no imagined cancellation."

[[hostile_controls]]
id = "strict-odd-collar"
must_preserve = "The canonical cyclic TV consumer requires max(oddLiftOffsets H)<2*M, with M>0. Odd lift of a nonempty shift set changes the actual max shift; do not substitute r=max H or relax strict inequality."

[[hostile_controls]]
id = "residual-not-controlled"
must_preserve = "Canonical energy obeys E_lambda(2M,oddLift H) <= [E_lambda(M,H)+E_oddResidual(M,H)]/2. The latter remains an independent all-order arithmetic supplier; this does not imply contraction or decay."

[[hostile_controls]]
id = "sharpness"
must_preserve = "M=1,H={0} gives image H'={1} and E_lifted=E_source=E_residual=1, attaining the energy inequality with equality."

[[hostile_controls]]
id = "publisher-not-kernel"
must_preserve = "Committed source, finite integer tests and the manifest do not imply that Lean/Lake elaborated these declarations or that a kernel/axiom audit succeeded."

[[hostile_controls]]
id = "no-higher-order-external-upgrade"
must_preserve = "The OpenAI fixed nonproportional binary theorem, whose external source preflight remains blocked, does not furnish all-order growing-shift odd-residual cancellation, Montgomery GUE, or RH."

