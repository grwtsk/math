[[hostile_controls]]
id = "actual-Mathlib-Liouville-sign"
must_preserve = "Lambda is the actual pinned ArithmeticFunction.liouville, with lambda(0)=0; all ordinary and lifted words evaluate positive integers lambda(n+h+1)."

[[hostile_controls]]
id = "odd-lift-correct-index"
must_preserve = "The lifted offset is 2*h+1, so source factor lambda(n+2*h+2), even root lambda(2*(m+h+1)), odd root lambda(2*m+2*h+3)."

[[hostile_controls]]
id = "sign-by-character-arity"
must_preserve = "At even roots each factor contributes minus one by complete multiplicativity; the total factor is exactly (-1)^|S|. Do not substitute one minus sign independent of arity."

[[hostile_controls]]
id = "odd-residual-remains-open"
must_preserve = "The odd-root affine correlation sum/mean/energy remains a distinct supplier. Do not set it to zero, substitute a new fixed-binary theorem for higher orders, or silently erase its cost."

[[hostile_controls]]
id = "exact-half-mean-normalization"
must_preserve = "The lifted mean uses exactly 2*M roots, ordinary and residual means use M, and normalized recurrence has one factor 1/2 with explicit M>0. At M=0 rational arithmetic is not a probability."

[[hostile_controls]]
id = "empty-subset-not-decaying"
must_preserve = "The algebra holds for S=empty and its normalized mean equals one for M>0. Only nonempty subsets enter squared energy and any attempted Chowla cancellation."

[[hostile_controls]]
id = "sharp-square-energy-convexity"
must_preserve = "Each lifted moment square is <= (source-square+odd-residual-square)/2, and the sum runs over ALL distinct nonempty subset characters. The factor 1/2 is sharp and the residual cost is not optional."

[[hostile_controls]]
id = "canonical-odd-lifted-index-adapter-open"
must_preserve = "OddLiftedAllOrderEnergy is indexed by original H subtype. Equality to liouvilleAllOrderEnergy (2*M) on image shifts {2*h+1 | h∈H} requires a distinct bijective subset/shift transport theorem, not yet provided."

[[hostile_controls]]
id = "no-contraction-without-residual"
must_preserve = "The bound E_lifted <= (E_source+E_residual)/2 is not an unconditional contraction; if both energies are the same it allows equality. No smallness or monotone decay is inferred."

[[hostile_controls]]
id = "source-not-kernel"
must_preserve = "Source-only theorem heads and independently enumerated integer cases do not establish Lean elaboration, accepted proof terms, transitive axiom audit or independent replay."

[[hostile_controls]]
id = "no-gue-rh-upgrade"
must_preserve = "The dyadic recurrence is arithmetic finite algebra, not a proof of growing-shift all-order Chowla, sofic convergence, GUE gaps, Montgomery or the Riemann hypothesis."

