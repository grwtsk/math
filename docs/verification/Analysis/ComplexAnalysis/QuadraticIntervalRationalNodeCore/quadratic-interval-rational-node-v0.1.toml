[[hostile_controls]]
id = "inherited-chain"
description = "Require all exact inherited targets, public types, decision instances and controls; root-only success is insufficient."

[[hostile_controls]]
id = "rational-real-refinement"
description = "All reciprocal nodes/sums, centers, radii and dyadic expressions must cast to their exact existing analytic definitions."

[[hostile_controls]]
id = "positive-log-grids"
description = "Reject zero cell counts and nodes below one. Empty sums or totalized divisions are not valid logarithm evidence."

[[hostile_controls]]
id = "exact-scale"
description = "Check both power inequalities at the external rational node; no unverified mantissa or logarithm metadata."

[[hostile_controls]]
id = "shared-log-two"
description = "Retain k-fold shared uncertainty. Equal-grid boundary choices must agree; a unit mantissa does not erase log-two error."

[[hostile_controls]]
id = "external-node-parameter"
description = "Recompute the exponent from the exact external node and complex parameter. Concrete stale-node and changed-parameter controls must fail."

[[hostile_controls]]
id = "domain-sign"
description = "Re(z)<=1 and the proved nonnegative center supply Re(w)<=0. Do not silently apply the ray bound above the admitted half-plane."

[[hostile_controls]]
id = "complete-exp-trace"
description = "Retain every seed, square, magnitude, Taylor-ratio and exact-length check from the prior rational checker."

[[hostile_controls]]
id = "separate-total-precision"
description = "Compare log-input plus full nonlinear exponential allowance to the external nonnegative tolerance. Exp-only precision is not node precision."

[[hostile_controls]]
id = "charged-radius-not-error-lower-bound"
description = "checked_log_charge_le is a condition on this sufficient checker, not a lower bound on actual numerical error. Failure is not an analytic counterexample."

[[hostile_controls]]
id = "constructed-acceptance"
description = "exactTrace_checked must construct an accepted trace at every admissible resolution; no assumed passing trace or always-rejecting checker."

[[hostile_controls]]
id = "nonconstant-control"
description = "Retain the exact t=2,z=0 sample 7921/16384 with total allowance 74833/262144 and tolerance 3/10; exp-only 1/10 is not total 1/10."

[[hostile_controls]]
id = "unit-control"
description = "Constant density admits exact zero tolerance at a valid resolution, while invalid log grids and negative precision still fail."

[[hostile_controls]]
id = "finite-code-versus-runtime"
description = "Computational definitions use rational/natural operations and prior checks, not analytic log/exp/norm or noncomputable interpretation. Source proof is not code-generation or parser qualification."

[[hostile_controls]]
id = "node-versus-integral"
description = "No standalone node trace is a covered-partition, weighted-sum, tent, full-divisor or prime-margin certificate."

[acceptance]
requires_all_declared_modules = true
requires_exact_public_signatures = true
requires_explicit_failures_and_unavailable_checks = true
requires_inherited_source_replay = true
requires_named_downstream_blockers = true

[nonclaims]
claims = ["Lean elaboration or kernel acceptance", "qualified executable, parser or generated code", "automatic precision allocation or bounded bit complexity", "complete rational quadrature or outer accumulation checker", "actual zeta-zero inventory or multiplicities", "complete arithmetic source or omitted-divisor tail", "Legendre, RH, new prime distribution, worker qualification or F06 release"]
