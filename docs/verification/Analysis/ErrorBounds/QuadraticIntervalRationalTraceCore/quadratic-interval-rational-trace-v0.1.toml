[[hostile_controls]]
id = "inherited-controls"
description = "Retain all earlier source/domain/mesh/logarithm/Taylor/scaling/rounding controls and acceptance obligations."

[[hostile_controls]]
id = "external-input-identity"
description = "check_sound must refer to the exact exponent supplied to check, not a separately named or relabeled trace exponent."

[[hostile_controls]]
id = "exact-complex-arithmetic"
description = "toComplex_mul uses complex coordinate multiplication, not the componentwise product. All Taylor and scaling operations must refine the inherited formulas."

[[hostile_controls]]
id = "nonnegative-squared-balls"
description = "inBall_iff must retain the radius sign before squaring and the imaginary coordinate. Negative radii and understated norm bounds fail."

[[hostile_controls]]
id = "all-input-domain-guards"
description = "Re(w)<=0, actual magnitude enclosure, positive dyadic/factorial denominators and the divided-argument Taylor guard remain explicit."

[[hostile_controls]]
id = "complete-lists"
description = "checked_lengths and rejection lemmas require exactly s+1 values and s square radii. Missing or extra entries must not be accepted through getD defaults."

[[hostile_controls]]
id = "exact-seed"
description = "The first comparison is with the rational Taylor polynomial at the exact divided external input. wrong_seed_rejected must remain."

[[hostile_controls]]
id = "every-square"
description = "All j<s local rational ball tests are required, not a root/final-only or sampled subset check. wrong_square_rejected must remain."

[[hostile_controls]]
id = "nonlinear-output-allowance"
description = "The rational recurrence casts to 2E+E^2+local_radius; local radii are not merely summed. rounded_trace_control retains the 21/100 cost."

[[hostile_controls]]
id = "precision-separate"
description = "checkWithin must check an externally requested nonnegative epsilon against the computed final radius. A consistent coarse trace need not meet zero precision."

[[hostile_controls]]
id = "constructed-nonvacuity"
description = "exactTrace_checked must accept the constructed exact reference trace for every admissible input, without an assumed accepted witness."

[[hostile_controls]]
id = "actual-analytic-control"
description = "negative_one_checked and negative_one_enclosure bind the literal nonzero rational example to exp(-1), not to a surrogate polynomial definition."

[[hostile_controls]]
id = "data-code-versus-interpretation"
description = "Computable data/checker definitions must not depend on toComplex, real/complex norms, log, exp or noncomputable choice. Their interpretation and analytic proofs are separate."

[[hostile_controls]]
id = "no-parser-or-runtime-promotion"
description = "No Python model check, source declaration, finite termination or manifest qualifies a parser, code generator, executable checker, resource policy or worker."

[[hostile_controls]]
id = "all-types-and-trust"
description = "Reconcile all public types, generated Trace declarations and named decision instance, inherited modules, full transitive imports/axioms and every retained control. A root-only PASS is insufficient."

[acceptance]
requires_all_declared_modules = true
requires_exact_public_signatures = true
requires_explicit_failures_and_unavailable_checks = true
requires_inherited_source_replay = true
requires_named_downstream_blockers = true

