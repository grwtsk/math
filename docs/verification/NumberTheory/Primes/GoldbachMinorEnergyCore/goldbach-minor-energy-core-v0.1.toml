major_absolute_cap = "integral_major |S_N|^2 <= 19*N"
diagonal_lower = "sum_(p<=2n) log(p)^2 >= 497*n*log(n)/500"
absolute_minor_lower = "A_(2n) >= 2*n*(497*log(n)/1000 - 19)"
linear_budget_obstruction = "C>=0 and 20+2*C < 497*log(n)/1000 imply C*(2*n+1) < A_(2n)"
classical_C2_example = "For every even N>=2*3^50, A_N>2*(N+1); written logarithm-threshold deduction only"
signed_target = "for every even N>=400000000, Re(I_N)>=-(N+1), still open"
phase_reformulation = "H_n <= P_n+(2*n+1); equivalently H_n <= (A_(2n)+(2*n+1))/2"
one_sided_scope = "Large positive signed mass is allowed; no two-sided asymptotic equality of P and H is required"

[finite_test]
target = 128
source = "complete list of actual primes through 128, all 961 ordered pairs"
energy_frequency = "p-q; zero branch means p=q"
signed_frequency = "p+q-N; zero branch means p+q=N"
