[[hostile_controls]]
id = "prime-power-not-prime"
description = "prime_power_is_not_prime: the proper power 9 does not make the prime count on (8,10) positive."

[[hostile_controls]]
id = "upper-sieve-not-lower"
description = "upper_sieve_is_not_lower: an odd sieve survivor exists in a prime-free interval."

[[hostile_controls]]
id = "fixed-shift"
description = "fixed_shift_control: shift six cannot be substituted for shift two."

[[hostile_controls]]
id = "finite-not-unbounded"
description = "finite_agreement plus bounded_predicate_not_unbounded and true_predicate_unbounded: finite count equality does not determine unboundedness."

[[hostile_controls]]
id = "strict-endpoints"
description = "strict_upper_endpoint, empty_interval and reversed_interval retain the exact interval domain."

[[hostile_controls]]
id = "universal-tail-required"
description = "legendre_of_prefix_and_tail must retain both typed premises; neither an average estimate nor finite checks supplies the tail."

[[hostile_controls]]
id = "complete-source-and-trust"
description = "Every listed owner and control declaration, source signature, elaborated type, module blob and transitive dependency must be reconciled; root-only success or absent checks do not pass."

[[hostile_controls]]
id = "no-target-promotion"
description = "Goldbach, TwinPrimes, Legendre and QuadraticPrimeValues are proposition definitions, not proved conjectures."

[acceptance]
requires_all_declared_modules = true
requires_exact_public_signatures = true
requires_explicit_failures_and_unavailable_checks = true
requires_named_downstream_blockers = true

[nonclaims]
claims = [
  "a proof of any Landau conjecture",
  "an analytic or sieve prime-distribution estimate",
  "the missing weighted prime/prime-power bridge to PR #256",
  "a complete explicit formula or omitted-zero tail",
  "an additive Fourier or Gaussian arithmetic theorem",
  "a matrix-kernel reconstruction or quantitative operator estimate",
  "Lean elaboration, transitive axiom audit or external replay acceptance",
  "execution, deployment or merge authority"
]
