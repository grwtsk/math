[[hostile_controls]]
id = "zero-excluded"
requirement = "At input zero the actual integer Liouville source is 0 and its Boolean parity sign is 1; the sign-equivalence theorem must require a nonzero argument."
status = "NOT_RUN"

[[hostile_controls]]
id = "exact-start-offset"
requirement = "All actual ordinary samples are at n + 1 + h, not n + h or a modularly wrapped index."
status = "NOT_RUN"

[[hostile_controls]]
id = "prime-multiplicity"
requirement = "Use cardFactors (Omega) with repeated prime factors, not cardDistinctFactors (omega)."
status = "NOT_RUN"

[[hostile_controls]]
id = "parity-orientation"
requirement = "Even Omega corresponds to +1, odd Omega to -1, never the reverse."
status = "NOT_RUN"

[[hostile_controls]]
id = "empty-sample"
requirement = "All identity theorems remain unnormalized and allow N=0."
status = "NOT_RUN"

[[hostile_controls]]
id = "empty-subset"
requirement = "The empty Liouville moment is N and the empty pattern matches every sample."
status = "NOT_RUN"

[[hostile_controls]]
id = "source-identity"
requirement = "Products contain casts of the actual pinned ArithmeticFunction.liouville, never postulated iid signs."
status = "NOT_RUN"

[[hostile_controls]]
id = "cesaro-scope"
requirement = "Do not infer ordinary/logarithmic Chowla estimates, fixed-to-growing-shift uniformity, maximal-prefix energy or entropy from the finite identity."
status = "NOT_RUN"

[[hostile_controls]]
id = "non-sofic-promotion"
requirement = "Do not promote finite labeled cylinders to ergodicity, Bernoulli limits, GUE, or RH."
status = "NOT_RUN"

[[hostile_controls]]
id = "mobius-ternary"
requirement = "Do not treat the Möbius function with zeros as a binary Liouville sequence."
status = "NOT_RUN"
