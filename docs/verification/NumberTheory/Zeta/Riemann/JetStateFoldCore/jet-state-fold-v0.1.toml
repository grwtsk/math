requirement = "Prove current power, natural factorial and entire polynomial invariant jointly. Retain M terms and complex multiplication."

[[controls]]
id = "F04_seed_rounding"
requirement = "No rounding within the exact seed sum. Round coordinates once at the old seed point, including negative flooring."

[[controls]]
