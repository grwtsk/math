[[controls]]
id = "same-invariant"
requirement = "The wrapper must reduce to the inherited exponential-lift winding, with closure and nonvanishing proof arguments, not a new numeric label."
status = "NOT_RUN"

[[controls]]
id = "signed-product"
requirement = "Check index_mul, index_pow and index_prod retain signed Z values and every natural multiplicity."
status = "NOT_RUN"

[[controls]]
id = "strict-rectangle"
requirement = "Reversed or degenerate coordinate bounds cannot construct the positive Rectangle without their genuine strict inequalities."
status = "NOT_RUN"

[[controls]]
id = "full-boundary"
requirement = "Reconcile all four oriented edges, corners, closure and the old full dyadic traversal; no vertex-only coverage."
status = "NOT_RUN"

[[controls]]
id = "arbitrary-root"
requirement = "The linear-factor homotopy accepts an arbitrary actual complex interior point, not its rounded center."
status = "NOT_RUN"

[[controls]]
id = "positive-linear"
requirement = "Execute reference_evaluates and compose it with factor_index_one; the exact CCW linear factor contributes +1."
status = "NOT_RUN"

[[controls]]
id = "multiplicity-three"
requirement = "Execute cubic_index_three: one distinct order-three root contributes three, not cardinality one."
status = "NOT_RUN"

[[controls]]
id = "negative-orientation"
requirement = "Retain reversed_linear_index=-1 and do not use natAbs to hide orientation."
status = "NOT_RUN"

[[controls]]
id = "whole-remainder"
requirement = "Boundary nonzero alone cannot replace whole-box nonzero in zero_free_index; test boundary_only_is_insufficient."
status = "NOT_RUN"

[[controls]]
id = "normal-form"
requirement = "Audit the genuine meromorphic raw quotient construction and the normal-form uniqueness theorem at EVERY selected point."
status = "NOT_RUN"

[[controls]]
id = "matching-orders"
requirement = "Cancellation occurs on punctured neighborhoods with equal exact powers; under-removal, over-removal and missing roots cannot supply the hypotheses."
status = "NOT_RUN"

[[controls]]
id = "removed-center"
requirement = "Execute double_root_has_extended_quotient and raw_quotient_at_removed_point; raw 0/0 is not the analytic quotient value."
status = "NOT_RUN"

[[controls]]
id = "full-location"
requirement = "Injectivity is on complex locations, not labels or heights; execute full_location_control."
status = "NOT_RUN"

[[controls]]
id = "source-divisor"
requirement = "Reconcile actual normalized-zeta local orders to canonical source multiplicities, including hypothetical repeated zeros."
status = "NOT_RUN"

[[controls]]
id = "canonical-coverage"
requirement = "source_covered uses the exact predicate, positive half-plane and whole-boundary exclusion to exhaust the CLOSED box."
status = "NOT_RUN"

[[controls]]
id = "pole-exclusion"
requirement = "Execute removed_pole_not_counted: F(1)=1 and order zero even though one is on the bottom edge."
status = "NOT_RUN"

[[controls]]
id = "same-count"
requirement = "index_eq_count must reindex to the maintained MirrorCountingRectangle.count, not an external list or cardinality."
status = "NOT_RUN"

[[controls]]
id = "traversal"
requirement = "The numerical consumer must retain literal all-parameter alignment with continuous endpoint-preserving r; carrier or area alone is insufficient."
status = "NOT_RUN"

[[controls]]
id = "conditional-completion"
requirement = "complete_pair_of_evaluate_one retains actual Enclosures, returned some 1, boundary exclusion and traversal; none is asserted for the large rectangle."
status = "NOT_RUN"

[[controls]]
id = "transitive-acceptance"
requirement = "All inherited finite decisions, exact types, generated names, imports, axioms and native dependencies require pinned elaboration and independent audit."
status = "NOT_RUN"
