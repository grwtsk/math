[[hostile_controls]]
id = "spatial-not-parameter-derivative"
description = "hasDerivAt_density_real reuses the actual positive-axis antiderivative theorem; norm(z-1) and the beta-2 exponent cannot be replaced by the parameter sensitivity."

[[hostile_controls]]
id = "exact-positive-covered-domain"
description = "kernel_eq_partition identifies every adjacent cell and the actual node endpoints on the domain 1<a. A partial prefix cannot claim a different right endpoint."

[[hostile_controls]]
id = "nonnegative-cell-lengths"
description = "Sample-error propagation requires Monotone x. Signed lengths cannot cancel enclosure allowances."

[[hostile_controls]]
id = "positive-uniform-cell-count"
description = "uniformNodes_end and uniform_leftSum_error require N>0. zero_cells_not_full_interval rejects totalized division at N=0."

[[hostile_controls]]
id = "nonzero-discretization"
description = "sharp_half_control and left_cell_error_at_two retain the attained factor one-half for the actual kernel at z=2."

[[hostile_controls]]
id = "constant-density-control"
description = "leftSum_one is exact only for exact density values on a covered partition."

[[hostile_controls]]
id = "sample-error-not-mesh-error"
description = "zero_samples_keep_error retains unit error for uniformly zero samples on [2,3] at every N; refining a mesh does not certify the sample values."

[[hostile_controls]]
id = "same-family-multiplicity"
description = "The square composition uses the same finite index set, natural multiplicities, actual parameters, centers, exact nodes and endpoints."

[[hostile_controls]]
id = "finite-not-divisor-complete"
description = "Coordinate, mesh and sample bounds do not provide source identity, a complete zero family or a complementary zero tail."

[[hostile_controls]]
id = "inherited-trust-no-promotion"
description = "Reconcile every selected module, all public elaborated signatures and full transitive trust. Prior source integration and auxiliary tests are not acceptance."

[acceptance]
requires_all_declared_modules = true
requires_exact_public_signatures = true
requires_explicit_failures_and_unavailable_checks = true
requires_named_downstream_blockers = true
requires_inherited_source_replay = true

[nonclaims]
claims = [
  "Lean elaboration or transitive kernel acceptance",
  "certified log/exp node evaluation or final floating arithmetic",
  "a complete Riemann source identity or omitted-zero-divisor tail",
  "source matching or multiplicity validation from coordinates",
  "uniform all-height or all-stage cancellation",
  "a prime witness from external zeros, Legendre or RH",
  "worker qualification, execution or merge authority"
]
