[[acceptance_obligations]]
id = "R01"
requirement = "Elaborate every new module at the exact committed head and preserve all inherited acceptance obligations."

[[acceptance_obligations]]
id = "R02"
requirement = "Reconcile exact types and the complete transitive import/axiom/native closure, including generated structure projections and constructors."

[[acceptance_obligations]]
id = "R03"
requirement = "Enforce the Taylor radius/degree guard; an empty polynomial keeps its complete error and a finite next term is not the whole tail."

[[acceptance_obligations]]
id = "R04"
requirement = "Retain independently proved real logarithm enclosures and the small argument-displacement guard; floating-point outputs alone do not supply them."

[[acceptance_obligations]]
id = "R05"
requirement = "Retain both truncation and logarithm-input uncertainty; derive polynomial values rather than accepting an arbitrary kernel or exponential value."

[[acceptance_obligations]]
id = "R06"
requirement = "Derive coordinate sensitivity using the entire integral kernel and true horizontal coordinates, not critical-line projection."

[[acceptance_obligations]]
id = "R07"
requirement = "Prove the actual and center real bounds; centers at 0 or -1 cannot use the guarded quotient evaluator."

[[acceptance_obligations]]
id = "R08"
requirement = "Retain positive center-denominator bounds, radius normalization, middle coefficient two, and exact algebraic division."

[[acceptance_obligations]]
id = "R09"
requirement = "Do not require a coordinate ball to avoid removable parameter singularities; the sensitivity argument is integral-defined."

[[acceptance_obligations]]
id = "R10"
requirement = "Bind every record to the SAME full canonical closed head and actual analytic multiplicity; do not accept an observed list by cardinality."

[[acceptance_obligations]]
id = "R11"
requirement = "Charge multiplicities on the entire per-record error and add a separate accumulation/serialization error exactly once."

[[acceptance_obligations]]
id = "R12"
requirement = "Preserve the coefficient-kappa complete omitted-zero tail, signed trivial-zero floor, proper-prime-power correction and strict prime margin."

[[acceptance_obligations]]
id = "R13"
requirement = "Record specifications do not supply zero identities, completeness enumeration, a byte checker, range reduction, numerical practicality or all-interval margins."

[[acceptance_obligations]]
id = "R14"
requirement = "Exact rational synthetic diagnostics and limited text checks do not establish universal analytic correctness, Lean acceptance or a spectral prime certificate."
