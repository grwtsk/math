  "Lean parsing, elaboration, exact-signature or transitive trust acceptance",
  "execution or replacement of any historical target or hostile control",
  "rational curve isomorphism or a selected quadratic twist from equal j",
  "injective recovery of the ordered marked source from j alone",
  "conductor, minimal discriminant, local reduction type or characteristic-two classification",
  "Faltings height, Arakelov metric or a geometric integral lattice comparison",
  "full geometric atlas, complete H0, intrinsic Hodge theorem or gauge recovery",
  "cancellation of the previous weighted composite, lattice or metric costs",
  "uniform radical observation-height, ABC or RH upper bound",
  "workflow, worker, external replay, merge, issue closure or promotion authority"
]
