[[hostile_controls]]
id = "same-marked-ratios-before-moduli"
description = "The invariant takes the OLD UnitPair and sourcePair; chart invariance alone is not identification with an elliptic invariant."

[[hostile_controls]]
id = "same-old-curve-j"
description = "Identify the expression with the OLD freyCurve.j using its discriminant-unit definition, actual c4 and delta. Do not invoke a newer convenience API absent from the pin."

[[hostile_controls]]
id = "retain-nonzero-unit-pair"
description = "Exclude zero ratios before division. Totalized rational division is not a geometric chart at a pole."

[[hostile_controls]]
id = "no-rational-isomorphism-from-j"
description = "Equal j does not supply a rational curve isomorphism, a chosen twist or an ordered marked-source inverse."

[[hostile_controls]]
id = "retain-source-primitivity"
description = "The shape/abc coprimality and cancellation formula require the OLD primitive source. Common scaling can introduce additional cancellation."

[[hostile_controls]]
id = "retain-prime-two-cancellation"
description = "The reduced denominator is (abc)^2/gcd(256,(abc)^2), not the raw square. Two can disappear or retain depth."

[[hostile_controls]]
id = "no-conductor-from-j-denominator"
description = "Neither denominator prime support nor its exponents constitute a conductor, minimal-discriminant or reduction-type theorem."

[[hostile_controls]]
id = "no-numerator-support-identification"
description = "The numerator can introduce primes outside abc, e.g. 19 for source (2,3,5). Full support of j is not automatically the old pair support."

[[hostile_controls]]
id = "value-versus-height"
description = "Use the OLD affine height of [1:j]. j can remain numerically near 1728 while rational height grows."

[[hostile_controls]]
id = "degree-six-height-not-equality"
description = "Retain the explicit comparison constants (27/64)c^6 and 256c^6. Do not identify j-height with c or c^2."

[[hostile_controls]]
id = "all-six-chart-labels"
description = "Keep all labelled charts, including stabilizers; the invariant is not six independent observations."

[[hostile_controls]]
id = "no-raw-metric-cancellation"
description = "The new nonlinear j observer is not combinedQ, an isometry on previous coefficient spaces, or recovery of discarded gauge fields."

[[hostile_controls]]
id = "no-radical-upper-bound"
description = "A degree-six comparison to the original c does not provide a uniform upper estimate by Rad(abc)."

[[hostile_controls]]
id = "no-Faltings-height-substitution"
description = "This is scalar rational j-height, not Faltings, Arakelov or an independently normalized minimal-model height."

[[hostile_controls]]
id = "native-exceptional-fixtures"
description = "Keep j=1728 with denominator1 at (1,1,2), denominator225 with numerator438976 at (2,3,5), and surviving 2-power denominator at (1,31,32)."

[[hostile_controls]]
id = "no-finite-check-as-Lean-acceptance"
description = "Exact finite checks and static scans do not parse, elaborate or kernel-audit the new or inherited declarations."

