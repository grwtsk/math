[[hostile_controls]]
id = "reject-two-port-as-saturated-three-port"
description = "The square two-port difference carries the factor a+b; it cannot be reported as the denominator-free three-port recovery theorem."

[[hostile_controls]]
id = "reject-rectangular-as-surjective"
description = "The exact obstruction quotient is split-surjective and the three-port evaluation is explicitly nonsurjective onto all of Z^3."

[[hostile_controls]]
id = "reject-left-inverse-without-bezout"
description = "Recovery, exactness, obstruction splitting and the unit maximal-minor ideal require the exact integer Bezout identity."

[[hostile_controls]]
id = "reject-maximal-minor-unit-without-primitivity"
description = "The typed unit-ideal theorem may use only the primitive triple's proved coprimality; a nonprimitive pair must not receive this certificate."

[[hostile_controls]]
id = "reject-exactness-without-compatible-kernel"
description = "The image equals the kernel of the explicit compatibility obstruction; arbitrary three-port data are not in the image."

[[hostile_controls]]
id = "reject-triple-drift"
description = "Postprocessing the canonical x-section values must recover the same typed primitive additive triple."

[[hostile_controls]]
id = "reject-formal-points-as-elliptic-proof"
description = "The finite coordinate and saturation modules do not prove that the formal values arise from rational two-torsion points or that (1,x) is an elliptic section basis."

[[hostile_controls]]
id = "reject-integral-left-inverse-as-uniform-isometry"
description = "Integral recovery does not imply a triple-independent archimedean operator norm or metric isometry."

[[hostile_controls]]
id = "reject-zero-interpolation-cost-as-zero-arithmetic-cost"
description = "The finite saturation theorem does not erase model, discriminant, conductor, higher-stage, bad-place or excess-valuation costs."

[[hostile_controls]]
id = "reject-source-frame-as-abc"
description = "A source-preserving split exact frame and a unit maximal-minor ideal are not an abc height-versus-radical inequality."

[[hostile_controls]]
id = "reject-root-import-as-slice-pass"
description = "A build of GRWTSK cannot substitute for checking the isolated root and every declared module."

[acceptance]
requires_all_declared_modules = true
requires_exact_public_signatures = true
requires_explicit_failures_and_unavailable_checks = true
requires_named_downstream_blockers = true
requires_root_import_unchanged = true
requires_hostile_controls = true
requires_axiom_audit = true
requires_runtime_safety_scan = true

[nonclaims]
claims = [
  "construction of the Frey elliptic curve",
  "proof that the formal ports are rational two-torsion points",
  "proof that H0(E,O(2O)) has basis (1,x)",
  "minimal discriminant or conductor formula",
  "uniform archimedean frame bound",
  "uniform height-versus-radical estimate",
  "Szpiro conjecture",
  "abc conjecture",
  "Riemann Hypothesis",
  "execution or replay receipt"
]
