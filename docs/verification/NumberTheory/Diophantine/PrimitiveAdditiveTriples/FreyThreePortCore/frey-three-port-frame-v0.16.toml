[[hostile_controls]]
id = "reject-one-sided-quotient-inverse"
description = "Prove both inverse compositions on complete quotient rings."

[[hostile_controls]]
id = "reject-scalar-drift-in-jet-algebra"
description = "Preserve the actual coefficient algebra S_i, not a rational replacement."

[[hostile_controls]]
id = "reject-truncation-conjugation-as-independent-map"
description = "Truncation is defined by ideal inclusion before proving compatibility."

[[hostile_controls]]
id = "reject-finite-tower-as-completed-equivalence"
description = "Require the compatible-sequence algebra, two inverse maps and coefficient reconstruction; finite-level isomorphisms alone are insufficient."

[[hostile_controls]]
id = "reject-incompatible-inverse-limit-sequence"
description = "Each sequence must satisfy every declared truncation equation; independent finite solutions cannot form a limit element."

[[hostile_controls]]
id = "reject-coefficient-from-too-short-level"
description = "Recover coefficient k only from a level N with k<=N and prove independence of larger levels."

[[hostile_controls]]
id = "reject-polynomial-truncation-as-ring-hom"
description = "Polynomial truncation is not multiplicative; prove multiplicativity after the actual quotient."

[[hostile_controls]]
id = "reject-relative-as-arithmetic-coefficient-completion"
description = "S_i[[T]] retains S_i; do not silently replace it by a p-adic coefficient ring or complete at a closed arithmetic point."

[[hostile_controls]]
id = "reject-formal-as-analytic-convergence"
description = "A formal power series and algebraic inverse limit have no asserted complex radius of convergence or heat-flow estimate."

[[hostile_controls]]
id = "reject-one-finite-projection-as-series-equality"
description = "A nonzero T^(N+1) tail is invisible at level N; equality requires all orders, not a sampled bound."

[[hostile_controls]]
id = "reject-filtration-exponent-loss"
description = "Vanishing at level N means exact T^(N+1)-divisibility, including the N=0 case; this is not a coefficient-norm inequality."

[[hostile_controls]]
id = "reject-unproved-completion-api-identification"
description = "The canonical AdicCompletion comparison requires the actual coordinate-ring ideal, both inverse maps and projection identities; scheme-stalk and topological comparisons remain separate."

[[hostile_controls]]
id = "reject-conjugated-base-change-as-presentation-map"
description = "Descend coefficient transport from the polynomial presentation before proving the naturality square; do not define it by conjugating the desired completion equivalence."

[[hostile_controls]]
id = "reject-unmapped-anchor-under-base-change"
description = "Map a,b,r and the inverse Jacobian together; no replacement root, source relabeling or independently fitted target series."

[[hostile_controls]]
id = "reject-noninjective-residue-as-faithful"
description = "Filtration membership is preserved, but exact vanishing order may increase; reflection of equality or filtration requires injective coefficients."

[[hostile_controls]]
id = "reject-base-change-as-tensor-limit-interchange"
description = "A coefficientwise map R[[T]] to S[[T]] does not prove S tensor_R R[[T]] is S[[T]], nor a uniform denominator bound."

[[hostile_controls]]
id = "reject-coefficient-map-as-fixed-base-linear-map"
description = "Across different coefficient rings retain the scalar law f(c); a ring map is not automatically linear over one unchanged base or isometric."

[[hostile_controls]]
id = "reject-stage-map-without-completion-naturality"
description = "Prove finite truncation compatibility, construction on compatible sequences, and agreement with PowerSeries.map at all orders."

[[hostile_controls]]
id = "reject-canonical-completion-as-limit-alias"
description = "Use Mathlib AdicCompletion on the actual affine coordinate algebra and image section ideal; do not define it as the pre-existing limit."

[[hostile_controls]]
id = "reject-adic-zero-as-jet-zero"
description = "Canonical exponent zero means C/I^0=0; jet order zero means C/I^1. Retain the successor shift and reconstruct every canonical exponent."

[[hostile_controls]]
id = "reject-double-quotient-without-image-powers"
description = "Prove J^n=map(m^n) for the same quotient map, then compare both quotient presentations and their transitions."

[[hostile_controls]]
id = "reject-adic-comparison-one-inverse-only"
description = "Verify both compositions through all canonical and jet projections, including exponent zero."

[[hostile_controls]]
id = "reject-smoothness-assumption-leak"
description = "The canonical-versus-explicit-limit comparison needs no root or inverse. The formal-series comparison still requires f(r)=0 and fprime(r)*j=1."

[[hostile_controls]]
id = "reject-canonical-algebra-as-topological-or-metric"
description = "A canonical coefficient-algebra equivalence does not assert a homeomorphism, completed tensor comparison, p-adic coefficient completion or height bound."

[[hostile_controls]]
id = "reject-exact-order-preservation-under-residue"
description = "Check 2*T^k+T^(k+1) maps to nonzero T^(k+1); exact order increases although filtration membership is preserved."

[[hostile_controls]]
id = "reject-canonical-transport-defined-by-conjugation"
description = "Construct affine and ideal-power quotient maps first, then use the library universal lift; the old-limit naturality square is a theorem."

[[hostile_controls]]
id = "reject-canonical-transport-without-all-exponents"
description = "The canonical lift needs every ideal exponent including zero and every transition equation, not only a finite set of smooth examples."

[[hostile_controls]]
id = "reject-canonical-transport-source-square-drift"
description = "Reconcile the original affine map, finite double-quotient comparison, both limit-comparison directions, and formal-series transport for the same mapped coefficients and root."

[acceptance]
requires_all_declared_modules = true
