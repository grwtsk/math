[[hostile_controls]]
id = "reject-signed-difference"
description = "Use b-a in Z and signed k. Natural truncated subtraction and k:Nat omit the valid source(16,1,17), whose k=-4."

[[hostile_controls]]
id = "reject-difference-guard"
description = "Retain b-a=4k+1. The same fixed change at(1,16,17) has a2=7/2 and is not integral at two."

[[hostile_controls]]
id = "reject-product-guard"
description = "Retain ab=16m. At(8,1,9), the same change has a4=-1/2; do not infer integrality from c4 parity alone."

[[hostile_controls]]
id = "reject-source-labels"
description = "The source is unchanged. Swapping(16,1,17) to(1,16,17) is not an authorized arithmetic normalization or an identity of the rational curves."

[[hostile_controls]]
id = "reject-full-variable-change"
description = "Retain u=2,r=0,s=1,t=0 and all five coefficients. The old root-a change and a change omitting or negating the shear are different."

[[hostile_controls]]
id = "reject-changed-not-raw"
description = "Reduction predicates attach to the actual changedCurve after base-change agreement. The unchanged raw equation is not claimed minimal at two."

[[hostile_controls]]
id = "reject-localization-not-completion"
description = "LocalRing2 remains the actual Z_(2) subring of Q. No completion, Z_2 or Q_2 realization is constructed."

[[hostile_controls]]
id = "reject-field-unit-not-local-unit"
description = "Scale two is a Q-unit but not a Z_(2)-unit. Integral output coefficients do not imply an integral coordinate automorphism."

[[hostile_controls]]
id = "reject-local-not-global-integrality"
description = "A competitor with odd coefficient denominators can be integral in Z_(2) without being integral in Z. All five local output coefficients must be tested."

[[hostile_controls]]
id = "reject-product-not-c-depth"
description = "The new chamber has c odd. Retain v2(Delta_new)+8=2v2(abc), not the old c-only balance."

[[hostile_controls]]
id = "reject-support-not-bad-locus"
description = "Source(16,1,17) has two in Supp(abc) but the changed equation is good at two. Do not extend the odd-prime support criterion without its guard."

[[hostile_controls]]
id = "reject-not-all-good"
description = "Source(32,1,33) has changed discriminant4356 and exponent2, so the chamber also has multiplicative reduction."

[[hostile_controls]]
id = "reject-no-depth-compression"
description = "The native family(16n,1,16n+1) retains exponent2v2(n). No squarefreeness, conductor exponent or uniform excess bound follows."

[[hostile_controls]]
id = "reject-affine-port-integrality"
description = "The odd labelled branch has X,Y denominators4,8 under the inverse map. Do not infer integral marked-point or jet-lattice transport from integral coefficients."

[[hostile_controls]]
id = "reject-no-full-classification"
description = "Outside both explicitly guarded chambers, reduction remains unclassified here. Failure of this fixed change is not a proof of additive reduction."

[[hostile_controls]]
id = "reject-singular-generic-parameters"
description = "Generic polynomial identities permit m=0, but reduction statements require the old positive primitive source and m>0. Undefined j and finite zero valuations must not pass."

[[hostile_controls]]
id = "reject-finite-search-not-proof"
description = "Bounded exact arithmetic tests do not prove universal minimality or elaborate Lean scripts. The actual all-changes criterion is inherited at unelaborated source scope."

[[hostile_controls]]
id = "reject-no-height-or-acceptance-promotion"
description = "Admissible-change j invariance and local minimality do not supply a radical-height estimate, intrinsic Hodge comparison, Lean acceptance, or authority to execute replay."

