[nonclaims]
claims = [
  "Lean parsing, elaboration, kernel or transitive trust acceptance",
  "execution or acceptance of any historical target or hostile fixture",
  "classification of sources outside the new or previous congruence chambers",
  "minimality of the raw equation at two or global minimal-equation packaging",
  "conductor, Ogg formula, splitness, Tamagawa data or Tate uniformization",
  "integral marked-point, section or jet-lattice transport",
  "completed local rings or fields, or a quadratic twist or source permutation",
  "complete H0, intrinsic geometric lattices or an intrinsic Hodge metric comparison",
  "cancellation of previous frame, denominator, index or gauge costs",
  "uniform radical-height estimates, ABC or RH",
  "workflow dispatch, worker/F06 action, external replay, merge or closure authority"
]
