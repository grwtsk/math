[scope]
kind = "mathematical-replay-target"
requires_clean_checkout = true
requires_exact_declaration_types = true
requires_module_coverage_reconciliation = true
requires_axiom_audit = true
operational_receipt_is_external = true

[trust]
allowed_axioms = ["propext", "Classical.choice", "Quot.sound"]
reject_sorry_ax = true
reject_unreported_native_dependencies = true

[[hostile_controls]]
id = "centered_actual_kernel"
requirement = "The kernel is exactly realFractionalKernel(t)-1/2 integrated above 1. It is signed, not a positive density, and its integral is not declared zero by a periodic-mean heuristic."

[[hostile_controls]]
id = "centered_correction_integrated"
requirement = "Prove integrability of BOTH source terms and integrate the subtracted constant at Re(s)>0. C=M-1/(2s) and H=(s+1)/2-s(s-1)C must use the same exact source with s!=0."

[[hostile_controls]]
id = "centered_cutoff_endpoint"
requirement = "The new finite model is P_N-(s-1)*N^(-s)/2. The halved tail does not belong to the unchanged old model. Positive cutoff, complete old finite sum, and H(1)=1 are retained."

[[hostile_controls]]
id = "centered_uniform_tail_scope"
requirement = "The bound |C_tail(T,s)|<=T^(-sigma)/(2sigma) requires T>=1 and 0<sigma<=Re(s). It is a Mellin integration tail, not a complete zero-divisor or Weil residual."

[[hostile_controls]]
id = "centered_quartic_exact_norms"
requirement = "Prove (Re(s)|s+1|)^2-(|s||s-1|)^2=4Re(s)^3-(Re(s)-1)^2 Im(s)^2-Im(s)^4. This signed polynomial comparison is not an assumed positive Hodge metric or a globally positive quartic."

[[hostile_controls]]
id = "centered_three_quarter_closed_box"
requirement = "The quartic lower11/256 and source lower1/256 include Re(s)=1/2, Re(s)=1, and both height endpoints +/-3/4. The kernel bound, positive denominator and reference-error inequality must precede squaring."

[[hostile_controls]]
id = "centered_no_complex_sign"
requirement = "No sign of C(s) is asserted for complex s. The proof is a norm disk about (s+1)/2, not positivity inherited from real-axis Mellin values."

[[hostile_controls]]
id = "centered_homotopy_time"
requirement = "The deformation reference is (s+1)/2, not the old constant unit. Its other endpoint is the actual H. Quantitative nonvanishing is stated only at real time0<=t<=1 on the proved rectangle."

[[hostile_controls]]
id = "centered_functional_mirror"
requirement = "Right-half norm lower bounds do not automatically transport. Use the existing critical-reflection theorem only on the canonical target-zero predicate; no equality of H-values, norms, or multiplicities."

[[hostile_controls]]
id = "centered_first_window_remainder"
requirement = "Retain old parabolic restrictions, new quartic<=0, 3/4<Im<=1, and the arbitrary approach to Re=1/2. The top-edge ambient point5/8+i is not a claimed zeta zero."

[[hostile_controls]]
id = "centered_no_window_one"
requirement = "Height3/4 remains below1. Do not promote the nonzero seed, local homotopy, finite-model improvement, or conditional remaining-cover theorem to WindowRH1 or RH."

[[hostile_controls]]
id = "centered_source_only_checks"
requirement = "Exact rational polynomial and synthetic model checks are not evaluations of C or zeta and not proof of integrability, Lean elaboration, dependency trust, kernel acceptance, or replay authority."
