[[hostile_controls]]
id = "reject-coordinate-as-proposition-equivalence"
description = "CoordinateTransition contains no proposition implication or equivalence field."

[[hostile_controls]]
id = "reject-logical-equivalence-for-atlas-membership"
description = "CriticalStripAtlas.transition must return CoordinateTransition, allowing neutral and equivalent charts to overlap."

[[hostile_controls]]
id = "reject-weakened-coordinate-laws"
description = "Identity, inverse and triple-cocycle laws remain mandatory after logical separation."

[[hostile_controls]]
id = "reject-directional-coordinate-exclusion"
description = "Both logically equivalent and merely directional exact-coordinate outcomes can supply atlas coordinate evidence."

[[hostile_controls]]
id = "reject-directional-as-chart-equivalence"
description = "Only an explicitly equivalent StatementTransport can produce ChartTransition or admittedTransition."

[[hostile_controls]]
id = "reject-coordinate-edge-as-logical-edge"
description = "A coordinate audit outcome does not construct VerticalStep.transport."

[[hostile_controls]]
id = "reject-neutral-root-target-collapse"
description = "The root and canonical target share coordinates but retain neutral and equivalent statuses respectively."

[[hostile_controls]]
id = "reject-coordinate-overlap-as-gapfree"
description = "The two-chart boundary atlas must prove not GapFree while the root chart remains neutral."

[[hostile_controls]]
id = "reject-hidden-root-rh-equivalence"
description = "The root-to-target overlap audit is directional with unrelated statement transport and no admitted ChartTransition."

[acceptance]
requires_all_declared_modules = true
requires_exact_public_signatures = true
requires_explicit_failures_and_unavailable_checks = true
requires_named_downstream_blockers = true

