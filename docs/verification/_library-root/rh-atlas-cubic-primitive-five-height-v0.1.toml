[[hostile_controls]]
id = "cubic_mean_correction"
requirement = "The derivative is p+1/12, not p. Preserve the independently integrated correction, its sign, and the factor (s+2)(s+3)/12 in the actual H identity."

[[hostile_controls]]
id = "cubic_kernel_bound"
requirement = "Prove |u(u-1)(2u-1)/12|<=1/120 for every 0<=u<=1. The rational two-case polynomial certificate, not a finite sample table, supplies the universal bound."

[[hostile_controls]]
id = "signed_primitive"
requirement = "The cubic kernel has both signs. Do not turn it into a positive Hodge metric, a positive Weil form, or an assertion of zero Mellin mean."

[[hostile_controls]]
id = "jet_seam_order"
requirement = "Cubic cell values and first polynomial jets match, but second jets jump. The global integral identity uses valid cellwise integration and a.e. equality, not invented C2 smoothness."

[[hostile_controls]]
id = "convergent_correction"
requirement = "Prove original quadratic, constant correction, adjusted, and cubic integrands integrable separately before subtraction and finite/tail splitting. Every stated identity retains Re(s)>0 and cutoff>=1."

[[hostile_controls]]
id = "tail_telescope_actual"
requirement = "Derive adjustedTail1=(s+2)*tail1 from adjacent-cell integration by parts and two quantitative tail limits. No exact comparison or vanishing residual is added as a premise."

[[hostile_controls]]
id = "integer_cutoff"
requirement = "The boundary-free cubic identity has integer N>=1. q(5/4)=1/128 is a noninteger boundary obstruction. No arbitrary real-cutoff identity omits this term."

[[hostile_controls]]
id = "finite_model_plus_correction"
requirement = "Use the unchanged centered finite model PLUS s(s-1)N^(-s-1)/12. The N^(-sigma-2) bound belongs to this corrected model, not either earlier finite model."

[[hostile_controls]]
id = "height_factor_growth"
requirement = "The tail coefficient is |s(s-1)(s+1)(s+2)|/[120(sigma+2)]. A fixed-parameter error limit is not a uniform all-height or zero-divisor/Weil tail theorem."

[[hostile_controls]]
id = "five_height_euclidean"
requirement = "Prove both |s||s-1|<=26 and |s+1|<=(7/8)|s+3| over the entire closed right rectangle. The latter retains the shared source reference factor."

[[hostile_controls]]
id = "five_height_margin"
requirement = "Reconcile tail1<=1/300, triple factor<=91|s+3|/4, relative error91/1200, gap3/400, product lower35/4, and |H|>=21/320. No fitted sample or zero-free premise."

[[hostile_controls]]
id = "closed_boundaries"
requirement = "Include Re(s)=1/2, Re(s)=1, |Im(s)|=5 and H(1)=1. The target-zero height conclusion is STRICTLY greater than5."

[[hostile_controls]]
id = "mirror_zero_not_norm"
requirement = "Left-half exclusion uses the canonical critical-reflection theorem only for target zero locations. The right-side quantitative norm bound is not mirrored by equality of H-values."

[[hostile_controls]]
id = "quadratic_not_affine_deformation"
requirement = "The new deformation is reference+t(H-reference) with quadratic reference. It is not the old affine-reference deformation. Nonzero bounds require real 0<=t<=1."

[[hostile_controls]]
id = "holomorphic_inverse"
requirement = "Continuity in time and complex differentiability in s have separate proofs. Reciprocal differentiability additionally consumes proved nonvanishing."

[[hostile_controls]]
id = "window_scope"
requirement = "WindowRH3,4,5 and ShellRH2,3,4 consume no new source/cover premise. ShellRH5 and all higher extension theorems remain unconstructed inputs. No unconditional RH."

[[hostile_controls]]
id = "pure_math_source"
requirement = "Keep runtime, search execution, authority, receipts and generated operational state outside math. Ordinary norm_num/decide/ring scripts are not native or external proof oracles."

[[hostile_controls]]
id = "replay_not_performed"
requirement = "All new and inherited declarations need exact Lean elaboration, exact signatures and transitive axiom audit. Rational and symbolic diagnostics are not replay evidence; reject sorryAx and hidden native dependencies."
