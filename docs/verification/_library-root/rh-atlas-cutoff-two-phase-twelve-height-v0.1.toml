[[hostile_controls]]
id = "exact_source"
requirement = "Preserve H, its removable value, the sextic finiteModel and the complete cutoff-two identity. Source residual and positive-real base2 are unchanged."

[[hostile_controls]]
id = "actual_phase"
requirement = "Derive log2 in[11/16,25/36] from the inherited enclosure. Use the pinned pi bounds and exact periodicity to establish the phase sector, not fitted phase samples."

[[hostile_controls]]
id = "both_height_signs"
requirement = "cos is even; sine is odd. Retain t*sin(t log2)>=6|t|/7. Do not replace an actual zero location by its absolute height."

[[hostile_controls]]
id = "complex_power_branch"
requirement = "Use cpow_def_of_ne_zero for positive base2 and the actual real logarithm. Check the minus sign in the imaginary part of 2^(-s)."

[[hostile_controls]]
id = "complete_polynomials"
requirement = "All155 natural coefficients must satisfy the exact three identities, with scaling256 and x=(1+u)/2,y=121+23v. No coefficient or shared factor may be dropped."

[[hostile_controls]]
id = "projection_source"
requirement = "Prove both components of scaledCoefficient(s)*conj(s-1) equal P and Im(s)*Q. The Hermitian projection is not an arbitrary positive polynomial."

[[hostile_controls]]
id = "cone_guard"
requirement = "Prove P>=0 and132Q>=7P, hence Q>=0. Combine the actual trigonometric sector and |Im|>=11 to obtain nonnegative finite-term projection."

[[hostile_controls]]
id = "one_sided_not_disk"
requirement = "Re(v conj d)>=0 does not imply |v|<=|d|. The new proof must not claim |H-(s-1)|<|s-1| from a one-sided projection."

[[hostile_controls]]
id = "tail_cutoff_two"
requirement = "Use only the general sextic cutoff-two tail bound. No cutoff-one5/7 or33/40 saving is used. The six-factor product and real-part denominator remain explicit."

[[hostile_controls]]
id = "tail_margin"
requirement = "Prove power norm<=3/4 and tailCoefficient<=3/4 on the exact band, then tail error<=9|s-1|/16. Do not omit the tail."

[[hostile_controls]]
id = "positive_reference_norm"
requirement = "Prove |s-1|>=11 before cancelling it in the Hermitian inequality. A zero reference is not admissible."

[[hostile_controls]]
id = "closed_carriers"
requirement = "All points with1/2<=Re<=1 and11<=|Im|<=12 are included. The y input is Im(s)^2 in[121,144], not a sampled grid or a height label."

[[hostile_controls]]
id = "exact_gluing"
requirement = "The old full height11 bound1/1000 and new band lower77/16 concern the same H. Retain the seam; global height12 lower stays1/1000."

[[hostile_controls]]
id = "mirror_zero_only"
requirement = "Critical reflection transports the exact canonical zero predicate only. Do not infer reflected H norms, analytic multiplicities or zero enumeration."

[[hostile_controls]]
id = "same_homotopy"
requirement = "Use the existing CutoffTwo.deformation. Nonzero control on the new band comes from a positive Hermitian half-plane, not the old two-sided disk bound."

[[hostile_controls]]
id = "holomorphy_independent"
requirement = "Time continuity and complex differentiability remain inherited, separate analytic results. Reciprocal differentiability additionally consumes proved nonvanishing."

[[hostile_controls]]
id = "old_failure_preserved"
requirement = "The old height12 sufficient guards remain false at their counterexample. New tail guard fails at height13; neither failure is a zeta-zero claim."

[[hostile_controls]]
id = "next_port"
requirement = "Instantiate the prior window_twelve_of_shell with shellRH_eleven. ShellRH12 and the complete higher-step family remain premises; no unconditional RH."

[[hostile_controls]]
id = "axiom_audit"
requirement = "Require exact declaration types, all required modules and transitive axiom audit. Reject sorryAx and unreported native dependencies. Pi/log/analytic imports remain within that audit."

[[hostile_controls]]
id = "source_not_receipt"
requirement = "Ring scripts, symbolic diagnostics and hashes are not elaboration. No worker, replay, runtime state, receipt, merge, closure or F06 release is authorized here."
