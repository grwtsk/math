[[hostile_controls]]
id = "missing-proof-debt"
declarations = ["GRWTSK.Logic.StateTransition.ResearchState.Examples.omitted_auxiliary_debt_rejected", "GRWTSK.Logic.StateTransition.ResearchState.Examples.missing_debt_transition_rejected"]
description = "Omitting the false auxiliary premise cannot preserve the old frontier implication and cannot inhabit Change."

[[hostile_controls]]
id = "circular-reduction"
declarations = ["GRWTSK.Logic.StateTransition.ResearchState.Examples.self_reduction_retains_debt", "GRWTSK.Logic.StateTransition.ResearchState.Examples.circular_reduction_rejected", "GRWTSK.Logic.StateTransition.ResearchState.Examples.mutual_circular_reduction_rejected"]
description = "An actual self-transfer retains its token; one-node and mutually conditional cycles have no grounded support."

[[hostile_controls]]
id = "relevance-only-closure"
declarations = ["GRWTSK.Logic.StateTransition.ResearchState.Examples.relevance_only_closure_rejected", "GRWTSK.Logic.StateTransition.ResearchState.Examples.relevance_only_transition_rejected"]
description = "A relevance score and description provide no proof adapter and cannot validate an empty frontier for the false selected claim."

[[hostile_controls]]
id = "unsupported-status-promotion"
declarations = ["GRWTSK.Logic.StateTransition.ResearchState.Examples.status_observation_preserves_proofs_and_debt", "GRWTSK.Logic.StateTransition.ResearchState.Examples.unsupported_status_promotion_rejected", "GRWTSK.Logic.StateTransition.ResearchState.Examples.unsupported_status_transition_rejected"]
description = "A kernelReported label may be observed as metadata; it preserves the frontier and proved set and cannot register a false theorem."

[[hostile_controls]]
id = "hypothesis-erasure"
declarations = ["GRWTSK.Logic.StateTransition.ResearchState.Examples.contextual_claim_proved", "GRWTSK.Logic.StateTransition.ResearchState.Examples.contextual_hypothesis_erasure_rejected", "GRWTSK.Logic.StateTransition.ResearchState.Examples.contextual_hypothesis_remains_unproved"]
description = "A contextual implication may be proved while its displayed hypothesis remains unproved; the raw statement is not thereby discharged."

[[hostile_controls]]
id = "unchanged-name-changed-revision"
declarations = ["GRWTSK.Logic.StateTransition.ResearchState.Examples.unchanged_name_does_not_identify_revision", "GRWTSK.Logic.StateTransition.ResearchState.Examples.same_name_revision_transport_rejected"]
description = "Equal declaration names do not identify changed source revisions or transport a proof from an old true claim to a revised false claim."

[[hostile_controls]]
id = "all-types-and-source-trust"
description = "Require the full exact elaborated declaration census, all listed local modules, upstream import closure, --trust=0 kernel rechecking and per-declaration transitive axiom audits. Root-module success, retained cache bytes or source-level names alone do not satisfy this contract."

[acceptance]
requires_all_declared_modules = true
requires_exact_public_signatures = true
requires_full_declaration_type_census = true
requires_exact_local_import_closure = true
requires_all_hostile_controls = true
requires_explicit_failures_and_unavailable_checks = true
requires_named_downstream_blockers = true
requires_inherited_source_replay = true
requires_source_bound_external_verification_record = true
requires_no_arithmetic_target_selection = true
runtime_correspondence_established_by_this_target = false

[nonclaims]
claims = [
  "this static descriptor is a build, kernel, axiom-audit or execution receipt",
