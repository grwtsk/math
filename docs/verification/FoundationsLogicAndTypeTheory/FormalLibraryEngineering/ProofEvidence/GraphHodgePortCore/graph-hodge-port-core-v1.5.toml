[[hostile_controls]]
id = "reject-root-import-as-slice-pass"
description = "A build of GRWTSK alone cannot substitute for checking every declared isolated module."
[[hostile_controls]]
id = "reject-source-metadata-as-proof"
description = "A source identity for the CM Hodge or external PTS theorem cannot populate a proof field."
[[hostile_controls]]
id = "reject-cycle-class-retargeting"
description = "Rational-Hodge surjectivity may move only through exact linear equivalences and a commuting cycle-class square."
[[hostile_controls]]
id = "reject-cell-class-without-cocycle"
description = "A degree-zero cellular class must land in the actual kernel of the selected coboundary."
[[hostile_controls]]
id = "reject-harmonicity-without-kernel-theorem"
description = "Cocycle representatives become harmonic only through a concrete Hodge-kernel theorem."
[[hostile_controls]]
id = "reject-hodge-equivalence-without-both-complex-laws"
description = "Hodge transport requires degreewise equivalences commuting with both differential and codifferential."
[[hostile_controls]]
id = "reject-h0-transport-without-cocycle-equivalence"
description = "H0 transport requires the induced equivalence of actual cocycle kernels."
[[hostile_controls]]
id = "reject-pts-metadata-without-model-alignment"
description = "External PTS normalization requires exact context, syntax, legality, and reduction alignment."
[[hostile_controls]]
id = "reject-compact-profile-without-compact-defects"
description = "A bounded cycle must prove compactness of adjoint, square, and represented commutator defects."
[[hostile_controls]]
id = "reject-unbounded-cycle-without-domain-invariance"
description = "Every represented algebra element must preserve the exact unbounded-operator domain."
[[hostile_controls]]
id = "reject-unbounded-commutator-without-bounded-extension"
description = "The represented commutator must agree on the exact domain with a selected bounded ambient operator."
[[hostile_controls]]
id = "reject-compact-resolvent-without-two-sided-inverse"
description = "A compact resolvent witness must map into the exact domain and satisfy both shifted inverse equations."
[[hostile_controls]]
id = "reject-absent-adapter-as-zero"
description = "A structurally absent optional adapter must leave the residual ledger unchanged."
[[hostile_controls]]
id = "reject-hidden-batch-update"
description = "An adapter plan may change only explicitly touched residual keys."
[[hostile_controls]]
id = "reject-k-invariant-as-operator-equation"
description = "A K0 or bivariant class cannot discharge an operator defect without an intertwining theorem."
[[hostile_controls]]
id = "reject-coloring-as-hodge"
description = "A proper coloring witness cannot be reported as harmonic."
[[hostile_controls]]
id = "reject-domain-erasure"
description = "An unbounded operator lift must preserve exact domains."
[[hostile_controls]]
id = "reject-wrong-middle-object"
description = "A bivariant product or typed port composition with a mismatched middle object must not elaborate."
[[hostile_controls]]
id = "reject-annotation-free-substitute"
description = "PTS replay must include reduction in lambda and product annotations."
[[hostile_controls]]
id = "reject-local-proof-as-external-replay"
description = "A local canonical-port theorem cannot be reported as external PTS replay."
[[hostile_controls]]
id = "reject-projector-energy-loss"
description = "Complementary positive Hodge sectors must reconstruct identity and split energy."
[[hostile_controls]]
id = "reject-rational-real-drift"
description = "Rational harmonicity enters the real model only through scalar-extension theorems."
[[hostile_controls]]
id = "reject-frame-without-inner-product-law"
description = "Ambient invertibility alone cannot transport symmetry."
[[hostile_controls]]
id = "reject-resolvent-at-spectrum"
description = "The finite resolvent theorem requires spectral exclusion."
[[hostile_controls]]
id = "separate-elaboration-from-axioms"
description = "Elaboration success cannot be reported as an axiom audit."

[acceptance]
requires_all_declared_modules = true
requires_exact_public_signatures = true
requires_explicit_failures_and_unavailable_checks = true
requires_named_downstream_blockers = true
requires_root_import_unchanged = true
requires_hostile_controls = true

[nonclaims]
claims = [
  "local proof of the global rational Hodge theorem for CM abelian varieties",
  "a genuine CM-variety-to-cellular comparison",
  "analytic Kasparov product",
  "unbounded Kasparov product",
  "external PTS weak-to-strong replay",
  "weak normalization of every proposed extended rewrite profile",
  "general self-adjoint spectral theorem",
  "self-adjointness from symmetry alone",
  "infinite-dimensional Fredholm determinant or zeta-divisor theorem",
  "Riemann hypothesis"
]
