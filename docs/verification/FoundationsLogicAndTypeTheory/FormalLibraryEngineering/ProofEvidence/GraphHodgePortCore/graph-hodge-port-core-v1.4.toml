[[hostile_controls]]
id = "reject-root-import-as-slice-pass"
description = "A build of GRWTSK alone cannot substitute for checking every declared isolated module."
[[hostile_controls]]
id = "reject-source-metadata-as-proof"
description = "A source identity for the CM Hodge or external PTS theorem cannot populate a proof field."
[[hostile_controls]]
id = "reject-cycle-class-retargeting"
description = "Rational-Hodge surjectivity may move between local statements only through exact linear equivalences and a commuting cycle-class square."
[[hostile_controls]]
id = "reject-cell-class-without-cocycle"
description = "A claimed degree-zero cellular class must land in the actual kernel of the selected coboundary."
[[hostile_controls]]
id = "reject-harmonicity-without-kernel-theorem"
description = "Cocycle representatives become harmonic only through a concrete theorem identifying the Hodge kernel with the coboundary kernel."
[[hostile_controls]]
id = "reject-hodge-equivalence-without-both-complex-laws"
description = "Transport between Hodge data requires degreewise equivalences commuting with both the differential and selected codifferential."
[[hostile_controls]]
id = "reject-h0-transport-without-cocycle-equivalence"
description = "A cohomology model may move between finite Hodge data only through the induced equivalence of actual cocycle kernels."
[[hostile_controls]]
id = "reject-pts-metadata-without-model-alignment"
description = "External PTS normalization requires exact context, syntax, legality, and one-step reduction equivalence before local admission."
[[hostile_controls]]
id = "reject-compact-profile-without-compact-defects"
description = "A bounded KK/Fredholm cycle must prove compactness of adjoint, square, and represented commutator defects using the actual compact-operator predicate."
[[hostile_controls]]
id = "reject-strict-cycle-without-zero-defects"
description = "A strict bounded cycle enters the compact-defect interface only after exact self-adjointness, involutivity, and representation commutation prove all defects zero."
[[hostile_controls]]
id = "reject-absent-adapter-as-zero"
description = "A structurally absent optional adapter must leave the residual ledger unchanged, not create a zero entry."
[[hostile_controls]]
id = "reject-hidden-batch-update"
description = "An adapter plan may change only keys explicitly touched by its proof-carrying sequence."
[[hostile_controls]]
id = "reject-k-invariant-as-operator-equation"
description = "A K0 or bivariant class cannot discharge an operator defect without the independent intertwining theorem."
[[hostile_controls]]
id = "reject-coloring-as-hodge"
description = "A proper coloring witness cannot be reported as harmonic."
[[hostile_controls]]
id = "reject-domain-erasure"
description = "An unbounded operator lift must preserve the exact declared domains."
[[hostile_controls]]
id = "reject-wrong-middle-object"
description = "A bivariant product or typed port composition with a mismatched middle object must not elaborate."
[[hostile_controls]]
id = "reject-annotation-free-substitute"
description = "PTS replay must include beta reduction inside lambda and product annotations and check exact subject reduction."
[[hostile_controls]]
id = "reject-local-proof-as-external-replay"
description = "The directly proved canonical port theorem cannot be reported as external PTS replay."
[[hostile_controls]]
id = "reject-projector-energy-loss"
description = "Complementary positive Hodge sectors must reconstruct the identity and exactly split energy."
[[hostile_controls]]
id = "reject-rational-real-drift"
description = "Rational harmonicity may enter the real metric model only through scalar-extension commutation theorems."
[[hostile_controls]]
id = "reject-frame-without-inner-product-law"
description = "Ambient invertibility alone cannot transport symmetric-operator status."
[[hostile_controls]]
id = "reject-resolvent-at-spectrum"
description = "The finite resolvent theorem requires every listed eigenvalue to differ from the selected parameter."
[[hostile_controls]]
id = "separate-elaboration-from-axioms"
description = "Successful elaboration cannot be reported as an axiom or trust audit."

[acceptance]
requires_all_declared_modules = true
requires_exact_public_signatures = true
requires_explicit_failures_and_unavailable_checks = true
requires_named_downstream_blockers = true
requires_root_import_unchanged = true
requires_hostile_controls = true

[nonclaims]
claims = [
  "local proof of the global rational Hodge theorem for CM abelian varieties",
  "a genuine CM-variety-to-cellular comparison",
  "analytic Kasparov product",
  "unbounded Kasparov product",
  "external PTS weak-to-strong replay",
  "weak normalization of every proposed extended rewrite profile",
  "general self-adjoint spectral theorem",
  "self-adjointness from symmetry alone",
  "infinite-dimensional resolvent or Fredholm theory",
  "Fredholm determinant or zeta-divisor theorem",
  "Riemann hypothesis"
]
