boundary_checks:
- Marked winding classes retain their lattice coordinates and all valid loops have the same basepoint.
- The FIFO pair with exponent vectors (2,1,3) and (2,3,1) gives equal squared norm and unequal prime
  codes.
- The optional height metric needs an explicit polarization, free classes and normalization.
- The actual Weil forms carry a different measure, test domain and arithmetic coefficients. The height
  analogy is an exploratory relation.
