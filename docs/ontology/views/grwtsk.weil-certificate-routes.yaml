boundary_checks:
- A single passing finite stage or a positive finite compression cannot supply an unbounded family.
- Positive heat coverage is a fact about an inventory and supplies neither the Gram sign nor the exact
  arithmetic source comparison.
- The real odd zeta criterion preserves actual zero multiplicities. The primitive nonprincipal negative-test
  return remains a premise.
- The two cofinal zeta returns share the literal root criterion and do not constitute independent proofs.

- The marked geometry route remains conditional and finite; no RH/Dirichlet GRH inference may consume it without a full-domain and all-character return.
- Reversible Markov coordinate diffusion retains the original signed source and preserves negative modes.
- The separate Noe frontier skill suite is advisory and cannot promote any mathematical evidence state.
