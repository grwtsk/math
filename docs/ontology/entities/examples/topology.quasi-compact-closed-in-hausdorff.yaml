id: entity:topology.quasi-compact-closed-in-hausdorff
kind: theorem
title: Quasi-compact subsets of Hausdorff spaces are closed
context: context:classical-point-set-topology
subjects:
- subject:msc2020.54
statement: If X is Hausdorff and E is a quasi-compact subspace, then E is closed in X.
