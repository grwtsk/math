statement: The rational mixture K(w) = (w + π) / 2 has inverse readback w = 2K(w) − π on its image.
  Uniform positive π gives one-step positivity of every cell in a finite prefix. Any particular natural-number
  code lies in a sufficiently large finite prefix.
