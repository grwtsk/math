schema: math-ontology/entity/2
id: entity:grwtsk.comb.odd-prime-affine-witness
kind: claim
title: Odd-prime affine embedding from three progression points
context: context:grwtsk.finite-combinatorics
subjects:
- subject:msc2020.05
- subject:msc2020.11
- subject:msc2020.12
statement: For an additive commutative group G with a module structure over ZMod(q) for prime q ≥ 3,
  if a+c=b+b and a≠b, the actual points a, b, c form an affine embedding Fin 3 ↪ G with nonzero step
  b−a. The inverse of two distinguishes the endpoints. In characteristic two the source witness convention
  permits a=c.
