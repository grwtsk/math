schema_version: grwtsk.mathematical-ontology/1
attribution: grwtsk contributors
baseline:
  repository: grwtsk/math
  revision: fc51c71c0c0a10701fdfb19d1a7ee2d2e49d7f52
  observed_date: '2026-11-06'
purpose: An additive, typed mathematical knowledge layer centered on the spectral geometry of the prime-coded reflective
  kernel; MSC2020 remains the primary source taxonomy.
preservation:
  primary_taxonomy: src.taxonomy
  existing_paths: preserve
  declaration_namespaces: preserve
  root_imports: preserve
  dependency_pins: preserve
  historical_evidence: append_only_scope_preserving
  legacy_article_schema: Do not change grwtsk.result-article/1; this is a separate versioned registry.
  operational_owner: grwtsk/noeaaeue
interpretation:
  default_truth: unasserted
  relation_edges: navigation_only_unless_a_separate_inference_with_witness_is_admitted
  inference_semantics: All premises within a rule are conjunctive; distinct rules with the same conclusion are alternatives.
  cycles: Exploratory rules may be cyclic; least-fixed-point closure never self-seeds a cycle. Accepted proofs require
    a finite checked derivation or an explicit well-founded induction witness.
  formal_backend: Lean checks formal propositions and applications; YAML validation does not prove mathematical
    truth or dependent type correctness.
  authority: Static mathematical and review data grant no execution, messaging, scheduler or publication authority.
  unknown_means: Unassessed is neither proved nor false. A metadata validation pass never changes a mathematical
    or formal evidence state.
