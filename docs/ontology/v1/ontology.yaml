roadmap:
- id: phase.inventory
  goal: Freeze and enumerate the complete source/document/issue inventories; retain truncation, unavailable manifests
    and concurrency information.
  done_when: Every fetched object is recorded; missing populations remain explicit; no inferred exhaustive coverage.
- id: phase.definitions
  goal: Resolve canonical definitions, aliases, contexts and duplicate concepts by actual statement comparison.
  done_when: All mapped definitions have one canonical identity; alternative formulations retain proved or pending
    comparison maps.
- id: phase.interfaces
  goal: Bind the concrete reflective kernel, operators, spaces and source-return obligations.
  done_when: Every proposed cross-domain transfer names its domain, codomain, assumptions, preserved structure and
    missing witness.
- id: phase.proofs
  goal: Map declarations and proof applications to the typed hypergraph with source-bound verification evidence.
  done_when: Checked extraction and explicit premise coverage; no import-edge or analogy-to-proof conversion.
- id: phase.issues
  goal: Add managed mathematical architecture records to each relevant issue without replacing its historical body.
  done_when: The complete issue census has reviewed relevance, bindings, obligations, acceptance criteria and preserved
    statuses.
- id: phase.acceptance
  goal: Enable trustworthy forward use and backward goal planning under a declared evidence policy.
  done_when: Exact-source schema, type/reference, coverage, no-circular-proof and trust-policy checks pass at the
    same pinned inventory; no RH/GRH acceptance inferred.
