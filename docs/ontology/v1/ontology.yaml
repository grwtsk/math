contexts:
- id: ctx.kernel
  parameters:
  - 'Sigma: a fixed typed manifest with d fields'
  - 'program: an exact program identity'
  - 'bounds: declared finite capacities'
  - 'revision: external snapshot context'
  conventions:
  - Valid states form a finite subset S_Sigma of N^d, not a vector subspace.
  - Distinct registered primes and complete field validation are required.
  - Revision and authority are not inferred from an exponent vector.
  source: src.kernel
- id: ctx.torus
  parameters:
  - Lambda = Z^d with the declared basis
  - 'G: a symmetric positive-definite real d by d matrix'
  conventions:
  - Primal torus V/Lambda; dual character torus V*/Lambda^vee.
  - Normalized Haar measure on both tori.
  - Characters chi_e(theta)=exp(2*pi*i*theta(e)); retain joint mode labels.
  - Full operators use their stated Fourier-diagonal domains; finite restrictions are different objects.
  source: src.kernel
- id: ctx.weil
  parameters:
  - 'T>0: support half-width'
  - 'sector: zeta or a specified primitive Dirichlet source'
  - 'f: an element of the exact source test/form domain'
  conventions:
  - Lebesgue measure dt; zero extension from [-T,T].
  - Fourier transform integral f(t) exp(-i*z*t) dt; inner products antilinear first.
  - Retain all active prime powers and Lambda(p^m)=log(p).
  - The full zeta pole is 2|<cosh(t/2),f>|^2-2|<sinh(t/2),f>|^2.
  - Physical L2, maximal form domain and operator domain are distinct.
  - Primitive conjugate-pair forms retain conductor, parity, ramification and completed-divisor factor 1/2.
  source: src.weil
- id: ctx.weighted
  parameters:
  - 'phi: the explicitly normalized positive even theta kernel with Fourier transform Xi'
  conventions:
  - dnu=2*phi(t)*cosh(t/2)dt; physical f=phi*g.
  - The map g -> f is not unitary into physical L2(dt).
  - Weighted reference heat, torus heat, Euler heat and stochastic coverage heat are different objects.
  source: src.heat
entities:
- id: obj.state
  kind: object
  label: Admissible typed state
  context: ctx.kernel
  statement: S_Sigma is the finite subset of N^d satisfying the complete manifest, queue, control and capacity predicates.
  mathematical_state: specified
  sources:
  - src.kernel
- id: obj.code
  kind: object
  label: Context-indexed prime code
  context: ctx.kernel
  statement: A positive integer N together with Sigma and program; complete decoding rejects any unregistered residual
    cofactor.
  mathematical_state: specified
  sources:
  - src.kernel
- id: obj.lattice
  kind: object
  label: Ambient integral lattice
  context: ctx.kernel
  statement: Lambda=Z^d; signed displacements live here, not necessarily in S_Sigma.
  mathematical_state: specified
  sources:
  - src.kernel
- id: obj.vector
  kind: object
  label: Ambient real vector space
  context: ctx.kernel
  statement: V=Lambda tensor_Z R. Valid states are not closed under its vector-space operations.
  mathematical_state: specified
  sources:
  - src.kernel
- id: obj.primal
  kind: object
  label: Primal flat torus
  context: ctx.torus
  statement: T=V/Lambda with metric G; all lattice vectors project to the same point.
  mathematical_state: specified
  sources:
  - src.kernel
- id: obj.winding
  kind: object
  label: Marked winding class
  context: ctx.torus
  statement: An element of pi_1(T,0)=Lambda with a chosen basis and lift; retain queue-slot labels.
  mathematical_state: specified
  sources:
  - src.kernel
- id: obj.dual
  kind: object
  label: Dual character torus
  context: ctx.torus
  statement: T_hat=V*/Lambda^vee with dual metric G^-1, not an algebraic dual abelian variety.
  mathematical_state: specified
  sources:
  - src.kernel
- id: obj.hilbert_full
  kind: object
  label: Full torus Hilbert space
  context: ctx.torus
  statement: ell^2(Lambda) is Fourier-isomorphic to L2(T_hat, normalized Haar).
  mathematical_state: specified
  sources:
  - src.kernel
- id: obj.hilbert_finite
  kind: object
  label: Finite valid-state Hilbert space
  context: ctx.torus
  statement: H_Sigma=span_C{chi_e:e in S_Sigma}; a classical state is a labeled basis vector.
  mathematical_state: specified
  sources:
  - src.kernel
- id: obj.height
  kind: object
  label: Optional arithmetic height space
  context: ctx.torus
  statement: A polarized abelian variety A/K, its free Mordell-Weil quotient, independent classes P_i, and a fixed
    canonical-height normalization.
  mathematical_state: specified
  sources:
  - src.kernel
- id: obj.snapshot
  kind: object
  label: Revision-bound snapshot
  context: ctx.kernel
  statement: (Sigma, program, revision, N), with complete decoding; replacement validity and authority are separate
    predicates.
  mathematical_state: specified
  sources:
  - src.kernel
- id: obj.events
  kind: object
  label: Labeled state transitions
  context: ctx.kernel
  statement: Source, destination, action and context; neither a spectrum nor a state-only observation reconstructs
    the event order.
  mathematical_state: specified
  sources:
  - src.kernel
- id: obj.weil_hilbert
  kind: object
  label: Physical window Hilbert space
  context: ctx.weil
  statement: H_T=L2([-T,T],dt) with zero extension; not the state-lattice Hilbert space.
  mathematical_state: specified
  sources:
  - src.weil
- id: obj.weil_form
  kind: object
  label: Full arithmetic Weil form
  context: ctx.weil
  statement: 'Q_T(f)=c_inf||f||^2+integral_{r>0} kappa(r)||tau_r f_0-f_0||^2 dr +2 Re(M_+(f) conjugate(M_-(f)))-2
    sum_{2<=n<exp(2T)} Lambda(n)/sqrt(n) Re(C_f(log n)); kappa(r)=exp(-r/2)/(1-exp(-2r)); c_inf=digamma(1/4)-log(pi).
    Domain: exactly the finite jump-energy elements of H_T. f_0 is the zero extension, C_f(r)=integral conjugate(f_0(t))*f_0(t+r)dt,
    M_+(f)=integral f_0(t)exp(t/2)dt and M_-(f)=integral f_0(t)exp(-t/2)dt. This is the zeta source; other sectors
    have separately indexed gamma/prime/pole data.'
  mathematical_state: specified
  sources:
  - src.weil
- id: obj.weighted_hilbert
  kind: object
  label: Theta-weighted reference Hilbert space
  context: ctx.weighted
  statement: L2(R,nu), dnu=2*phi*cosh(t/2)dt; separate from physical L2.
  mathematical_state: specified
  sources:
  - src.heat
- id: obj.finite_matrix
  kind: object
  label: Source-indexed finite observation
  context: ctx.weil
  statement: A finite compression or lower enclosure with basis, source, norm, support, sector and complete error
    budget retained.
  mathematical_state: specified
  sources:
  - src.weil
  - src.schur
- id: op.coordinates
  kind: operator
  label: Joint coordinate observables
  context: ctx.torus
  statement: X_i chi_e=e_i chi_e. The joint tuple, not one eigenvalue, identifies e.
  mathematical_state: specified
  sources:
  - src.kernel
  operator:
    carrier: obj.hilbert_finite
    domain: All of H_Sigma
    codomain: obj.hilbert_finite
    formula: X_i chi_e=e_i chi_e
    boundedness: finite_dimensional
- id: op.code
  kind: operator
  label: Prime-code observable
  context: ctx.torus
  statement: The manifest-dependent commuting functional calculus realizes the exact integer code.
  mathematical_state: specified
  sources:
  - src.kernel
  operator:
    carrier: obj.hilbert_finite
    domain: All of H_Sigma
    codomain: obj.hilbert_finite
    formula: N_Sigma=exp(sum_i log(p_i)*X_i)
    boundedness: finite_dimensional
- id: op.laplacian
  kind: operator
  label: Dual-torus height Laplacian
  context: ctx.torus
  statement: The primal operator instead uses G^-1; do not identify their scalar spectra without the metric comparison.
  mathematical_state: specified
  sources:
  - src.kernel
  operator:
    carrier: obj.hilbert_full
    domain: Fourier coefficients a_e with sum_e (e^T G e)^2 |a_e|^2 finite
    codomain: obj.hilbert_full
    formula: Delta_hat chi_e=4*pi^2*(e^T G e)*chi_e
    boundedness: unbounded
- id: op.torus_heat
  kind: operator
  label: Dual-torus heat semigroup
  context: ctx.torus
  statement: A nonnegative geometric reference heat, not a scheduler or an arithmetic positivity certificate.
  mathematical_state: specified
  sources:
  - src.kernel
  operator:
    carrier: obj.hilbert_full
    domain: All of L2(T_hat), for t>=0
    codomain: obj.hilbert_full
    formula: exp(-t*Delta_hat)
    boundedness: bounded
- id: op.guard
  kind: operator
  label: Enabled-state projection
  context: ctx.kernel
  statement: The guard includes consumption, zero tests, control state and validity of the output.
  mathematical_state: specified
  sources:
  - src.kernel
  operator:
    carrier: obj.hilbert_finite
    domain: All of H_Sigma
    codomain: obj.hilbert_finite
    formula: P_a chi_e=1_{D_a}(e)*chi_e
    boundedness: finite_dimensional
- id: op.transition
  kind: operator
  label: Guarded transition operator
  context: ctx.kernel
  statement: The linear encoding of a partial state map; mergers need not be isometries, and adjoints are not automatic
    executable reverses.
  mathematical_state: specified
  sources:
  - src.kernel
  operator:
    carrier: obj.hilbert_finite
    domain: All of H_Sigma; zero on disabled basis states
    codomain: obj.hilbert_finite
    formula: W_a=sum_{e in D_a} |F_a(e)><e|
    boundedness: finite_dimensional
- id: op.port_swap
  kind: operator
  label: Paired-port involution
  context: ctx.kernel
  statement: Only a validity-preserving coordinate permutation acts on H_Sigma; geometric isometry additionally
    requires J^T G J=G.
  mathematical_state: specified
  sources:
  - src.kernel
  operator:
    carrier: obj.hilbert_finite
    domain: All of H_Sigma if J(S_Sigma)=S_Sigma
    codomain: obj.hilbert_finite
    formula: U_J|e>=|Je>
    boundedness: finite_dimensional
- id: op.weil
  kind: operator
  label: Canonical full window Weil operator
  context: ctx.weil
  statement: The self-adjoint operator associated with the specified closed source form; not its finite compression.
  mathematical_state: specified
  sources:
  - src.weil
  operator:
    carrier: obj.weil_hilbert
    domain: f in H_T with sum_n (1+|d_n|^2)|<e_n,f>|^2<infinity, e_n=(2T)^(-1/2)exp(i*pi*n*t/T), d_n=c_inf+m(pi*n/T),
      m(xi)=2 sum_{j>=0} xi^2/[alpha_j(alpha_j^2+xi^2)], alpha_j=2j+1/2; source identification is an unreviewed
      analytical input, not newly kernel checked.
    codomain: obj.weil_hilbert
    formula: A_T=D_T+G_T-P_T^arith+L_T^pole
    boundedness: unbounded
- id: op.weighted_heat
  kind: operator
