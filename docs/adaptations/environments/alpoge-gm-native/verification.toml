# Native Alpoge intermediate Gm source-only verification manifest.
# This is for the ORIGINAL isolated Lean v4.33.1 toolchain and its
# Mathlib commit, NOT the incompatible grwtsk/math root Lean v4.34.1.
#
# Original mirror (read-only):
# tamnd/riemann-lean@af705e0d9a5904326eb0693310e36d9484df7f8f
# Core source: Formalism/SharpRestriction/RamificationFrobenius/
# TotientGaloisClasses/{PrimePairSizeCondition,Analytic,
# ExplicitFormulaErrorOfHostConditions,Window,Landau};
# Development/AutomorphicArithmetic/PrimitiveCosets/CoreGm.
#
# Stage source files into the disposable ORIGINAL Lean checkout at
# lean/src/<module_path>.lean (see README.md), then use that
# toolchain to build, lean --trust=0, and audit #print axioms.
# Source SHA/name checks alone are NOT elaboration, kernel checking,
# or proof of the periodic Abel-tail bounds and eventual EAtH/CoreAtH.
# NO Alpoge Main / FinalTheorems / everyCharacter imported.
format_version = 1
suite = "Actual native Level.Gm normalization, Dirichlet constants, and original typed integer source"
issue = "https://github.com/grwtsk/math/issues/1850"

[environment]
lean_toolchain = "leanprover/lean4:v4.33.1"
mathlib_revision = "0df444a360eaa60ab8c11dca51a86af692955474"
alpoge_repository = "tamnd/riemann-lean"
alpoge_revision = "af705e0d9a5904326eb0693310e36d9484df7f8f"

[policy]
expected_theorems = 48
allowed_axioms = ["propext", "Classical.choice", "Quot.sound"]
lean_elaboration = "NOT_RUN"
fresh_kernel_replay = "NOT_RUN"
transitive_axiom_audit = "NOT_RUN"
periodic_Abel_Dirichlet_tail_formalization = "NOT_PROVED_IN_LEAN"
universal_eventual_native_EAtH_CoreAtH = "NOT_PROVED"
native_cyclic_phase_orthogonality = "MATHEMATICAL_PROOF_ONLY"
native_integer_Gm_curvature_kernel = "NOT_RUN"
centered_weighted_Mertens_power_rate = "NOT_PROVED"

