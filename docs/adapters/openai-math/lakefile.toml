name = "grwtsk-openai-math-adapters"
defaultTargets = ["GRWTSKOpenAIAdapters"]

[[lean_lib]]
name = "GRWTSKOpenAIAdapters"
roots = ["GRWTSK.NumberTheory.MultiplicativeNumberTheory.AsymptoticResultsOnArithmeticFunctions.LiouvilleTwoPointFiniteFamily", "GRWTSK.NumberTheory.ZetaAndLFunctionsAnalyticTheory.NonrealZerosOfZetaSAndLSChiRiemannAndOtherHypotheses.SevenEighthsZeroFreeGap", "GRWTSK.ComputerScience.ComputerScienceSupportForMathematicalResearchAndPractice.TheoremProvingAutomatedAndInteractiveTheoremProversDeductionResolutionEtc.AdapterAxiomQueries"]

[[require]]
name = "OAI"
git = "https://github.com/openai/math.git"
rev = "7ef5c0cc5ca4b0e072b7a050fca09ab24bc6fa3a"
subDir = "lean"

# Opt-in subject-organized upstream surfaces; excluded from defaultTargets.
[[lean_lib]]
name = "GRWTSKOpenAICatalogue"
roots = []
globs = ["GRWTSK.+"]
