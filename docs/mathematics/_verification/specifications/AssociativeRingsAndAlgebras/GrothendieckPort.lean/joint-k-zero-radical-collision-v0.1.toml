[[declarations]]
name = "GRWTSK.Algebra.KTheory.JointCollision.type_eq_of_joint_feature_collision"
kind = "theorem"
meaning = "Any decoder correct on all sources identifies type labels of sources with equal K-zero-shaped class and equal radical signal"
hypotheses = ["CommMonoid Stable", "correct : ∀ source, decode (feature source) = typeOf source", "kClass a = kClass b", "radical a = radical b"]

[[declarations]]
name = "GRWTSK.Algebra.KTheory.JointCollision.no_exact_type_decoder_of_collision"
kind = "theorem"
meaning = "A joint feature collision between different exact type labels prohibits an exact decoder factoring only through those features"
hypotheses = ["CommMonoid Stable", "kClass a = kClass b", "radical a = radical b", "typeOf a ≠ typeOf b"]

