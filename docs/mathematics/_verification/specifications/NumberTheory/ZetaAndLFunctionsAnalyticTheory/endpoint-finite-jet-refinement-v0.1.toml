[[hostile_controls]]
id = "existing_rising_polynomial"
required = true
description = "value is upstream ascPochhammer; do not replace it with a free jet label."

[[hostile_controls]]
id = "vanishing_factors"
required = true
description = "P3(-1)=0 and derivative=-1; reject division-based zero tangent."

[[hostile_controls]]
id = "positive_inventory"
required = true
description = "Exactly all bases 1 through N, with no base zero and no missing final endpoint."

[[hostile_controls]]
id = "inclusive_half"
required = true
description = "The inclusive cutoff uses minus one-half. N=1,p=0,s=2 gives 3/2, not 5/2."

[[hostile_controls]]
id = "endpoint_derivative"
required = true
description = "At N=1,p=0,s=2 the Dirichlet derivative is zero but the full derivative is -1."

[[hostile_controls]]
id = "bernoulli_identity"
required = true
description = "Use upstream B1=-1/2 and all even coefficients through B16; no unchecked coefficient labels."

[[hostile_controls]]
id = "nonpole_domain"
required = true
description = "Actual analytic and reciprocal refinement theorems require s not equal to one."

[[hostile_controls]]
id = "constructed_rounded_traces"
required = true
description = "All seed and square residuals and exactly s+1 values/s radii are constructed; no defaults as evidence."

[[hostile_controls]]
id = "input_alignment"
required = true
description = "Each of 81 traces uses the derived exponent from the same literal center and exact positive-base log."

[[hostile_controls]]
id = "taylor_domain"
required = true
description = "The real-part and divided-argument Taylor guards remain required for every leaf."

[[hostile_controls]]
id = "nonlinear_and_rounding_errors"
required = true
description = "Keep seed error, every square residual, nonlinear amplification, and upward radius rounding."

[[hostile_controls]]
id = "full_ball_product"
required = true
description = "Keep both linear radius terms, the product of radii, signed coordinate displacement and every outer operation."

[[hostile_controls]]
id = "presented_center"
required = true
description = "Retain displacement to both unchanged Newton constants in the final budgets."

[[hostile_controls]]
id = "two_output_identity"
required = true
description = "The second output encloses the actual complex derivative of the same finite corrected model."

[[hostile_controls]]
id = "uniform_source_gap"
required = true
description = "The local actual-zeta theorem still requires the full closed-disk remainder bound. Do not infer it from sample values."

[[hostile_controls]]
id = "cauchy_derivative_gap"
required = true
description = "Use holomorphic difference on the same outer disk with factor 1/S, not differentiated pointwise error."

[[hostile_controls]]
id = "large_finite_decisions"
required = true
description = "All large by-decide expressions need pinned execution and resource review. Python matches are not Lean acceptance."

[[hostile_controls]]
id = "global_and_runtime_nonclaims"
required = true
description = "No Horner/parser/compiler/runtime qualification, complete count, omitted-divisor tail, prime margin, bounded line theorem or RH conclusion."
