[[hostile_controls]]
id = "bernoulli-convention"
requirement = "Require upstream negative B1 and actual upstream polynomial; reject a renamed coefficient table."
status = "NOT_RUN"

[[hostile_controls]]
id = "degree-one-seam"
requirement = "Do not cancel B1(1)-B1(0)=1. Unit-tail recurrence requires m>=1."
status = "NOT_RUN"

[[hostile_controls]]
id = "coefficient-continuum"
requirement = "Require proof on every unit-interval point, not endpoints or finite samples; coefficient sum is not asserted the supremum."
status = "NOT_RUN"

[[hostile_controls]]
id = "integrability-first"
requirement = "Require measurable integrand and the sigma+m>1 domination proof before using each infinite tail."
status = "NOT_RUN"

[[hostile_controls]]
id = "positive-base"
requirement = "Retain N>=1 and positive real bases. Zero-base totalized complex powers are not consumed."
status = "NOT_RUN"

[[hostile_controls]]
id = "power-derivative-zero"
requirement = "The real-base derivative handles exponent zero separately, not through a false nonzero premise."
status = "NOT_RUN"

[[hostile_controls]]
id = "cell-endpoint-nullity"
requirement = "Raw polynomial and periodic functions agree on open cells; singleton-nullity transports integrals without claiming global seam differentiability."
status = "NOT_RUN"

[[hostile_controls]]
id = "all-cells"
requirement = "Finite block exactly covers N..N+K. K=0 is zero, not the infinite tail."
status = "NOT_RUN"

[[hostile_controls]]
id = "both-exterior-endpoints"
requirement = "Retain the upper endpoint until its proved limit is taken. A finite identity with it deleted is false."
status = "NOT_RUN"

[[hostile_controls]]
id = "absolute-limit"
requirement = "Use actual improper-integral convergence from absolute integrability and upper-endpoint norm decay, not an unproved formal limit."
status = "NOT_RUN"

[[hostile_controls]]
id = "inclusive-cutoff"
requirement = "The source sum includes N and requires the minus half endpoint; changing the sign changes the function."
status = "NOT_RUN"

[[hostile_controls]]
id = "nonpole-and-domain"
requirement = "The zeta residual retains Re(s)>0 and s!=1; an enlarged tail domain does not enlarge the source identity."
status = "NOT_RUN"

[[hostile_controls]]
id = "full-rising-factorial"
requirement = "All factors and the factorial denominator remain; no division by a vanishing Pochhammer factor."
status = "NOT_RUN"

[[hostile_controls]]
id = "literal-uniform-disk"
requirement = "Retain exact old center and outer radius; prove all-point Re(s)>=1/4, |s|<=15 and pole exclusion."
status = "NOT_RUN"

[[hostile_controls]]
id = "same-finite-target"
requirement = "Require exact equality with EndpointCorrectedJet.model, including every Bernoulli correction and original positive-base inventory."
status = "NOT_RUN"

[[hostile_controls]]
id = "same-newton-consumer"
requirement = "Supply exactly old CenterEstimates without changing constants/errors; Cauchy derivative and finite presentation charges remain."
status = "NOT_RUN"

[[hostile_controls]]
id = "large-prior-decisions"
requirement = "All inherited 81-term checks and rational reductions must actually elaborate under authorized resource limits; no native shortcut or report truth value."
status = "NOT_RUN"

[[hostile_controls]]
id = "source-not-acceptance"
requirement = "No-hypothesis source declaration is not kernel acceptance, an ordinal zero number, a critical-line theorem, a count/tail/margin or RH result."
status = "NOT_RUN"
