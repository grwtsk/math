[[controls]]
id = "double-zero"
obligation = "A double zero contributes -2, not -1; no simple-zero premise is inserted."

[[controls]]
id = "pole-sign"
obligation = "An order-minus-three pole contributes +3; the actual zeta pole contributes +1."

[[controls]]
id = "unit"
obligation = "A nonvanishing unit has zero logarithmic coefficient."

[[controls]]
id = "center-totalization"
obligation = "Do not read logDeriv at its assigned center value as a residue."

[[controls]]
id = "vanishing-multiplier"
obligation = "A zero of the analytic multiplier may cancel the logarithmic pole."

[[controls]]
id = "riesz-zero"
obligation = "The quotient at z=0 is excluded from continuity and quotient arguments."

[[controls]]
id = "riesz-minus-one"
obligation = "The quotient at z=-1 is excluded; no totalized value is substituted."

[[controls]]
id = "normalization"
obligation = "The Riesz pole term is u^2/2 and the tent pole term is h, not 2h."

[[controls]]
id = "local-not-global"
obligation = "An arbitrary entire addition can preserve residues but change contour contributions."

[[controls]]
id = "source-location"
obligation = "Use the canonical full complex zero and analytic multiplicity, not a midpoint or line projection."

[[controls]]
id = "punctured-domain"
obligation = "Derivative agreement is taken on a punctured neighborhood with actual denominator separation."

[[controls]]
id = "inherited-boundary"
obligation = "No local residue theorem supplies counting, Perron inversion, infinite contour limits or all-interval margins."
