[[hostile_controls]]
id = "reject-unbound-rational-extension"
description = "The rational composite must agree with the previous integer combinedMap on all integral parameters, and retain minimumData followed by the old weighted port."

[[hostile_controls]]
id = "reject-nonprime-local-place"
description = "Require Fact p.Prime for multiplicativity, ultrametric frame bounds, and the prime-depth inverse factor. Composite bases are not finite places."

[[hostile_controls]]
id = "reject-zero-column-inverse"
description = "Every inverse requires nonzero source weights; the Frey inverse retains ab!=0. Division by zero is never an accepted inverse."

[[hostile_controls]]
id = "reject-euclidean-or-sum-as-padic-max"
description = "Use the explicit finite maximum of the actual rational padicNorm. Do not use Q's default archimedean norm or a sum of norms."

[[hostile_controls]]
id = "reject-empty-sharpness-carrier"
description = "The max-norm carrier is finite and nonempty; the old Index k includes a constant coordinate even at grade zero."

[[hostile_controls]]
id = "reject-index-as-operator-norm"
description = "The exact local inverse factor is obtained from reciprocal columns. Do not substitute the product of all cokernel moduli."

[[hostile_controls]]
id = "reject-source-column-reversal"
description = "Source i reads target reverse(i); the signed weight belongs to the source column, not to the target slot."

[[hostile_controls]]
id = "reject-missing-common-mismatch"
description = "Raw target data include sum and all three mismatch fields. Differences alone discard the common mismatch coordinate."

[[hostile_controls]]
id = "reject-unproved-frame-isometry"
description = "The integer difference frame and its inverse need both ultrametric bounds. Its p-adic isometry does not imply real max-norm isometry."

[[hostile_controls]]
id = "reject-lcm-of-independent-costs"
description = "Prove sharpness using the actual top-weight 3 and 4 columns and 1/(12w)=1/(3w)-1/(4w). Shared prime depths are retained."

[[hostile_controls]]
id = "reject-radical-as-inverse-cost"
description = "Use v_p(12)+k*v_p(ab), not the support indicator or the index exponent. At ab=6,k=2 the factors at 2 and 3 are 16 and 27."

[[hostile_controls]]
id = "reject-grade-zero-cost-erasure"
description = "At grade zero the weighted map is identity but the minimum-source chart retains clearing12 and local factors at 2 and 3."

[[hostile_controls]]
id = "reject-rational-norm-as-completed-operator"
description = "This target uses rational inputs and Mathlib padicNorm. It does not construct or audit a continuous extension to Q_p."

[[hostile_controls]]
id = "reject-local-sum-as-source-height"
description = "The finite sum is log12+k log|ab| for this same inverse and declared norms. It is not a global source-height upper bound or ABC theorem."

[[hostile_controls]]
id = "reject-quotient-as-full-source-recovery"
description = "Four-field reduced recovery does not restore the two discarded gauge fields. Six-field full recovery and intrinsic geometric lattices remain separate."

[[hostile_controls]]
id = "reject-source-or-python-as-lean-acceptance"
description = "The new Lean scripts are unelaborated. Bounded exact arithmetic checks and patch/hash checks are not kernel or transitive trust evidence."

