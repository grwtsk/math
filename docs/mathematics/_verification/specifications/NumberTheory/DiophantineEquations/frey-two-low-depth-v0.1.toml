  "conductor, Ogg formula, Kodaira symbols, Tamagawa data or Tate uniformization",
  "completed local rings or fields, or global minimal-model packaging",
  "integral marked-point, section or jet-lattice transport",
  "complete H0, intrinsic geometric lattices or an intrinsic Hodge metric comparison",
  "cancellation of previous frame, denominator, index or gauge costs",
  "uniform radical-height estimates, ABC or RH",
  "workflow dispatch, worker/F06 action, external replay, merge or closure authority"
]
