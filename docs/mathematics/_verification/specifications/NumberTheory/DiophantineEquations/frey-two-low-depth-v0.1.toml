[[hostile_controls]]
id = "reject-singular-log"
description = "The exponent uses a total integer logarithm. Every minimality and exponent-change theorem must retain Delta nonzero; the junk exponent at zero is not a finite discriminant exponent."

[[hostile_controls]]
id = "reject-window-endpoint"
description = "Retain exponent strictly below12. Scaling tuple(1,4,0,1,0) up by u=1/2 gives integral tuple(2,16,0,16,0) of exponent12, and u=2 lowers that exponent to0."

[[hostile_controls]]
id = "reject-sign-reversal"
description = "Multiplicative localVal decreases when additive depth increases. In the change law, exponent_new=exponent_old+12log(localVal(u)); log(localVal(u)) is the negative additive scale valuation."

[[hostile_controls]]
id = "reject-weight-six"
description = "The discriminant scales by u^(-12), not u^(-6). The threshold and congruence class of its exponent must retain12."

[[hostile_controls]]
id = "reject-integrality-guard"
description = "Compare all admissible changes only when all FIVE resulting coefficients lie in the actual local ring. A nonintegral output can have a smaller or negative exponent and is not a competitor."

[[hostile_controls]]
id = "reject-integer-only-search"
description = "Local integrality in Z_(p) permits denominators prime to p. Restricting competitors to globally integral coefficients is not a universal local minimality proof."

[[hostile_controls]]
id = "reject-canonical-normalization"
description = "Derive the local maximal ideal generator and localVal(p)=exp(-1) for the existing LocalRing. An arbitrary equivalent rescaled valuation cannot be substituted in the numeric threshold12."

[[hostile_controls]]
id = "reject-zero-factorization"
description = "localVal_nat requires a nonzero natural integer. factorization(0)=0 does not justify localVal(0)=1."

[[hostile_controls]]
id = "reject-c-only-guard"
description = "Use the FULL product abc in 16 not dividing abc. The source(16,1,17) has odd c but is outside the low-depth domain."

[[hostile_controls]]
id = "reject-nonunit-only-additive"
description = "Both raw c4 and Delta nonunit are insufficient until minimality is established. Raw(1,31,32) admits the previous integral scale-two improvement."

[[hostile_controls]]
id = "reject-raw-changed-confusion"
description = "The new low-depth predicate applies to the OLD raw freyCurve. The old semistable predicates apply to their explicit changed equations and are not reassigned to the raw tuples."

[[hostile_controls]]
id = "reject-complement-promotion"
description = "No classification follows for high-depth sources outside the two previous guarded chambers. Failure of the small-window criterion or one coordinate change is not additive classification."

[[hostile_controls]]
id = "reject-conductor-identification"
description = "Discriminant exponents6,8,10 are not conductor exponents, Kodaira symbols, Tamagawa numbers, or evidence of a squarefree ideal."

[[hostile_controls]]
id = "reject-completion-substitution"
description = "LocalRing remains the genuine Z_(p) subring of Q. No completed Q_p or Z_p transport or comparison is constructed."

[[hostile_controls]]
id = "reject-height-promotion"
description = "The local classification neither lowers the existing marked source height nor controls the signed excess uniformly. No weighted-map, frame, denominator, index or discarded-gauge cost is canceled."

[[hostile_controls]]
id = "reject-finite-test-acceptance"
description = "Bounded exact arithmetic checks are not universal minimality proofs, Lean elaboration, exact public-signature acceptance, or a transitive trust audit. This static target grants no execution authority."

