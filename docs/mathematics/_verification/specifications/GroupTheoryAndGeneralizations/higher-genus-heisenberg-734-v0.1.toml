[[hostile_controls]]
id = "g-two-boundary"
requirement = "The family includes k=0 and a literal two-handle relator; the additional handle list is empty but the first two commutators remain."
status = "NOT_RUN"

[[hostile_controls]]
id = "g-three-nonempty"
requirement = "The family includes k=1 and the ordered extra relator list is a singleton, even though its Heisenberg image is one."
status = "NOT_RUN"

[[hostile_controls]]
id = "arbitrary-k-not-only-two"
requirement = "Every k:Nat has finite extra handle IDs and the full single relator; no hidden maximum genus or omitted family cases."
status = "NOT_RUN"

[[hostile_controls]]
id = "free-group-source-exact"
requirement = "Use the actual Mathlib FreeGroup on Sum(Fin4, Fin k×Bool), not a free abstract oracle or an infinitely generated stand-in."
status = "NOT_RUN"

[[hostile_controls]]
id = "handle-source-injective"
requirement = "Base generator labels and extra-handle pair labels inhabit disjoint Sum constructors; do not collapse a newly added handle into a base generator."
status = "NOT_RUN"

[[hostile_controls]]
id = "a-versus-b-extra-letter"
requirement = "The Bool flag distinguishes the extra a and b generators and their ordered commutator factors."
status = "NOT_RUN"

[[hostile_controls]]
id = "noncommutative-product-order"
requirement = "Handle commutators form an ORDERED List.prod; unordered Finset.prod would require an invalid commutativity premise."
status = "NOT_RUN"

[[hostile_controls]]
id = "extra-list-order"
requirement = "The extra handle relator list is List.ofFn over canonical Fin k order; don't silently reorder its source terms."
status = "NOT_RUN"

[[hostile_controls]]
id = "actual-relator-normal-closure"
requirement = "HigherGenusPresentedGroup must be the genuine PresentedGroup quotient by the normal closure of the entire ordered relator."
status = "NOT_RUN"

[[hostile_controls]]
id = "base-relator-cancellation"
requirement = "The first two commutators map [X,Y]=Z and [X,Y^-1]=Z^-1, with the inverse on the second b generator."
status = "NOT_RUN"

[[hostile_controls]]
id = "trivial-extra-letters"
requirement = "Every extra source generator maps to group identity in the selected quotient homomorphism, not necessarily to identity in the presented group."
status = "NOT_RUN"

[[hostile_controls]]
id = "extra-commutators-before-product"
requirement = "Prove each extra handle commutator has image 1, then the entire ordered list product has image 1."
status = "NOT_RUN"

[[hostile_controls]]
id = "full-relator-soundness"
requirement = "The entire actual relator must map to identity before applying PresentedGroup.toGroup; a base-only check is not sufficient."
status = "NOT_RUN"

[[hostile_controls]]
id = "real-group-hom-from-quotient"
requirement = "The map must be a MonoidHom from the actual PresentedGroup, not merely a map of finite generator values."
status = "NOT_RUN"

[[hostile_controls]]
id = "first-handle-same-source"
requirement = "The first-handle commutator inside each presented group must be the exact same element sent to Z and mapped to identity by abelianization."
status = "NOT_RUN"

[[hostile_controls]]
id = "heisenberg-Z-not-power"
requirement = "Reuse the exact parent Heisenberg proof excluding all positive proper roots of Z, not a bounded enumeration."
status = "NOT_RUN"

[[hostile_controls]]
id = "separating-primitive-not-simple-proof"
requirement = "The non-power group theorem does not by itself prove a geodesic is simple or separating in a marked hyperbolic surface."
status = "NOT_RUN"

[[hostile_controls]]
id = "canonical-abelianization"
requirement = "Use Mathlib Abelianization.of of the complete presented group; do not equate an arbitrary first/second-coordinate projection with H1."
status = "NOT_RUN"

[[hostile_controls]]
id = "all-integer-characters-zero"
requirement = "For each k and every actual IntegerCharacter, the first-handle commutator maps to integer zero."
status = "NOT_RUN"

[[hostile_controls]]
id = "unit-certificate-not-necessary"
