[[hostile_controls]]
id = "same_source"
requirement = "Use the unchanged sextic source H=R6-A7*J6_1, exact signed kernel b6, positive-real power branch, and removable H(1)=1. No new primitive or endpoint correction."

[[hostile_controls]]
id = "old_table_not_cap"
requirement = "Reuse all112 signed coefficients and the exact16 row identities. The new absolute-coefficient Bernstein envelope is not the old piecewise constant maximum cap, and neither is a sampled value."

[[hostile_controls]]
id = "basis_power_identity"
requirement = "Check the complete49-entry power table against the actual degree6 basis. Compute all moments from the exact power integrals with nonzero denominators k+m+1."

[[hostile_controls]]
id = "partition_and_sign"
requirement = "The binomial weights form the proved partition of unity. Prove every deficitCoefficient nonnegative and density<=1-|B|; do not assume a positive signed kernel."

[[hostile_controls]]
id = "both_endpoints"
requirement = "Use source_on_first_cell including t=2 with B(1)=B(0). Do not use floor(t)=1 at t=2 or omit that boundary."

[[hostile_controls]]
id = "tangent_squares"
requirement = "Prove both tangent lower bounds by exact nonnegative polynomial identities with c>0 and t>0. The t=0 counterexample prevents dropping the domain."

[[hostile_controls]]
id = "varying_exponent"
requirement = "Derive t^(-x-6)>=t^-7+(1-x)(t-1)t^-8 from the actual log/exp inequalities with x<=1 and t>0. It is not exponent equality or numerical fitting."

[[hostile_controls]]
id = "affine_jacobian"
requirement = "Retain the subcell change of variables t=node(i)+v/16 and Jacobian1/16. Both polynomial moments are integrated, not evaluated at centers."

[[hostile_controls]]
id = "exact_mass"
requirement = "Compute sum mass0>=23/480 and sum mass1>=9/1000 by finite rational proof. No new quadrature-error premise or external evaluator."

[[hostile_controls]]
id = "complement"
requirement = "Telescope all16 subintervals across[1,2]. Prove the omitted(2,infinity) defect independently integrable and nonnegative before dropping it."

[[hostile_controls]]
id = "same_norm_integral"
requirement = "Relate the actual defect integral to 1/(Re(s)+5)-30240 integral norm. Apply norm_integral<=integral_norm at the same exact kernel and exponent."

[[hostile_controls]]
id = "saving_scope"
requirement = "Prove normalized saving>=2/7 using BOTH1/2<=Re(s) and Re(s)<=1. The5/7 factor is at cutoff ONE only, not arbitrary integer N."

[[hostile_controls]]
id = "joint_certificate"
requirement = "All66 positive integers must satisfy the full1024*(19321D-10000N) tensor identity under x=(1+u)/2,y=100v. N,D and their norm-square identities are unchanged."

[[hostile_controls]]
id = "geometry_not_positivity"
requirement = "Geometric ratio139/100 exceeds1. Only its product with actual analytic factor5/7 gives139/140<1. The preceding33/40 saving is insufficient for this comparison."

[[hostile_controls]]
id = "denominator"
requirement = "Keep real Re(s)+5 distinct from complex norm |s+5|. Restore shared |s+2| and |s+4| before using the tail."

[[hostile_controls]]
id = "closed_ten"
requirement = "Include Re=1/2,Re=1,Im=+/-10 and H(1)=1. Derive |H|>=13/3136 and strict target height>10; no first-zero numerical location."

[[hostile_controls]]
id = "mirror"
requirement = "Use critical reflection only on target zero locations. Do not equate reflected H values,norms,or multiplicities."

[[hostile_controls]]
id = "finite_cutoff"
requirement = "The unchanged all-integer finite model receives factor139/100 times |R6| N^(-Re(s)-5); do not attach the cutoff-one5/7 saving to general N."

[[hostile_controls]]
id = "previous_next_port"
requirement = "Supply the new ShellRH9 to the previous window_ten_of_shell. WindowRH11 retains ShellRH10; RH retains the complete higher-step family."

[[hostile_controls]]
id = "old_failure"
requirement = "The old height10 failure remains valid for its old comparison. The new gap at x=1/2,y=121 is negative and prevents extrapolation, not a zero or failure of RH."

[[hostile_controls]]
id = "homotopy"
requirement = "Reuse the same R6+t(H-R6), real t in[0,1]. Reciprocal differentiability consumes separate holomorphy and nonvanishing; no global-unit or Hodge/Weil coercion."

[[hostile_controls]]
id = "verification"
requirement = "All inherited/new declarations require exact Lean elaboration, type and transitive axiom audits. Rational polynomial diagnostics are not a kernel receipt; reject sorryAx and undeclared native dependencies."
