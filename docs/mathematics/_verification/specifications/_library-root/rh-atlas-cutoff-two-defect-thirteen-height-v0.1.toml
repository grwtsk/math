[[hostile_controls]]
id = "exact_source"
requirement = "Retain H, removable H(1), sextic b6, finiteModel, cutoff-two regrouping and residual. No new primitive, finite model or zeta source is introduced."

[[hostile_controls]]
id = "new_cutoff_two_proof"
requirement = "Derive the factor3/4 from the actual kernel on [2,3]. The earlier cutoff-one factors33/40 and5/7 are not transferred or assumed."

[[hostile_controls]]
id = "kernel_endpoint"
requirement = "Prove source_on_second_cell on the CLOSED interval. At t=3 the fractional part resets and B(1)=B(0)=1 is used, not a false floor=2 at3."

[[hostile_controls]]
id = "exact_density"
requirement = "Reuse all112 signed kernel coefficients and the proved density bound. Its nonnegative deficit is not the signed kernel declared positive."

[[hostile_controls]]
id = "rational_mass"
requirement = "Integrate the translated density against the exact tangent to t^-7. Reuse the actual power moments. Prove total>=1/1408 by finite rational arithmetic, not quadrature."

[[hostile_controls]]
id = "weight_alignment"
requirement = "For t>=2 and x<=1 prove t^(-x-6)>=2^(1-x)t^-7. Retain the factor2^(1-x); integrate it as a constant. Exact identity2^(1-x)=64*2^(-x-5) gives64/1408=1/22."

[[hostile_controls]]
id = "complement_and_integrability"
requirement = "Prove integrability before subtraction. The [2,3] telescope and the nonnegative separately integrable(3,infinity) complement give the full norm deficit."

[[hostile_controls]]
id = "normalization_bounds"
requirement = "The factor3/4 consumes BOTH 1/2<=Re(s) and Re(s)<=1, and cutoff2. Do not assert it at arbitrary cutoffs or parameter margins."

[[hostile_controls]]
id = "phase_sector"
requirement = "Use the inherited log enclosure and pinned pi bounds to place the reduced positive angle in[pi/2,7pi/8]. Derive cos>=-37/40 and sin>=3/8; no sampled phase."

[[hostile_controls]]
id = "signed_height_and_chord"
requirement = "Retain t*sin(t log2)>=3|t|/8 for both signs. Prove(t^2+156)/25<=|t| on12<=|t|<=13. This is not projection of zero locations."

[[hostile_controls]]
id = "weighted_root"
requirement = "L=(109+62x)/99 is only a positive rational lower bound for sqrt(2x+1) on[1/2,1]. Prove L^2<=2x+1, then combine with the actual power_weight. Do not assert L is the square root."

[[hostile_controls]]
id = "complete_tensor_identities"
requirement = "All191 positive natural coefficients must satisfy the four exact tensor identities on x=(1+u)/2,y=144+25v with scales128,64,56320,4096. Equality to the actual polynomials is required; signs alone and sampled points are insufficient."

[[hostile_controls]]
id = "adverse_projection"
requirement = "P,Q are the inherited exact components of967680*C2*conj(s-1). The new inequality permits loss2/5 of|s-1|^2. Do not assert the finite term has nonnegative projection on the new band."

[[hostile_controls]]
id = "tail_arithmetic"
requirement = "Derive TailCoefficient<=10/9 and |2^-s|<=99/140. Only the new cutoff-two3/4 combines them to33/56. All factors of the actual residual remain."

[[hostile_controls]]
id = "strict_margin"
requirement = "Retain1-2/5-33/56=3/280>0. Positive cancellation requires|s-1|>=12. The new band lower is9/70 and the glued full-height lower is1/1000."

[[hostile_controls]]
id = "closed_domain_gluing"
requirement = "All real and height edges are included. The lower seed is the existing height-twelve theorem for the same H, not a claim of global affine-reference positivity."

[[hostile_controls]]
id = "mirror_only_zeros"
requirement = "Critical reflection transports canonical target zero locations only; no reflected H-value/norm/multiplicity equality or complete zero count is inferred."

[[hostile_controls]]
id = "same_homotopy"
requirement = "Keep the existing affine deformation and real time in[0,1]. Prove the new one-sided projection first; reciprocal differentiability also consumes inherited holomorphy. No global unit, Hodge or Weil coercion."

[[hostile_controls]]
id = "prior_port_next_gap"
requirement = "Feed shellRH_twelve into the old window_thirteen_of_shell. WindowRH14 still consumes ShellRH13; global RH still consumes every higher step. Do not extrapolate blanket nonvanishing indefinitely."

[[hostile_controls]]
id = "counterexample_scope"
requirement = "Retain the old height13 failure guard and the new tail-gap failure at x=1/2,y=196. These refute sufficient bounds only and are not zeta-zero or false-RH claims."

[[hostile_controls]]
id = "exact_verification"
requirement = "Every listed module, exact declaration type and transitive axiom set needs actual Lean verification. Source hashes, symbolic identities and rational tests are not elaboration, replay or kernel acceptance."

[[hostile_controls]]
id = "no_execution_authority"
requirement = "This static target authorizes no worker, process, native evaluation, replay, merge, issue closure or F06 release. Operational actions and receipts remain outside math."
