[[controls]]
id = "same_tent"
description = "Every member must target the existing normalized tent, not the unweighted interval or a shifted-parameter call."

[[controls]]
id = "radius_mass"
description = "Check the direct sensitivity coefficient h*log(x+h), the two affine masses h/2, and both Re<=1 premises."

[[controls]]
id = "complete_local_and_outer"
description = "Require every local two-half trace, exact family lengths and keys, zero initialization, and all weighted outer updates."

[[controls]]
id = "multiplicity_twice"
description = "Positive natural multiplicities weight outputs and full error allowances; zero-weight shortcuts are rejected."

[[controls]]
id = "keys_not_provenance"
description = "Unique keys do not prove source-point identity; equal centers do not imply equal source points."

[[controls]]
id = "constructed_acceptance"
description = "Replay reference_checked at its complete per-node guards; no assumed accepted-family premise or always-reject checker."

[[controls]]
id = "actual_source_equivalence"
description = "Reindexed source conclusion requires a true finite-type equivalence and exact point/multiplicity equations; neither injectivity nor surjectivity alone suffices."

[[controls]]
id = "coordinate_truth_is_external"
description = "Successful rational arithmetic does not prove that any actual zero belongs to a coordinate enclosure. Preserve independent coordinate and horizontal proofs."

[[controls]]
id = "computed_log_majorant"
description = "Recompute the upper logarithm enclosure at exact x+h, retaining scale/resolution guards and complete shared error."

[[controls]]
id = "radii_shape_and_sign"
description = "Require exactly one nonnegative coordinate radius per member; missing/default or negative entries cannot pass."

[[controls]]
id = "three_error_levels"
description = "Member node/quadrature arithmetic, family accumulation and coordinate movement are distinct; charge once each and retain complex errors."

[[controls]]
id = "precision_not_error_lower_bound"
description = "Rejected conservative tolerances are not proofs of actual inaccuracy, zeros or prime-free intervals."

[[controls]]
id = "empty_family"
description = "Empty finite evaluation requires a zero accumulator and does not identify a canonical head as empty."

[[controls]]
id = "no_tail_or_global_source"
description = "No finite arithmetic or reindexing theorem supplies a complete divisor tail, global source identity, universal prime margin, Legendre or RH."
