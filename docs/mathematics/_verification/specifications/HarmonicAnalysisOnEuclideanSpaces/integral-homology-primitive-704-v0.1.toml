[[hostile_controls]]
id = "homology-map-multiplicative"
requirement = "Use an actual MonoidHom G →* Multiplicative ℤ, never a loose numeric tag or arithmetic analogy."
status = "NOT_RUN"

[[hostile_controls]]
id = "power-map-actual-theorem"
requirement = "Derive h(r^n)=n*h(r) from group homomorphism map_pow and integer nsmul, not an unproved assumption."
status = "NOT_RUN"

[[hostile_controls]]
id = "any-root-exponent-covered"
requirement = "Every r∈G and n≥2 is excluded by unit homology: no bounded root-search exhaustiveness assumption."
status = "NOT_RUN"

[[hostile_controls]]
id = "nonidentity-from-nonzero-image"
requirement = "The unit-valued character forces g≠1 because h(1)=0; omitting nonidentity is rejected."
status = "NOT_RUN"

[[hostile_controls]]
id = "unit-codomain-int"
requirement = "IsUnit applies to the integer image, not a complex or finite-mod-q unit, where the conclusion would be false."
status = "NOT_RUN"

[[hostile_controls]]
id = "minus-sign-supported"
requirement = "The witness works for +1 and -1; an arbitrary integer of magnitude>1 is not a unit."
status = "NOT_RUN"

[[hostile_controls]]
id = "root-exponent-unit-contradiction"
requirement = "n≥2 cannot divide a unit of ℤ; no negative n or n=0,1 is slipped into the proper-power definition."
status = "NOT_RUN"

[[hostile_controls]]
id = "conjugacy-invariance"
requirement = "The actual homomorphism's integer image is invariant on Mathlib IsConj classes."
status = "NOT_RUN"

[[hostile_controls]]
id = "actual-integer-positive-examples"
requirement = "Both +1 and -1 in Multiplicative ℤ are primitive; proofs must use the true group identity homomorphism."
status = "NOT_RUN"

[[hostile_controls]]
id = "nonnecessity-preserved"
requirement = "Absence of a unit-valued homological functional never proves nonprimitivity; separating primitive geodesics may be nullhomologous."
status = "NOT_RUN"

[[hostile_controls]]
id = "signed-vs-residue"
requirement = "The source pairing uses exact signed ℤ homology; ZMod q or absolute values cannot be substituted."
status = "NOT_RUN"

[[hostile_controls]]
id = "real-linear-functional-required"
requirement = "Signed coefficients c_i are integers; arbitrary unverified coefficients without a true group homomorphism do not certify primitivity."
status = "NOT_RUN"

[[hostile_controls]]
id = "source-pairing-same-ID"
requirement = "For every accepted word w and source ID a, actual group functional value equals signed pairing of t.homology a, with the same decoding event."
status = "NOT_RUN"

[[hostile_controls]]
id = "wrong-homology-row-rejected"
requirement = "A different source identifier, conjugacy representative with unproved transfer, shifted indexing or unmatched amplitude cannot discharge source_pairing."
status = "NOT_RUN"

[[hostile_controls]]
id = "modular-alias-remains"
requirement = "Unit homology proves group nonpower, not equality of q-torsion and integral source projections; aliasMass is not zeroed."
status = "NOT_RUN"

[[hostile_controls]]
id = "empty-word-rejected"
requirement = "The strengthened gate must reject codes whose evaluation is group identity, including empty words."
status = "NOT_RUN"

[[hostile_controls]]
id = "repeated-word-rejected"
requirement = "Doubled word u++u is a square and cannot decode to accepted primitive source."
status = "NOT_RUN"

[[hostile_controls]]
id = "cyclic-word-ID-preserved"
requirement = "Cyclically split words decode to equal source IDs through the same ConjClasses factorization."
status = "NOT_RUN"

[[hostile_controls]]
id = "proper-power-decision-still-open"
requirement = "A positive unit witness does not give Decidable IsProperPower for all group words, including null-homologous cases."
status = "NOT_RUN"

[[hostile_controls]]
id = "finite-universe-not-geometric"
requirement = "The selected source remains a finite candidate universe, not authenticated all oriented primitive geodesics of a surface."
status = "NOT_RUN"

[[hostile_controls]]
id = "zero-homology-no-unit"
requirement = "A zero integer homology vector produces zero under every signed pairing; this does not imply the group element is a power."
status = "NOT_RUN"

[[hostile_controls]]
id = "dimension-zero-conditional"
requirement = "For m=0 no unit signed pairing exists for a successful source; an arbitrary nonempty decoder cannot vacuously instantiate the gate."
status = "NOT_RUN"

[[hostile_controls]]
id = "bezout-positive-example"
requirement = "With H=(2,3), c=(-1,1), the signed pairing is +1 even though neither coordinate is a unit."
status = "NOT_RUN"

[[hostile_controls]]
id = "bezout-not-surface-example"
requirement = "The toy integer vector/coefficients do NOT construct a genuine surface-group element or marked homology functional."
status = "NOT_RUN"

[[hostile_controls]]
id = "no-gcd-completeness"
requirement = "Signed unit pairing is a useful sufficient arithmetic witness; not every primitive group element has primitive abelianization."
status = "NOT_RUN"

[[hostile_controls]]
id = "conjugacy-class-map-remains-supplied"
requirement = "A ConjClasses G→Option γ map is externally supplied; no full conjugacy normalizer or effective decision algorithm is built."
status = "NOT_RUN"

[[hostile_controls]]
id = "geometric-marking-open"
requirement = "The chosen group G, group homomorphism and packet homology are not automatically authenticated as π1(X) or H1(X;ℤ)."
status = "NOT_RUN"

[[hostile_controls]]
id = "Fourier-support-premises-retained"
requirement = "The old lengthFloor, Fourier radius, finite word search bound, cutoff K≤M and source completeness obligations persist."
status = "NOT_RUN"

[[hostile_controls]]
id = "no-rmt-selberg-upgrade"
requirement = "This group algebra yields no Selberg trace, Weil-Petersson volume, GOE/GUE variance, or microscopic sine process."
status = "NOT_RUN"

[[hostile_controls]]
id = "no-chowla-rh-upgrade"
requirement = "No growing-shift Möbius/Chowla cancellation, zeta divisor or Riemann hypothesis is supplied."
status = "NOT_RUN"

[[hostile_controls]]
id = "no-unapproved-execution"
requirement = "Passive target does not authorize Lean/Lake, native/VM/F06, workflow, cache, executor or CI mutation."
status = "NOT_RUN"

