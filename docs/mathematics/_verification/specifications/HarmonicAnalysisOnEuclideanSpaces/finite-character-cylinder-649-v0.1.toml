[[hostile_controls]]
id = "reject-zero-modulus"
requirement = "The modulus must be nonzero; no q=0 division, character normalization or false finite cyclic model."
status = "NOT_RUN"

[[hostile_controls]]
id = "normalized-frequency-average"
requirement = "Reject the full character sum without q^(-m), and reject normalization by q rather than q^m."
status = "NOT_RUN"

[[hostile_controls]]
id = "empty-tuple"
requirement = "m=0 has exactly one frequency tuple and its indicator equals one."
status = "NOT_RUN"

[[hostile_controls]]
id = "empty-coordinates"
requirement = "The empty coordinate set matches every finite observation; qaryPatternCount is N."
status = "NOT_RUN"

[[hostile_controls]]
id = "empty-horizon"
requirement = "N=0 counts zero, with no division by N."
status = "NOT_RUN"

[[hostile_controls]]
id = "boolean-encoding"
requirement = "Swapping the true/false signs must not silently preserve the wrong signed factor."
status = "NOT_RUN"

[[hostile_controls]]
id = "integer-modular-alias"
requirement = "Distinct integer classes 0 and q have identical mod-q residues; refuse integral equality."
status = "NOT_RUN"

[[hostile_controls]]
id = "finite-vs-haar"
requirement = "No finite torsion average is identified with continuous Haar orthogonality without a new theorem."
status = "NOT_RUN"

[[hostile_controls]]
id = "complex-phase-vs-gue"
requirement = "q>=3 complex characters alone do not imply GUE universality."
status = "NOT_RUN"

[[hostile_controls]]
id = "variance-vs-spacing"
requirement = "GOE/GUE spectral number variance is not a full microscopic nearest-neighbor or sine process theorem."
status = "NOT_RUN"

[[hostile_controls]]
id = "source-labels"
requirement = "No replacement of actual geodesic homology or Liouville/Mobius source labels by free finite residues."
status = "NOT_RUN"

[[hostile_controls]]
id = "no-chowla"
requirement = "Finite character identities contain no Liouville or Mobius correlation cancellation estimate."
status = "NOT_RUN"

[[hostile_controls]]
id = "no-sofic-operator-upgrade"
requirement = "Finite residue character models supply no labeled local/sofic operator limit by themselves."
status = "NOT_RUN"

[[hostile_controls]]
id = "no-rh"
requirement = "No zeta divisor identification, growing-shift maximal packet, or Riemann hypothesis is proved."
status = "NOT_RUN"

